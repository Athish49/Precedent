playbook_key: halcyon-saas-msa-vendor
based_on_version: '1.0'
version:
  version: '1.1'
  status: published
  effective_from: 2026-07-01
  change_summary: Mid-year update informed by negotiation outcomes closed between January
    and June 2026. Re-prices the late-fee ladder, widens several yellow-zone boundaries where
    Deal Desk, Security Lead, VP Customer Success and the CFO data showed a fallback was routinely
    approved, adds a Net 75 payment-terms rung and a second tier-1 on-site audit rung, removes
    the little-used 36-month strategic liability-cap rung, and drops a redundant dependency.
    Twelve of the thirty-six rules are affected; the rest are carried forward unchanged from
    version 1.0.
  created_by: Senior Commercial Counsel
  approved_by: General Counsel
changes:
- field_path: payment.late_fees.parameters.late_fee_percent_per_month.preferred_value
  change_type: modified
  old_value: 1.5
  new_value: 1.0
  reason: The 1.0%-a-month fallback (rung 1) was accepted in 61% of the 72 late-fee negotiations
    closed in H1 2026 (44 of 72 deals), against only 20 deals (28%) that held the 1.5% preferred
    rate; promoted 1.0% to preferred and moved the prior preferred rate to a new, lower fallback
    rung 1 of 0.5%.
- field_path: payment.late_fees.parameters.late_fee_percent_per_month.green_limit
  change_type: modified
  old_value: 1.0
  new_value: 0.5
  reason: 'Paired with the preferred-rate change above: fallback rung 1 moved from 1.0% to
    0.5% a month so the ladder still offers a real further concession below the new 1.0% preferred
    rate.'
- field_path: term.initial_term.risk_weight
  change_type: modified
  old_value: 4
  new_value: 5
  reason: 33 of the 61 initial-term negotiations in H1 2026 (54%) opened below the 36-month
    preferred term before settling, more than double the rate seen in the back half of 2025;
    raised risk_weight from 4 to 5 so the clause surfaces earlier in contract review queues.
    The position ladder and parameter limits are unchanged.
- field_path: term.auto_renewal.parameters.renewal_notice_days.context_overrides[tier_1].yellow_limit
  change_type: modified
  old_value: 10
  new_value: 5
  reason: Tier-1 accounts accepted a non-renewal notice window as short as 5 business days
    in 9 of 14 tier-1 auto-renewal negotiations in H1 2026 (64%), each with VP Sales sign-off;
    lowered the tier-1 override's yellow boundary from 10 to 5 days to match observed practice.
- field_path: termination.for_convenience.parameters.tfc_notice_days.yellow_limit
  change_type: modified
  old_value: 90
  new_value: 75
  reason: 5 of the 19 enterprise and strategic deals (26%) that reached the termination-for-convenience
    fallback ladder in H1 2026 settled at 75 days' notice rather than the full 90; lowered
    the yellow boundary from 90 to 75 days so a 75-day ask no longer needs escalation past
    VP Sales.
- field_path: termination.for_cause_cure_period.parameters.cure_period_days.yellow_limit
  change_type: modified
  old_value: 10
  new_value: 7
  reason: Only 3 of the 48 cure-period negotiations in H1 2026 (6%) pushed below 10 days,
    and Commercial Counsel cleared all 3 without General Counsel review; narrowed the yellow
    floor from 10 to 7 days to reflect that a slightly shorter period is still a Commercial
    Counsel-level concession.
- field_path: service_levels.uptime_commitment.parameters.maintenance_notice_hours.yellow_limit
  change_type: modified
  old_value: 48
  new_value: 72
  reason: VP Customer Success closed 9 of the 22 uptime and maintenance negotiations in H1
    2026 (41%) by agreeing to a 72-hour maintenance-notice commitment rather than 48; widened
    the yellow boundary from 48 to 72 hours so a 72-hour ask stays inside the existing approval
    band.
- field_path: audit.customer_audit_rights.parameters.audit_notice_days.yellow_limit
  change_type: modified
  old_value: 15
  new_value: 10
  reason: Security Lead approved an audit-notice period as short as 10 business days in 7
    of the 24 audit-rights negotiations in H1 2026 (29%), all without operational incident;
    lowered the yellow boundary from 15 to 10 days so a 10-day ask stays inside the Security
    Lead approval band.
- field_path: warranties.performance_warranty.parameters.warranty_cure_period_days.yellow_limit
  change_type: modified
  old_value: 15
  new_value: 10
  reason: Commercial Counsel and VP Customer Success together cleared a 10-day warranty cure
    period in 4 of 18 performance-warranty negotiations in H1 2026 (22%) when paired with
    a service-credit remedy; lowered the yellow boundary from 15 to 10 days to match that
    approved practice.
- field_path: insurance.coverage_requirements.parameters.cyber_eo_limit_usd.yellow_limit
  change_type: modified
  old_value: 20000000
  new_value: 25000000
  reason: The CFO approved a cyber coverage-evidence ask above the prior $20M ceiling in 3
    of 9 large-account insurance negotiations in H1 2026 (33%), each settling at $25M and
    none higher; raised the yellow ceiling from $20M to $25M so a $25M ask no longer defaults
    to a blocked red-zone deviation.
- field_path: payment.payment_terms.positions[+fallback_3]
  change_type: added
  old_value: null
  new_value:
    label: Net 75
    zone: yellow
    approver_role: cfo
    conditions:
      deal_value_band:
      - strategic
  reason: 4 of the 50 payment-terms negotiations in H1 2026 (8%), all strategic accounts above
    $1.5M a year, asked for 75-day terms in exchange for annual prepayment; added a Net 75
    fallback rung requiring CFO sign-off, and raised the payment_terms_days parameter's yellow
    boundary from 60 to 75 days so the new rung does not read as a red-zone deviation.
- field_path: audit.customer_audit_rights.positions[+fallback_3]
  change_type: added
  old_value: null
  new_value:
    label: Two on-site audits per year, tier-1 only
    zone: yellow
    approver_role: security_lead
  reason: 'Tier-1 accounts asked for a second on-site audit within the same year in 6 of 24
    audit-rights negotiations in H1 2026 (25%); added a rung permitting two on-site audits
    a year for tier-1 accounts with Security Lead approval. No parameter change was needed:
    audit_frequency_per_year''s existing yellow boundary of 2 already covers two audits a
    year.'
- field_path: limitation_of_liability.cap_amount.positions[fallback_3]
  change_type: removed
  old_value:
    label: 36-month cap, strategic deals only
    zone: yellow
    approver_role: general_counsel
    conditions:
      deal_value_band:
      - strategic
  new_value: null
  reason: Only 2 of the 31 strategic-deal liability negotiations in H1 2026 (6%) reached the
    36-month fallback rung at all, and both were renegotiated back down to 24 months within
    the same quarter after General Counsel and CFO review; removed the 36-month rung so strategic
    deals cap out at 24 months (rung 2), the same ceiling used on enterprise deals, and removed
    the matching strategic context_override on cap_multiple_months.
- field_path: payment.taxes.dependencies[payment.payment_terms]
  change_type: removed
  old_value:
    related_rule_key: payment.payment_terms
    relation: read_with
  new_value: null
  reason: Contracts Managers flagged the cross-reference to the payment-terms rule as redundant
    in 2 of 3 internal drafting-guide audits conducted in H1 2026, since Finance Policy FIN-04
    v3 (effective January 2026) fixed the exemption-certificate deadline at a flat ten business
    days regardless of the payment term; removed the dependency entry.
rules:
- rule_key: payment.payment_terms
  title: Payment terms
  required: true
  risk_weight: 4
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Customer pays invoices within 30 days of the invoice date; longer terms
    up to 60 days are negotiable with Deal Desk approval.

    '
  risk_rationale: 'Halcyon invoices annually in advance on most of its 310 customers, and
    cash timing matters most on the larger deals that fund the $72M ARR base. Net 30 keeps
    collections predictable against payroll and AWS hosting costs; stretching past 60 days
    materially delays cash on the largest accounts, some of which run to $2.4M a year.

    '
  detection_guidance: 'Look for "net 30", "within thirty (30) days of the invoice date", "due
    upon receipt" or "payable in arrears" in the payment section or the order form. Convert
    any stated period to days from the invoice date. A payment clause with fees stated but
    no stated period is a missing clause, since the parties have fees but no due date.

    '
  source_ref: Halcyon Finance Policy FIN-02; accounts receivable terms
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Net 30
    zone: green
    summary: Customer pays each invoice within 30 days of the invoice date.
    language: 'Customer shall pay each undisputed invoice within thirty (30) days of the invoice
      date. Halcyon will invoice the Fees annually in advance of each Subscription Term unless
      the Order Form states otherwise.

      '
  - kind: fallback
    rung: 1
    label: Net 45
    zone: green
    summary: Payment within 45 days of the invoice date.
    language: 'Customer shall pay each undisputed invoice within forty-five (45) days of the
      invoice date. Halcyon will invoice the Fees annually in advance of each Subscription
      Term unless the Order Form states otherwise.

      '
  - kind: fallback
    rung: 2
    label: Net 60
    zone: yellow
    approver_role: deal_desk
    conditions:
      counterparty_tier:
      - tier_1
      - tier_2
    give_get: Ask for annual prepayment in full on signature, with no instalments.
    summary: Payment within 60 days of the invoice date.
    language: 'Customer shall pay each undisputed invoice within sixty (60) days of the invoice
      date. Halcyon will invoice the Fees annually in advance of each Subscription Term unless
      the Order Form states otherwise.

      '
  - kind: acceptable_variant
    label: Due-within-30-days wording
    zone: green
    summary: Same 30-day period in different wording.
    language: 'All amounts invoiced under this Agreement are due and payable within thirty
      (30) days following Customer''s receipt of the applicable invoice.

      '
  - kind: fallback
    rung: 3
    label: Net 75
    zone: yellow
    approver_role: cfo
    conditions:
      deal_value_band:
      - strategic
    give_get: Ask for annual prepayment in full on signature and a non-refundable onboarding
      fee.
    summary: Payment within 75 days of the invoice date, for strategic accounts only.
    language: 'For a strategic account, Customer shall pay each undisputed invoice within
      seventy-five (75) days of the invoice date. Halcyon will invoice the Fees annually in
      advance of each Subscription Term unless the Order Form states otherwise.

      '
  parameters:
  - key: payment_terms_days
    label: Days to pay an invoice
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 30
    green_limit: 45
    yellow_limit: 75
    extraction_hint: 'Convert "net 30", "net 45", "net 60" or a stated number of days after
      the invoice date to the day count. "Due upon receipt" is 0. "Annually in advance" without
      a due date does not by itself set this parameter; look for the separate payment-period
      wording.

      '
  red_lines:
  - key: pay-terms-contingent-on-satisfaction
    description: 'Payment is made contingent on Customer''s subjective satisfaction or on
      Customer''s own receipt of payment from a third party, rather than on the invoice period
      running.

      '
    condition_type: semantic
    condition:
      test: 'The clause makes Customer''s obligation to pay conditional on Customer''s satisfaction
        with the Services, or on Customer first being paid by a third party (a "pay-when-paid"
        or "pay-if-paid" condition), rather than simply on the stated payment period running
        from the invoice date.

        '
    action: block
    rationale: 'A satisfaction or pay-when-paid condition turns a fixed revenue stream into
      a discretionary one and is not something Halcyon''s finance team can forecast or collect
      against; this is distinct from, and more severe than, simply a longer payment period.

      '
  objections:
  - objection: Our accounts payable cycle is fixed at Net 60; we cannot process anything faster.
    their_rationale: Large health systems batch vendor payments on a fixed AP run and will
      not create an exception.
    response: 'We can agree to Net 60 with Deal Desk sign-off in exchange for annual prepayment
      in full on signature, which removes the collections risk the longer term creates for
      us. Let us know if annual prepayment works for your budget cycle.

      '
    talking_points:
    - Net 60 is available but needs Deal Desk approval and a give-get.
    - Prepayment in full removes the cash-timing concern entirely.
    recommended_position:
      rule_key: payment.payment_terms
      rung: 2
    frequency: common
    counterparty_profile: Large hospital systems and public bodies
  - objection: We only pay invoices we have reviewed and approved internally, which can take
      time.
    their_rationale: Internal procurement sign-off is a real operational constraint for the
      counterparty.
    response: 'We are glad to work with your review cycle, but the clause needs a fixed outside
      date so Fees do not become payable at Customer''s discretion. We can extend to Net 45
      to give your team more room within the stated period.

      '
    talking_points:
    - A fixed day count protects both sides from open-ended disputes.
    - Net 45 already builds in meaningful review time.
    frequency: occasional
    counterparty_profile: Mid-market physician groups
  dependencies:
  - related_rule_key: termination.for_cause_cure_period
    relation: trade_against
    note: 'A longer payment term should be paired with a shorter, separate cure period specifically
      for non-payment, so slow payment does not also delay Halcyon''s ability to act on it.

      '
  - related_rule_key: suspension.suspension_rights
    relation: requires
    note: 'The suspension trigger for non-payment is measured from the due date this rule
      sets; the two must use consistent day counts.

      '
  test_cases:
  - name: Standard Net 30
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Customer will pay all undisputed invoices within thirty (30) days after
      the date of the invoice.

      '
  - name: Due-on-receipt variant wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Invoices issued under this Agreement are payable in full upon Customer''s
      receipt, provided that Customer shall in any event remit payment no later than thirty
      (30) days after the invoice date.

      '
  - name: Net 60 for a tier-1 hospital system
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Customer shall settle each invoice no later than sixty (60) days following
      the date it is issued.

      '
  - name: Net 50 payment term
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Customer shall pay invoices within fifty (50) days of the invoice date.

      '
  - name: Pay-when-paid condition
    expected_outcome: red_line
    expected_red_line_key: pay-terms-contingent-on-satisfaction
    expected_zone: red
    sample_text: 'Customer''s obligation to pay any invoice is conditioned on Customer''s
      receipt of the corresponding reimbursement from its own payers, and payment is due within
      thirty (30) days after such reimbursement is received.

      '
  - name: No stated payment period
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
  - name: Net 75 for a strategic account
    context:
      deal_value_band: strategic
    expected_outcome: fallback
    expected_position_rung: 3
    expected_zone: yellow
    sample_text: 'As a strategic account, Customer shall remit payment within seventy-five
      (75) days of the date of each invoice.

      '
- rule_key: payment.late_fees
  title: Late fees on overdue amounts
  required: true
  risk_weight: 3
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Overdue, undisputed amounts accrue interest at 1.5% a month; Halcyon
    may recover reasonable collection costs. No customer set-off right.

    '
  risk_rationale: 'With a median contract of $165k a year, a handful of slow-paying accounts
    can meaningfully affect quarterly cash flow if there is no cost to paying late. A modest
    late fee gives Customer a reason to pay on time without being so aggressive that it becomes
    a point of principle in renewal talks.

    '
  detection_guidance: 'Look for "interest at the rate of", a monthly or annual percentage,
    "or the maximum rate permitted by applicable law", "late charge" and "costs of collection,
    including reasonable attorneys'' fees". Also check for "set off" or "withhold" language
    in Customer''s favor, which is a deviation regardless of the interest rate. No late-fee
    wording at all is a concession in Customer''s favor, not a missing clause; treat it as
    the no-late-fee fallback below, not as absence of the issue.

    '
  source_ref: Halcyon Finance Policy FIN-02
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 1.0% a month
    zone: green
    summary: Interest of 1.0% a month on overdue, undisputed amounts.
    language: 'Any undisputed amount not paid when due will accrue interest at the rate of
      one percent (1.0%) per month, or the highest rate permitted by applicable law if lower,
      from the due date until paid, and Halcyon may recover its reasonable costs of collection,
      including reasonable attorneys'' fees.

      '
  - kind: fallback
    rung: 1
    label: 0.5% a month
    zone: green
    summary: Interest reduced to 0.5% a month.
    language: 'Any undisputed amount not paid when due will accrue interest at the rate of
      one-half of one percent (0.5%) per month, or the highest rate permitted by applicable
      law if lower, from the due date until paid, and Halcyon may recover its reasonable costs
      of collection, including reasonable attorneys'' fees.

      '
  - kind: fallback
    rung: 2
    label: No late fee
    zone: yellow
    approver_role: deal_desk
    give_get: Ask for a shorter payment term or annual prepayment in exchange.
    summary: No interest or late charge on overdue amounts.
    language: 'This Agreement states no interest or late charge on amounts paid after their
      due date; Halcyon''s remedies for non-payment are those stated in the suspension and
      termination provisions of this Agreement.

      '
  - kind: acceptable_variant
    label: Statutory-rate wording
    zone: green
    summary: Interest pegged to a statutory rate that is at or above 1.0% a month.
    language: 'Overdue, undisputed amounts bear interest at the statutory rate applicable
      to commercial debts under the law governing this Agreement, together with Halcyon''s
      reasonable costs of collection.

      '
  parameters:
  - key: late_fee_percent_per_month
    label: Late fee, percent a month
    value_type: percent
    unit: percent per month
    direction: higher_is_better
    preferred_value: 1.0
    green_limit: 0.5
    yellow_limit: 0
    extraction_hint: 'Read the stated monthly rate directly. Convert an annual rate to a monthly
      equivalent by dividing by twelve. No late-fee wording at all extracts as 0, which is
      the no-late-fee yellow rung, not an absent parameter.

      '
  red_lines:
  - key: late-fee-customer-setoff
    description: 'Customer is given a right to set off or withhold amounts it claims are owed
      against the Fees payable to Halcyon.

      '
    condition_type: semantic
    condition:
      test: 'The clause gives Customer a right to set off, withhold or deduct any amount from
        the Fees payable to Halcyon, based on Customer''s own claim or dispute, rather than
        merely stating the interest rate Halcyon may charge on amounts Customer owes.

        '
    action: block
    rationale: 'A set-off right lets Customer unilaterally reduce what it pays based on its
      own assessment of a dispute, which turns a fixed subscription fee into something Customer
      can discount at will; this is a different and more severe problem than the interest
      rate itself.

      '
  objections:
  - objection: 1.0% a month is well above what we pay our other vendors; we would like it
      removed.
    their_rationale: Hospital procurement teams compare late-fee terms across vendors and
      push back on anything above a nominal rate.
    response: 'We can bring the rate down to 0.5% a month, which is in line with standard
      commercial terms, but removing it entirely needs Deal Desk approval and usually comes
      with a shorter payment term in return.

      '
    talking_points:
    - 0.5% a month is the market-standard fallback, offered without escalation.
    - Removing the fee only happens alongside a shorter payment term or prepayment.
    recommended_position:
      rule_key: payment.late_fees
      rung: 1
    frequency: common
    counterparty_profile: Mid-market and tier-2 customers
  - objection: If you can charge us interest for paying late, we should be able to withhold
      payment when Services are down.
    their_rationale: Counterparty treats the two as symmetrical remedies for breach of the
      same agreement.
    response: 'Service level failures already have a dedicated remedy, the service credit,
      so the fee and the credit cover different problems; a general set-off right would let
      either side withhold payment over any dispute, which we are not able to agree to.

      '
    talking_points:
    - Service credits already address availability failures.
    - A set-off right is a global red line, not a negotiable term.
    frequency: occasional
    counterparty_profile: Tier-1 health systems with sophisticated procurement
  dependencies:
  - related_rule_key: payment.payment_terms
    relation: trade_against
    note: 'Removing the late fee entirely is a larger concession when paired with a longer
      payment term; prefer offering only one of the two.

      '
  test_cases:
  - name: Standard 1.0% monthly interest
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Amounts not paid by their due date bear interest at one percent (1.0%) per
      month until paid in full.

      '
  - name: Statutory-rate variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Past-due, undisputed invoices accrue interest at the maximum rate permitted
      under applicable law for commercial accounts.

      '
  - name: Reduced to 0.5% a month
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Overdue amounts accrue interest at a rate of one-half of one percent (0.5%)
      per month from the due date.

      '
  - name: 0.25% monthly rate
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Late payments accrue a charge of one-quarter of one percent (0.25%) of the
      overdue amount for each month or part of a month it remains unpaid.

      '
  - name: Trap - Customer may not set off
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Overdue amounts bear interest at 1.0% per month, and Customer shall not
      set off, withhold or deduct any amount from the Fees for any reason, including a dispute
      over the Services.

      '
- rule_key: payment.price_increases
  title: Renewal price increases
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Fees may increase by up to 7% at each renewal on 60 days'' notice; a
    cap of 5% remains green, and a multi-year price freeze needs Deal Desk approval.

    '
  risk_rationale: 'AWS hosting and staffing costs rise every year, and with a median contract
    of $165k the difference between a 5% and a 7% increase is real at scale across 310 customers.
    A stated cap also protects Customer from an open-ended increase, which keeps renewal conversations
    about value rather than price shock.

    '
  detection_guidance: 'Look for "increase the Fees", "upon each renewal", a percentage cap,
    "Consumer Price Index", "then-current list price" or "Fees shall remain fixed for" a number
    of years. No cap at all leaves renewal pricing fully at Halcyon''s discretion, which favors
    Halcyon and is a concession in our favor rather than a missing clause; do not treat silence
    on this issue as missing.

    '
  source_ref: Halcyon Finance Policy FIN-03; renewal pricing guidance
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Up to 7% a year
    zone: green
    summary: Fees may increase up to 7% at each renewal, on 60 days' notice.
    language: 'Upon each renewal of the Subscription Term, Halcyon may increase the Fees by
      notice given at least sixty (60) days before the renewal date, provided that any such
      increase shall not exceed seven percent (7%) of the Fees in effect for the immediately
      preceding Subscription Term.

      '
  - kind: fallback
    rung: 1
    label: Capped at 5%
    zone: green
    summary: The renewal increase cap is reduced to 5%.
    language: 'Upon each renewal of the Subscription Term, Halcyon may increase the Fees by
      notice given at least sixty (60) days before the renewal date, provided that any such
      increase shall not exceed five percent (5%) of the Fees in effect for the immediately
      preceding Subscription Term.

      '
  - kind: fallback
    rung: 2
    label: Fixed price for the renewal term
    zone: yellow
    approver_role: deal_desk
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a longer renewal term, such as 24 or 36 months, in exchange.
    summary: Fees remain fixed, with no increase, for the stated renewal term.
    language: 'Upon each renewal, the Fees shall remain fixed at the amount in effect for
      the immediately preceding Subscription Term for the renewal term stated on the applicable
      Order Form.

      '
  - kind: acceptable_variant
    label: Index-linked increase at or below 7%
    zone: green
    summary: An increase tied to CPI, capped so it cannot exceed 7%.
    language: 'Upon each renewal, the Fees may increase by the percentage increase in the
      Consumer Price Index for the preceding twelve (12) months, provided that the increase
      shall in no event exceed seven percent (7%).

      '
  parameters:
  - key: price_increase_notice_days
    label: Notice of a renewal price increase, in days
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 60
    green_limit: 45
    yellow_limit: 30
    extraction_hint: 'Read the stated number of days'' advance notice required before a renewal
      price increase takes effect.

      '
  - key: price_increase_cap_percent
    label: Renewal price increase cap, percent
    value_type: percent
    unit: percent per renewal
    direction: higher_is_better
    preferred_value: 7
    green_limit: 5
    yellow_limit: 0
    extraction_hint: 'Read the stated percentage cap on each renewal increase directly. A
      CPI-linked increase with no stated ceiling is treated as uncapped for this parameter,
      even though the deviation itself is still assessed on its own terms.

      '
  - key: price_lock_years
    label: Years Fees are fixed with no increase
    value_type: number
    unit: years
    direction: lower_is_better
    preferred_value: 0
    green_limit: 0
    yellow_limit: 3
    extraction_hint: '0 when any renewal increase is permitted at all, however small. Set
      to the number of years the Fees are contractually frozen when a price-lock or fixed-price
      clause applies.

      '
  red_lines:
  - key: price-lock-over-3-years
    description: 'Fees are frozen, with no permitted increase, for more than three years.

      '
    condition_type: parameter
    condition:
      parameter_key: price_lock_years
      op: gt
      value: 3
    action: block
    rationale: 'A price lock beyond a few years leaves Halcyon unable to recover rising AWS
      and staffing costs on that account for the life of a long agreement, and sets a precedent
      other large accounts will expect at their own renewal.

      '
  objections:
  - objection: A 7% increase is far above typical healthcare IT budget growth; we need a hard
      cap closer to CPI.
    their_rationale: Hospital systems set multi-year budgets and cannot absorb unpredictable
      software cost increases.
    response: 'We can bring the cap down to 5%, which is already below our standard rate and
      does not need approval. If you need the Fees fixed outright, we can discuss that in
      exchange for a longer renewal term.

      '
    talking_points:
    - 5% is available immediately, no escalation required.
    - A fixed price is available for a longer committed renewal term.
    recommended_position:
      rule_key: payment.price_increases
      rung: 1
    frequency: common
    counterparty_profile: Tier-1 and tier-2 hospital systems
  - objection: Lock the price for the full five years of our renewal, with no exceptions.
    their_rationale: Large strategic accounts want cost certainty to match their own multi-year
      budget cycles.
    response: 'We can fix the price for a strategic renewal term with Deal Desk approval,
      but we are not able to agree to a lock beyond that term without further sign-off, since
      it removes our ability to recover rising hosting costs.

      '
    talking_points:
    - A fixed-price renewal is available for strategic accounts with approval.
    - A lock beyond the stated renewal term is not something we can offer.
    recommended_position:
      rule_key: payment.price_increases
      rung: 2
    frequency: occasional
    counterparty_profile: Strategic accounts over $1.5M a year
  dependencies:
  - related_rule_key: term.initial_term
    relation: trade_against
    note: 'A lower price-increase cap or a price freeze is a reasonable ask from Customer
      in exchange for agreeing to a longer initial term.

      '
  test_cases:
  - name: Standard 7% renewal cap
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'At each renewal, Halcyon may raise the then-current Fees by no more than
      seven percent (7%), on at least sixty (60) days'' notice.

      '
  - name: CPI-linked, capped at 7%
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Fees may be adjusted at each renewal to reflect the change in the Consumer
      Price Index over the prior year, but any such adjustment will not exceed seven percent
      (7%).

      '
  - name: 5% cap
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Renewal Fees will not increase by more than five percent (5%) over the prior
      term''s Fees.

      '
  - name: 3% renewal increase cap
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon may increase the Fees at renewal by up to three percent (3%) upon
      notice to Customer.

      '
  - name: Trap - no price-lock commitment beyond the term
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Nothing in this Agreement fixes the Fees beyond the then-current Subscription
      Term; at each renewal, Halcyon may increase the Fees by up to seven percent (7%) on
      sixty (60) days'' notice.

      '
- rule_key: payment.taxes
  title: Allocation of taxes on the fees
  required: true
  risk_weight: 3
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Fees are exclusive of taxes other than those on Halcyon''s net income;
    Customer bears sales, use, VAT and similar taxes and provides any exemption certificate;
    cross-border withholding gross-up needs Deal Desk approval.

    '
  risk_rationale: 'Halcyon serves US hospital systems and EU private clinic groups, so both
    US sales and use tax and EU VAT regimes apply across the $72M ARR base. Several non-profit
    hospital customers hold tax exemptions that must be honored correctly to avoid Halcyon
    over-collecting or under-remitting tax on the same invoice stream.

    '
  detection_guidance: 'Look for "exclusive of taxes", "sales, use, value added or withholding
    taxes", "gross up", "exemption certificate" and "taxes based on Halcyon''s net income".
    Silence on who bears tax leaves it unclear whether the stated Fees include tax, which
    is a missing clause, not a concession either way.

    '
  source_ref: Halcyon Finance Policy FIN-04; tax allocation guidance
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Exclusive of taxes, Customer bears them
    zone: green
    summary: Fees are exclusive of tax; Customer pays all taxes except those on Halcyon's
      net income.
    language: 'All Fees are exclusive of applicable sales, use, value added, goods and services
      and similar taxes, which Customer shall pay or reimburse to Halcyon, excluding any tax
      imposed on Halcyon''s net income. Customer shall provide Halcyon with a valid exemption
      certificate before invoicing if it claims a tax exemption.

      '
  - kind: fallback
    rung: 1
    label: Exemption certificate required before exemption applies
    zone: green
    summary: Same allocation, with the exemption conditioned on a certificate on file in advance.
    language: 'All Fees are exclusive of applicable sales, use, value added, goods and services
      and similar taxes, which Customer shall pay or reimburse to Halcyon, excluding any tax
      imposed on Halcyon''s net income. No tax exemption applies to an invoice unless Customer
      has delivered a valid, then-current exemption certificate to Halcyon at least ten (10)
      business days before that invoice is issued.

      '
  - kind: fallback
    rung: 2
    label: Withholding gross-up
    zone: yellow
    approver_role: deal_desk
    conditions:
      region:
      - eu
      - uk
      - other
    give_get: Ask for annual prepayment to offset the administrative cost of the gross-up.
    summary: Halcyon agrees to a gross-up for cross-border withholding tax.
    language: 'If Customer is required by law to withhold any amount from a payment to Halcyon
      on account of tax, Customer shall increase the payment so that Halcyon receives, after
      withholding, the full amount it would have received had no withholding applied.

      '
  - kind: acceptable_variant
    label: Taxes-payable-by-Customer wording
    zone: green
    summary: Different wording for the same allocation.
    language: 'Customer is responsible for all sales, use, value added and similar taxes assessed
      on the Fees, other than taxes based on Halcyon''s net income, and shall pay such taxes
      in addition to the Fees unless it furnishes a valid exemption certificate.

      '
  parameters:
  - key: withholding_tax_gross_up
    label: Halcyon bears cross-border withholding gross-up
    value_type: boolean
    direction: exact
    preferred_value: false
    green_limit: false
    yellow_limit: true
    extraction_hint: 'True if the clause requires Halcyon (rather than Customer) to absorb
      or gross up for withholding tax on cross-border payments; false if Customer bears it
      or no withholding applies.

      '
  red_lines:
  - key: tax-income-tax-indemnity
    description: 'Halcyon is required to bear or indemnify Customer for taxes based on Halcyon''s
      own net income, or for taxes generally without the net-income carve-out.

      '
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to pay, reimburse or indemnify Customer for any tax
        measured by Halcyon''s income or profits, or states that Halcyon bears all taxes of
        any kind arising from the Agreement with no carve-out for Halcyon''s own income tax.

        '
    action: block
    rationale: 'Taxes on Halcyon''s own income are Halcyon''s cost of doing business everywhere
      it operates and are not a negotiable term tied to any one customer''s deal.

      '
  objections:
  - objection: We are a non-profit hospital and are exempt from sales tax; this clause should
      not apply to us.
    their_rationale: Many US non-profit health systems hold a genuine, documented state tax
      exemption.
    response: 'We honor a valid exemption certificate on file; please send the current certificate
      and we will apply the exemption going forward and will not charge tax on your invoices.

      '
    talking_points:
    - The clause already carves out a valid exemption certificate.
    - We need the certificate on file before, not after, an invoice issues.
    frequency: common
    counterparty_profile: Non-profit hospital systems
  - objection: Your invoices to our EU entity must be net of any withholding tax we are required
      to deduct.
    their_rationale: Some jurisdictions legally require the payer to withhold tax at source
      regardless of the contract's allocation.
    response: 'We can agree to a withholding gross-up for EU and UK deals with Deal Desk approval,
      in exchange for annual prepayment to offset the added administrative cost on our side.

      '
    talking_points:
    - A gross-up is available for cross-border deals, not as a default.
    - Prepayment is the standard give-get for this concession.
    recommended_position:
      rule_key: payment.taxes
      rung: 2
    frequency: occasional
    counterparty_profile: EU private clinic groups
  dependencies: []
  test_cases:
  - name: Standard exclusive-of-tax allocation
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'The Fees stated on the Order Form do not include applicable sales, use or
      similar taxes, which Customer will pay in addition, except for taxes assessed on Halcyon''s
      net income.

      '
  - name: Taxes payable by Customer, different wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Customer shall bear and pay all transaction taxes arising from this Agreement,
      other than any tax based on Halcyon''s income, upon presentation of a valid exemption
      certificate where applicable.

      '
  - name: Exemption certificate required in advance
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Customer is responsible for all applicable taxes other than those on Halcyon''s
      net income, and any claimed exemption requires a current certificate on file with Halcyon
      no later than ten (10) business days before the invoice date.

      '
  - name: Fees stated inclusive of sales and use tax
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'The Fees stated on the Order Form are inclusive of applicable sales and
      use tax, which Halcyon will remit on Customer''s behalf; this does not affect Halcyon''s
      own obligation to pay tax on its net income.

      '
  - name: Halcyon must indemnify Customer for Halcyon's own income tax
    expected_outcome: red_line
    expected_red_line_key: tax-income-tax-indemnity
    expected_zone: red
    sample_text: 'Halcyon shall indemnify and hold Customer harmless from any tax assessed
      on Halcyon''s revenue or net income arising from amounts paid under this Agreement.

      '
  - name: No allocation of taxes stated
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: term.initial_term
  title: Initial subscription term
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'The first committed Subscription Term is 36 months; terms of 12 months
    or more stay green; shorter committed terms, down to a 3-month floor, need VP Sales approval;
    month-to-month is a red line.

    '
  risk_rationale: 'Implementation of Halcyon Engage involves HL7 FHIR integration with a hospital''s
    record system, which takes months to complete and is not worth the cost on a short commitment.
    A 36-month term matches the revenue recognition and discounting Halcyon builds into its
    pricing for a $165k median contract, and protects against churn shortly after a costly
    integration.

    '
  detection_guidance: 'Look for "Initial Term", "Subscription Term", "commences on the Effective
    Date and continues for" and a stated period in months or years, in the agreement body
    or the Order Form. "Month-to-month" wording, or language that lets either party exit on
    short notice with no minimum period, is a deviation at best and usually the red line below,
    not a missing clause. No stated term at all is a missing clause.

    '
  source_ref: Halcyon Finance Policy FIN-01; subscription revenue guidance
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 36-month Initial Term
    zone: green
    summary: The Initial Term is 36 months from the Effective Date.
    language: 'The Subscription Term commences on the Effective Date stated on the Order Form
      and continues for an initial period of thirty-six (36) months (the "Initial Term"),
      unless earlier terminated as permitted by this Agreement.

      '
  - kind: fallback
    rung: 1
    label: 12-month Initial Term
    zone: green
    summary: The Initial Term is reduced to 12 months.
    language: 'The Subscription Term commences on the Effective Date stated on the Order Form
      and continues for an initial period of twelve (12) months (the "Initial Term"), unless
      earlier terminated as permitted by this Agreement.

      '
  - kind: fallback
    rung: 2
    label: 3-month Initial Term
    zone: yellow
    approver_role: vp_sales
    give_get: Ask for annual prepayment in full and a non-refundable implementation fee.
    summary: The Initial Term is reduced to a 3-month floor.
    language: 'The Subscription Term commences on the Effective Date stated on the Order Form
      and continues for an initial period of three (3) months (the "Initial Term"), unless
      earlier terminated as permitted by this Agreement.

      '
    internal_note: '3 months is an internally set floor for a committed term; it is not stated
      in the company risk appetite table and should be revisited at the next review.

      '
  - kind: acceptable_variant
    label: Continues-for wording with an Order Form reference
    zone: green
    summary: Same 36-month commitment, referencing the Order Form for the period.
    language: 'This Agreement and each Order Form are effective for the period stated on the
      applicable Order Form, which shall be no less than thirty-six (36) months unless the
      parties agree otherwise in writing.

      '
  parameters:
  - key: initial_term_months
    label: Initial Term, in months
    value_type: number
    unit: months
    direction: higher_is_better
    preferred_value: 36
    green_limit: 12
    yellow_limit: 3
    extraction_hint: 'Read the stated Initial Term or Subscription Term length directly in
      months, converting years to months. Month-to-month or evergreen wording with no minimum
      period does not map to a number here; flag it against the red line instead.

      '
  red_lines:
  - key: iterm-month-to-month
    description: 'The agreement runs month-to-month, or otherwise states no minimum committed
      Initial Term, from the outset.

      '
    condition_type: semantic
    condition:
      test: 'The clause gives the agreement no fixed Initial Term and instead lets it run
        on a month-to-month or similarly open-ended basis from the start, with no minimum
        committed period.

        '
    action: block
    rationale: 'With no minimum committed period, Halcyon cannot justify the implementation
      effort or the pricing it extends against a multi-year relationship, and every account
      becomes cancellable before its HL7 FHIR integration has even stabilized.

      '
  objections:
  - objection: We cannot commit to 36 months before we know the integration will work for
      our clinicians.
    their_rationale: Clinical staff adoption is uncertain until the system has been used in
      production for a while.
    response: 'We can start with a 12-month Initial Term, which still gives your team a full
      year to evaluate fit, and most customers renew well before then. A shorter commitment
      than that needs VP Sales sign-off and usually comes with prepayment.

      '
    talking_points:
    - 12 months is available without escalation.
    - A pilot concern is better addressed through a phased rollout than a short term.
    recommended_position:
      rule_key: term.initial_term
      rung: 1
    frequency: common
    counterparty_profile: Tier-2 and tier-3 customers evaluating Halcyon Engage for the first
      time
  - objection: Our procurement rules do not allow multi-year committed contracts without a
      break clause.
    their_rationale: Some public and non-profit hospital systems have internal policies against
      long non-cancellable commitments.
    response: 'We can go as short as three months with VP Sales approval if paired with prepayment
      and a non-refundable implementation fee, since a very short term changes how we price
      and resource the implementation.

      '
    talking_points:
    - A 3-month floor is available only with approval and a give-get.
    - Month-to-month with no minimum period is not something we can offer.
    recommended_position:
      rule_key: term.initial_term
      rung: 2
    frequency: occasional
    counterparty_profile: Public-sector and tier-1 health systems with procurement constraints
  dependencies:
  - related_rule_key: payment.price_increases
    relation: trade_against
    note: 'A longer Initial Term is a reasonable basis to offer a lower renewal price-increase
      cap or a fixed price for the term.

      '
  test_cases:
  - name: Standard 36-month term
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Beginning on the Effective Date, the Subscription Term runs for thirty-six
      (36) consecutive months.

      '
  - name: Order Form reference variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'The term of this Agreement is the period stated on the Order Form, which
      will be at least thirty-six (36) months.

      '
  - name: 12-month term
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'This Agreement commences on the Effective Date and runs for a period of
      twelve (12) months.

      '
  - name: 6-month term with no approval basis stated
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'The Initial Term of this Agreement is six (6) months from the Effective
      Date.

      '
  - name: Month-to-month from inception
    expected_outcome: red_line
    expected_red_line_key: iterm-month-to-month
    expected_zone: red
    sample_text: 'This Agreement continues on a month-to-month basis from the Effective Date
      until either party gives notice to terminate.

      '
  - name: No stated term
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: term.auto_renewal
  title: Automatic renewal
  required: true
  risk_weight: 4
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'The agreement automatically renews for successive 12-month terms unless
    either party gives at least 60 days'' written notice of non-renewal; removing auto-renewal
    entirely needs VP Sales approval.

    '
  risk_rationale: 'Automatic renewal protects the recurring revenue Halcyon relies on for
    $72M of ARR without a sales team having to re-sign every account each year. Many public-sector
    and hospital customers have procurement rules against automatic renewal, so a clean non-renewal
    path matters to winning and keeping those accounts even though Halcyon prefers to keep
    the right.

    '
  detection_guidance: 'Look for "automatically renew", "successive renewal terms of", "unless
    either party gives written notice of non-renewal at least" and a stated number of days.
    Wording that instead requires a new signed Order Form to continue the relationship means
    there is no auto-renewal at all, which corresponds to the no-auto-renewal fallback below,
    not to a missing clause; an agreement with no renewal wording at all simply expires at
    the end of the Initial Term, which is the same outcome as that fallback.

    '
  source_ref: Halcyon Finance Policy FIN-01; subscription revenue guidance
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 12-month renewals, 60 days' notice
    zone: green
    summary: Auto-renews for 12 months unless either party gives 60 days' notice.
    language: 'Upon expiration of the Initial Term, and upon expiration of each Renewal Term,
      this Agreement will automatically renew for successive twelve (12) month Renewal Terms,
      unless either party gives the other written notice of non-renewal at least sixty (60)
      days before the end of the then-current term.

      '
  - kind: fallback
    rung: 1
    label: 30 days' notice
    zone: green
    summary: The non-renewal notice window is shortened to 30 days.
    language: 'Upon expiration of the Initial Term, and upon expiration of each Renewal Term,
      this Agreement will automatically renew for successive twelve (12) month Renewal Terms,
      unless either party gives the other written notice of non-renewal at least thirty (30)
      days before the end of the then-current term.

      '
  - kind: fallback
    rung: 2
    label: No automatic renewal
    zone: yellow
    approver_role: vp_sales
    give_get: Ask for a longer Initial Term or a right of first refusal on renewal pricing
      in exchange.
    summary: The Agreement does not renew automatically; a new Order Form is required.
    language: 'This Agreement will expire at the end of the Initial Term, or any Renewal Term
      then in effect, unless the parties execute a new or amended Order Form before that date.

      '
  - kind: acceptable_variant
    label: 45 days' notice, double-negative wording
    zone: green
    summary: Same 12-month auto-renewal, within the notice range, worded as a double negative.
    language: 'Unless Customer gives Halcyon written notice of non-renewal at least forty-five
      (45) days before the end of the then-current term, this Agreement does not terminate
      at that time and instead continues for a further Renewal Term of twelve (12) months.

      '
  parameters:
  - key: renewal_notice_days
    label: Non-renewal notice window, in days
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 60
    green_limit: 30
    yellow_limit: 15
    extraction_hint: 'Read the stated number of days'' notice required to stop automatic renewal.
      This parameter does not apply when there is no auto-renewal at all; in that case assess
      the rule against the no-auto-renewal fallback instead.

      '
    context_overrides:
    - when:
        counterparty_tier:
        - tier_1
      yellow_limit: 5
  - key: renewal_term_months
    label: Length of each Renewal Term, in months
    value_type: number
    unit: months
    direction: higher_is_better
    preferred_value: 12
    green_limit: 12
    yellow_limit: 6
    extraction_hint: 'Read the stated length of each successive Renewal Term in months. Does
      not apply when there is no auto-renewal at all.

      '
  red_lines:
  - key: renew-midterm-cancel-refund
    description: 'Customer may cancel a Renewal Term after it has already begun and receive
      a refund of prepaid Fees for that term.

      '
    condition_type: semantic
    condition:
      test: 'The clause allows Customer to terminate a Renewal Term at any time after that
        Renewal Term has started and receive a refund of the Fees prepaid for it, rather than
        only being able to stop renewal by giving advance non-renewal notice before the term
        begins.

        '
    action: block
    rationale: 'This converts every renewal into an option Customer can exercise and then
      unwind after the fact, which removes the predictability auto-renewal is meant to provide
      and effectively turns the Subscription Term into month-to-month with a refund right.

      '
  objections:
  - objection: Automatic renewal is against our procurement policy; we must affirmatively
      re-sign every term.
    their_rationale: Public bodies and some hospital systems are required to run a fresh approval
      process for each contract period.
    response: 'We can remove automatic renewal with VP Sales approval, typically in exchange
      for a longer Initial Term or a right of first refusal on renewal pricing, so we are
      not left re-negotiating from scratch every year.

      '
    talking_points:
    - Removing auto-renewal needs approval and a give-get.
    - A longer Initial Term is the most common trade for this concession.
    recommended_position:
      rule_key: term.auto_renewal
      rung: 2
    frequency: common
    counterparty_profile: Public-sector bodies and tier-1 hospital systems
  - objection: Sixty days is too far out; give us 30 days to decide on renewal.
    their_rationale: Budget approval for the next fiscal year is often not finalized until
      closer to the renewal date.
    response: 'Thirty days'' notice is already within our standard range and does not need
      approval. We would ask that any notice be in writing so there is no dispute about timing.

      '
    talking_points:
    - 30 days is available immediately, no escalation.
    - Written notice protects both sides from a timing dispute.
    recommended_position:
      rule_key: term.auto_renewal
      rung: 1
    frequency: common
    counterparty_profile: Mid-market customers on an annual budget cycle
  dependencies:
  - related_rule_key: termination.for_convenience
    relation: read_with
    note: 'Once Customer has a clean non-renewal path, a separate mid-term termination for
      convenience right is less necessary and should be resisted more firmly.

      '
  test_cases:
  - name: Standard 60-day non-renewal notice
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'This Agreement renews automatically for additional twelve-month terms unless
      either party notifies the other in writing at least sixty (60) days before the current
      term ends that it will not renew.

      '
  - name: Double-negative 45-day variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Unless Customer notifies Halcyon at least forty-five (45) days before the
      end of the then-current term that it elects not to renew, this Agreement continues automatically
      for another twelve-month term.

      '
  - name: 30-day notice window
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Either party may stop this Agreement from renewing by giving the other written
      notice at least thirty (30) days before the current term''s end date.

      '
  - name: 20-day notice window
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'This Agreement renews automatically unless a party gives notice of non-renewal
      at least twenty (20) days before the then-current term ends.

      '
  - name: Trap - double-negative confirming the preferred position
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'This Agreement does not simply terminate at the end of the Initial Term;
      rather, absent sixty (60) days'' advance written notice of non-renewal from either party,
      it continues automatically for a further twelve-month Renewal Term.

      '
- rule_key: termination.for_convenience
  title: Termination for convenience by Customer
  required: true
  risk_weight: 6
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Customer has no right to terminate for convenience during the Subscription
    Term; a narrow, late-starting right with no refund is a VP Sales concession, never a right
    exercisable at any time with a refund.

    '
  risk_rationale: 'Removing a committed Subscription Term''s cancellability is what lets Halcyon
    recognize subscription revenue predictably and justify implementation investment against
    a $165k median contract. A termination for convenience right, once granted, is the single
    biggest threat to that predictability on the largest accounts, up to $2.4M a year, so
    it should only be granted late in the term and without a refund.

    '
  detection_guidance: 'Look for "for any reason or no reason", "for convenience", "without
    cause", or "upon [n] days'' written notice" in the termination section, and note which
    party holds the right and what happens to prepaid Fees. The absence of any such right
    is Halcyon''s preferred position and is compliant, not a missing clause; Halcyon itself
    holding a termination for convenience right says nothing about Customer''s position under
    this rule.

    '
  source_ref: Halcyon Risk Policy RP-02; revenue predictability guidance
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: No termination for convenience
    zone: green
    summary: Customer may not terminate this Agreement for convenience during the Subscription
      Term.
    language: 'Except as expressly permitted elsewhere in this Agreement, Customer may not
      terminate this Agreement or any Order Form before the end of the then-current Subscription
      Term for convenience or without cause.

      '
  - kind: fallback
    rung: 1
    label: After month 18, 120 days' notice, no refund
    zone: yellow
    approver_role: vp_sales
    conditions:
      deal_value_band:
      - mid
      - enterprise
      - strategic
    give_get: Ask for a 36-month Initial Term or a non-refundable implementation fee in exchange.
    summary: Customer may terminate for convenience only after month 18, on 120 days' notice,
      with no refund.
    language: 'Beginning on the date that is eighteen (18) months after the Effective Date,
      Customer may terminate this Agreement for convenience by giving Halcyon at least one
      hundred twenty (120) days'' prior written notice. No Fees paid or payable before the
      effective date of such termination will be refunded.

      '
  - kind: fallback
    rung: 2
    label: After month 12, 90 days' notice, no refund
    zone: yellow
    approver_role: vp_sales
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a right of first refusal on any replacement vendor, or a larger non-refundable
      implementation fee.
    summary: Customer may terminate for convenience only after month 12, on 90 days' notice,
      with no refund.
    language: 'Beginning on the date that is twelve (12) months after the Effective Date,
      Customer may terminate this Agreement for convenience by giving Halcyon at least ninety
      (90) days'' prior written notice. No Fees paid or payable before the effective date
      of such termination will be refunded.

      '
    internal_note: 'Matches the company risk appetite anchor exactly; requires Deal Desk concurrence
      on the no-refund treatment in addition to VP Sales approval before signature.

      '
  - kind: acceptable_variant
    label: Non-renewal-only exit, counterparty wording
    zone: green
    summary: Counterparty wording that limits Customer's exit to non-renewal, which is the
      same outcome as no mid-term termination for convenience.
    language: 'Customer''s sole right to end its subscription without cause is to decline
      to renew the then-current term in accordance with the renewal provisions of this Agreement;
      Customer has no right to terminate for convenience during a Subscription Term that has
      already begun.

      '
  parameters:
  - key: customer_tfc_permitted
    label: Customer has any termination-for-convenience right
    value_type: boolean
    direction: exact
    preferred_value: false
    green_limit: false
    yellow_limit: true
    extraction_hint: 'True only if Customer has a right to terminate before the end of the
      Subscription Term without alleging a breach by Halcyon. A right exercisable only at
      renewal through non-renewal notice is false here.

      '
  - key: tfc_notice_days
    label: Notice required to exercise termination for convenience, in days
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 120
    green_limit: 120
    yellow_limit: 75
    extraction_hint: 'Applies only once customer_tfc_permitted is true. Read the stated notice
      period Customer must give before a for-convenience termination takes effect.

      '
  red_lines:
  - key: tfc-anytime-refund
    description: 'Customer may terminate for convenience at any time, including before any
      minimum period has run, and receive a refund of prepaid Fees.

      '
    condition_type: semantic
    condition:
      test: 'The clause gives Customer an unconditional right to terminate this Agreement
        for convenience at any time, with no minimum period before the right becomes exercisable,
        and entitles Customer to a refund of Fees already paid.

        '
    action: block
    rationale: 'This combination removes both the timing and the financial protection the
      Subscription Term is meant to provide and is one of the clearest ways a vendor contract
      becomes effectively cancel-anytime-for-a-refund, which is not insurable against on the
      revenue side the way a liability claim is.

      '
  objections:
  - objection: We need an exit if Halcyon Engage does not deliver the clinical workflow improvements
      we expect.
    their_rationale: Customer wants an operational escape hatch independent of proving a breach.
    response: 'A performance shortfall of that kind is addressed through the warranty and
      termination-for-cause provisions, not a general convenience right; if you need more
      flexibility than that, we can discuss a late-starting convenience right with VP Sales
      approval.

      '
    talking_points:
    - Performance concerns are a cure-period, for-cause matter, not a convenience right.
    - A convenience right, when granted, starts no earlier than month 12 with no refund.
    recommended_position:
      rule_key: termination.for_convenience
      rung: 2
    frequency: common
    counterparty_profile: Tier-2 customers piloting Halcyon Engage for the first time
  - objection: If we terminate for convenience, we should at least get back the unused portion
      of our prepayment.
    their_rationale: Customer views a refund of unused fees as fair even if they are the one
      ending the relationship early.
    response: 'We are not able to offer a refund on a convenience termination; doing so removes
      the financial predictability the committed term is meant to provide. A refund is available
      only where Customer terminates for Halcyon''s own uncured breach.

      '
    talking_points:
    - No-refund is a fixed feature of any convenience-termination concession.
    - A refund right already exists for Halcyon's uncured breach, under the effect-of-termination
      provision.
    recommended_position:
      rule_key: termination.effect_of_termination
      rung: 0
    frequency: occasional
    counterparty_profile: Strategic accounts with sophisticated procurement
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: trade_against
    note: 'Only extend a termination-for-convenience right in exchange for, or alongside,
      a liability position that is no more favorable to Customer than Halcyon''s standard
      cap; the two should not both move in Customer''s favor on the same deal.

      '
  test_cases:
  - name: No termination for convenience clause at all
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'This Agreement sets out specific grounds on which either party may terminate;
      it does not give Customer a right to end the Agreement without cause before the Subscription
      Term expires.

      '
  - name: Non-renewal-only exit variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Customer''s only means of ending its subscription without alleging a breach
      is to decline to renew at the end of the then-current term by following the non-renewal
      procedure stated above.

      '
  - name: Convenience right after month 12, 90 days, no refund
    context:
      deal_value_band: enterprise
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'After the first anniversary of the Effective Date, Customer may end this
      Agreement for any reason by giving ninety (90) days'' advance written notice, and Fees
      already paid will not be returned.

      '
  - name: Convenience right from month 6, 100 days' notice
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Starting six (6) months after the Effective Date, Customer may terminate
      this Agreement without cause on one hundred (100) days'' prior written notice.

      '
  - name: Trap - Halcyon's own convenience right
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon may terminate this Agreement for convenience at any time upon ninety
      (90) days'' written notice to Customer; this Agreement states no corresponding right
      for Customer.

      '
- rule_key: termination.for_cause_cure_period
  title: Termination for cause and cure period
  required: true
  risk_weight: 4
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Either party may terminate for the other''s uncured material breach after
    a 30-day cure period; shortening the cure period to as little as 10 days needs Commercial
    Counsel approval, and anything shorter, or no cure right at all, is a red line.

    '
  risk_rationale: 'A 30-day cure period gives Halcyon''s delivery and security teams realistic
    time to fix an integration or security issue before losing a customer worth up to $165k
    a year on average, while still letting Halcyon exit a customer that will not pay or cooperate.
    Too short a cure period on either side increases the odds a fixable issue escalates into
    a terminated account rather than being resolved.

    '
  detection_guidance: 'Look for "material breach", "fails to cure", "remains uncured" and
    a stated number of days after "written notice", together with insolvency wording such
    as "becomes the subject of a petition in bankruptcy" as a separate, immediate trigger.
    No termination-for-cause right at all is a missing clause. A right to terminate for breach
    with no opportunity to cure at all, or a stated cure period under 10 days, both fall under
    the red line below, not under deviation.

    '
  source_ref: Halcyon Risk Policy RP-02
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 30-day cure period
    zone: green
    summary: Either party may terminate for the other's uncured material breach after a 30-day
      cure period.
    language: 'Either party may terminate this Agreement if the other party materially breaches
      this Agreement and fails to cure that breach within thirty (30) days after receiving
      written notice describing it in reasonable detail, or immediately if the other party
      becomes the subject of a petition in bankruptcy or similar insolvency proceeding that
      is not dismissed within sixty (60) days.

      '
  - kind: fallback
    rung: 1
    label: 20-day cure period, non-payment carved out
    zone: yellow
    approver_role: commercial_counsel
    give_get: Ask that non-payment breaches keep the shorter cure period stated in the suspension
      provision.
    summary: Cure period reduced to 20 days, with non-payment breaches handled separately.
    language: 'Either party may terminate this Agreement if the other party materially breaches
      this Agreement and fails to cure that breach within twenty (20) days after receiving
      written notice describing it in reasonable detail, except that a breach of Customer''s
      payment obligations is governed by the suspension provision of this Agreement rather
      than by this cure period.

      '
  - kind: fallback
    rung: 2
    label: 15-day cure period
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that insolvency remain an immediate termination trigger with no cure
      right.
    summary: Cure period reduced to 15 days.
    language: 'Either party may terminate this Agreement if the other party materially breaches
      this Agreement and fails to cure that breach within fifteen (15) days after receiving
      written notice describing it in reasonable detail, or immediately if the other party
      becomes the subject of a petition in bankruptcy or similar insolvency proceeding that
      is not dismissed within sixty (60) days.

      '
  - kind: acceptable_variant
    label: Remedy-the-failure wording at 30 days
    zone: green
    summary: Same 30-day cure period in different wording.
    language: 'If either party commits a material breach of this Agreement and does not remedy
      the failure within thirty (30) days of written notice specifying it, the non-breaching
      party may terminate this Agreement on further written notice.

      '
  parameters:
  - key: cure_period_days
    label: Cure period, in days
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 30
    green_limit: 30
    yellow_limit: 7
    extraction_hint: 'Read the stated number of days to cure a material breach after written
      notice. Treat a separate, shorter cure period stated only for non-payment as part of
      the suspension or payment provisions, not this parameter.

      '
  red_lines:
  - key: cure-period-under-10-days-or-none
    description: 'Halcyon''s cure period for an alleged material breach is less than 10 days,
      or there is no cure period at all before Customer may terminate for breach.

      '
    condition_type: semantic
    condition:
      test: 'The clause lets Customer terminate for Halcyon''s material breach with no opportunity
        to cure, or with a cure period of fewer than ten (10) days after notice.

        '
    action: block
    rationale: 'A cure window that short does not give Halcyon''s delivery and security teams
      a realistic chance to fix an integration or security problem, turning any disputed breach
      allegation into an effective immediate termination right for Customer.

      '
  objections:
  - objection: Thirty days is too long if the issue is a HIPAA security problem affecting
      our patients.
    their_rationale: Customer treats a security incident as urgent enough to warrant a much
      faster exit right.
    response: 'A security incident is addressed through the breach notification and remediation
      provisions on a much faster timeline than this general cure period; we can shorten the
      general cure period itself to twenty days with Commercial Counsel approval if that is
      the underlying concern.

      '
    talking_points:
    - Security incidents are handled on their own, faster timeline elsewhere in the agreement.
    - The general cure period can come down to 20 days without touching the insolvency trigger.
    recommended_position:
      rule_key: termination.for_cause_cure_period
      rung: 1
    frequency: occasional
    counterparty_profile: Tier-1 health systems with security-focused counsel
  - objection: Non-payment should not get thirty days to cure; we want to be able to exit
      faster for that specific breach.
    their_rationale: Customer is comfortable with a longer general cure period but wants a
      faster path when Halcyon itself is the non-payor in a reciprocal services arrangement.
    response: 'We can carve non-payment out to a shorter, separate cure period with Commercial
      Counsel approval, while keeping thirty days for every other type of breach.

      '
    talking_points:
    - A carve-out for non-payment is available without shortening the general cure period.
    - Insolvency remains an immediate trigger regardless of the general cure period.
    recommended_position:
      rule_key: termination.for_cause_cure_period
      rung: 1
    frequency: rare
    counterparty_profile: Customers with their own services obligations to Halcyon
  dependencies:
  - related_rule_key: payment.payment_terms
    relation: trade_against
    note: 'A longer payment term should be paired with a shorter, separate cure period specifically
      for non-payment, so slow payment does not also delay Halcyon''s ability to act on it.

      '
  test_cases:
  - name: Standard 30-day cure period
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'If either party materially breaches this Agreement and does not cure the
      breach within thirty (30) days of written notice, the other party may terminate this
      Agreement.

      '
  - name: Remedy-the-failure variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'A party that fails to remedy a material breach within thirty (30) days after
      receiving notice specifying the breach may have this Agreement terminated by the non-breaching
      party.

      '
  - name: 15-day cure period
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Either party may end this Agreement if the other party''s material breach
      remains uncured fifteen (15) days after written notice of it.

      '
  - name: 25-day cure period
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'If either party''s material breach of this Agreement remains unresolved
      twenty-five (25) days after written notice of it, the other party may terminate this
      Agreement.

      '
  - name: 5-day cure period
    expected_outcome: red_line
    expected_red_line_key: cure-period-under-10-days-or-none
    expected_zone: red
    sample_text: 'Customer may terminate this Agreement if Halcyon''s material breach is not
      cured within five (5) days of written notice.

      '
  - name: No termination-for-cause provision
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: termination.effect_of_termination
  title: Effect of termination or expiration
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'On termination, accrued Fees are due, prepaid Fees are refunded pro-rata
    only if Customer terminated for Halcyon''s uncured breach, Customer Data is retrievable
    for 30 days, and stated sections survive; a longer retrieval window up to 90 days needs
    Commercial Counsel approval.

    '
  risk_rationale: 'Without a stated effect-of-termination clause, refunds, data access and
    survival default to general law, which is unpredictable across the US and EU jurisdictions
    where Halcyon''s 310 customers are based. A bounded data retrieval window also matters
    operationally, since Halcyon''s AWS storage and support costs do not stop just because
    a customer has left.

    '
  detection_guidance: 'Look for headings such as "Effect of Termination" and for "upon termination
    or expiration", "all rights granted shall cease", "refund any prepaid Fees" and "the following
    sections shall survive". Absence of this clause leaves refunds, data access and survival
    to general law and is a missing clause, distinct from a clause that states these outcomes
    but on worse terms.

    '
  source_ref: Halcyon Risk Policy RP-02; data retention schedule
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Accrued Fees due, pro-rata refund only for Halcyon's uncured breach, 30-day retrieval
    zone: green
    summary: Standard effect-of-termination package with a 30-day data retrieval window.
    language: 'Upon termination or expiration of this Agreement, Customer''s right to access
      the Services ceases, and all Fees accrued but unpaid as of the effective date become
      immediately due. Fees already paid are not refundable, except that if Customer terminates
      this Agreement under the termination-for-cause provision for Halcyon''s uncured material
      breach, Halcyon will refund, on a pro-rata basis, any prepaid Fees for the unused portion
      of the then-current Subscription Term. For thirty (30) days after the effective date
      of termination, Halcyon will make Customer Data available for Customer to retrieve in
      a standard export format, after which Halcyon''s destruction of that data from production
      systems and backup media is governed by the data return and deletion provision of this
      Agreement. Sections of this Agreement that by their nature should survive termination,
      including confidentiality, payment obligations accrued before termination, and limitation
      of liability, will survive.

      '
  - kind: fallback
    rung: 1
    label: 60-day data retrieval window
    zone: green
    summary: Same terms, with the data retrieval window extended to 60 days.
    language: 'Upon termination or expiration of this Agreement, Customer''s right to access
      the Services ceases, and all Fees accrued but unpaid as of the effective date become
      immediately due. Fees already paid are not refundable, except that if Customer terminates
      this Agreement under the termination-for-cause provision for Halcyon''s uncured material
      breach, Halcyon will refund, on a pro-rata basis, any prepaid Fees for the unused portion
      of the then-current Subscription Term. For sixty (60) days after the effective date
      of termination, Halcyon will make Customer Data available for Customer to retrieve in
      a standard export format, after which Halcyon''s destruction of that data from production
      systems and backup media is governed by the data return and deletion provision of this
      Agreement. Sections of this Agreement that by their nature should survive termination,
      including confidentiality, payment obligations accrued before termination, and limitation
      of liability, will survive.

      '
  - kind: fallback
    rung: 2
    label: 90-day data retrieval window
    zone: yellow
    approver_role: commercial_counsel
    give_get: Ask for prepayment of any extension period Customer requests beyond the stated
      window.
    summary: Data retrieval window extended to 90 days.
    language: 'Upon termination or expiration of this Agreement, Customer''s right to access
      the Services ceases, and all Fees accrued but unpaid as of the effective date become
      immediately due. Fees already paid are not refundable, except that if Customer terminates
      this Agreement under the termination-for-cause provision for Halcyon''s uncured material
      breach, Halcyon will refund, on a pro-rata basis, any prepaid Fees for the unused portion
      of the then-current Subscription Term. For ninety (90) days after the effective date
      of termination, Halcyon will make Customer Data available for Customer to retrieve in
      a standard export format, after which Halcyon''s destruction of that data from production
      systems and backup media is governed by the data return and deletion provision of this
      Agreement. Sections of this Agreement that by their nature should survive termination,
      including confidentiality, payment obligations accrued before termination, and limitation
      of liability, will survive.

      '
  - kind: acceptable_variant
    label: Export-window wording
    zone: green
    summary: Same 30-day window, described as an export period rather than a retrieval period.
    language: 'Following termination, Customer will have thirty (30) days to export its Customer
      Data in a standard format, after which the data return and deletion provision of this
      Agreement governs its destruction, and any Fees accrued prior to termination remain
      payable; prepaid Fees are non-refundable except on a pro-rata basis where Customer terminated
      for Halcyon''s uncured material breach.

      '
  parameters:
  - key: data_retrieval_window_days
    label: Post-termination data retrieval window, in days
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 30
    green_limit: 60
    yellow_limit: 90
    extraction_hint: 'Read the number of days after termination that Customer Data remains
      available for export or retrieval. An indefinite or unlimited window does not map to
      a number here; assess it against the red line instead.

      '
  red_lines:
  - key: eot-unlimited-retention-or-fee-waiver
    description: 'Halcyon must retain or provide access to Customer Data for an indefinite
      or unlimited period after termination, or Customer''s Fees accrued before termination
      are waived rather than paid.

      '
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to keep Customer Data available, or to continue hosting
        it, for an indefinite or unlimited time after termination with no stated end date,
        or it excuses Customer from paying Fees that accrued before the termination date.

        '
    action: block
    rationale: 'Open-ended post-termination hosting is a cost with no stop date across 310
      customers, and waiving already-accrued Fees on top of that turns an ordinary exit into
      Halcyon absorbing both the storage cost and the lost revenue.

      '
  objections:
  - objection: Thirty days is not enough for our IT team to migrate patient data to a new
      system.
    their_rationale: Migrating clinical and scheduling data out of a care-coordination platform
      takes real operational time.
    response: 'We can extend the retrieval window to sixty days at no cost, which is already
      available without escalation; a longer window up to ninety days needs Commercial Counsel
      approval and is usually paired with prepayment for the extension.

      '
    talking_points:
    - 60 days is available immediately, no escalation.
    - 90 days is available with approval and a modest give-get.
    recommended_position:
      rule_key: termination.effect_of_termination
      rung: 1
    frequency: common
    counterparty_profile: Tier-1 health systems with complex data migrations
  - objection: We should get our unused subscription fees back no matter why the Agreement
      ends.
    their_rationale: Customer views any early end to the relationship as grounds for a pro-rata
      refund.
    response: 'A pro-rata refund already applies when Customer terminates for our uncured
      breach; extending that to every termination, including Customer''s own convenience termination,
      is not something we can agree to, since it removes the financial predictability the
      term is meant to provide.

      '
    talking_points:
    - A pro-rata refund already exists for Halcyon's uncured breach.
    - Extending it to every exit scenario is a different, larger concession than this rule
      covers.
    frequency: occasional
    counterparty_profile: Strategic accounts negotiating broad exit protections
  dependencies:
  - related_rule_key: data_protection.data_return_and_deletion
    relation: requires
    note: 'This rule fixes the data retrieval window first; the data protection rule''s production
      destruction and backup purge periods are a second, later stage that runs from the end
      of this window, not from the termination date. Whichever rung of this rule is agreed
      (30, 60 or 90 days), the deletion commitment in the other rule always starts the clock
      after it, so Customer is never promised access to data Halcyon has already committed
      to delete.

      '
  - related_rule_key: termination.for_convenience
    relation: read_with
    note: 'The pro-rata refund carve-out here is deliberately narrower than, and should not
      be read to expand, any refund terms negotiated into a termination-for-convenience fallback.

      '
  test_cases:
  - name: Standard effect-of-termination package
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'When this Agreement ends, Customer must pay all Fees that accrued before
      the end date, and Halcyon will keep Customer Data available for export for thirty (30)
      days afterward. Prepaid Fees are not returned except pro-rata if Customer ended the
      Agreement for Halcyon''s own uncured breach.

      '
  - name: Export-window wording variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'On termination, Customer has a thirty (30) day export period for its data,
      all pre-termination Fees remain due, and prepayments are non-refundable other than on
      a pro-rata basis for a termination caused by Halcyon''s uncured breach.

      '
  - name: 60-day retrieval window
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Customer Data remains available for retrieval for sixty (60) days following
      termination, and accrued Fees remain payable regardless of the reason for termination.

      '
  - name: 75-day retrieval window with no approval basis stated
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon will retain and make available Customer Data for seventy-five (75)
      days after termination for Customer to retrieve.

      '
  - name: Indefinite data retention with Fees waived
    expected_outcome: red_line
    expected_red_line_key: eot-unlimited-retention-or-fee-waiver
    expected_zone: red
    sample_text: 'Halcyon will continue to host and make available Customer Data indefinitely
      after termination, and any Fees accrued but unpaid as of the termination date are waived.

      '
  - name: No effect-of-termination provision
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: suspension.suspension_rights
  title: Halcyon's right to suspend the Services
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon may suspend the Services for fees overdue more than 30 days,
    a security threat, or unlawful use, on 10 days'' notice where practicable; widening the
    overdue threshold to 60 days and the notice to 15 days needs Commercial Counsel approval.

    '
  risk_rationale: 'Suspension is Halcyon''s main lever against non-payment short of terminating
    a $165k-median relationship outright, and Halcyon Engage is used in active patient care,
    so the trigger and notice period need to be narrow enough to be fair to hospital customers
    while still giving Halcyon a real remedy before a non-paying account runs for months.
    A security or unlawful-use trigger protects Halcyon''s SOC 2 Type II and HITRUST r2 posture
    across the whole multi-tenant environment, not just the one account.

    '
  detection_guidance: 'Look for "may suspend", "access to the Services", "overdue by more
    than thirty (30) days", "threat to the security or integrity" and "prior written notice
    where practicable". No suspension right at all leaves non-payment or misuse to be addressed
    only through termination, which is a missing clause on Halcyon''s own paper.

    '
  source_ref: Halcyon Risk Policy RP-05; security incident response plan
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 30-day overdue threshold, 10 days' notice
    zone: green
    summary: Halcyon may suspend for fees 30 days overdue, a security threat, or unlawful
      use, on 10 days' notice.
    language: 'Halcyon may suspend Customer''s and any user''s access to the Services, with
      prior written notice of at least ten (10) days where practicable, if (a) any undisputed
      Fees remain overdue by more than thirty (30) days, (b) Halcyon reasonably determines
      that suspension is necessary to address a threat to the security or integrity of the
      Services or any other customer''s data, or (c) Customer''s or a user''s use of the Services
      violates applicable law or this Agreement''s acceptable use terms. Halcyon will restore
      access promptly once the condition giving rise to the suspension has been resolved.

      '
  - kind: fallback
    rung: 1
    label: 45-day overdue threshold
    zone: green
    summary: The non-payment overdue threshold is extended to 45 days.
    language: 'Halcyon may suspend Customer''s and any user''s access to the Services, with
      prior written notice of at least ten (10) days where practicable, if (a) any undisputed
      Fees remain overdue by more than forty-five (45) days, (b) Halcyon reasonably determines
      that suspension is necessary to address a threat to the security or integrity of the
      Services or any other customer''s data, or (c) Customer''s or a user''s use of the Services
      violates applicable law or this Agreement''s acceptable use terms. Halcyon will restore
      access promptly once the condition giving rise to the suspension has been resolved.

      '
  - kind: fallback
    rung: 2
    label: 60-day overdue threshold, 15 days' notice
    zone: yellow
    approver_role: commercial_counsel
    give_get: Ask for a shortened cure period specifically for repeated non-payment in exchange.
    summary: Non-payment threshold extended to 60 days, with 15 days' advance notice.
    language: 'Halcyon may suspend Customer''s and any user''s access to the Services, with
      prior written notice of at least fifteen (15) days where practicable, if (a) any undisputed
      Fees remain overdue by more than sixty (60) days, (b) Halcyon reasonably determines
      that suspension is necessary to address a threat to the security or integrity of the
      Services or any other customer''s data, or (c) Customer''s or a user''s use of the Services
      violates applicable law or this Agreement''s acceptable use terms. Halcyon will restore
      access promptly once the condition giving rise to the suspension has been resolved.

      '
    internal_note: 'Consult security_lead and vp_customer_success before agreeing to this
      rung, consistent with the suspension-yellow escalation policy in authority.yaml.

      '
  - kind: acceptable_variant
    label: May-suspend-or-terminate wording
    zone: green
    summary: Same suspension right, drafted as one of several remedies Halcyon may choose
      among.
    language: 'If any undisputed Fees remain unpaid more than thirty (30) days after their
      due date, or Halcyon reasonably believes continued access poses a security risk or involves
      unlawful use, Halcyon may, at its option and with ten (10) days'' notice where practicable,
      suspend access to the Services or terminate this Agreement.

      '
  parameters:
  - key: suspension_overdue_threshold_days
    label: Fees overdue before Halcyon may suspend for non-payment, in days
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 30
    green_limit: 45
    yellow_limit: 60
    extraction_hint: 'Read the number of days an invoice must be overdue before suspension
      for non-payment is permitted. Does not apply to suspension for a security threat or
      unlawful use, which are not tied to a day count.

      '
  - key: suspension_notice_days
    label: Advance notice of suspension, in days
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 10
    green_limit: 10
    yellow_limit: 15
    extraction_hint: 'Read the stated advance notice period before suspension takes effect.
      A right to suspend a security threat immediately, without notice, is standard and does
      not reduce this parameter; read it from the non-payment and unlawful-use triggers.

      '
  red_lines:
  - key: susp-right-removed-with-liability
    description: 'Halcyon has no right to suspend the Services for non-payment, security threat
      or unlawful use, while remaining liable for any resulting unavailability.

      '
    condition_type: semantic
    condition:
      test: 'The clause removes or prohibits Halcyon''s right to suspend the Services for
        non-payment, a security threat, or unlawful use, while still holding Halcyon responsible
        for service levels or liability as if the Services remained continuously available.

        '
    action: block
    rationale: 'Without a suspension right, Halcyon''s only lever against a non-paying or
      misusing customer is full termination, which is a disproportionate response to a single
      overdue invoice and takes far longer, while the clause would still hold Halcyon to uptime
      and liability commitments it has no way to protect.

      '
  objections:
  - objection: Suspending access to a patient-care system on 10 days' notice for a billing
      dispute is dangerous.
    their_rationale: Customer is concerned about continuity of care if access is cut off over
      a payment disagreement.
    response: 'The suspension right only applies to undisputed amounts overdue by more than
      thirty days, not to a genuine billing dispute, and we always restore access promptly
      once the issue is resolved. If your team needs more runway, we can extend the overdue
      threshold to 45 days at no cost.

      '
    talking_points:
    - Suspension applies only to undisputed, significantly overdue amounts.
    - 45 days is available immediately as a no-cost concession.
    recommended_position:
      rule_key: suspension.suspension_rights
      rung: 1
    frequency: common
    counterparty_profile: Tier-1 hospital systems concerned about care continuity
  - objection: Give us 15 days' notice before any suspension, and extend the overdue threshold
      to 60 days.
    their_rationale: Larger organizations want more internal runway to resolve an invoice
      dispute before access is affected.
    response: 'We can extend both numbers together with Commercial Counsel approval, in exchange
      for a shorter cure period specifically for repeated non-payment, so a pattern of late
      payment does not also slow our ability to act on it.

      '
    talking_points:
    - The 60-day, 15-day combination is available only with approval.
    - A shorter repeated-non-payment cure period is the standard trade.
    recommended_position:
      rule_key: suspension.suspension_rights
      rung: 2
    frequency: occasional
    counterparty_profile: Tier-1 and enterprise accounts
  dependencies:
  - related_rule_key: payment.payment_terms
    relation: requires
    note: 'The suspension overdue threshold is measured from the due date set by the payment
      terms rule; keep the two day counts consistent when either is negotiated.

      '
  test_cases:
  - name: Standard 30-day suspension right
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'If any undisputed invoice remains unpaid more than thirty (30) days after
      its due date, Halcyon may suspend Customer''s access to the Services on ten (10) days''
      prior notice where practicable, restoring access promptly once payment is received.

      '
  - name: Suspend-or-terminate option variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Where Fees remain undisputed and unpaid for more than thirty (30) days,
      Halcyon may choose to suspend access or terminate this Agreement, giving ten (10) days''
      notice where practicable before suspension.

      '
  - name: 45-day overdue threshold
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Halcyon may suspend the Services if an undisputed invoice is not paid within
      forty-five (45) days of its due date.

      '
  - name: 50-day threshold, 12 days' notice
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon may suspend access to the Services if an undisputed invoice remains
      unpaid fifty (50) days after its due date, on twelve (12) days'' prior notice where
      practicable.

      '
  - name: No suspension right, liability for unavailability retained
    expected_outcome: red_line
    expected_red_line_key: susp-right-removed-with-liability
    expected_zone: red
    sample_text: 'Halcyon has no right to suspend Customer''s access to the Services for any
      reason, and remains fully liable for the uptime commitment regardless of Customer''s
      payment status.

      '
  - name: No suspension provision
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: service_levels.uptime_commitment
  title: Uptime commitment
  required: true
  risk_weight: 6
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon commits to 99.9% Monthly Uptime Percentage, excluding scheduled
    maintenance and events outside its control; raising the commitment to 99.95% needs VP
    Customer Success approval, and 99.99% or higher, or a commitment with no exclusions, is
    a red line.

    '
  risk_rationale: 'Each additional "nine" of committed uptime sharply reduces Halcyon''s permitted
    downtime and raises engineering cost across every tenant on shared AWS infrastructure
    in us-east-1, us-west-2 and eu-west-1, not just the one customer asking for it. 99.9%
    monthly is realistic given Halcyon''s current architecture and SOC 2 Type II change-management
    controls, while 99.95% is achievable only with added redundancy that is not cost-justified
    for a $165k median contract.

    '
  detection_guidance: 'Look for "available", "Uptime", "Monthly Uptime Percentage", a stated
    percentage, "excluding Scheduled Maintenance" and "measured monthly", in the main agreement
    or a service level exhibit. No availability commitment at all is a missing clause on a
    hosted service like Halcyon Engage.

    '
  source_ref: Halcyon Service Level Policy SL-01
  authored_by: Senior Commercial Counsel
  approved_by: VP Customer Success
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 99.9% monthly
    zone: green
    summary: 99.9% Monthly Uptime Percentage, excluding scheduled maintenance and events outside
      Halcyon's control.
    language: 'Halcyon will use commercially reasonable efforts to maintain a Monthly Uptime
      Percentage of at least 99.9% for the Services, excluding Scheduled Maintenance, Emergency
      Maintenance, and any unavailability caused by Customer''s equipment, a third-party service,
      or a Force Majeure Event. "Scheduled Maintenance" means maintenance for which Halcyon
      gives Customer at least twenty-four (24) hours'' prior notice.

      '
  - kind: fallback
    rung: 1
    label: 99.95% measured quarterly
    zone: yellow
    approver_role: vp_customer_success
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Ask for a 24-month or longer Initial Term in exchange.
    summary: Headline commitment raised to 99.95%, measured over a calendar quarter rather
      than each month.
    language: 'Halcyon will use commercially reasonable efforts to maintain a Quarterly Uptime
      Percentage of at least 99.95% for the Services, calculated over each calendar quarter
      rather than each month, and excluding Scheduled Maintenance, Emergency Maintenance,
      and any unavailability caused by Customer''s equipment, a third-party service, or a
      Force Majeure Event.

      '
  - kind: fallback
    rung: 2
    label: 99.95% measured monthly
    zone: yellow
    approver_role: vp_customer_success
    conditions:
      counterparty_tier:
      - tier_1
      deal_value_band:
      - enterprise
      - strategic
    give_get: Require that the service credit cap and sole-remedy language stay at the preferred
      position.
    summary: 99.95% Monthly Uptime Percentage, measured each calendar month.
    language: 'Halcyon will use commercially reasonable efforts to maintain a Monthly Uptime
      Percentage of at least 99.95% for the Services, excluding Scheduled Maintenance, Emergency
      Maintenance, and any unavailability caused by Customer''s equipment, a third-party service,
      or a Force Majeure Event.

      '
  - kind: acceptable_variant
    label: Wider maintenance exclusion, same 99.9% headline
    zone: green
    summary: Same 99.9% commitment, with a broader, explicitly bounded maintenance exclusion.
    language: 'The Services will be available at least 99.9% of the time in each calendar
      month, excluding up to eight (8) hours of Scheduled Maintenance per month performed
      on at least twenty-four (24) hours'' notice, Emergency Maintenance, and outages caused
      by Customer''s equipment, a third-party service, or events beyond Halcyon''s reasonable
      control.

      '
  parameters:
  - key: uptime_percent
    label: Committed Monthly (or equivalent) Uptime Percentage
    value_type: percent
    unit: percent
    direction: lower_is_better
    preferred_value: 99.9
    green_limit: 99.9
    yellow_limit: 99.98
    extraction_hint: 'Read the stated committed availability percentage directly. Treat a
      quarterly-measured commitment at the same stated percentage as this value; the measurement
      period is a separate consideration from the percentage itself.

      '
  - key: maintenance_notice_hours
    label: Advance notice of Scheduled Maintenance, in hours
    value_type: number
    unit: hours
    direction: lower_is_better
    preferred_value: 24
    green_limit: 24
    yellow_limit: 72
    extraction_hint: 'Read the stated advance notice period, in hours, Halcyon must give before
      Scheduled Maintenance that is excluded from the uptime calculation.

      '
  red_lines:
  - key: uptime-100-percent-no-exclusions
    description: 'Halcyon commits to 100% uptime, or to an uptime commitment with no exclusion
      for scheduled maintenance, emergency maintenance or force majeure events.

      '
    condition_type: semantic
    condition:
      test: 'The clause commits Halcyon to 100% availability, or states an uptime commitment
        with no exclusion at all for scheduled maintenance, emergency maintenance, or events
        outside Halcyon''s reasonable control.

        '
    action: block
    rationale: 'No multi-tenant SaaS platform can honestly promise 100% availability or maintenance
      with zero exclusions, and agreeing to it creates a commitment Halcyon''s own infrastructure
      cannot actually meet, regardless of the service credit remedy attached to it.

      '
  objections:
  - objection: 99.9% is not enough for a system our clinicians rely on throughout the day;
      we need 99.95%.
    their_rationale: A large health system views patient-facing scheduling and messaging tools
      as near-critical infrastructure.
    response: 'We can commit to 99.95% measured over a calendar quarter with VP Customer Success
      approval, which smooths out any single bad month; a monthly 99.95% commitment is available
      too, but it is a deeper concession and typically needs a longer committed term in exchange.

      '
    talking_points:
    - Quarterly-measured 99.95% is the lighter of the two 99.95% options.
    - A longer Initial Term is the standard trade for either option.
    recommended_position:
      rule_key: service_levels.uptime_commitment
      rung: 1
    frequency: common
    counterparty_profile: Tier-1 hospital systems
  - objection: Your maintenance exclusion is too broad; eight hours a month is a lot of downtime
      you are carving out.
    their_rationale: Customer reads a wide maintenance window as a way to understate real
      unavailability.
    response: 'The eight-hour figure is a ceiling, not a target, and it comes with twenty-four
      hours'' advance notice so your team can plan around it; we are not able to commit to
      an uptime figure with no maintenance exclusion at all.

      '
    talking_points:
    - The maintenance allowance is a stated ceiling with advance notice.
    - An exclusion-free commitment is a red line, not a negotiable point.
    frequency: occasional
    counterparty_profile: Tier-2 customers with technical procurement review
  dependencies:
  - related_rule_key: service_levels.service_credits
    relation: read_with
    note: 'The uptime percentage and measurement period here must match the availability bands
      used to calculate service credits, or the remedy will not line up with the commitment
      it is meant to cover.

      '
  test_cases:
  - name: Standard 99.9% monthly commitment
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will keep the Services available at least 99.9% of the time each
      month, not counting Scheduled Maintenance or events outside its reasonable control.

      '
  - name: Broader maintenance exclusion variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'The Services will meet a 99.9% monthly availability target, excluding up
      to eight hours of notified maintenance per month and any outage caused by factors outside
      Halcyon''s reasonable control.

      '
  - name: 99.95% quarterly commitment for a tier-1 account
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Measured over each calendar quarter, Halcyon commits to at least 99.95%
      availability of the Services, excluding Scheduled Maintenance and Force Majeure Events.

      '
  - name: 99.92% monthly commitment with no stated basis
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'The Services will be available at least 99.92% of the time each month.

      '
  - name: 100% uptime promise
    expected_outcome: red_line
    expected_red_line_key: uptime-100-percent-no-exclusions
    expected_zone: red
    sample_text: 'Halcyon guarantees the Services will be available one hundred percent (100%)
      of the time, with no exceptions.

      '
  - name: No availability commitment
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: service_levels.service_credits
  title: Service credits for missed service levels
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Service credits are capped at 10% of the affected month''s Fees and are
    Customer''s sole remedy for a missed uptime commitment; raising the cap to as much as
    25% needs VP Customer Success approval, and removing the sole-remedy status is a red line.

    '
  risk_rationale: 'Service credits need to be meaningful enough to matter to Customer without
    becoming a second, uncapped damages regime layered on top of the general liability cap.
    Capping credits at a percentage of a single month''s Fees, against a $165k median annual
    contract, keeps the maximum exposure per incident proportionate and predictable across
    Halcyon''s 310 customers.

    '
  detection_guidance: 'Look for "Service Credit", a table of availability bands against a
    percentage of monthly Fees, "shall not exceed", "sole and exclusive remedy", "must be
    requested within" and "chronic failure". An uptime commitment stated with no remedy at
    all for missing it is a missing issue, since it leaves Customer to claim damages instead.

    '
  source_ref: Halcyon Service Level Policy SL-01
  authored_by: Senior Commercial Counsel
  approved_by: VP Customer Success
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Capped at 10%, sole remedy
    zone: green
    summary: Service credits on a sliding scale, capped at 10% of the affected month's Fees,
      as Customer's sole remedy.
    language: 'If Halcyon fails to meet the Monthly Uptime Percentage commitment in a calendar
      month, Customer may request a service credit calculated on the sliding scale stated
      in the applicable service level exhibit, provided that the total service credits for
      any month will not exceed ten percent (10%) of the Fees payable for that month. Service
      credits are Customer''s sole and exclusive remedy for Halcyon''s failure to meet the
      uptime commitment, and Customer must request a credit in writing within thirty (30)
      days after the month to which it relates.

      '
  - kind: fallback
    rung: 1
    label: Capped at 15%, sole remedy
    zone: green
    summary: The monthly service credit cap is raised to 15% of the affected month's Fees.
    language: 'If Halcyon fails to meet the Monthly Uptime Percentage commitment in a calendar
      month, Customer may request a service credit calculated on the sliding scale stated
      in the applicable service level exhibit, provided that the total service credits for
      any month will not exceed fifteen percent (15%) of the Fees payable for that month.
      Service credits are Customer''s sole and exclusive remedy for Halcyon''s failure to
      meet the uptime commitment, and Customer must request a credit in writing within thirty
      (30) days after the month to which it relates.

      '
  - kind: fallback
    rung: 2
    label: Capped at 25%, sole remedy
    zone: yellow
    approver_role: vp_customer_success
    conditions:
      counterparty_tier:
      - tier_1
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a 24-month or longer Initial Term, or a chronic-failure termination
      right in place of an uncapped remedy.
    summary: The monthly service credit cap is raised to 25% of the affected month's Fees.
    language: 'If Halcyon fails to meet the Monthly Uptime Percentage commitment in a calendar
      month, Customer may request a service credit calculated on the sliding scale stated
      in the applicable service level exhibit, provided that the total service credits for
      any month will not exceed twenty-five percent (25%) of the Fees payable for that month.
      Service credits are Customer''s sole and exclusive remedy for Halcyon''s failure to
      meet the uptime commitment, and Customer must request a credit in writing within thirty
      (30) days after the month to which it relates.

      '
  - kind: acceptable_variant
    label: Sliding-scale table wording
    zone: green
    summary: Same 10% cap and sole-remedy status, expressed as an availability-band table
      rather than prose.
    language: 'Service credits for a missed Monthly Uptime Percentage are calculated according
      to the table in the applicable service level exhibit, subject to a cap of ten percent
      (10%) of the affected month''s Fees, and are Customer''s only remedy for an uptime shortfall.

      '
  parameters:
  - key: service_credit_cap_percent
    label: Monthly service credit cap, percent of that month's Fees
    value_type: percent
    unit: percent of monthly Fees
    direction: lower_is_better
    preferred_value: 10
    green_limit: 15
    yellow_limit: 25
    extraction_hint: 'Read the stated cap on total service credits for a single month, as
      a percentage of that month''s Fees. Convert a stated dollar cap to a percentage using
      the Fees for the affected month when known.

      '
  - key: credit_request_window_days
    label: Days Customer has to request a service credit
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 30
    green_limit: 30
    yellow_limit: 60
    extraction_hint: 'Read the stated number of days after the affected month, or after the
      uptime shortfall, within which Customer must request a service credit.

      '
  - key: service_credits_sole_remedy
    label: Service credits are Customer's sole remedy for a missed uptime commitment
    value_type: boolean
    direction: exact
    preferred_value: true
    green_limit: true
    yellow_limit: true
    extraction_hint: 'True if the clause states that service credits are Customer''s sole,
      exclusive or only remedy for an uptime shortfall; false if Customer may also claim damages
      or other remedies for the same shortfall.

      '
  red_lines:
  - key: credit-not-sole-remedy
    description: 'Service credits are not stated as Customer''s sole remedy for a missed uptime
      commitment, leaving Customer free to also claim damages for the same shortfall.

      '
    condition_type: parameter
    condition:
      parameter_key: service_credits_sole_remedy
      op: eq
      value: false
    action: block
    rationale: 'Without sole-remedy status, a single availability incident could expose Halcyon
      to both a service credit and a separate damages claim for the same event, layering an
      uncapped remedy on top of the capped one the credit scale is meant to provide.

      '
  objections:
  - objection: A capped service credit with no other remedy does not reflect how much an outage
      actually costs us.
    their_rationale: Customer argues the credit understates real operational harm from downtime
      affecting patient care.
    response: 'We can raise the monthly cap to fifteen percent at no cost, and up to twenty-five
      percent with VP Customer Success approval, but we are not able to remove the sole-remedy
      status, since that would layer an open-ended damages claim on top of the credit.

      '
    talking_points:
    - 15% is available immediately; 25% is available with approval.
    - Sole-remedy status is not part of the negotiable range.
    recommended_position:
      rule_key: service_levels.service_credits
      rung: 1
    frequency: common
    counterparty_profile: Tier-1 hospital systems
  - objection: If Halcyon has repeated outages month after month, a credit alone is not enough;
      we want a right to terminate.
    their_rationale: Customer wants an exit option for chronic, rather than one-off, service
      level failures.
    response: 'We can add a chronic-failure termination right, for example after three consecutive
      months of missed commitments, as part of the give-get for a higher credit cap, rather
      than removing the sole-remedy status itself.

      '
    talking_points:
    - A chronic-failure termination right is a workable alternative to an uncapped remedy.
    - It is offered alongside, not instead of, the capped credit.
    recommended_position:
      rule_key: service_levels.service_credits
      rung: 2
    frequency: occasional
    counterparty_profile: Strategic accounts with high operational reliance on Halcyon Engage
  dependencies:
  - related_rule_key: service_levels.uptime_commitment
    relation: read_with
    note: 'The availability bands behind this credit scale must be calculated against the
      same Monthly (or Quarterly) Uptime Percentage commitment and measurement period negotiated
      in the uptime rule.

      '
  - related_rule_key: limitation_of_liability.cap_amount
    relation: requires
    note: 'If sole-remedy status is ever removed for a given deal, any resulting damages claim
      for an availability shortfall must still sit inside the general liability cap, not alongside
      it.

      '
  test_cases:
  - name: Standard 10% cap, sole remedy
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Customer''s only remedy for Halcyon missing the uptime commitment in a month
      is a service credit, capped at ten percent (10%) of that month''s Fees, requested in
      writing within thirty days.

      '
  - name: Sliding-scale table variant
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'The service level exhibit''s availability-band table determines the credit
      owed for a shortfall, up to a ceiling of ten percent (10%) of the month''s Fees, and
      no other remedy is available for that shortfall.

      '
  - name: 15% cap, sole remedy
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'For any month Halcyon does not meet the uptime commitment, Customer may
      claim a credit of up to fifteen percent (15%) of that month''s Fees as its only remedy.

      '
  - name: 20% cap, sole remedy kept
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Service credits for a missed uptime commitment, capped at twenty percent
      (20%) of the affected month''s Fees, are Customer''s only remedy for that shortfall.

      '
  - name: Credits available in addition to damages
    expected_outcome: red_line
    expected_red_line_key: credit-not-sole-remedy
    expected_zone: red
    sample_text: 'Customer may claim a service credit for a missed uptime commitment and may
      separately pursue any other remedy available at law for the same failure.

      '
  - name: No remedy stated for a missed uptime commitment
    expected_outcome: missing
    expected_zone: yellow
    sample_text: ''
- rule_key: limitation_of_liability.cap_amount
  title: Aggregate liability cap
  required: true
  risk_weight: 10
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Each party''s total liability is capped at the Fees paid in the 12 months
    before the claim, rising only on larger deals and only with the named approvals.

    '
  risk_rationale: 'Halcyon''s median contract is $165k a year against $10M of cyber and technology
    errors and omissions cover and $2M of general liability cover. An uncapped or high-multiple
    cap on one contract can exceed the revenue from that customer many times over and is not
    insurable, so the cap is the single most important number in the agreement.

    '
  detection_guidance: 'Look for "aggregate liability", "total liability", "shall not exceed",
    "limited to", followed by an amount, a multiple such as "two times", or a look-back period
    such as "the twelve months preceding the claim". A liability clause with no monetary limit
    is a deviation, not a missing clause; an agreement with no liability clause at all is
    a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04; cyber and technology E&O aggregate limit
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: 12-month cap
    zone: green
    summary: Mutual cap at 12 months of Fees.
    language: 'Except for the Excluded Claims, each party''s total aggregate liability arising
      out of or related to this Agreement shall not exceed the Fees paid and payable by Customer
      in the twelve (12) months preceding the first event giving rise to the liability.

      '
  - kind: fallback
    rung: 1
    label: 18-month cap
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      deal_value_band:
      - mid
      - enterprise
      - strategic
    give_get: Ask for a thirty-six (36) month initial term or annual Fees paid in advance.
    summary: Mutual cap at 18 months of Fees.
    language: 'Except for the Excluded Claims, each party''s total aggregate liability arising
      out of or related to this Agreement shall not exceed the Fees paid and payable by Customer
      in the eighteen (18) months preceding the first event giving rise to the liability.

      '
  - kind: fallback
    rung: 2
    label: 24-month cap
    zone: yellow
    approver_role: general_counsel
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Require that all indemnities and the data breach super-cap sit inside this cap.
    summary: Mutual cap at 24 months of Fees.
    language: 'Except for the Excluded Claims, each party''s total aggregate liability arising
      out of or related to this Agreement shall not exceed the Fees paid and payable by Customer
      in the twenty-four (24) months preceding the first event giving rise to the liability.

      '
  - kind: acceptable_variant
    label: Fixed-sum cap at or below 12 months of Fees
    zone: green
    summary: A dollar cap no higher than 12 months of Fees.
    language: 'Except for the Excluded Claims, the total aggregate liability of each party
      arising out of or related to this Agreement shall not exceed the greater of (a) the
      Fees paid in the prior twelve (12) months and (b) US$[amount].

      '
  parameters:
  - key: cap_multiple_months
    label: Cap as months of Fees
    value_type: number
    unit: months
    direction: lower_is_better
    preferred_value: 12
    green_limit: 12
    yellow_limit: 24
    extraction_hint: 'Convert "1x annual fees" to 12, "2x" to 24, "3x" to 36. A fixed sum
      is converted using the contract''s annual Fees when known.

      '
  red_lines:
  - key: lol-cap-above-ceiling
    description: A finite cap stated above 36 months of Fees, the highest rung any approver
      may give.
    condition_type: parameter
    condition:
      parameter_key: cap_multiple_months
      op: gt
      value: 36
    action: block
    rationale: '36 months of Fees on a strategic deal, approved by the General Counsel with
      the CFO, is the ceiling the risk appetite allows against $10M of cyber and technology
      E&O cover; a higher finite multiple is treated the same as no cap at all for insurance
      purposes.

      '
  objections:
  - objection: Twelve months of fees does not cover our exposure if patient data is lost.
    their_rationale: A breach affecting patients costs far more than one year of the subscription.
    response: 'We address data incidents separately through a dedicated, higher cap, so the
      general cap does not need to carry that risk. The general cap covers ordinary contract
      claims, where twelve months of Fees is the market position for software of this kind.

      '
    talking_points:
    - Point to the data breach super-cap at 2x annual Fees.
    - The cap is mutual and also protects Customer.
    recommended_position:
      rule_key: limitation_of_liability.data_breach_super_cap
      rung: 0
    frequency: common
    counterparty_profile: Large hospital systems
  - objection: Our procurement policy requires every vendor to accept at least two years of
      fees.
    their_rationale: The policy is applied to all suppliers regardless of what they provide.
    response: 'We can move above twelve months where the deal supports it. For an agreement
      of this size we can offer eighteen months of Fees, provided the initial term is thirty-six
      months.

      '
    talking_points:
    - Ask whether the policy distinguishes software from hardware or construction services.
    - Offer the 18-month cap in return for a longer initial term.
    recommended_position:
      rule_key: limitation_of_liability.cap_amount
      rung: 1
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.data_breach_super_cap
    relation: trade_against
    note: Offer the data breach super-cap before raising the general cap; raising both at
      once gives away more than either concession needs.
  - related_rule_key: term.initial_term
    relation: trade_against
    note: 'Rungs 1 and 2 each ask for a longer initial term or prepayment in return for a
      higher cap.

      '
  test_cases:
  - name: Standard 12-month cap
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Neither party''s aggregate liability under this Agreement shall exceed the
      fees paid by Customer in the twelve months before the claim arose.

      '
  - name: Fixed-sum cap equal to one year of fees
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'The liability of each party under this Agreement is limited to the greater
      of the fees paid in the previous twelve months and US$150,000.

      '
  - name: 24-month cap on an enterprise deal
    context:
      deal_value_band: enterprise
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'In no event shall either party''s cumulative liability under this Agreement
      exceed two times the annual Fees payable by Customer.

      '
  - name: Five times annual fees
    context:
      deal_value_band: mid
      regimes:
      - hipaa
    expected_outcome: deviation
    expected_zone: red
    sample_text: 'Each party''s aggregate liability shall not exceed five times the fees paid
      by Customer in the year before the claim.

      '
  - name: Trap - negated wording
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Nothing in this Agreement shall impose unlimited liability on either party;
      each party''s liability is limited to the fees paid in the preceding twelve months.

      '
- rule_key: limitation_of_liability.cap_carve_outs
  title: Cap carve-outs
  required: true
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Only fraud, wilful misconduct, breach of payment obligations and the
    IP infringement indemnity sit outside the aggregate cap; every other claim, including
    data and confidentiality claims, stays inside it.

    '
  risk_rationale: 'Each carve-out reopens uncapped exposure against Halcyon''s $10M of cyber
    and technology E&O cover and $2M of general liability cover. A carve-out for "any breach"
    of the data protection or confidentiality terms removes the cap from the exact claims
    Halcyon is most likely to face across its roughly 310 hospital and clinic customers.

    '
  detection_guidance: 'Look for "the limitations in this section shall not apply to", "except
    for", "Excluded Claims" or "nothing in this Agreement limits liability for", followed
    by a list. Read each listed item separately; a carve-out list that is shorter than the
    preferred list is still compliant. A cap section with no carve-out list at all is a missing
    clause, not a deviation.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Four carve-outs
    zone: green
    summary: Fraud, wilful misconduct, payment obligations and the IP indemnity sit outside
      the cap.
    language: 'The limitations in this Section shall not apply to (a) a party''s fraud or
      wilful misconduct, (b) Customer''s payment obligations under this Agreement, or (c)
      Halcyon''s indemnification obligations under the IP Infringement Indemnity ("Excluded
      Claims").

      '
  - kind: fallback
    rung: 1
    label: Add a narrow confidentiality carve-out
    zone: yellow
    approver_role: general_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require the carve-out to exclude Customer Data and to be capped at the general
      cap's upper rung.
    summary: Add an uncapped confidentiality breach carve-out that excludes Customer Data.
    language: 'In addition to the Excluded Claims, the limitations in this Section shall not
      apply to a party''s breach of its confidentiality obligations under this Agreement,
      excluding any breach involving Customer Data, which remains subject to the data breach
      super-cap.

      '
  - kind: fallback
    rung: 2
    label: Widen the fraud and misconduct carve-out to each party's personnel
    zone: yellow
    approver_role: general_counsel
    give_get: Require written notice and an opportunity to cure before any claim under the
      widened carve-out.
    summary: Extend the fraud and wilful misconduct carve-out to acts of a party's employees
      and contractors.
    language: 'For purposes of the Excluded Claims, a party''s fraud or wilful misconduct
      includes the fraud or wilful misconduct of its employees and subcontractors acting within
      the scope of their engagement.

      '
  - kind: acceptable_variant
    label: Carve-outs listed as "Excepted Liabilities"
    zone: green
    summary: The same four categories under a different heading.
    language: 'The Excepted Liabilities, being fraud, wilful misconduct, unpaid Fees and Halcyon''s
      obligations under the infringement indemnity, are not subject to the limitations of
      liability set out in this Section.

      '
  parameters:
  - key: carve_out_scope
    label: Categories excluded from the general cap
    value_type: enum
    direction: set_membership
    preferred_value:
    - fraud
    - wilful_misconduct
    - payment_obligations
    - ip_indemnity
    allowed_values:
    - fraud
    - wilful_misconduct
    - payment_obligations
    - ip_indemnity
    - confidentiality_breach_excl_customer_data
    - any_breach_of_agreement
    - data_breach
    green_limit:
    - fraud
    - wilful_misconduct
    - payment_obligations
    - ip_indemnity
    yellow_limit:
    - confidentiality_breach_excl_customer_data
    extraction_hint: 'List every category the clause excludes from the cap. "any_breach_of_agreement"
      or "data_breach" appearing in the list is never green or yellow.

      '
  red_lines:
  - key: lol-carveouts-databreach-uncapped
    description: A carve-out that makes liability for a data breach or confidentiality breach
      involving Customer Data unlimited.
    condition_type: semantic
    condition:
      test: 'The clause lists a carve-out from the liability cap that covers a data breach,
        security incident, or breach of confidentiality involving Customer Data, so that liability
        for that category is unlimited.

        '
    action: block
    rationale: 'Data and confidentiality claims are the categories most likely to be large
      relative to a $165k median contract; an uncapped carve-out for them cannot be insured
      under the $10M cyber and technology E&O policy and is covered instead by the dedicated,
      bounded super-cap.

      '
  objections:
  - objection: Every carve-out list we see from other vendors includes data breaches.
    their_rationale: Hospital procurement teams compare vendor paper and expect data claims
      to be unlimited.
    response: 'We do not leave data claims uncapped by any vendor''s standard, but we address
      them through a dedicated cap set at a multiple of annual Fees rather than removing the
      limit altogether. That gives Customer a meaningfully higher number without leaving Halcyon
      uninsurable.

      '
    talking_points:
    - Offer the data breach super-cap in the same conversation.
    - Ask to see the vendor paper referenced, if any, before conceding.
    recommended_position:
      rule_key: limitation_of_liability.data_breach_super_cap
      rung: 0
    frequency: common
    counterparty_profile: Large hospital systems with standardised procurement paper
  - objection: Confidentiality breaches should also be uncapped, not just fraud and non-payment.
    their_rationale: Large counterparties treat any confidentiality breach as equivalent to
      fraud.
    response: 'We can add a confidentiality carve-out that excludes Customer Data, which is
      already protected by its own cap, so the two carve-outs do not overlap and create unlimited
      exposure through the back door.

      '
    talking_points:
    - Keep Customer Data inside the data breach super-cap, not the new carve-out.
    - This rung needs General Counsel sign-off and is reserved for tier-1 counterparties.
    recommended_position:
      rule_key: limitation_of_liability.cap_carve_outs
      rung: 1
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: read_with
    note: Read the carve-out list against the general cap; a carve-out is meaningless unless
      the cap it escapes is already set.
  - related_rule_key: indemnification.ip_infringement_indemnity
    relation: requires
    note: The IP indemnity carve-out in rung 0 only works if the indemnity itself is in the
      agreement.
  test_cases:
  - name: Standard four carve-outs
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'The cap in this Section does not limit a party''s liability for fraud, wilful
      misconduct, Customer''s unpaid fees, or Vendor''s obligations under the infringement
      indemnity.

      '
  - name: Excepted Liabilities, same four categories
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'The Excepted Liabilities are fraud, wilful misconduct, non-payment of fees
      and the indemnity for third-party intellectual property claims; none of these is subject
      to the limitation of liability.

      '
  - name: Confidentiality carve-out excluding Customer Data on a tier-1 account
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'The limitations above do not apply to a party''s breach of its confidentiality
      duties, other than a breach involving Customer Data, which is governed by the data protection
      cap.

      '
  - name: Carve-out for any breach of the agreement
    expected_outcome: deviation
    expected_zone: red
    sample_text: 'The cap set out above shall not apply to any breach of this Agreement by
      either party.

      '
  - name: Carve-out reaching Customer Data breaches
    expected_outcome: red_line
    expected_red_line_key: lol-carveouts-databreach-uncapped
    expected_zone: red
    sample_text: 'Liability arising from a breach of the security or confidentiality obligations
      relating to Customer Data is not subject to any limit of liability in this Agreement.

      '
- rule_key: limitation_of_liability.consequential_damages_exclusion
  title: Consequential damages exclusion
  required: true
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Neither party is liable to the other for indirect, special, incidental
    or consequential damages, or for lost profits, revenue, data or goodwill, except for the
    same categories excluded from the aggregate cap.

    '
  risk_rationale: 'Lost profits, revenue and goodwill claims from a hospital system or physician
    group can run far above the fees on a $165k median contract and are not the kind of loss
    Halcyon''s $10M cyber and technology E&O cover is priced to absorb. The exclusion must
    be mutual so it also protects Halcyon from the same categories of claim.

    '
  detection_guidance: 'Look for "in no event shall either party be liable for any indirect,
    incidental, special, consequential or punitive damages" or "loss of profits, revenue,
    data or goodwill", often in capital letters. Check whether it reads "neither party" or
    names only one party, and whether its own exceptions match the cap carve-outs. Absence
    of the clause entirely is a missing clause and leaves both parties exposed to consequential
    claims.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Mutual exclusion matching the cap carve-outs
    zone: green
    summary: Mutual exclusion of consequential damages, with exceptions that mirror the cap
      carve-outs.
    language: 'Except for the Excluded Claims, in no event shall either party be liable to
      the other for any indirect, incidental, special, consequential or punitive damages,
      or for any loss of profits, revenue, data or goodwill, arising out of or related to
      this Agreement, however caused and regardless of the theory of liability, even if advised
      of the possibility of such damages.

      '
  - kind: fallback
    rung: 1
    label: One-way exclusion favouring Customer
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that the general liability cap drop to 12 months of Fees in exchange.
    summary: The exclusion applies only against claims made against Halcyon, not against Customer.
    language: 'Except for the Excluded Claims, in no event shall Halcyon be liable to Customer
      for any indirect, incidental, special, consequential or punitive damages, or for any
      loss of profits, revenue, data or goodwill, arising out of or related to this Agreement.

      '
  - kind: fallback
    rung: 2
    label: Narrow the loss-of-data carve-out instead of removing mutuality
    zone: yellow
    approver_role: commercial_counsel
    give_get: Keep the exclusion mutual in exchange for naming "loss of Customer Data" as
      a recoverable, but capped, direct loss.
    summary: Mutual exclusion stays, but Customer Data loss is reclassified as a direct loss
      subject to the general cap.
    language: 'Except for the Excluded Claims, in no event shall either party be liable to
      the other for any indirect, incidental, special, consequential or punitive damages,
      or for any loss of profits, revenue or goodwill; for purposes of this Agreement, loss
      of Customer Data recoverable as a direct loss is subject to the general limitation of
      liability.

      '
  - kind: acceptable_variant
    label: Exclusion stated as a single combined sentence with the cap
    zone: green
    summary: Same mutual exclusion and carve-outs, drafted inside the liability cap sentence
      rather than as a separate paragraph.
    language: 'Except for the Excluded Claims, neither party shall be liable to the other
      for consequential, incidental, special or punitive damages or for lost profits, revenue,
      data or goodwill, and each party''s total liability is otherwise capped as set out above.

      '
  parameters:
  - key: exclusion_is_mutual
    label: Exclusion applies to both parties
    value_type: boolean
    direction: exact
    preferred_value: true
    green_limit: true
    extraction_hint: 'True when the exclusion binds both Halcyon and Customer equally. False
      when only one party is protected or when the exceptions to the exclusion differ between
      the parties.

      '
  red_lines:
  - key: lol-consequential-removed
    description: The consequential damages exclusion is deleted or carved out for a broad
      category of claim.
    condition_type: semantic
    condition:
      test: 'The clause removes the exclusion of indirect, incidental, special or consequential
        damages entirely, or carves out a broad category of claim such as "any breach of this
        Agreement" or "any data-related claim" from an otherwise mutual exclusion.

        '
    action: block
    rationale: 'Without this exclusion, a single customer''s claim for lost revenue or goodwill
      is uncapped in kind even where the aggregate cap applies to it in amount, and such claims
      are excluded from Halcyon''s $10M cyber and technology E&O policy as consequential loss.

      '
  objections:
  - objection: This exclusion should not apply to us; only the vendor should be barred from
      claiming lost profits.
    their_rationale: Customer sees itself as the party more likely to suffer business interruption
      losses.
    response: 'We can make the exclusion one-way in Customer''s favour where the deal supports
      it, in exchange for bringing the general cap back down to twelve months of Fees, since
      the two concessions address the same risk from different directions.

      '
    talking_points:
    - A one-way exclusion is a real concession and is priced against the general cap.
    - Most of Halcyon's own exposure to lost profits is remote given the product's scope.
    recommended_position:
      rule_key: limitation_of_liability.consequential_damages_exclusion
      rung: 1
    frequency: occasional
  - objection: Loss of our patient data should not be treated as merely "consequential" and
      excluded.
    their_rationale: Counterparty's security team wants data loss treated as a direct, recoverable
      loss.
    response: 'We agree data loss deserves its own treatment, which is why we address it through
      the dedicated data breach super-cap rather than leaving it to turn on whether a court
      calls it direct or consequential. We can also reclassify data loss as a direct loss
      inside the general cap if that is the easier path for your counsel.

      '
    talking_points:
    - Point to the data breach super-cap as the primary remedy for data loss.
    - Rung 2 reclassifies data loss as direct without breaking mutuality.
    recommended_position:
      rule_key: limitation_of_liability.consequential_damages_exclusion
      rung: 2
    frequency: common
    counterparty_profile: Large hospital systems
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: read_with
    note: The Excluded Claims referenced here must match the carve-out list in the cap_amount
      and cap_carve_outs rules exactly.
  - related_rule_key: limitation_of_liability.data_breach_super_cap
    relation: conflicts_with
    note: Reclassifying Customer Data loss as a direct loss (rung 2) must not be combined
      with also claiming it under the super-cap for the same incident.
  test_cases:
  - name: Standard mutual exclusion
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Except for the Excluded Claims, neither party shall be liable to the other
      for indirect, special, incidental, consequential or punitive damages, or for lost profits,
      revenue, data or goodwill.

      '
  - name: Exclusion combined into the cap sentence
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party''s liability is capped as stated above, and in no event shall
      either party owe the other consequential, incidental or punitive damages or lost profits,
      revenue, data or goodwill, except for the Excluded Claims.

      '
  - name: One-way exclusion favouring Customer
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor shall not be liable to Customer for any indirect, special, incidental
      or consequential damages or for lost profits, revenue or goodwill; this exclusion does
      not limit claims brought by Vendor.

      '
  - name: Exclusion carved out for any breach
    expected_outcome: deviation
    expected_zone: red
    sample_text: 'The exclusion of consequential damages above shall not apply to any breach
      of this Agreement by either party.

      '
  - name: Trap - mutual exclusion phrased with a double negative
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'It is not the case that either party may recover consequential, incidental,
      special or punitive damages, or lost profits, revenue, data or goodwill, from the other,
      except for the Excluded Claims.

      '
- rule_key: limitation_of_liability.data_breach_super_cap
  title: Data breach super-cap
  required: false
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: true
  judgment_note: 'Weigh the volume and sensitivity of the Customer Data actually at issue,
    not only the stated multiple; a 3x cap on a tier-1 account with special category data
    may warrant more scrutiny than the multiple alone suggests.

    '
  applies_when:
    data_sensitivity:
    - personal_data
    - phi
    - special_category
  position_summary: 'Liability for a breach of the data protection and security obligations
    has its own cap of twice the annual Fees, in place of the general cap, with a dollar ceiling
    once the multiple rises.

    '
  risk_rationale: 'Customers that send PHI or other personal data expect more than the general
    cap for data incidents. A separate cap of twice the annual Fees meets that expectation
    while keeping the exposure on a median $165k contract comfortably inside the $10M cyber
    and technology E&O policy, and the dollar ceiling keeps even a strategic account''s exposure
    bounded in absolute terms.

    '
  detection_guidance: 'Look for a second, higher limit tied to "data breach", "Security Incident",
    "breach of the data protection obligations" or "Data Protection Claims", often called
    a "super cap" or "enhanced cap", and check whether it is in addition to or instead of
    the general cap. If data claims are listed as an exclusion from every cap instead, that
    is a red line on this rule, not a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Super-cap at 2x annual Fees
    zone: green
    summary: Data breach liability capped at twice the annual Fees, in place of the general
      cap.
    language: 'Halcyon''s total aggregate liability arising out of a breach of its obligations
      under the Data Protection section of this Agreement shall not exceed two (2) times the
      Fees paid and payable by Customer in the twelve (12) months preceding the first event
      giving rise to the liability, and this limit applies in place of, and not in addition
      to, the general limit of liability.

      '
  - kind: fallback
    rung: 1
    label: Super-cap at 2.5x annual Fees
    zone: yellow
    approver_role: general_counsel
    give_get: Ask Customer to accept the standard breach notification timeline in exchange.
    summary: Data breach liability capped at two and a half times the annual Fees.
    language: 'Halcyon''s total aggregate liability arising out of a breach of its obligations
      under the Data Protection section of this Agreement shall not exceed two and one-half
      (2.5) times the Fees paid and payable by Customer in the twelve (12) months preceding
      the first event giving rise to the liability, and this limit applies in place of, and
      not in addition to, the general limit of liability.

      '
  - kind: fallback
    rung: 2
    label: Super-cap at 3x annual Fees, ceiling of US$5,000,000
    zone: yellow
    approver_role: general_counsel
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Require a thirty-six (36) month initial term.
    internal_note: Confirm the dollar ceiling with the CFO before offering this rung.
    summary: Data breach liability capped at three times the annual Fees and never above US$5M.
    language: 'Halcyon''s total aggregate liability arising out of a breach of its obligations
      under the Data Protection section of this Agreement shall not exceed the lesser of (a)
      three (3) times the Fees paid and payable by Customer in the twelve (12) months preceding
      the first event giving rise to the liability and (b) US$5,000,000, and this limit applies
      in place of, and not in addition to, the general limit of liability.

      '
  - kind: acceptable_variant
    label: Super-cap stated as 24 months of Fees
    zone: green
    summary: The same limit expressed as a period of Fees rather than a multiple.
    language: 'For claims arising from a Security Incident affecting Customer Data, Halcyon''s
      aggregate liability shall be limited to the Fees paid and payable in the twenty-four
      (24) months before the claim arose, which limit replaces the general limit of liability
      for those claims.

      '
  parameters:
  - key: super_cap_multiple
    label: Super-cap as a multiple of annual Fees
    value_type: number
    unit: multiple of annual Fees
    direction: lower_is_better
    preferred_value: 2
    green_limit: 2
    yellow_limit: 3
    extraction_hint: 'Convert a period of Fees to a multiple of annual Fees: 24 months is
      2, 36 months is 3. A fixed sum is converted using the annual Fees when known.

      '
  - key: super_cap_ceiling_usd
    label: Dollar ceiling on the super-cap
    value_type: currency_usd
    direction: lower_is_better
    preferred_value: 5000000
    green_limit: 5000000
    yellow_limit: 5000000
    extraction_hint: 'The fixed dollar amount, if the clause states one. Leave empty when
      the super-cap is stated only as a multiple or period of Fees with no dollar ceiling.

      '
  red_lines:
  - key: sbc-above-3x
    description: A data breach cap above three times the annual Fees or above the US$5,000,000
      ceiling.
    condition_type: parameter
    condition:
      parameter_key: super_cap_multiple
      op: gt
      value: 3
    action: block
    rationale: 'Three times annual Fees, capped at US$5,000,000, is the level the General
      Counsel may approve under the risk policy; above it the exposure on a strategic account
      can exceed what the $10M cyber and technology E&O policy is sized to cover alongside
      other open claims.

      '
  objections:
  - objection: Twice the fees is nowhere near the cost of notifying our patients after a breach.
    their_rationale: Notification, credit monitoring and regulatory costs scale with the number
      of patients affected, not with fees.
    response: 'We understand that breach costs follow patient volume rather than contract
      size. We can increase the dedicated cap to two and a half times the annual Fees, which
      is already well above what we offer for any other category of claim.

      '
    talking_points:
    - Explain that the super-cap sits on top of Halcyon's SOC 2 Type II, ISO 27001 and HITRUST
      r2 controls.
    - Offer rung 1 before discussing a dollar figure.
    recommended_position:
      rule_key: limitation_of_liability.data_breach_super_cap
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems
  - objection: Data breaches should be uncapped because the risk is entirely within your control.
    their_rationale: Halcyon runs the systems, so Halcyon should carry the whole risk of a
      data incident.
    response: 'No software vendor of our size can insure unlimited liability, and we will
      not promise what we could not pay. The dedicated cap is set by reference to the cover
      we actually hold, so it is a limit Customer can rely on being paid in full.

      '
    talking_points:
    - Halcyon holds $10M of cyber and technology E&O cover across about 310 customers.
    - Security is shared; Customer controls its own users, credentials and configuration.
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: read_with
    note: The super-cap replaces the general cap for data claims; check both limits together
      so they are not stacked.
  - related_rule_key: breach_notification.notification_timeline
    relation: trade_against
    note: Rung 1's give-get trades a higher super-cap for Customer accepting the standard
      notification timeline rather than a shorter one.
  test_cases:
  - name: Super-cap at twice annual fees
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor''s liability for breach of its data protection obligations is limited
      to twice the annual fees and replaces the general cap for those claims.

      '
  - name: Super-cap as 24 months of fees
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'For security incident claims, Vendor''s liability shall not exceed the fees
      paid in the two years before the incident, in lieu of the general limitation.

      '
  - name: Three times fees with a dollar ceiling on a strategic deal
    context:
      deal_value_band: strategic
      data_sensitivity: phi
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Liability for data breaches is capped at the lower of three times the annual
      fees and five million US dollars.

      '
  - name: Super-cap added on top of the general cap
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor''s liability for data breaches shall not exceed twice the annual
      fees, which amount is in addition to the general limitation of liability.

      '
  - name: Trap - super-cap expressed as a floor, not a ceiling
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor''s liability for a breach of its data protection obligations shall
      be no less protective to Customer than, and shall replace, the general limitation, and
      in any event shall not exceed twice the annual fees.

      '
- rule_key: indemnification.ip_infringement_indemnity
  title: IP infringement indemnity
  required: true
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon defends and indemnifies Customer against third-party claims that
    the Services, as provided and used in accordance with the Documentation, infringe a patent,
    copyright, trade mark or trade secret, subject to standard exclusions and a procure-or-refund
    remedy.

    '
  risk_rationale: 'Halcyon Engage runs on a single multi-tenant code base serving about 310
    customers, so an infringement exposure is shared across the whole book, not one contract.
    The indemnity is priced into Halcyon Risk Policy RP-04 on the assumption that it does
    not extend to combinations, modifications or Customer-supplied materials that Halcyon
    did not choose.

    '
  detection_guidance: 'Look for "defend, indemnify and hold harmless" paired with "infringes"
    or "misappropriates" and "intellectual property rights of a third party", usually followed
    by a list of exclusions and a "procure, modify or refund" remedy. If the indemnity section
    has no infringement indemnity at all, that is a missing clause, not a deviation.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Standard infringement indemnity with exclusions and procure-or-refund remedy
    zone: green
    summary: Halcyon defends infringement claims against the Services as provided; excludes
      combinations and Customer-supplied materials.
    language: 'Halcyon shall defend Customer against any third-party claim that the Services,
      when used in accordance with the Documentation and this Agreement, infringe or misappropriate
      that third party''s patent, copyright, trade mark or trade secret, and shall indemnify
      Customer against damages and costs finally awarded, except to the extent the claim arises
      from (a) a combination of the Services with products, data or processes not provided
      by Halcyon, (b) modification of the Services by anyone other than Halcyon, or (c) Customer''s
      breach of this Agreement. If the Services are, or in Halcyon''s opinion are likely to
      be, held infringing, Halcyon may at its option procure the right to continue use, modify
      the Services to be non-infringing, or terminate the affected Services and refund prepaid,
      unused Fees.

      '
  - kind: fallback
    rung: 1
    label: Extend to combinations Halcyon specified
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require written notice and sole control of the defence in exchange.
    summary: The indemnity also covers combinations with third-party products that Halcyon's
      Documentation specifies or recommends.
    language: 'The indemnity in this Section also applies to a claim arising from the combination
      of the Services with a third-party product, provided that the Documentation specifies
      or recommends that combination; Halcyon shall have sole control of the defence and settlement
      of any claim it indemnifies, and Customer shall give prompt written notice of the claim.

      '
  - kind: fallback
    rung: 2
    label: Remove the "in Halcyon's opinion" threshold for the remedy
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require that any substitute Services remain materially equivalent under the
      performance warranty.
    summary: Halcyon's procure-modify-refund remedy triggers on an actual adverse ruling or
      settlement, not only Halcyon's own opinion.
    language: 'If the Services are held to infringe by a court of competent jurisdiction,
      or Halcyon agrees to settle such a claim, Halcyon may, at its option, procure the right
      for Customer to continue using the Services, modify the Services to be non-infringing
      without materially reducing their functionality, or terminate the affected Services
      and refund prepaid, unused Fees.

      '
  - kind: acceptable_variant
    label: Indemnity drafted as "Infringement Claims" with the same exclusions
    zone: green
    summary: Same scope and remedy under different defined-term labels.
    language: 'Halcyon will defend and indemnify Customer against Infringement Claims, meaning
      third-party claims that the Services as delivered infringe a patent, copyright, trade
      mark or trade secret, excluding claims arising from unauthorised modification, combination
      with non-Halcyon products, or Customer''s own breach, and subject to Halcyon''s right
      to procure, modify or refund as set out above.

      '
  red_lines:
  - key: ip-indemnity-any-breach
    description: The indemnity is extended to cover any breach of the Agreement rather than
      only third-party infringement claims.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to indemnify Customer for any breach of the Agreement,
        any claim relating to the Services generally, or any first-party loss, rather than
        being limited to third-party claims that the Services infringe intellectual property
        rights.

        '
    action: block
    rationale: 'A general indemnity for "any breach" duplicates and effectively removes the
      liability cap for the whole agreement, which is priced against $10M of cyber and technology
      E&O cover and a $165k median contract; it is covered instead by ordinary breach of contract
      remedies subject to the cap.

      '
  objections:
  - objection: The indemnity should cover any infringement claim, not only ones about the
      Services "as provided".
    their_rationale: Customer's counsel wants to avoid arguing over whether its use matched
      the Documentation.
    response: 'We can extend the indemnity to combinations that our own Documentation specifies,
      which covers the integrations we actively support, in exchange for sole control of the
      defence so we can manage the exposure across all affected customers consistently.

      '
    talking_points:
    - Sole control of the defence protects Customer as much as Halcyon, since Halcyon bears
      the cost.
    - The combination carve-out only excludes products Halcyon did not choose.
    recommended_position:
      rule_key: indemnification.ip_infringement_indemnity
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with in-house integration teams
  - objection: Why does the remedy depend on Halcyon's own opinion that the Services are likely
      infringing?
    their_rationale: Counterparty's counsel reads the "in Halcyon's opinion" standard as letting
      Halcyon avoid the remedy indefinitely.
    response: 'We can tie the remedy to an actual court ruling or settlement instead of Halcyon''s
      own view, which removes the subjectivity your counsel is flagging without changing the
      remedy itself.

      '
    talking_points:
    - This rung needs commercial counsel sign-off and is offered on tier-1 accounts.
    - The substitute remedy is still procure, modify or refund, unchanged.
    recommended_position:
      rule_key: indemnification.ip_infringement_indemnity
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.cap_carve_outs
    relation: requires
    note: This indemnity is one of the four Excluded Claims; the carve-out list must name
      it for the indemnity to sit outside the general cap.
  - related_rule_key: indemnification.indemnity_procedure
    relation: read_with
    note: The notice and defence-control terms in rung 1 must match the procedure rule rather
      than create a second, conflicting procedure.
  test_cases:
  - name: Standard indemnity with exclusions and remedy
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor will defend Customer against claims that the Services infringe a
      third party''s patent, copyright or trade secret, except where the claim results from
      a combination with non-Vendor products or from Customer''s modification, and Vendor
      may procure rights, modify the Services, or terminate and refund as its sole remedy
      option.

      '
  - name: Infringement Claims defined term, same scope
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor shall defend and indemnify Customer against Infringement Claims,
      being claims that the Services as delivered infringe a patent, copyright, trade mark
      or trade secret, excluding claims from modification or combination not made by Vendor.

      '
  - name: Extended to Documentation-specified combinations
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'The indemnity above also covers a claim arising from combining the Services
      with a third-party product that Vendor''s user guide identifies as a supported integration,
      provided Customer gives prompt notice and Vendor controls the defence.

      '
  - name: Indemnity excludes claims from Vendor's own code changes
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor will defend Customer against third-party infringement claims, except
      any claim arising from a modification Vendor itself made to the Services after the Order
      Form date.

      '
  - name: Indemnity extended to any breach of the agreement
    expected_outcome: red_line
    expected_red_line_key: ip-indemnity-any-breach
    expected_zone: red
    sample_text: 'Vendor shall indemnify, defend and hold harmless Customer against any claim,
      loss or liability of any kind arising out of or related to this Agreement or Vendor''s
      performance of the Services.

      '
- rule_key: indemnification.customer_indemnity
  title: Customer indemnity
  required: false
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: true
  judgment_note: 'Weigh whether the counterparty is a public body or large health system that
    is barred by its own charter or state law from giving an indemnity at all; pressing for
    this clause against such a counterparty may not be worth the negotiating capital.

    '
  position_summary: 'Customer indemnifies Halcyon against third-party claims arising from
    Customer Data, Customer''s instructions, or Customer''s use of the Services in breach
    of this Agreement or of law.

    '
  risk_rationale: 'Halcyon Engage ingests content hospital staff and patients submit through
    secure messaging and intake forms. Without a customer indemnity, Halcyon alone bears the
    cost of defending claims caused by content or instructions it did not create, against
    only $2M of general liability cover shared across roughly 310 customers.

    '
  detection_guidance: 'Look for an indemnity given by "Customer" covering "Customer Data",
    "Customer''s use of the Services in violation of" or "content submitted by Customer",
    usually directly after Halcyon''s infringement indemnity under a heading such as "Indemnification
    by Customer". Absence means Halcyon relies on ordinary breach of contract claims only,
    which is a missing clause, not a deviation.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Full customer indemnity
    zone: green
    summary: Customer indemnifies Halcyon for Customer Data, its instructions, and its unlawful
      or non-compliant use of the Services.
    language: 'Customer shall defend and indemnify Halcyon against any third-party claim arising
      from (a) Customer Data, (b) Customer''s instructions to Halcyon regarding the processing
      of Customer Data, or (c) Customer''s use of the Services in violation of this Agreement
      or of applicable law, and shall pay the damages and costs finally awarded against Halcyon
      on such a claim.

      '
  - kind: fallback
    rung: 1
    label: Narrow to Customer Data and breach of the Agreement
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require Customer to maintain its own general liability cover and provide evidence
      on request.
    summary: Drop the stand-alone "violation of law" ground, keeping Customer Data and breach
      of the Agreement.
    language: 'Customer shall defend and indemnify Halcyon against any third-party claim arising
      from Customer Data or from Customer''s use of the Services in breach of this Agreement,
      and shall pay the damages and costs finally awarded against Halcyon on such a claim.

      '
  - kind: fallback
    rung: 2
    label: Indemnity capped at the general liability cap
    zone: yellow
    approver_role: general_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require a specific acknowledgement that Customer Data includes PHI submitted
      through intake forms and secure messaging.
    summary: Customer's indemnity obligation is expressly subject to the same aggregate cap
      that applies to Halcyon.
    language: 'Customer shall defend and indemnify Halcyon against any third-party claim arising
      from Customer Data or from Customer''s use of the Services in breach of this Agreement,
      subject to the general limitation of liability set out in this Agreement.

      '
  - kind: acceptable_variant
    label: Indemnity drafted as a mutual indemnification section
    zone: green
    summary: Customer's obligation is stated as one half of a mutual indemnification clause
      rather than a stand-alone section.
    language: 'Each party shall defend and indemnify the other against third-party claims
      arising from the indemnifying party''s own data, instructions or breach of this Agreement,
      Customer''s obligation under this Section covering Customer Data and Customer''s use
      of the Services.

      '
  red_lines:
  - key: cust-indemnity-removed-no-substitute
    description: Customer's indemnity obligation is deleted with no equivalent protection
      for claims arising from Customer Data or Customer's own conduct.
    condition_type: semantic
    condition:
      test: 'The agreement removes any obligation for Customer to indemnify Halcyon for claims
        arising from Customer Data, Customer''s instructions, or Customer''s breach of the
        Agreement or violation of law in using the Services, and gives Halcyon no equivalent
        protection elsewhere in the agreement.

        '
    action: escalate
    approver_role: general_counsel
    rationale: 'Some tier-1 public bodies and health systems are barred by charter or state
      law from giving an indemnity; the General Counsel must confirm whether that is the actual
      reason before Halcyon accepts the gap, since otherwise Halcyon alone carries claims
      caused by content it did not create against only $2M of general liability cover.

      '
  objections:
  - objection: Our charter does not permit us to indemnify a vendor under any circumstances.
    their_rationale: Public hospital systems and some non-profits are statutorily barred from
      giving indemnities.
    response: 'We can accept that limitation where it is a genuine legal bar, and will ask
      for written confirmation of the specific statute or charter provision so General Counsel
      can document the exception file.

      '
    talking_points:
    - Ask for the specific statute or charter clause, not a general assertion.
    - Consider requiring Customer to carry its own liability cover as a partial substitute.
    recommended_position:
      rule_key: indemnification.customer_indemnity
      rung: 1
    frequency: common
    counterparty_profile: Public hospital systems and government-affiliated clinics
  - objection: We will not indemnify you for claims about how our own staff used the product;
      that is your product's responsibility.
    their_rationale: Customer draws the line at its staff's ordinary use, as distinct from
      its own data or deliberate misuse.
    response: 'Ordinary use within the Documentation is already Halcyon''s responsibility
      under the performance warranty and is not what this clause reaches; we only ask Customer
      to stand behind data it submits and conduct that breaches this Agreement or the law.

      '
    talking_points:
    - Distinguish ordinary use (Halcyon's responsibility) from unlawful or breaching use (Customer's).
    - Offer to cap Customer's indemnity at the general liability cap.
    recommended_position:
      rule_key: indemnification.customer_indemnity
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: read_with
    note: Rung 2 makes Customer's indemnity obligation subject to the same cap that applies
      to Halcyon; the two numbers must match.
  test_cases:
  - name: Standard customer indemnity
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Customer will defend and indemnify Vendor against any third-party claim
      arising from Customer Data, Customer''s instructions to Vendor, or Customer''s use of
      the Services in violation of this Agreement or applicable law.

      '
  - name: Mutual indemnification clause, same scope for Customer's half
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party shall indemnify the other against third-party claims caused by
      the indemnifying party''s own data or breach of this Agreement; for Customer, this covers
      Customer Data and Customer''s breach.

      '
  - name: Narrowed to Customer Data and breach of the agreement only
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Customer will indemnify Vendor against claims arising from Customer Data
      or from Customer''s breach of this Agreement.

      '
  - name: Customer indemnity limited to claims where Customer was grossly negligent
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Customer shall indemnify Vendor only for claims arising from Customer''s
      grossly negligent submission of Customer Data.

      '
  - name: Agreement expressly states Customer has no indemnity obligation
    expected_outcome: red_line
    expected_red_line_key: cust-indemnity-removed-no-substitute
    expected_zone: yellow
    sample_text: 'For the avoidance of doubt, Customer shall have no obligation to defend
      or indemnify Vendor under this Agreement in any circumstance.

      '
  - name: Missing customer indemnity
    expected_outcome: missing
    expected_zone: red
    sample_text: ''
- rule_key: indemnification.indemnity_procedure
  title: Indemnity procedure
  required: true
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'An indemnified party must give prompt written notice within a stated
    number of days, and the indemnifying party controls the defence and settlement, with no
    settlement that admits fault without the indemnified party''s consent.

    '
  risk_rationale: 'Halcyon''s insurers under the $10M cyber and technology E&O policy require
    prompt notice and control of the defence as a condition of cover. A vague or one-sided
    procedure can forfeit that cover entirely on a claim far larger than the $165k median
    contract that gave rise to it.

    '
  detection_guidance: 'Look for "promptly notify", "within [number] days", "sole control of
    the defence and settlement", "reasonable assistance" and "shall not settle without the
    prior written consent". The text is usually a sub-clause headed "Procedure" or "Conditions"
    inside the indemnification section. An indemnity with no procedure language at all is
    a deviation, not a missing clause, since the indemnity obligation itself still exists.

    '
  source_ref: Halcyon Risk Policy RP-04; cyber policy claims-reporting condition
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Prompt notice within 10 days; indemnifying party controls defence
    zone: green
    summary: 10-day notice, sole control of defence and settlement by the indemnifying party,
      no fault-admitting settlement without consent.
    language: 'The indemnified party shall give the indemnifying party prompt written notice
      of the claim, in any event within ten (10) days of becoming aware of it, and shall give
      the indemnifying party sole control of the defence and settlement, provided that the
      indemnifying party shall not settle any claim in a manner that admits fault by, or imposes
      any obligation on, the indemnified party without its prior written consent, such consent
      not to be unreasonably withheld. The indemnified party shall provide reasonable cooperation
      at the indemnifying party''s expense.

      '
  - kind: fallback
    rung: 1
    label: Notice within 30 days
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that late notice only reduces the indemnity to the extent the delay
      actually prejudiced the defence.
    summary: Extend the notice window to thirty days without losing control of the defence.
    language: 'The indemnified party shall give the indemnifying party prompt written notice
      of the claim, in any event within thirty (30) days of becoming aware of it, and shall
      give the indemnifying party sole control of the defence and settlement, subject to the
      consent requirement above; a failure to give notice within this period relieves the
      indemnifying party of its obligations only to the extent the delay materially prejudiced
      the defence.

      '
  - kind: fallback
    rung: 2
    label: Joint participation, indemnifying party still controls settlement
    zone: yellow
    approver_role: general_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require that the indemnified party's own counsel costs under this rung are not
      reimbursed.
    summary: The indemnified party may participate in the defence with its own counsel at
      its own cost; the indemnifying party keeps control of settlement.
    language: 'The indemnified party may participate in the defence of the claim with counsel
      of its own choosing at its own expense, provided that the indemnifying party retains
      control of the settlement of the claim subject to the consent requirement above.

      '
  - kind: acceptable_variant
    label: Procedure stated as conditions precedent in a single paragraph
    zone: green
    summary: Same notice, control and consent terms combined into one paragraph rather than
      separate sentences.
    language: 'As a condition of the indemnities in this Section, the indemnified party must
      give prompt written notice of any claim within ten (10) days of becoming aware of it
      and must allow the indemnifying party to control the defence and any settlement, which
      shall not admit fault by or bind the indemnified party without its prior written consent.

      '
  parameters:
  - key: claim_notice_days
    label: Days to give written notice of a claim
    value_type: number
    unit: days
    direction: lower_is_better
    preferred_value: 10
    green_limit: 10
    yellow_limit: 30
    extraction_hint: 'The number of days the indemnified party has to give notice of a claim
      before the indemnity is at risk. "Promptly" with no number is treated as meeting the
      green limit.

      '
  red_lines:
  - key: indemnity-proc-no-defence-control
    description: The indemnifying party has no right to control the defence or settlement
      of a claim it must pay for.
    condition_type: semantic
    condition:
      test: 'The clause lets the indemnified party conduct or settle the claim on its own,
        including admitting fault or agreeing to pay money, while still requiring the indemnifying
        party to pay for it, with no right for the indemnifying party to control or at least
        participate in the defence.

        '
    action: escalate
    approver_role: general_counsel
    rationale: 'Losing control of the defence is itself a condition of cover under Halcyon''s
      $10M cyber and technology E&O policy; accepting it risks the insurer denying the claim
      entirely, which the General Counsel must weigh against the commercial value of the deal.

      '
  objections:
  - objection: Ten days is too short; our claims have to go through several layers of internal
      sign-off before we can even notify you.
    their_rationale: Large health systems route vendor notices through risk management and
      legal before they go out.
    response: 'We can extend the notice window to thirty days, which still lets us respond
      to most claims while they are easy to defend, provided a late notice only reduces the
      indemnity to the extent it actually hurt our ability to defend the claim.

      '
    talking_points:
    - The extended window still protects Customer fully unless the delay caused real prejudice.
    - Internal sign-off delays are exactly what the "materially prejudiced" standard is meant
      to tolerate.
    recommended_position:
      rule_key: indemnification.indemnity_procedure
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with multi-layer legal sign-off
  - objection: We need our own counsel involved in any claim that could affect our patients
      or our reputation.
    their_rationale: Counterparty wants assurance it is not left out of a defence strategy
      that affects its public standing.
    response: 'We can let Customer''s own counsel participate in the defence at Customer''s
      expense, while Halcyon retains control of settlement so the claim is resolved consistently
      with our other customers in the same position.

      '
    talking_points:
    - Participation is not the same as control; Halcyon still decides whether and how to settle.
    - This rung is reserved for tier-1 accounts and needs General Counsel sign-off.
    recommended_position:
      rule_key: indemnification.indemnity_procedure
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: indemnification.ip_infringement_indemnity
    relation: requires
    note: This procedure governs how claims under the infringement indemnity, and any customer
      indemnity, are notified and defended.
  test_cases:
  - name: Standard 10-day notice with defence control
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'The party seeking indemnification must give written notice of the claim
      within ten days of learning of it and must let the indemnifying party control the defence
      and settlement, which may not admit fault without the indemnified party''s consent.

      '
  - name: Conditions precedent paragraph, same terms
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'As a condition of any indemnity in this Agreement, the indemnified party
      shall give prompt notice within ten days and shall permit the indemnifying party to
      control the defence, subject to consent before any fault-admitting settlement.

      '
  - name: 30-day notice with a materiality standard for late notice
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Notice of a claim must be given within thirty days of the indemnified party
      becoming aware of it; late notice excuses the indemnifying party''s obligations only
      to the extent it was actually prejudiced by the delay.

      '
  - name: Notice period of 60 days with no materiality standard
    expected_outcome: deviation
    expected_zone: red
    sample_text: 'The indemnified party shall notify the indemnifying party of any claim within
      sixty days; failure to do so within that period relieves the indemnifying party of all
      obligations under this Section.

      '
  - name: Indemnified party may settle without the indemnifying party's involvement
    expected_outcome: red_line
    expected_red_line_key: indemnity-proc-no-defence-control
    expected_zone: yellow
    sample_text: 'Customer may defend or settle any claim in its sole discretion, including
      by admitting liability or agreeing to a payment, and Vendor shall reimburse Customer
      for the full cost of the settlement.

      '
- rule_key: warranties.performance_warranty
  title: Performance warranty
  required: true
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon warrants that the Services will perform materially in accordance
    with the Documentation and will be provided with reasonable skill and care, with a thirty-day
    cure period as the sole remedy for a breach of this warranty.

    '
  risk_rationale: 'Halcyon Engage is a clinical workflow tool, not a source of medical advice,
    so the warranty standard must stay at "materially in accordance with the Documentation"
    rather than an error-free or fitness-for-clinical-purpose standard the product was never
    built to meet. A cure-period remedy keeps the exposure proportionate to the $165k median
    contract instead of opening it to termination or damages claims for every minor defect.

    '
  detection_guidance: 'Look for "warrants that the Services will perform materially in accordance
    with the Documentation", "professional and workmanlike manner", "free from material defects"
    and a stated cure period as the remedy. A warranty with no cure period or remedy stated
    is a deviation, not a missing clause; an agreement with no performance warranty at all
    is a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Material-conformance warranty with 30-day cure
    zone: green
    summary: Services perform materially as documented; sole remedy is a 30-day cure or, failing
      cure, termination and refund.
    language: 'Halcyon warrants that, during the Subscription Term, the Services will perform
      materially in accordance with the Documentation and will be provided with reasonable
      skill and care. If the Services fail to conform to this warranty, Customer''s sole and
      exclusive remedy, and Halcyon''s entire liability, shall be for Halcyon to use commercially
      reasonable efforts to correct the non-conformance within thirty (30) days of written
      notice, or, if Halcyon cannot do so, to terminate the affected Services and refund any
      prepaid, unused Fees.

      '
  - kind: fallback
    rung: 1
    label: Cure period of 15 days
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require written notice with enough detail to reproduce the non-conformance before
      the cure clock starts.
    summary: Shorten the cure period to fifteen days.
    language: 'If the Services fail to conform to the warranty above, Customer''s sole and
      exclusive remedy shall be for Halcyon to use commercially reasonable efforts to correct
      the non-conformance within fifteen (15) days of written notice reasonably sufficient
      to reproduce the issue, or, if Halcyon cannot do so, to terminate the affected Services
      and refund any prepaid, unused Fees.

      '
  - kind: fallback
    rung: 2
    label: Add a narrow uptime cross-reference without a separate standard
    zone: yellow
    approver_role: vp_customer_success
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require that this cross-reference not create a second, independent remedy beyond
      service credits.
    summary: State expressly that the uptime commitment is part of "performs materially in
      accordance with the Documentation" without adding a new, separate warranty standard.
    language: 'For clarity, a failure to meet the uptime commitment set out in this Agreement
      is addressed exclusively through the service credits described there and does not, by
      itself, constitute a breach of the warranty in this Section.

      '
  - kind: acceptable_variant
    label: Warranty stated as part of a broader "Mutual Warranties" section
    zone: green
    summary: Same material-conformance standard and cure remedy, drafted alongside mutual
      warranties of authority and compliance.
    language: 'Each party represents that it has the authority to enter into this Agreement,
      and Halcyon further warrants that the Services will perform materially in accordance
      with the Documentation, Customer''s sole remedy for a breach of this warranty being
      a thirty (30) day cure period followed by termination and refund of unused, prepaid
      Fees if not cured.

      '
  parameters:
  - key: warranty_cure_period_days
    label: Days to cure a non-conforming warranty claim
    value_type: number
    unit: days
    direction: higher_is_better
    preferred_value: 30
    green_limit: 30
    yellow_limit: 10
    extraction_hint: 'The number of days Halcyon has to correct a non-conformance before Customer''s
      remedy shifts to termination and refund. A longer cure period is better for Halcyon.

      '
  red_lines:
  - key: warranty-fitness-for-purpose
    description: The warranty is extended to promise error-free, uninterrupted operation or
      fitness for Customer's particular clinical or regulatory purpose.
    condition_type: semantic
    condition:
      test: 'The clause warrants that the Services will be error-free, uninterrupted, or fit
        for Customer''s particular clinical, diagnostic or regulatory purpose, rather than
        warranting only material conformance with the Documentation.

        '
    action: block
    rationale: 'Halcyon Engage is coordination and messaging software, not a diagnostic or
      clinical-decision tool, and was never designed or validated against an error-free or
      purpose-fitness standard; a promise at that standard is outside what the performance
      warranty disclaimer and the $10M technology E&O policy are priced to cover.

      '
  objections:
  - objection: Thirty days is too long to leave a defect unfixed when our clinicians are relying
      on it daily.
    their_rationale: Counterparty's clinical operations team wants defects resolved fast,
      not on a contractual clock.
    response: 'We can commit to fifteen days for the contractual cure remedy while still working
      urgent issues through our support process on a much faster operational timeline; the
      thirty-day period is the outer bound for the legal remedy, not how quickly we actually
      respond.

      '
    talking_points:
    - Separate the support SLA, which is fast, from the contractual cure remedy, which is
      a backstop.
    - Offer the 15-day rung in exchange for clearer, written non-conformance notices.
    recommended_position:
      rule_key: warranties.performance_warranty
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with clinical operations stakeholders
  - objection: The warranty should cover uptime failures too, not just functional defects.
    their_rationale: Counterparty wants one warranty standard to cover both features and availability.
    response: 'We keep those separate because uptime already has its own dedicated remedy,
      service credits, which is faster and does not require proving a material non-conformance;
      folding uptime into this warranty would just duplicate that remedy under a different
      name.

      '
    talking_points:
    - Service credits are available without a cure period or dispute over materiality.
    - This rung is for tier-1 accounts and needs Customer Success sign-off.
    recommended_position:
      rule_key: warranties.performance_warranty
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: service_levels.uptime_commitment
    relation: conflicts_with
    note: The performance warranty must not create a second remedy for an uptime miss that
      duplicates the service credit remedy.
  test_cases:
  - name: Standard material-conformance warranty with 30-day cure
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor warrants the Services will perform materially in accordance with
      the Documentation; Customer''s sole remedy for a breach is a thirty-day period for Vendor
      to correct the defect or, failing that, termination and a refund of unused fees.

      '
  - name: Warranty inside a Mutual Warranties section
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party warrants its authority to sign this Agreement, and Vendor further
      warrants material conformance of the Services with the Documentation, remediable within
      thirty days as Customer''s sole remedy.

      '
  - name: 15-day cure period
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'If the Services do not perform materially as documented, Vendor''s sole
      obligation is to correct the issue within fifteen days of receiving a detailed written
      notice.

      '
  - name: No cure period or remedy stated
    expected_outcome: deviation
    expected_zone: red
    sample_text: 'Vendor warrants that the Services will perform materially in accordance
      with the Documentation.

      '
  - name: Trap - warranty phrased as a disclaimer of a stricter standard
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor does not warrant that the Services will be error-free; the only warranty
      given is that the Services will perform materially in accordance with the Documentation,
      with a thirty-day cure period as Customer''s sole remedy.

      '
- rule_key: warranties.disclaimer
  title: Warranty disclaimer
  required: true
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Other than the express performance warranty, Halcyon disclaims all warranties,
    including implied warranties of merchantability, fitness for a particular purpose and
    non-infringement, and states that the Services do not constitute medical advice.

    '
  risk_rationale: 'Without this disclaimer, implied warranties under the Uniform Commercial
    Code and similar state law can attach by default and are not bounded by the cure-period
    remedy in the express warranty. For a clinical workflow product used by roughly 310 hospital
    and clinic customers, the disclaimer is also how Halcyon makes clear the Services are
    not a source of medical advice or diagnosis.

    '
  detection_guidance: 'Look for "except as expressly provided", "disclaims all warranties",
    "merchantability", "fitness for a particular purpose", "non-infringement" and "as is",
    often in capital letters, and for a statement that the Services do not constitute medical
    advice. A disclaimer that is present but silent on medical advice is a deviation, not
    a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Full disclaimer with medical-advice statement
    zone: green
    summary: Disclaims all implied warranties and states the Services are not medical advice.
    language: 'EXCEPT AS EXPRESSLY SET OUT IN THIS AGREEMENT, HALCYON DISCLAIMS ALL WARRANTIES,
      WHETHER EXPRESS, IMPLIED OR STATUTORY, INCLUDING THE IMPLIED WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NON-INFRINGEMENT. THE SERVICES ARE NOT A SUBSTITUTE
      FOR PROFESSIONAL MEDICAL JUDGMENT AND DO NOT CONSTITUTE MEDICAL ADVICE, DIAGNOSIS OR
      TREATMENT.

      '
  - kind: fallback
    rung: 1
    label: Drop the capitalisation, keep the substance
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that the medical-advice statement still appear in the body of the Agreement,
      not only in the Documentation.
    summary: Same disclaimer and medical-advice statement, without requiring capital letters.
    language: 'Except as expressly set out in this Agreement, Halcyon disclaims all warranties,
      whether express, implied or statutory, including the implied warranties of merchantability,
      fitness for a particular purpose and non-infringement. The Services are not a substitute
      for professional medical judgment and do not constitute medical advice, diagnosis or
      treatment.

      '
  - kind: fallback
    rung: 2
    label: Carve the performance warranty itself out of the disclaimer's "AS IS" language
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require Customer to accept that this clarification does not expand the performance
      warranty's standard or remedy.
    summary: Clarify that the disclaimer does not override the express performance warranty
      elsewhere in the Agreement.
    language: 'Except for the express warranty set out in the Performance Warranty section
      of this Agreement, the Services are provided "AS IS" and Halcyon disclaims all other
      warranties, whether express, implied or statutory, including the implied warranties
      of merchantability, fitness for a particular purpose and non-infringement.

      '
  - kind: acceptable_variant
    label: Disclaimer combined with the warranty section as one clause
    zone: green
    summary: Same disclaimer substance, drafted as the closing paragraph of the warranty section
      rather than a stand-alone clause.
    language: 'No warranty is given other than as expressly stated above; Halcyon disclaims
      the implied warranties of merchantability, fitness for a particular purpose and non-infringement,
      and the Services are not intended to provide medical advice, diagnosis or treatment.

      '
  red_lines:
  - key: disclaimer-deleted
    description: The warranty disclaimer is removed, or Halcyon is deemed to give warranties
      beyond the express performance warranty.
    condition_type: semantic
    condition:
      test: 'The clause removes the disclaimer of implied warranties entirely, or states that
        Halcyon gives warranties of merchantability, fitness for a particular purpose or non-infringement
        in addition to the express performance warranty.

        '
    action: block
    rationale: 'Implied warranties left standing are not bounded by the cure-period remedy
      and are not priced into Halcyon Risk Policy RP-04; for a clinical product serving about
      310 customers, an implied fitness-for-purpose warranty could be read as a promise about
      clinical outcomes the product was never built to make.

      '
  objections:
  - objection: All-capitals disclaimers are unenforceable boilerplate in our state; please
      use normal text.
    their_rationale: Counterparty's counsel has seen capitalisation requirements struck down
      or ignored by courts.
    response: 'We are comfortable dropping the capitalisation as long as the substance, including
      the medical-advice statement, stays in the body of the Agreement where Customer''s own
      business teams will see it.

      '
    talking_points:
    - The substance of the disclaimer, not its formatting, is what Halcyon's risk policy requires.
    - Confirm the medical-advice statement remains visible, not moved to the Documentation
      only.
    recommended_position:
      rule_key: warranties.disclaimer
      rung: 1
    frequency: occasional
  - objection: This disclaimer seems to undercut the performance warranty you just gave us.
    their_rationale: Counterparty's counsel reads "AS IS" language as potentially swallowing
      the express warranty.
    response: 'We can add a sentence making clear the disclaimer does not override the express
      performance warranty, which remains in full effect; the disclaimer only removes the
      warranties Halcyon did not expressly agree to give.

      '
    talking_points:
    - The performance warranty section already states its own remedy and survives the disclaimer.
    - This clarification does not expand the performance warranty's standard.
    recommended_position:
      rule_key: warranties.disclaimer
      rung: 2
    frequency: common
    counterparty_profile: Large hospital systems
  dependencies:
  - related_rule_key: warranties.performance_warranty
    relation: read_with
    note: The disclaimer's "AS IS" language and the express performance warranty must be read
      together so neither swallows the other.
  test_cases:
  - name: Standard full disclaimer with medical-advice statement
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Except as expressly stated in this Agreement, Vendor disclaims all warranties,
      express, implied or statutory, including merchantability, fitness for a particular purpose
      and non-infringement, and the Services do not constitute medical advice or diagnosis.

      '
  - name: Disclaimer folded into the close of the warranty section
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'No other warranty is given; the implied warranties of merchantability, fitness
      for a particular purpose and non-infringement are disclaimed, and the Services are not
      intended as medical advice.

      '
  - name: Disclaimer in normal case, same substance
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor disclaims all implied warranties, including merchantability, fitness
      for a particular purpose and non-infringement; the services are not a substitute for
      professional medical judgment.

      '
  - name: Disclaimer present but silent on medical advice
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Except as expressly stated, Vendor disclaims all implied warranties, including
      merchantability, fitness for a particular purpose and non-infringement.

      '
  - name: Disclaimer deleted entirely
    expected_outcome: red_line
    expected_red_line_key: disclaimer-deleted
    expected_zone: red
    sample_text: 'Vendor warrants that the Services are fit for Customer''s intended purpose,
      merchantable, and will not infringe any third party''s rights, in addition to the express
      warranties stated elsewhere in this Agreement.

      '
- rule_key: insurance.coverage_requirements
  title: Insurance coverage requirements
  required: true
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon maintains cyber and technology errors and omissions cover of
    at least $10,000,000 aggregate and commercial general liability cover of at least $2,000,000,
    and provides a certificate of insurance on request.

    '
  risk_rationale: '$10M of cyber and technology E&O cover and $2M of general liability cover
    are the limits Halcyon actually holds today across its roughly 310 customers. Committing
    to a higher stated limit than Halcyon carries creates a contractual promise the insurance
    does not back, and an open-ended "adequate to cover all losses" promise cannot be priced
    or verified at all.

    '
  detection_guidance: 'Look for "shall maintain", "commercial general liability", "cyber liability",
    "technology errors and omissions", "limits of not less than", "additional insured" and
    "certificate of insurance". Absence means there is no contractual insurance obligation,
    which is a missing clause for a SaaS agreement of this kind.

    '
  source_ref: Halcyon Risk Policy RP-04; current cyber and technology E&O and general liability
    policies
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Current limits, certificate on request
    zone: green
    summary: $10M cyber/technology E&O, $2M general liability, certificate of insurance provided
      on request.
    language: 'Halcyon shall maintain, throughout the Subscription Term, (a) cyber liability
      and technology errors and omissions insurance with limits of not less than US$10,000,000
      in the aggregate, and (b) commercial general liability insurance with limits of not
      less than US$2,000,000 per occurrence, in each case with insurers rated A- or better
      by A.M. Best, and shall provide a certificate of insurance evidencing this coverage
      within ten (10) business days of Customer''s written request.

      '
  - kind: fallback
    rung: 1
    label: Add additional insured status on the general liability policy
    zone: yellow
    approver_role: cfo
    give_get: Require that additional insured status not extend to the cyber or technology
      E&O policy.
    summary: Name Customer as an additional insured on the general liability policy only.
    language: 'Halcyon shall maintain the insurance described above and shall name Customer
      as an additional insured on its commercial general liability policy, such status not
      extending to Halcyon''s cyber liability and technology errors and omissions policy.

      '
  - kind: fallback
    rung: 2
    label: Raise the cyber and technology E&O limit above US$10,000,000
    zone: yellow
    approver_role: cfo
    conditions:
      deal_value_band:
      - strategic
    give_get: Require advance notice before Halcyon reduces its coverage below the stated
      limit during the Subscription Term.
    summary: Increase the cyber and technology E&O limit beyond what Halcyon holds today,
      up to US$20,000,000.
    language: 'Halcyon shall maintain cyber liability and technology errors and omissions
      insurance with limits of not less than US$[amount, not to exceed US$20,000,000] in the
      aggregate for the duration of the Subscription Term.

      '
  - kind: acceptable_variant
    label: Limits stated as a schedule rather than inline
    zone: green
    summary: Same limits and certificate obligation, set out in an insurance schedule referenced
      from the body of the Agreement.
    language: 'Halcyon shall maintain the insurance coverage set out in Schedule [X] (Insurance),
      being cyber liability and technology errors and omissions cover of not less than US$10,000,000
      and commercial general liability cover of not less than US$2,000,000, and shall provide
      a certificate of insurance on Customer''s written request.

      '
  parameters:
  - key: cyber_eo_limit_usd
    label: Cyber and technology E&O aggregate limit
    value_type: currency_usd
    direction: lower_is_better
    preferred_value: 10000000
    green_limit: 10000000
    yellow_limit: 25000000
    extraction_hint: 'The stated aggregate limit for cyber liability and technology errors
      and omissions cover. A limit below $10,000,000 is still green; it is the floor, not
      a target.

      '
  red_lines:
  - key: insurance-unlimited
    description: Halcyon must maintain insurance with no stated limit, or coverage "adequate
      to cover all losses" under the Agreement.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to maintain insurance coverage with no stated dollar
        limit, or coverage described as adequate or sufficient to cover all losses, liabilities
        or damages that could arise under the Agreement.

        '
    action: block
    rationale: 'An unlimited or "adequate to cover all losses" insurance requirement cannot
      be purchased, priced or verified against Halcyon''s actual $10M cyber and technology
      E&O and $2M general liability cover, and effectively removes the liability cap through
      an insurance-procurement obligation instead.

      '
  objections:
  - objection: We need to be named as an additional insured on every policy you carry, including
      the cyber policy.
    their_rationale: Counterparty's risk management team applies a single additional-insured
      requirement across all vendor policies.
    response: 'We can add Customer as an additional insured on our general liability policy,
      which is the standard way insurers extend that status; cyber and technology E&O policies
      are underwritten and priced differently and our carrier does not offer additional insured
      status on them.

      '
    talking_points:
    - Additional insured status on cyber policies is unusual in the market and often unavailable
      from carriers.
    - Offer a certificate of insurance and notice of material changes as an alternative on
      the cyber side.
    recommended_position:
      rule_key: insurance.coverage_requirements
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with standard vendor risk requirements
  - objection: $10M is not enough given the scale of patient data you process across your
      whole customer base.
    their_rationale: Counterparty benchmarks the limit against Halcyon's total customer count
      rather than this one contract.
    response: 'We can increase the cyber and technology E&O limit for a strategic engagement
      of this size, subject to CFO approval, up to twenty million dollars; that increase needs
      to be weighed against the premium cost across our full book, not just this contract.

      '
    talking_points:
    - The limit is an aggregate across all claims in a policy period, not per contract.
    - This rung is reserved for strategic deals and needs CFO sign-off.
    recommended_position:
      rule_key: insurance.coverage_requirements
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: limitation_of_liability.cap_amount
    relation: read_with
    note: The liability cap on strategic deals should not be raised to a multiple of Fees
      that the stated insurance limits could not realistically back.
  test_cases:
  - name: Standard limits with certificate on request
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor will maintain cyber and technology errors and omissions insurance
      of at least ten million dollars and general liability insurance of at least two million
      dollars, and will provide a certificate of insurance within ten business days of request.

      '
  - name: Limits set out in a schedule
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor''s insurance obligations are set out in Schedule 3, which states
      a ten-million-dollar cyber and technology E&O limit and a two-million-dollar general
      liability limit, with a certificate available on request.

      '
  - name: Additional insured on general liability only
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor shall maintain the insurance described above and shall name Customer
      as an additional insured on its commercial general liability policy.

      '
  - name: Certificate obligation with no stated limits
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor shall maintain insurance appropriate to its business and shall provide
      a certificate of insurance on request.

      '
  - name: Trap - limits stated as a floor with explicit headroom language
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor''s insurance shall at no time provide less than ten million dollars
      of cyber and technology E&O cover and two million dollars of general liability cover.

      '
- rule_key: intellectual_property.ownership
  title: Ownership of intellectual property
  required: true
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon retains all right, title and interest in the Services, the underlying
    software and the Documentation, including any configurations or customizations built on
    the shared platform; Customer owns only its own Customer Data and any deliverables created
    solely for it that contain no Halcyon technology.

    '
  risk_rationale: 'Every one of Halcyon''s roughly 310 customers runs on the same multi-tenant
    code base, so any ownership right given to one customer over a configuration or customization
    built from shared platform components would leave Halcyon unable to lawfully reuse or
    support that component for the others. This is the foundation the $72M ARR business is
    built on and is not adjustable by deal size.

    '
  detection_guidance: 'Look for "retains all right, title and interest", "no rights are granted
    except as expressly set out", "work made for hire", "hereby assigns" and "Deliverables",
    and check closely for any assignment wording that reaches configurations, workflows or
    integrations built on the shared platform. Absence of an ownership clause in a SaaS agreement
    is a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Halcyon retains all IP; Customer owns only its own data
    zone: green
    summary: Halcyon owns the Services, software, Documentation and any configurations; Customer
      owns Customer Data.
    language: 'As between the parties, Halcyon and its licensors retain all right, title and
      interest in and to the Services, the underlying software, the Documentation, and any
      configurations, customizations, workflows or integrations created in connection with
      this Agreement, including any suggestions or modifications requested by Customer. No
      rights are granted to Customer except as expressly set out in this Agreement. As between
      the parties, Customer retains all right, title and interest in and to Customer Data.

      '
  - kind: fallback
    rung: 1
    label: Customer-specific deliverables containing no Halcyon technology
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that any such deliverable be separately scoped and priced under an Order
      Form, not bundled into the base subscription.
    summary: Customer owns deliverables built solely for it under a separate statement of
      work, provided they contain no Halcyon pre-existing technology.
    language: 'Where the parties agree in a separate Order Form or statement of work that
      Halcyon will create a deliverable solely for Customer that contains no pre-existing
      Halcyon technology, Halcyon assigns to Customer all right, title and interest in that
      deliverable upon full payment of the fees for it; for clarity, this does not apply to
      the Services, the underlying software, the Documentation, or any configuration built
      using Halcyon''s platform components.

      '
  - kind: fallback
    rung: 2
    label: Perpetual, royalty-free licence to Customer-requested configurations
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require that the licence be non-exclusive and non-transferable outside Customer's
      corporate group.
    summary: Grant Customer a perpetual, non-exclusive licence to configurations built at
      its request, without assigning ownership.
    language: 'Halcyon grants Customer a perpetual, non-exclusive, non-transferable, royalty-free
      licence to use any configuration or workflow built at Customer''s specific request,
      solely for Customer''s own internal use of the Services; ownership of the underlying
      platform components remains with Halcyon.

      '
  - kind: acceptable_variant
    label: Ownership stated through a "no implied licence" clause
    zone: green
    summary: Same reservation of rights, drafted as a negative grant rather than an affirmative
      retention statement.
    language: 'Nothing in this Agreement grants Customer any right, title or interest in the
      Services, the underlying software or the Documentation, other than the limited right
      to use the Services during the Subscription Term as set out in this Agreement; all other
      rights are reserved to Halcyon.

      '
  red_lines:
  - key: ip-ownership-assignment-to-customer
    description: Ownership of configurations, customizations or integrations built using Halcyon's
      pre-existing platform is assigned to Customer.
    condition_type: semantic
    condition:
      test: 'The agreement assigns to Customer ownership of a configuration, customization,
        workflow or integration that Halcyon built using its pre-existing platform components,
        rather than limiting Customer''s ownership to its own data and to deliverables created
        solely for it that contain no Halcyon technology.

        '
    action: block
    rationale: 'Assigning any part of the shared, multi-tenant platform to one customer would
      leave Halcyon unable to lawfully reuse that component for the other roughly 310 customers
      running on the same code base and would breach the ownership warranties Halcyon gives
      in its other contracts.

      '
  objections:
  - objection: We paid for the configuration work, so we should own it.
    their_rationale: Counterparty's procurement team treats anything it paid a professional-services
      fee for as a work made for hire.
    response: 'Where we build something solely for you that does not touch our shared platform
      components, we are glad to assign that under a separate statement of work once it is
      paid for. Configuration of the platform itself has to stay ours, because the same components
      run every other customer''s environment.

      '
    talking_points:
    - Distinguish stand-alone deliverables from configuration of the shared platform.
    - Offer a perpetual licence to the configuration if ownership is not available.
    recommended_position:
      rule_key: intellectual_property.ownership
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with in-house development teams
  - objection: At minimum, we need a licence to keep using any custom workflow if we ever
      switch vendors.
    their_rationale: Counterparty wants continuity of its own business processes independent
      of the relationship with Halcyon.
    response: 'We can grant a perpetual, non-exclusive licence to a workflow built specifically
      at your request, so you can keep describing your process the same way even if the underlying
      platform changes, without us losing the ability to reuse the same building blocks for
      other customers.

      '
    talking_points:
    - The licence is non-exclusive and tied to Customer's own internal use.
    - This rung is reserved for tier-1 accounts and needs commercial counsel sign-off.
    recommended_position:
      rule_key: intellectual_property.ownership
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: intellectual_property.feedback_license
    relation: read_with
    note: Feedback and configuration requests both flow into the same shared platform; the
      ownership and feedback clauses should use consistent language about what Customer receives
      back.
  test_cases:
  - name: Standard ownership retention
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor retains all right, title and interest in the Services, the underlying
      software and the Documentation; Customer retains all right, title and interest in Customer
      Data.

      '
  - name: Ownership stated as a no-implied-licence clause
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Customer receives no right, title or interest in the Services or underlying
      software beyond the right to use them during the Subscription Term; all other rights
      are reserved to Vendor.

      '
  - name: Customer owns a stand-alone deliverable under a statement of work
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Under the attached statement of work, Vendor assigns to Customer all right,
      title and interest in the custom report template built solely for Customer, which contains
      no Vendor platform code, upon payment in full.

      '
  - name: Ownership clause silent on configurations built during onboarding
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor retains ownership of the Services and Documentation. This Agreement
      does not address ownership of any configuration created during implementation.

      '
  - name: Customer assigned ownership of a platform configuration
    expected_outcome: red_line
    expected_red_line_key: ip-ownership-assignment-to-customer
    expected_zone: red
    sample_text: 'Vendor hereby assigns to Customer all right, title and interest in the workflow
      configuration built on Vendor''s platform during implementation of the Services.

      '
- rule_key: intellectual_property.feedback_license
  title: Feedback licence
  required: false
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon may use any suggestions, enhancement requests or recommendations
    Customer provides about the Services under a perpetual, irrevocable, royalty-free licence,
    without restriction or obligation to Customer.

    '
  risk_rationale: 'Halcyon Engage improves through enhancement requests from its roughly 310
    customers, and a product change suggested by one customer is almost always built into
    the shared platform and used by many others. Without a clear feedback licence, Halcyon
    risks a claim that a feature built on one customer''s suggestion belongs to that customer.

    '
  detection_guidance: 'Look for "Feedback", "suggestions, enhancement requests or recommendations",
    "perpetual, irrevocable, royalty-free licence" and "without restriction or obligation",
    usually a short sub-clause in the intellectual property section. Absence leaves Halcyon''s
    right to act on customer suggestions unclear, which is a missing clause.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Perpetual, royalty-free feedback licence
    zone: green
    summary: Halcyon may use Feedback freely, without restriction or obligation to Customer.
    language: 'If Customer provides Halcyon with any suggestion, enhancement request, recommendation
      or other feedback relating to the Services ("Feedback"), Customer grants Halcyon a perpetual,
      irrevocable, worldwide, royalty-free licence to use, incorporate and commercialise the
      Feedback in the Services, without restriction or obligation to Customer, provided that
      Feedback shall not include Customer''s Confidential Information unless Customer identifies
      it as such and agrees to its use.

      '
  - kind: fallback
    rung: 1
    label: Exclude Customer's Confidential Information by default
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require Customer to flag any Feedback it wants excluded from the licence at
      the time it is given.
    summary: Feedback licence excludes anything that would otherwise be Customer's Confidential
      Information, with no separate identification step required.
    language: 'Customer grants Halcyon a perpetual, irrevocable, worldwide, royalty-free licence
      to use Feedback in the Services, without restriction or obligation to Customer, except
      that Feedback does not include any information that is Customer''s Confidential Information
      under this Agreement.

      '
  - kind: fallback
    rung: 2
    label: Non-attribution assurance
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that this assurance not be read as limiting Halcyon's right to use the
      Feedback itself.
    summary: Add assurance that Halcyon will not publicly attribute specific Feedback to Customer
      without consent.
    language: 'Halcyon will not publicly attribute specific Feedback to Customer by name without
      Customer''s prior written consent, provided that this does not limit Halcyon''s licence
      to use, incorporate or commercialise the Feedback itself.

      '
  - kind: acceptable_variant
    label: Feedback licence drafted as part of a broader "Suggestions" clause
    zone: green
    summary: Same perpetual, royalty-free licence, drafted under a "Suggestions" heading rather
      than "Feedback".
    language: 'Any suggestions Customer submits regarding the Services may be used by Halcyon
      for any purpose, including incorporating them into the Services, without payment or
      other obligation to Customer, on a perpetual and irrevocable basis.

      '
  red_lines:
  - key: feedback-license-revocable-or-confidential
    description: The feedback licence is made revocable, non-perpetual, or Customer retains
      confidentiality rights that prevent Halcyon from using the Feedback.
    condition_type: semantic
    condition:
      test: 'The clause lets Customer revoke the licence to use Feedback, is not stated as
        perpetual or irrevocable, or treats all Feedback as Customer''s Confidential Information
        by default, preventing Halcyon from using or disclosing it.

        '
    action: escalate
    approver_role: commercial_counsel
    rationale: 'Feedback from one customer is routinely built into the shared platform used
      by Halcyon''s roughly 310 customers; a revocable or confidential licence would force
      Halcyon to track and potentially remove shared features on a single customer''s demand.

      '
  objections:
  - objection: We do not want our enhancement requests used to help your other hospital customers
      for free.
    their_rationale: Counterparty views its operational know-how embedded in a feature request
      as a competitive input.
    response: 'We only use the functional substance of a suggestion, never your confidential
      business information, and we will not publicly attribute the idea to you without your
      consent. The alternative, where every customer''s feedback is locked to that customer
      alone, would slow improvements for everyone, including you.

      '
    talking_points:
    - Offer the non-attribution assurance at rung 2.
    - Clarify that Feedback excludes Customer's Confidential Information.
    recommended_position:
      rule_key: intellectual_property.feedback_license
      rung: 2
    frequency: occasional
  - objection: Any feedback we give should remain our confidential information unless we say
      otherwise.
    their_rationale: Counterparty's default confidentiality clause would otherwise sweep in
      anything said to Halcyon's support team.
    response: 'We agree Feedback should not include your genuinely confidential information,
      and we are comfortable excluding it by default rather than requiring you to flag it
      each time, as long as the licence to use ordinary product suggestions is not affected.

      '
    talking_points:
    - Rung 1 excludes Confidential Information by default, with no extra step required from
      Customer.
    - The licence still needs to be perpetual and irrevocable for ordinary suggestions.
    recommended_position:
      rule_key: intellectual_property.feedback_license
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with strict confidentiality policies
  dependencies:
  - related_rule_key: intellectual_property.ownership
    relation: read_with
    note: Feedback incorporated into the Services becomes part of the platform Halcyon owns
      under the ownership rule; the two clauses should not conflict on who owns the resulting
      feature.
  test_cases:
  - name: Standard perpetual feedback licence
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Any suggestions or enhancement requests Customer gives Vendor about the
      Services may be used, incorporated and commercialised by Vendor on a perpetual, irrevocable,
      royalty-free basis, with no obligation to Customer.

      '
  - name: Feedback licence under a "Suggestions" heading
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Suggestions Customer submits about the Services may be used by Vendor for
      any purpose, including incorporating them into the Services, on a perpetual and irrevocable
      basis and without payment to Customer.

      '
  - name: Confidential Information excluded by default
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Customer grants Vendor a perpetual, irrevocable, royalty-free licence to
      use Feedback, except that Feedback never includes information that would otherwise be
      Customer''s Confidential Information.

      '
  - name: Feedback licence silent on whether it is perpetual
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Customer''s suggestions regarding the Services may be used by Vendor in
      the Services without payment to Customer.

      '
  - name: Trap - licence described as broad but still perpetual and irrevocable
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor''s right to use Feedback is as broad as permitted by law, on a perpetual,
      irrevocable, royalty-free basis, without restriction or obligation to Customer.

      '
- rule_key: intellectual_property.usage_data
  title: Usage data
  required: false
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: true
  judgment_note: 'Weigh whether the described aggregation or de-identification method could
    plausibly re-identify a specific patient or Customer given the actual volume and sensitivity
    of the data at issue, not only whether the clause uses the words "aggregated" or "de-identified".

    '
  position_summary: 'Halcyon may collect and use Usage Data, meaning aggregated and de-identified
    data about how the Services are used, to operate, secure and improve the product, without
    identifying Customer or any patient and without training third-party models or selling
    the data.

    '
  risk_rationale: 'Halcyon operates a multi-tenant platform across roughly 310 hospital and
    clinic customers and needs aggregated usage signals to run capacity planning, security
    monitoring and product improvement work under its SOC 2 Type II, ISO 27001 and HITRUST
    r2 programs. Because the underlying data can include PHI before it is aggregated, the
    right must be narrow enough that Usage Data can never be used to re-identify a patient
    or to train models made available to other companies.

    '
  detection_guidance: 'Look for "Usage Data", "aggregated and anonymised", "de-identified",
    "statistical data", "system performance data" and "to improve the Services", and check
    for limits on re-identification and on disclosure to third parties. Absence means Halcyon
    has no express right to use data about how the Services are used, which is a missing clause
    for a product operated at this scale. This rule governs telemetry and metadata about how
    the Services are used, such as login frequency, feature usage and system performance;
    it is distinct from the data_protection customer_data_use rule, which governs de-identified
    or aggregated derivatives of the content of Customer Data itself (patient, scheduling
    or clinical record content Halcyon hosts for Customer). A clause that aggregates or de-identifies
    the substance of patient or clinical records belongs to the other rule even if it is labelled
    "usage data" or "analytics"; a clause limited to configuration or usage metrics belongs
    here.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Aggregated, de-identified Usage Data for operating, securing and improving the
      Services
    zone: green
    summary: Halcyon may use Usage Data that is aggregated and de-identified to a standard
      that cannot reasonably re-identify a patient or Customer.
    language: 'Halcyon may collect and use data about the configuration and use of the Services
      ("Usage Data"), provided that Usage Data is aggregated and de-identified such that it
      cannot reasonably be used to identify Customer or any individual, to operate, secure,
      support and improve the Services and Halcyon''s other products. Halcyon will not use
      Usage Data to train models made available to third parties and will not sell Usage Data.

      '
  - kind: fallback
    rung: 1
    label: Add a right for Customer to request the de-identification methodology on request
    zone: yellow
    approver_role: commercial_counsel
    give_get: Require that this disclosure be made under confidentiality and not more than
      once per year absent a security incident.
    summary: Halcyon describes its de-identification methodology to Customer on written request,
      under confidentiality.
    language: 'On Customer''s written request, not more than once per year absent a security
      incident, Halcyon will describe in reasonable detail, under the confidentiality obligations
      of this Agreement, the method it uses to aggregate and de-identify Usage Data.

      '
  - kind: fallback
    rung: 2
    label: Permit benchmarking disclosures in a form that does not identify Customer
    zone: yellow
    approver_role: general_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Require that any benchmark report be reviewed by Customer before external publication
      if it could be inferred to relate to Customer.
    summary: Halcyon may publish benchmark statistics derived from Usage Data across its customer
      base, provided no statistic is specific enough to identify Customer.
    language: 'Halcyon may publish aggregate benchmark statistics derived from Usage Data
      across its customer base, provided no such statistic identifies Customer or is derived
      from a sample small enough that Customer could reasonably be identified from it.

      '
  - kind: acceptable_variant
    label: Usage Data right drafted as part of the data protection section
    zone: green
    summary: Same aggregation, de-identification and no-training-or-sale limits, placed in
      the data protection section rather than intellectual property.
    language: 'As part of operating and improving the Services, Vendor may process de-identified,
      aggregated data about Services usage that does not identify Customer or any individual,
      and will not use that data to train models offered to third parties or sell it.

      '
  parameters:
  - key: usage_data_training_or_sale_prohibited
    label: Usage Data may not be used to train third-party models or sold
    value_type: boolean
    direction: exact
    preferred_value: true
    green_limit: true
    extraction_hint: 'True when the clause expressly prohibits using Usage Data to train models
      offered to third parties and prohibits selling it. False if the clause is silent or
      permits either use.

      '
  red_lines:
  - key: usage-data-reidentification-risk
    description: Usage Data may be disclosed or used in a form that could re-identify a specific
      patient or Customer.
    condition_type: semantic
    condition:
      test: 'The clause permits Usage Data to be disclosed to a third party, or used internally,
        in a form that is not aggregated and de-identified to a standard that prevents reasonably
        identifying a specific patient or Customer.

        '
    action: block
    rationale: 'Halcyon is a business associate under HIPAA and a processor under GDPR; data
      that could re-identify a patient is PHI or Personal Data regardless of the "Usage Data"
      label, and using or disclosing it outside those regimes'' instructions would put Halcyon''s
      HITRUST r2 certification and its business associate agreements at risk.

      '
  objections:
  - objection: We don't want any data derived from our patients used for anything other than
      running our own instance.
    their_rationale: Counterparty's privacy counsel treats all derived data as inseparable
      from the underlying PHI.
    response: 'We limit our use to data that has been aggregated and de-identified to a standard
      that cannot reasonably identify your patients or your organisation, and we will describe
      that method to you under confidentiality on request so your privacy counsel can review
      it directly.

      '
    talking_points:
    - Offer rung 1's methodology disclosure before conceding further.
    - Distinguish de-identified aggregate data from PHI itself, which stays governed by the
      Data Protection section.
    recommended_position:
      rule_key: intellectual_property.usage_data
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with privacy counsel review
  - objection: You should not be allowed to publish any statistics derived from our usage
      at all.
    their_rationale: Counterparty worries that even aggregate benchmarks could let competitors
      infer its performance.
    response: 'We can withhold your organisation from any benchmark that could be read as
      specific to you, and on tier-1 accounts we will show you a benchmark before it is published
      externally if it could be inferred to relate to you.

      '
    talking_points:
    - Benchmarks are reviewed before publication on tier-1 accounts under rung 2.
    - No benchmark statistic is derived from a sample small enough to identify a single customer.
    recommended_position:
      rule_key: intellectual_property.usage_data
      rung: 2
    frequency: occasional
  dependencies:
  - related_rule_key: data_protection.customer_data_use
    relation: read_with
    note: Usage Data must be read against the data protection section's limits on Customer
      Data use so the two rights do not overlap or conflict.
  test_cases:
  - name: Standard aggregated, de-identified Usage Data right
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor may collect and use Usage Data, meaning aggregated and de-identified
      data about use of the Services that cannot reasonably identify Customer or any individual,
      to operate, secure and improve the Services; Vendor will not use Usage Data to train
      third-party models or sell it.

      '
  - name: Usage Data right drafted in the data protection section
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor may process de-identified, aggregated usage data that does not identify
      Customer or any individual to operate and improve the Services, and will not use it
      to train models offered to third parties or sell it.

      '
  - name: Methodology disclosure on written request
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor may use aggregated, de-identified Usage Data to improve the Services
      and will describe its de-identification method to Customer under confidentiality on
      written request, no more than once per year absent a security incident.

      '
  - name: Usage Data right silent on training or sale
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor may collect and use aggregated data about use of the Services to
      improve its products.

      '
  - name: Usage Data disclosed without adequate de-identification
    expected_outcome: red_line
    expected_red_line_key: usage-data-reidentification-risk
    expected_zone: red
    sample_text: 'Vendor may disclose usage statistics, including record-level activity logs
      tied to individual patient accounts, to its analytics partners to improve the Services.

      '
- rule_key: publicity.name_and_logo_use
  title: Name and logo use
  required: false
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon may identify Customer as a customer and use Customer''s name
    and logo in a customer list, consistent with Customer''s trademark guidelines, and Customer
    may not publicise Halcyon''s performance or service level data without Halcyon''s prior
    written consent.

    '
  risk_rationale: 'Reference customers are valuable to a $72M ARR business selling to about
    310 hospital systems and clinic groups that look to peers before buying, so a basic right
    to list Customer by name supports sales without disclosing Customer Data. Allowing Customer
    to publish Halcyon''s own uptime or service level performance without consent could expose
    incident details before Halcyon has verified them, affecting every other customer on the
    shared platform.

    '
  detection_guidance: 'Look for "may use Customer''s name and logo", "customer list", "press
    release", "case study", "without the prior written consent" and "in accordance with trademark
    usage guidelines", and check for any right given to Customer to publish or benchmark Halcyon''s
    performance data. Absence means neither party has a contractual right to use the other''s
    name or marks, which is a missing clause, not a deviation.

    '
  source_ref: Halcyon Risk Policy RP-04
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2026-01-08
  positions:
  - kind: preferred
    rung: 0
    label: Customer list and logo use, consent required for case studies
    zone: green
    summary: Halcyon may list Customer by name and logo; a case study or press release needs
      Customer's prior written consent.
    language: 'Halcyon may identify Customer as a customer of Halcyon and use Customer''s
      name and logo on Halcyon''s customer list and in sales materials, in accordance with
      Customer''s trademark usage guidelines if provided, provided that any press release
      or case study naming Customer requires Customer''s prior written consent. Customer shall
      not publish, disclose or benchmark Halcyon''s performance, uptime or service level data
      without Halcyon''s prior written consent.

      '
  - kind: fallback
    rung: 1
    label: Consent required for the customer list as well
    zone: yellow
    approver_role: contracts_manager
    give_get: Require Customer to respond to a consent request within 30 days, after which
      consent is deemed given for the customer list only.
    summary: Halcyon needs Customer's prior written consent even to add Customer to the general
      customer list.
    language: 'Halcyon may identify Customer as a customer of Halcyon, including on Halcyon''s
      customer list, only with Customer''s prior written consent, which Customer shall not
      unreasonably withhold or delay; consent is deemed given for the customer list alone
      if Customer does not respond within thirty (30) days of a request.

      '
  - kind: fallback
    rung: 2
    label: No publicity right at all
    zone: yellow
    approver_role: contracts_manager
    give_get: Require that Customer's restriction on publicising Halcyon's performance data
      survive this concession unchanged.
    summary: Halcyon has no right to identify Customer publicly in any form.
    language: 'Neither party may identify the other as a party to this Agreement, or use the
      other''s name, logo or trademarks, in any public statement, customer list, press release
      or case study, without that party''s prior written consent in each instance.

      '
  - kind: acceptable_variant
    label: Publicity rights drafted as a mutual, reciprocal clause
    zone: green
    summary: Same consent structure, stated as a mutual right rather than one-sided in Halcyon's
      favour.
    language: 'Each party may identify the other as a party to this Agreement and use the
      other''s name and logo on a customer or vendor list, as applicable, subject to the other
      party''s trademark usage guidelines, provided that any case study, press release, or
      publication of the other party''s performance data requires that party''s prior written
      consent.

      '
  red_lines:
  - key: publicity-performance-data-release
    description: Customer may publish, disclose or benchmark Halcyon's performance, uptime
      or service level data without Halcyon's consent.
    condition_type: semantic
    condition:
      test: 'The clause allows Customer to publish, disclose to third parties, or use in a
        public benchmark Halcyon''s performance, uptime, security incident or service level
        data, without requiring Halcyon''s prior written consent.

        '
    action: block
    rationale: 'Halcyon''s multi-tenant platform serves about 310 customers on shared infrastructure;
      unverified or out-of-context performance disclosures by one customer can misstate the
      experience of every other customer and complicate incident response under Halcyon''s
      SOC 2 Type II program.

      '
  objections:
  - objection: We don't want to appear on any public customer list; our procurement rules
      forbid it.
    their_rationale: Public hospital systems and government-affiliated clinics often restrict
      vendor endorsements by policy.
    response: 'We can require our own consent even for the general customer list, so nothing
      is published about the relationship without your sign-off each time, or on request we
      can agree not to identify you publicly at all.

      '
    talking_points:
    - Offer rung 1 first; move to rung 2 only if the policy is absolute.
    - Confirm whether the restriction is a blanket policy or case-by-case.
    recommended_position:
      rule_key: publicity.name_and_logo_use
      rung: 1
    frequency: common
    counterparty_profile: Public hospital systems and government-affiliated clinics
  - objection: We should be free to publish our own experience with your service, including
      uptime, in our own materials.
    their_rationale: Counterparty wants to use its own operational data about Halcyon's performance
      for its own marketing or vendor reviews.
    response: 'We are glad to work with you on an approved case study that includes performance
      information we have verified together; publishing uptime or incident figures unilaterally
      risks describing a single customer''s experience as if it applied to the whole platform,
      which is what the consent requirement is there to avoid.

      '
    talking_points:
    - Offer to collaborate on a joint case study instead.
    - Performance figures are specific to shared infrastructure and need context before publication.
    frequency: occasional
  dependencies:
  - related_rule_key: service_levels.uptime_commitment
    relation: read_with
    note: The restriction on Customer publicising performance data refers to the same uptime
      and service credit figures defined in the service levels rule.
  test_cases:
  - name: Standard customer list right with consent for case studies
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor may list Customer as a customer and use its name and logo in sales
      materials; any press release or case study naming Customer requires Customer''s prior
      written consent, and Customer may not publish Vendor''s performance data without Vendor''s
      consent.

      '
  - name: Mutual, reciprocal publicity clause
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party may identify the other as a party to this Agreement and use its
      name and logo on a customer or vendor list, subject to trademark guidelines, with consent
      required for any case study or publication of the other''s performance data.

      '
  - name: Consent required even for the customer list
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor may identify Customer as a customer, including on its customer list,
      only with Customer''s prior written consent, not to be unreasonably withheld.

      '
  - name: Customer list right with no restriction on Customer publicising performance data
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor may list Customer as a customer and use its name and logo in sales
      materials and on its website.

      '
  - name: Trap - restriction phrased as a Customer obligation, not a Vendor right
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Customer shall not publish, disclose, or use in any public benchmark any
      data regarding Vendor''s performance, uptime or service levels without Vendor''s prior
      written consent, and Vendor may identify Customer as a customer in its sales materials.

      '
- rule_key: confidentiality.standard_of_care
  title: Standard of care for Confidential Information
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Each party protects the other''s Confidential Information using the same
    degree of care it uses for its own information of a similar kind, but never less than
    a reasonable standard of care, and uses it only for the Subscription Term and the purpose
    of this Agreement.

    '
  risk_rationale: 'Halcyon exchanges commercial and technical Confidential Information with
    around 310 hospital systems, physician groups and clinic groups, so a vague or one-sided
    standard is applied inconsistently across the book of business. A floor of reasonable
    care that does not depend on proving what a counterparty does internally keeps the obligation
    enforceable and auditable under Halcyon''s SOC 2 Type II and ISO 27001 programmes.

    '
  detection_guidance: 'Look for "the same degree of care", "no less than a reasonable degree
    of care", "strict confidence" and "solely for the Purpose". A clause stating only a reasonable-care
    standard, with no self-care comparator, matches fallback rung 1 rather than the preferred
    position. A clause that states only the self-care comparator with no reasonable-care floor
    is a deviation rather than a missing clause. No confidentiality clause at all in the agreement
    is a missing clause.

    '
  source_ref: Halcyon Information Security Policy ISP-02
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-02
  positions:
  - kind: preferred
    rung: 0
    label: Self-care comparator with a reasonable-care floor
    zone: green
    summary: Same care as own information, never less than reasonable care, mutual.
    language: 'Each party shall protect the other party''s Confidential Information using
      the same degree of care that it uses to protect its own confidential information of
      a similar nature, but in no event less than a reasonable degree of care, and shall use
      the other party''s Confidential Information solely for the purpose of exercising its
      rights and performing its obligations under this Agreement.

      '
  - kind: fallback
    rung: 1
    label: Reasonable care only, no self-care comparator
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      counterparty_tier:
      - tier_1
      - tier_2
    give_get: Ask for a mutual equitable-relief acknowledgment in return.
    summary: Drop the self-care comparator and rely on a reasonable-care standard alone.
    language: 'Each party shall use a reasonable degree of care to protect the other party''s
      Confidential Information from unauthorized use or disclosure, and shall use such Confidential
      Information solely for the purpose of exercising its rights and performing its obligations
      under this Agreement.

      '
  - kind: fallback
    rung: 2
    label: Customer's written security policy incorporated as an exhibit
    zone: yellow
    approver_role: security_lead
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask that the exhibit be attached as of the Order Form date and changed only
      by written amendment.
    summary: Accept a named set of safeguards from Customer's policy, fixed as an exhibit
      rather than a floating reference.
    language: 'Each party shall protect the other party''s Confidential Information using
      administrative, technical and physical safeguards no less protective than those described
      in Exhibit [X] (the version in effect on the Effective Date), and no less protective
      than a reasonable degree of care, and shall use such Confidential Information solely
      for the purpose of exercising its rights and performing its obligations under this Agreement.

      '
    internal_note: 'Only agree to a fixed exhibit, never a live link to Customer''s policy
      as it changes from time to time.

      '
  - kind: acceptable_variant
    label: Commercially reasonable efforts, industry-standard floor
    zone: green
    summary: Counterparty wording for the same outcome using an industry-standard comparator.
    language: 'Each party shall use commercially reasonable efforts to protect the Confidential
      Information of the other party in a manner no less protective than the efforts it applies
      to its own information of a similar nature, and in any event consistent with then-current
      industry standards, using such Confidential Information solely to exercise its rights
      and perform its obligations under this Agreement.

      '
  red_lines:
  - key: data-confidentiality-standard-removed
    description: The clause removes any standard of care, letting either party use or disclose
      Confidential Information as it sees fit.
    condition_type: semantic
    condition:
      test: 'The clause states no standard of care for protecting Confidential Information,
        or expressly allows a party to use or disclose the other party''s Confidential Information
        at its own discretion for purposes beyond this Agreement.

        '
    action: block
    rationale: 'Without an enforceable floor, Halcyon cannot discipline a counterparty''s
      mishandling of commercially sensitive terms, and cannot represent to its own customers
      that shared information stays protected.

      '
  objections:
  - objection: Our policy only commits to reasonable care; we cannot promise to match whatever
      Halcyon does internally.
    their_rationale: Counterparties cannot audit or certify to a standard defined by reference
      to another party's undisclosed internal practices.
    response: 'We can drop the comparison to our own practices and rely on a straightforward
      reasonable-care standard instead. That gives you a clear, objective obligation without
      needing visibility into our internal programme.

      '
    talking_points:
    - The self-care comparator is a floor-raiser for us, not a floor-lowerer for you.
    - A reasonable-care-only standard is still enforceable and is common in SaaS agreements.
    recommended_position:
      rule_key: confidentiality.standard_of_care
      rung: 1
    frequency: occasional
  - objection: Our security exhibit is sixty pages and already governs every vendor; you must
      follow it.
    their_rationale: Large health systems standardize vendor obligations across their supplier
      base to simplify their own compliance programme.
    response: 'We can incorporate a fixed version of your exhibit as an attachment to this
      Agreement so both sides know exactly what applies, rather than a reference that updates
      on your side without our review. Any later changes to the exhibit would need our written
      agreement.

      '
    talking_points:
    - A multi-tenant platform cannot run a different security programme for each customer.
    - Fixing the exhibit at signature avoids a silent change of obligations mid-term.
    recommended_position:
      rule_key: confidentiality.standard_of_care
      rung: 2
    frequency: common
    counterparty_profile: Large hospital systems with a standard vendor security exhibit
  dependencies:
  - related_rule_key: security.security_program
    relation: read_with
    note: The standard of care here and the security programme commitment should use consistent
      language on safeguards.
  test_cases:
  - name: Self-care comparator with reasonable floor
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Each party will protect the other''s confidential information with the same
      care it gives its own similar information, and never with less than a reasonable standard
      of care, using it only to perform this Agreement.

      '
  - name: Industry-standard comparator, no self-care reference
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party will apply commercially reasonable efforts, consistent with prevailing
      industry practice, to safeguard the other party''s confidential information, and will
      use it only to exercise its rights and perform its obligations here.

      '
  - name: Reasonable care only, tier 1 counterparty
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Each party shall take reasonable steps to protect information designated
      confidential by the other party from unauthorized disclosure, and will use that information
      only in connection with this Agreement.

      '
  - name: Standard of care stated with no reasonable-care floor
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Each party shall protect the other party''s confidential information using
      whatever measures it applies to information of its own that it considers comparably
      sensitive.

      '
  - name: No limit on use or disclosure
    expected_outcome: red_line
    expected_red_line_key: data-confidentiality-standard-removed
    expected_zone: red
    sample_text: 'Either party may use or disclose the other party''s confidential information
      as it determines appropriate in its sole discretion.

      '
  - name: Trap - negated "no care" wording
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Neither party may treat the other''s confidential information as unprotected;
      each party shall apply the same degree of care it applies to its own confidential information,
      and in no case less than a reasonable degree of care.

      '
- rule_key: data_protection.customer_data_use
  title: Permitted use of Customer Data
  required: true
  risk_weight: 8
  negotiable: true
  default_zone: yellow
  needs_human_judgment: true
  judgment_note: 'Weigh how the clause describes de-identification and aggregation against
    the sensitivity of the data involved and the deal''s value; language that would pass for
    a low-sensitivity standard account can still be too loose for a tier 1 counterparty sending
    patient data.

    '
  position_summary: 'Halcyon uses Customer Data solely to provide the Services to Customer,
    and may separately use Customer Data in de-identified and aggregated form to operate,
    support and improve the Services, without identifying Customer or any individual.

    '
  risk_rationale: 'Halcyon Engage is multi-tenant software serving roughly 310 customers,
    so a credible commitment that Customer Data is used only to provide the Services, with
    a narrow and clearly bounded carve-out for de-identified analytics, is what lets Halcyon
    operate a shared platform and improve it over time without reopening every customer''s
    trust in the product. Losing the narrow analytics carve-out would require customer-by-customer
    engineering that the $165k median contract cannot support.

    '
  detection_guidance: 'Look for "use Customer Data solely to provide the Services", "shall
    not sell", "shall not use for advertising", "de-identified", "aggregated" and any licence
    back to Halcyon to "host, copy, transmit and display" Customer Data. Absence of any use
    restriction, in an agreement under which Halcyon hosts Customer Data, is a missing clause.
    This rule governs de-identified or aggregated derivatives of Customer Data''s own content
    (patient, scheduling or clinical record content that Halcyon hosts for Customer). It is
    distinct from the intellectual_property usage_data rule, which governs telemetry and metadata
    about how the Services are used (login frequency, feature usage, system performance) rather
    than the content of Customer Data itself. A clause that aggregates or de-identifies the
    substance of patient or clinical records belongs to this rule even if it is labelled "usage
    data" or "analytics"; a clause limited to configuration or usage metrics belongs to the
    other rule. This rule''s PHI fallback (rung 1) governs de-identification that is not tied
    to the HIPAA regulatory standard, or a deal with no HIPAA overlay in scope. Where the
    agreement is also subject to a Business Associate Agreement under the HIPAA overlay, PHI
    that has been de-identified to the Safe Harbor or expert determination standard under
    45 C.F.R. § 164.514 is governed by that overlay''s data_protection.de_identification rule,
    which may permit cross-customer benchmarking of properly de-identified PHI that this rule''s
    PHI fallback would otherwise withhold; do not treat the two rules as requiring the same
    answer for the same clause.

    '
  source_ref: Halcyon Data Governance Policy DG-01
  authored_by: Privacy Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-02
  positions:
  - kind: preferred
    rung: 0
    label: Service purpose plus de-identified analytics carve-out
    zone: green
    summary: Use limited to providing the Services, with a narrow de-identified and aggregated
      analytics carve-out.
    language: 'Halcyon shall use Customer Data solely to provide the Services to Customer
      and for the purposes expressly described in the Documentation. Halcyon may also use
      Customer Data in de-identified and aggregated form, from which Customer and any individual
      cannot reasonably be identified, to operate, support, secure and improve the Services
      and Halcyon''s other products. Halcyon shall not sell Customer Data, shall not use Customer
      Data for advertising directed at Customer or its personnel, and shall not use Customer
      Data to train or improve any model made available to a party other than Customer.

      '
  - kind: fallback
    rung: 1
    label: Internal-only analytics, no cross-customer benchmarking
    zone: yellow
    approver_role: privacy_counsel
    conditions:
      data_sensitivity:
      - phi
      - special_category
    give_get: Offer a faster security-review turnaround in return.
    summary: Narrow the de-identified analytics use to Halcyon's own product improvement,
      excluding benchmarking shared across customers.
    language: 'Halcyon shall use Customer Data solely to provide the Services to Customer.
      Halcyon may also use Customer Data in de-identified and aggregated form solely to maintain,
      secure and improve the Services Halcyon provides to Customer, and shall not use such
      de-identified data to produce benchmarking, comparative reporting or other output that
      is shared with or made available to any other customer. Halcyon shall not sell Customer
      Data, use it for advertising, or use it to train or improve any model made available
      to a party other than Customer.

      '
  - kind: fallback
    rung: 2
    label: Service purpose only, no analytics carve-out
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a longer initial term to offset the lost cost-sharing benefit of shared
      analytics.
    summary: Drop the de-identified analytics carve-out entirely; use is limited to providing
      the Services to this Customer.
    language: 'Halcyon shall use Customer Data solely to provide the Services to Customer
      and for no other purpose, including no use, in any form, to operate, support or improve
      products or services provided to any other customer. Halcyon shall not sell Customer
      Data, use it for advertising, or use it to train or improve any model.

      '
  - kind: acceptable_variant
    label: Processor-style purpose limitation
    zone: green
    summary: Counterparty wording limiting use to providing the Services, allowing the same
      de-identified carve-out.
    language: 'Vendor shall process Customer Data solely to provide the Services described
      in the applicable Order Form and the Documentation, and for no other purpose, except
      that Vendor may use Customer Data in de-identified and aggregated form, from which Customer
      cannot be identified, to maintain and improve the Services generally.

      '
  red_lines:
  - key: data-use-shared-across-tenants-identifiable
    description: Customer Data, in identifiable form, is used for or disclosed to Halcyon's
      other customers or the public.
    condition_type: semantic
    condition:
      test: 'The clause permits Halcyon to use or disclose Customer Data, in a form from which
        Customer or an individual can reasonably be identified, for the benefit of or visible
        to any party other than Customer, including Halcyon''s other customers, or to make
        it publicly available.

        '
    action: block
    rationale: 'Cross-tenant exposure of identifiable Customer Data would be a reportable
      incident under Halcyon''s own breach programme and would breach the confidentiality
      commitments Halcyon gives every other customer on the same multi-tenant platform.

      '
  objections:
  - objection: You cannot use our data for your own analytics at all, de-identified or not.
    their_rationale: Hospital systems want a bright line against any secondary use of information
      collected from patients.
    response: 'We can narrow the carve-out to Halcyon''s own product improvement only, with
      no cross-customer benchmarking or shared reporting built from your de-identified data.
      That removes the use you are concerned about while still letting us maintain and secure
      the platform you depend on.

      '
    talking_points:
    - De-identified, aggregated data cannot be traced back to Customer or any patient.
    - Offer to drop benchmarking first before dropping internal analytics entirely.
    recommended_position:
      rule_key: data_protection.customer_data_use
      rung: 1
    frequency: common
    counterparty_profile: Hospital systems and tier 1 health systems
  - objection: Your form contract gives Halcyon a licence to "host, copy, transmit and display"
      our data; that sounds broader than running the Services.
    their_rationale: Broad licence language reads as open-ended even when the business intent
      is narrower.
    response: 'That licence is the technical right we need to operate the Services, such as
      storing and displaying your data back to your users; it is not a separate right to use
      your data for other purposes. We can add an express statement that the licence is limited
      to providing the Services and the stated analytics carve-out.

      '
    talking_points:
    - Offer to add a sentence that the hosting licence is "solely to provide the Services".
    - Point to the separate, narrower sentence restricting sale, advertising and model training.
    frequency: occasional
  dependencies:
  - related_rule_key: intellectual_property.usage_data
    relation: read_with
    note: Usage and telemetry data generated by Halcyon's own systems is addressed separately
      and is not Customer Data.
  - related_rule_key: limitation_of_liability.data_breach_super_cap
    relation: trade_against
    note: A narrower use restriction supports holding the data breach cap at its preferred
      level.
  test_cases:
  - name: Service purpose with de-identified analytics carve-out
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will use Customer Data only to provide the Services under the applicable
      Order Form, and may also use Customer Data in a de-identified, aggregated form that
      does not identify Customer or any person to maintain and improve the Services. Halcyon
      will not sell Customer Data or use it for advertising.

      '
  - name: Processor-style purpose limitation
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor shall process Customer Data solely to deliver the Services ordered
      by Customer, except that de-identified and aggregated Customer Data that does not identify
      Customer may be used by Vendor to improve the Services generally.

      '
  - name: Internal-only analytics for PHI
    context:
      data_sensitivity: phi
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Halcyon will use Customer Data to provide the Services, and may use de-identified,
      aggregated data only to maintain and secure the Services it provides to Customer, without
      producing any cross-customer benchmarking or comparison reports.

      '
  - name: Analytics use described only as "business purposes"
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon may use Customer Data as reasonably necessary for its business purposes,
      including improving its products and services.

      '
  - name: Identifiable data shared with other customers
    expected_outcome: red_line
    expected_red_line_key: data-use-shared-across-tenants-identifiable
    expected_zone: red
    sample_text: 'Halcyon may include Customer''s records, in identifiable form, in reports
      or benchmarking materials made available to Halcyon''s other customers.

      '
- rule_key: data_protection.data_return_and_deletion
  title: Return and deletion of Customer Data at termination
  required: true
  risk_weight: 7
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'On termination or expiry, Halcyon makes Customer Data available for export
    during the data retrieval window stated in the Effect of Termination provision, then destroys
    it from production systems within 60 days after that window ends, and lets backup copies
    holding it expire within the ordinary backup cycle, not to exceed 90 days after that window
    ends.

    '
  risk_rationale: 'Halcyon stores Customer Data for roughly 310 customers across AWS us-east-1,
    us-west-2 and eu-west-1, with backups as encrypted snapshots that expire on a fixed, shared
    cycle and cannot be purged customer by customer on demand. These periods give Customer
    a real export window and a bounded production deletion commitment while matching what
    a shared engineering process can reliably deliver without putting Halcyon in breach of
    its own deletion clause the day it is signed.

    '
  detection_guidance: 'Look for "return or delete", "make available for export", "after termination",
    "after the retrieval window", "securely delete or destroy", "backup copies" and "certification
    of deletion". Record whether the production destruction and backup purge periods run from
    the termination date or from the end of the data retrieval window stated in the Effect
    of Termination provision; Halcyon''s own template runs them from the end of that window,
    in sequence, so the retrieval commitment and the deletion commitment never compete for
    the same days. Record the destruction period separately from the backup purge period.
    No return-or-deletion commitment at all, in an agreement under which Halcyon hosts Customer
    Data, is a missing clause.

    '
  source_ref: Halcyon Data Governance Policy DG-01
  authored_by: Privacy Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-05
  positions:
  - kind: preferred
    rung: 0
    label: 60-day production deletion, 90-day backup purge, both after the retrieval window
    zone: green
    summary: Export during the Effect of Termination retrieval window, destruction in production
      within 60 days after that window ends, backups purged in the ordinary cycle within 90
      days after that window ends.
    language: 'Upon termination or expiry of this Agreement, Halcyon shall make the Customer
      Data then held in the Services available to Customer for export in the format described
      in the Documentation during the data retrieval window stated in the Effect of Termination
      provision of this Agreement. Halcyon shall thereafter delete all Customer Data from
      its production systems within sixty (60) days after the end of that retrieval window,
      and Customer Data held in backup media shall be overwritten or destroyed in the ordinary
      course within ninety (90) days after the end of that retrieval window.

      '
  - kind: fallback
    rung: 1
    label: 45-day production deletion with certificate
    zone: green
    summary: Faster deletion from production after the retrieval window ends, plus written
      confirmation delivered without a separate request.
    give_get: Offer a longer notice period for the export request in return for the faster
      commitment.
    language: 'Upon termination or expiry of this Agreement, Halcyon shall make the Customer
      Data then held in the Services available to Customer for export during the data retrieval
      window stated in the Effect of Termination provision of this Agreement. Halcyon shall
      delete all Customer Data from its production systems within forty-five (45) days after
      the end of that retrieval window, and Customer Data held in backup media shall be overwritten
      or destroyed in the ordinary course within ninety (90) days after the end of that retrieval
      window. Within ten (10) business days after production deletion is complete, Halcyon
      shall provide Customer with written confirmation that deletion has occurred.

      '
  - kind: fallback
    rung: 2
    label: 30-day production deletion, 60-day backup purge, both after the retrieval window
    zone: yellow
    approver_role: security_lead
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Customer must complete its export before the retrieval window ends and accept
      that the shortened backup cycle is a per-tenant operational change.
    summary: The shortest schedule Halcyon's backup cycle can support, both periods still
      counted from the end of the retrieval window.
    language: 'Upon termination or expiry of this Agreement, Halcyon shall make the Customer
      Data then held in the Services available to Customer for export during the data retrieval
      window stated in the Effect of Termination provision of this Agreement, and shall, within
      thirty (30) days after the end of that retrieval window, delete all Customer Data from
      its production systems. Customer Data held in backup media shall be overwritten or destroyed
      within sixty (60) days after the end of that retrieval window. Halcyon shall provide
      written confirmation once production deletion is complete.

      '
    internal_note: 'Security must confirm the customer''s tenant can be moved to the shortened
      snapshot schedule before this rung is offered.

      '
  - kind: acceptable_variant
    label: Return-or-destroy at Customer's election
    zone: green
    summary: Counterparty wording giving Customer the election, on periods no shorter than
      Halcyon's, sequenced after the retrieval window.
    language: 'At termination of this Agreement, Halcyon shall, at Customer''s election notified
      before the end of the data retrieval window stated in the Effect of Termination provision,
      return to Customer or destroy all Customer Data that Halcyon then holds, and shall complete
      that return or destruction within sixty (60) days after the end of that retrieval window,
      except that copies on backup media may persist for up to ninety (90) days after the
      end of that retrieval window pending the ordinary overwrite cycle.

      '
  parameters:
  - key: data_destruction_days
    label: Days after the end of the data retrieval window to delete Customer Data from production
      systems
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 60
    green_limit: 45
    yellow_limit: 30
    extraction_hint: 'Calendar days after the end of the data retrieval window stated in the
      Effect of Termination provision by which Customer Data in live systems must be deleted.
      If the clause instead counts this period from the termination date rather than from
      the end of that retrieval window, read the number as stated and flag the drafting gap,
      since Halcyon''s own template runs the two periods in sequence so they never compete
      for the same days. "Immediately" or "promptly" with no stated number counts as 0. Backup
      media is tracked separately and is not part of this value even when the clause states
      one combined date for "all copies".

      '
  - key: data_backup_purge_days
    label: Days after the end of the data retrieval window for backups containing Customer
      Data to be overwritten
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 90
    green_limit: 90
    yellow_limit: 60
    extraction_hint: 'Calendar days after the end of the data retrieval window by which backup
      or archive copies must be overwritten or destroyed. If the clause requires all copies
      "in any form" to be destroyed by one date and makes no separate provision for backups,
      use that same date for this value too.

      '
  red_lines:
  - key: data-return-no-feasibility-limit
    description: Every copy of Customer Data, including backups, must be destroyed by a single
      blanket date with no allowance for the ordinary backup cycle or for data Halcyon must
      retain by law.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to destroy all Customer Data in every form, including
        backup and archive copies, by a single fixed date with no separate allowance for the
        ordinary backup overwrite cycle, and with no exception for copies Halcyon must retain
        to comply with law.

        '
    action: block
    rationale: 'Backups are encrypted snapshots that expire on a shared, fixed cycle that
      cannot be edited customer by customer; a single blanket destruction date with no cycle
      allowance and no legal retention exception cannot be performed and would put Halcyon
      in breach of its own deletion clause on the day it is signed.

      '
  objections:
  - objection: We need every copy of our data gone the day the contract ends.
    their_rationale: Data held by a former vendor is risk with no remaining benefit to the
      customer.
    response: 'We agree that retained data is risk for both of us and delete on a fixed schedule
      for that reason. Deletion is a verified engineering process, and you will want time
      to complete your own export first. We can shorten production deletion to forty-five
      days and send a written confirmation once it is done.

      '
    talking_points:
    - Customer Data stays encrypted and access-restricted until deleted.
    - Backups are encrypted snapshots on a fixed cycle that cannot be edited per customer.
    recommended_position:
      rule_key: data_protection.data_return_and_deletion
      rung: 1
    frequency: common
    counterparty_profile: Hospital systems and tier 1 health systems
  - objection: Ninety days for backups is too long; our vendor policy caps retention after
      exit at 60 days.
    their_rationale: The customer's vendor-management policy sets a maximum retention period
      after a vendor relationship ends.
    response: 'Our standard snapshot cycle produces the ninety-day figure. With our security
      lead''s agreement we can move your tenant to a shorter cycle so backups are gone within
      sixty days and production data within thirty, provided you complete your export within
      that same thirty-day window.

      '
    talking_points:
    - The shorter cycle is a per-tenant operational change that needs security approval.
    - Ask whether the policy distinguishes SaaS platforms from on-premises software.
    recommended_position:
      rule_key: data_protection.data_return_and_deletion
      rung: 2
    frequency: occasional
    counterparty_profile: Tier 1 health systems with vendor-exit policies
  dependencies:
  - related_rule_key: termination.effect_of_termination
    relation: requires
    note: 'This rule is the second of two sequential stages: the effect-of-termination clause
      fixes the data retrieval window first, and this rule''s production destruction and backup
      purge periods run from the end of that window, not from the termination date. Whatever
      retrieval window is agreed under that rule (30, 60 or 90 days), destruction and backup
      purge always follow it, so the two clauses can never commit to deleting data before
      the agreed retrieval window has closed.

      '
  test_cases:
  - name: Export during the retrieval window, 60-day production deletion, 90-day backups
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'When this Agreement ends, Customer may export its data during the data retrieval
      window described in the Effect of Termination section. Halcyon will delete Customer
      Data from its live systems within sixty days after that retrieval window ends, and backup
      copies will be overwritten in the usual cycle within ninety days after that retrieval
      window ends.

      '
  - name: Election to return or destroy, same periods
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Following the close of the data retrieval window stated in the Effect of
      Termination section, and as Customer elects before that window closes, Halcyon shall
      return or destroy all Customer Data it then holds, completing the task within 60 days
      after that window closes; backup media may retain copies for up to 90 days after that
      window closes pending routine overwriting.

      '
  - name: 30-day deletion, 60-day backups after the retrieval window, enterprise deal
    context:
      deal_value_band: enterprise
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Halcyon shall delete all Customer Data from its production environment within
      thirty days after the end of the data retrieval window and from backup media within
      sixty days after the end of that window, and shall confirm in writing once deletion
      is complete.

      '
  - name: Production deletion measured from termination instead of from the end of the retrieval
      window
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon will delete Customer Data from its production systems within forty
      (40) days after termination, regardless of whether Customer has completed its export
      during the retrieval window.

      '
  - name: Blanket destruction of all copies, no cycle or legal allowance
    expected_outcome: red_line
    expected_red_line_key: data-return-no-feasibility-limit
    expected_zone: red
    sample_text: 'Within five days of termination Halcyon shall destroy all Customer Data
      in its possession in every form, including any backup or archival copies, with no exception
      of any kind.

      '
- rule_key: security.security_program
  title: Written information security programme
  required: true
  risk_weight: 6
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon maintains a written information security programme with administrative,
    technical and physical safeguards consistent with industry standards, and will not materially
    decrease the overall security of the Services during the Subscription Term.

    '
  risk_rationale: 'Halcyon''s SOC 2 Type II, ISO 27001 and HITRUST r2 programmes already define
    the safeguards that protect all 310 customers on a shared, multi-tenant platform; replacing
    them, customer by customer, with a bespoke security exhibit is not something a team of
    this size can run and audit for every $165k median contract. A single named programme,
    fixed against the standard it follows, keeps the commitment enforceable without fragmenting
    Halcyon''s actual security operations.

    '
  detection_guidance: 'Look for "written information security program", "administrative, technical
    and physical safeguards", "industry standard", "Security Exhibit" and "shall not materially
    decrease the overall security". Absence of any security commitment, in an agreement under
    which data is hosted, is a missing clause.

    '
  source_ref: Halcyon Information Security Policy ISP-02
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-02
  positions:
  - kind: preferred
    rung: 0
    label: Named programme, industry-standard comparator
    zone: green
    summary: Halcyon's own written programme, consistent with industry standards, with a no-material-decrease
      commitment.
    language: 'Halcyon shall maintain a written information security program that includes
      administrative, technical and physical safeguards designed to protect the confidentiality,
      integrity and availability of Customer Data, consistent with then-current industry standards
      for a multi-tenant software provider. Halcyon shall not materially decrease the overall
      security of the Services during the Subscription Term.

      '
  - kind: fallback
    rung: 1
    label: Named framework alignment added
    zone: yellow
    approver_role: security_lead
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Ask that the framework reference track Halcyon's current certification rather
      than a framework Halcyon does not hold.
    summary: Add an express reference to a named framework Customer favours, alongside Halcyon's
      own programme.
    language: 'Halcyon shall maintain a written information security program, consistent with
      the safeguard categories described in the National Institute of Standards and Technology
      Cybersecurity Framework or an equivalent successor framework, that includes administrative,
      technical and physical safeguards designed to protect the confidentiality, integrity
      and availability of Customer Data. Halcyon shall not materially decrease the overall
      security of the Services during the Subscription Term.

      '
  - kind: fallback
    rung: 2
    label: Security questionnaire incorporated as a representation
    zone: yellow
    approver_role: security_lead
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask that Customer accept Halcyon's SOC 2 Type II report as satisfying any audit
      right in place of further questionnaires.
    summary: Incorporate Halcyon's completed security questionnaire responses as a fixed representation,
      not an ongoing obligation to match future versions.
    language: 'Halcyon shall maintain a written information security program as described
      in its responses to Customer''s security questionnaire dated [date], which are incorporated
      into this Agreement as a representation of Halcyon''s safeguards as of that date, together
      with administrative, technical and physical safeguards consistent with then-current
      industry standards. Halcyon shall not materially decrease the overall security of the
      Services during the Subscription Term.

      '
    internal_note: 'Fix the questionnaire responses by date; never agree to track a questionnaire
      Customer can update unilaterally after signature.

      '
  - kind: acceptable_variant
    label: Customer-drafted industry-standard wording
    zone: green
    summary: Counterparty wording for the same outcome using a slightly different formulation.
    language: 'Vendor shall implement and maintain commercially reasonable administrative,
      technical and physical safeguards designed to protect Customer Data, no less protective
      than then-current industry standards, and shall not materially reduce those safeguards
      during the term of this Agreement.

      '
  red_lines:
  - key: security-program-bound-by-customer-policy
    description: Halcyon's security obligations are replaced by Customer's own security policy,
      as Customer may amend it from time to time without Halcyon's agreement.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to comply with Customer''s security policy, standard
        or exhibit as it may be amended, updated or replaced by Customer from time to time,
        without Halcyon''s prior written agreement to the change.

        '
    action: block
    rationale: 'A security obligation that floats with a document only the counterparty controls
      is not a commitment Halcyon can staff, budget or audit against, and effectively lets
      one customer dictate changes to the programme that protects every other tenant.

      '
  objections:
  - objection: You must follow our security exhibit, not describe your own programme in general
      terms.
    their_rationale: Large health systems standardize security requirements across their vendor
      base to simplify their own audits.
    response: 'We can reference a fixed version of your exhibit, dated at signature, alongside
      our own certified programme. We cannot agree to track a document that changes on your
      side without our review, since that would apply retroactively to a platform we run for
      every customer.

      '
    talking_points:
    - Offer the named-framework fallback before the fixed-questionnaire fallback.
    - SOC 2 Type II and ISO 27001 already cover the categories most exhibits require.
    recommended_position:
      rule_key: security.security_program
      rung: 1
    frequency: common
    counterparty_profile: Large hospital systems with a standard vendor security exhibit
  - objection: The phrase "industry standard" is too vague; name the framework you follow.
    their_rationale: A vague comparator is hard for the customer's own security team to evaluate
      or report against.
    response: 'We can add an express reference to a named framework such as the NIST Cybersecurity
      Framework alongside our own programme, so the comparator is concrete without displacing
      the certifications we already hold.

      '
    talking_points:
    - Point to the separate certifications rule for the specific attestations Halcyon holds.
    - A named framework reference does not commit Halcyon to a framework it is not certified
      against.
    recommended_position:
      rule_key: security.security_program
      rung: 1
    frequency: occasional
  dependencies:
  - related_rule_key: security.certifications
    relation: requires
    note: The security programme commitment depends on the certifications rule naming the
      attestations that evidence it.
  test_cases:
  - name: Written programme, industry-standard comparator
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon maintains a written security program with administrative, technical
      and physical safeguards consistent with prevailing industry standards for multi-tenant
      software, and will not materially decrease the Services'' overall security during the
      term.

      '
  - name: Commercially reasonable safeguards, customer wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor will maintain commercially reasonable administrative, technical and
      physical safeguards for Customer Data, no less protective than then-current industry
      standards, and will not materially reduce them during the term.

      '
  - name: NIST framework reference added, tier 1 counterparty
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: yellow
    sample_text: 'Vendor''s written security program shall be consistent with the safeguard
      categories of the NIST Cybersecurity Framework, covering administrative, technical and
      physical safeguards for Customer Data.

      '
  - name: Safeguards described only as "appropriate"
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Vendor shall maintain appropriate safeguards for Customer Data as Vendor
      determines from time to time.

      '
  - name: Security governed by Customer's policy as amended
    expected_outcome: red_line
    expected_red_line_key: security-program-bound-by-customer-policy
    expected_zone: red
    sample_text: 'Vendor shall at all times comply with Customer''s information security policy,
      including any future updates Customer makes to that policy.

      '
  - name: Trap - negated "no safeguards" wording
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Vendor shall not leave Customer Data unprotected; Vendor will maintain a
      written security program with administrative, technical and physical safeguards consistent
      with industry standards, and will not materially decrease that security during the term.

      '
- rule_key: security.certifications
  title: Independent security certifications
  required: true
  risk_weight: 5
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon maintains SOC 2 Type II, ISO 27001 and HITRUST r2 throughout
    the Subscription Term and provides the current report, or a bridge letter if a report
    has lapsed, within ten days of a written request.

    '
  risk_rationale: 'Halcyon already holds SOC 2 Type II, ISO 27001 and HITRUST r2, so committing
    to maintain them costs nothing beyond what the compliance programme already does. Turning
    reports around quickly on request gives customers the assurance they are actually relying
    on when they accept Halcyon''s security programme in place of their own audit of a platform
    serving 310 other customers.

    '
  detection_guidance: 'Look for "SOC 2 Type II", "ISO/IEC 27001", "HITRUST", "maintain throughout
    the Term", "provide a copy of the most recent report upon request", "bridge letter" and
    "or successor standard". Absence means there is no contractual commitment to keep the
    certifications the customer relied on when it signed.

    '
  source_ref: Halcyon Information Security Policy ISP-02
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-02
  positions:
  - kind: preferred
    rung: 0
    label: Named certifications, 10-day report delivery
    zone: green
    summary: Maintain the three named certifications and deliver the current report or a bridge
      letter within 10 days of request.
    language: 'Halcyon shall maintain SOC 2 Type II, ISO/IEC 27001 and HITRUST r2 certification
      (or a successor standard providing substantially equivalent assurance) throughout the
      Subscription Term. Upon Customer''s written request, and subject to the confidentiality
      of the report, Halcyon shall provide Customer with a copy of its then- current report
      for each such certification, or a bridge letter if the then-current report has lapsed,
      within ten (10) days of the request.

      '
  - kind: fallback
    rung: 1
    label: 15-day report delivery
    zone: green
    summary: Same certifications and content, a slightly longer delivery window.
    language: 'Halcyon shall maintain SOC 2 Type II, ISO/IEC 27001 and HITRUST r2 certification
      (or a successor standard providing substantially equivalent assurance) throughout the
      Subscription Term. Upon Customer''s written request, Halcyon shall provide Customer
      with a copy of its then-current report for each such certification, or a bridge letter
      if the then-current report has lapsed, within fifteen (15) days of the request.

      '
  - kind: fallback
    rung: 2
    label: 30-day report delivery
    zone: yellow
    approver_role: security_lead
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Ask Customer to accept these reports as satisfying its audit right in place
      of a separate on-site audit.
    summary: Extend the delivery window to 30 days to match slower internal report-release
      cycles.
    language: 'Halcyon shall maintain SOC 2 Type II, ISO/IEC 27001 and HITRUST r2 certification
      (or a successor standard providing substantially equivalent assurance) throughout the
      Subscription Term. Upon Customer''s written request, Halcyon shall provide Customer
      with a copy of its then-current report for each such certification, or a bridge letter
      if the then-current report has lapsed, within thirty (30) days of the request.

      '
  - kind: acceptable_variant
    label: Customer-drafted "current report on request" wording
    zone: green
    summary: Counterparty wording for the same outcome, naming the same certifications.
    language: 'Vendor shall maintain SOC 2 Type II, ISO 27001 and HITRUST r2 certifications,
      or successor standards giving substantially equivalent assurance, during the term of
      this Agreement, and will provide Customer with its most recent report for each upon
      reasonable written request, within seven (7) business days.

      '
  parameters:
  - key: certification_report_delivery_days
    label: Days to deliver the current report or a bridge letter after a written request
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 10
    green_limit: 15
    yellow_limit: 30
    extraction_hint: 'Calendar days from Customer''s written request to delivery of the report
      or bridge letter. If the clause states business days, convert using a five-day week.
      If no number is stated but delivery "on request" is promised, leave this parameter absent
      rather than assuming a value.

      '
  red_lines:
  - key: certification-reports-may-be-disclosed-publicly
    description: Halcyon's certification reports may be shared publicly, with Halcyon's competitors,
      or with any third party outside Customer's own advisors, without restriction.
    condition_type: semantic
    condition:
      test: 'The clause permits Customer to publish, post publicly, or share with any third
        party other than Customer''s own auditors, regulators or professional advisors, the
        substance of Halcyon''s SOC 2, ISO 27001 or HITRUST report.

        '
    action: block
    rationale: 'These reports contain details of Halcyon''s security controls across every
      customer on the platform; public or third-party disclosure beyond Customer''s own advisors
      would itself create the kind of security exposure the certifications are meant to guard
      against.

      '
  objections:
  - objection: Ten days is too slow; we need the report before we can even begin our own security
      review.
    their_rationale: Procurement timelines are often set before the vendor security review
      starts, so delay here delays everything else.
    response: 'We can commit to fifteen days as our standard delivery window, and in practice
      we turn most requests around faster once the request is confirmed in writing. If timing
      is critical for a specific deal, tell us early and we will try to get the report to
      you ahead of the committed date.

      '
    talking_points:
    - The committed window is a ceiling, not a target; most requests are faster.
    - Offer the 15-day fallback before any further concession.
    recommended_position:
      rule_key: security.certifications
      rung: 1
    frequency: occasional
  - objection: Your reports should satisfy our audit right entirely; we should not need a
      separate audit at all for a SOC 2-certified vendor.
    their_rationale: A hospital system with its own audit resource constraints prefers to
      rely on independent attestations where it reasonably can.
    response: 'That is exactly how we intend the reports to be used. We can agree that our
      current SOC 2 Type II report satisfies your audit right in the first instance, with
      a further audit right reserved only if the report shows a material deficiency.

      '
    talking_points:
    - Point to the audit rights rule for how the report interacts with on-site audit requests.
    - This is a trade worth making before conceding on report delivery time.
    recommended_position:
      rule_key: audit.customer_audit_rights
      rung: 0
    frequency: common
    counterparty_profile: Tier 1 health systems
  dependencies:
  - related_rule_key: audit.customer_audit_rights
    relation: trade_against
    note: Offer the certification reports as satisfying the audit right before agreeing to
      on-site access.
  test_cases:
  - name: Three certifications, 10-day delivery
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will keep its SOC 2 Type II, ISO 27001 and HITRUST r2 certifications
      in force throughout the term, and will give Customer its current report, or a bridge
      letter if one has lapsed, within ten days of a written request.

      '
  - name: Customer-drafted "most recent report" wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor shall hold SOC 2 Type II, ISO 27001 and HITRUST r2 (or equivalent
      successor certifications) during the term and will share its most recent report for
      each upon reasonable written request within seven business days.

      '
  - name: 15-day delivery window
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Halcyon will maintain SOC 2 Type II, ISO 27001 and HITRUST r2 certification
      and will provide its current report for each, or a bridge letter, within fifteen days
      of Customer''s written request.

      '
  - name: Delivery "within a reasonable time" with no number
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon will maintain its certifications and will share the current report
      with Customer within a reasonable time after a written request.

      '
  - name: Reports may be published or shared with any third party
    expected_outcome: red_line
    expected_red_line_key: certification-reports-may-be-disclosed-publicly
    expected_zone: red
    sample_text: 'Customer may publish, post, or otherwise share Halcyon''s SOC 2, ISO 27001
      and HITRUST reports with any third party, including on Customer''s public website.

      '
- rule_key: breach_notification.notification_timeline
  title: Security incident notification timeline
  required: true
  risk_weight: 9
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon notifies Customer without undue delay, and in no event later
    than 72 hours, after confirming a security incident affecting Customer Data, with notice
    triggered by confirmation rather than mere suspicion.

    '
  risk_rationale: 'Halcyon''s $10M cyber and technology errors and omissions aggregate and
    its SOC 2 Type II incident-response programme both assume a confirmed trigger: premature
    notice based on unconfirmed suspicion generates false alarms across 310 customers and
    undermines the credibility of notices that turn out to be genuine. Seventy-two hours after
    confirmation gives Halcyon''s team enough time to establish scope while still meeting
    the fastest timelines customers reasonably expect from a healthcare-adjacent vendor.

    '
  detection_guidance: 'Look for "without undue delay", "within seventy-two hours", "within
    twenty-four hours", "upon confirming", "suspected or actual" and "confirmed". Record both
    the stated number of hours and whether notice is triggered by confirmation or by mere
    suspicion. Absence of any incident notification commitment, in an agreement under which
    Halcyon hosts Customer Data, is a missing clause.

    '
  source_ref: Halcyon Incident Response Policy IR-01
  authored_by: Privacy Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-05
  positions:
  - kind: preferred
    rung: 0
    label: 72 hours after confirmation
    zone: green
    summary: Notice without undue delay, and in no event later than 72 hours after Halcyon
      confirms a security incident.
    language: 'Halcyon shall notify Customer without undue delay, and in no event later than
      seventy-two (72) hours, after Halcyon confirms a security incident that has resulted
      in the unauthorized access to or acquisition of Customer Data (a "Security Incident").
      Notice under this section is triggered by Halcyon''s confirmation of a Security Incident,
      not by an unconfirmed report or suspicion.

      '
  - kind: fallback
    rung: 1
    label: 48 hours after confirmation
    zone: green
    summary: Shorten the outer limit to 48 hours, trigger unchanged.
    give_get: Ask for the single point of contact and notice method to be fixed in the Order
      Form.
    language: 'Halcyon shall notify Customer without undue delay, and in no event later than
      forty-eight (48) hours, after Halcyon confirms a Security Incident. Notice under this
      section is triggered by Halcyon''s confirmation of a Security Incident, not by an unconfirmed
      report or suspicion.

      '
  - kind: fallback
    rung: 2
    label: 24 hours after confirmation
    zone: yellow
    approver_role: security_lead
    conditions:
      data_sensitivity:
      - phi
      - special_category
      counterparty_tier:
      - tier_1
    give_get: Ask for a longer cure period elsewhere in the agreement to offset the compressed
      internal response window.
    summary: Shorten the outer limit to 24 hours for the most sensitive accounts.
    language: 'Halcyon shall notify Customer without undue delay, and in no event later than
      twenty-four (24) hours, after Halcyon confirms a Security Incident. Notice under this
      section is triggered by Halcyon''s confirmation of a Security Incident, not by an unconfirmed
      report or suspicion.

      '
    internal_note: Consult privacy_counsel before offering this rung; it compresses the forensic
      triage window significantly.
  - kind: acceptable_variant
    label: Customer-drafted "promptly, in no event later than" wording
    zone: green
    summary: Counterparty wording for the same outcome and trigger.
    language: 'Vendor shall notify Customer promptly, and in no event later than seventy-two
      (72) hours, after Vendor confirms a security incident affecting Customer Data, with
      notice triggered by Vendor''s confirmation of the incident.

      '
  parameters:
  - key: notification_hours
    label: Outer limit, in hours, to notify Customer after the trigger
    value_type: number
    unit: hours
    direction: higher_is_better
    preferred_value: 72
    green_limit: 48
    yellow_limit: 24
    extraction_hint: 'Convert any stated day period to hours (one day equals 24 hours). "Without
      undue delay" with no outer number is treated as the stated number in the same sentence
      if one exists; if no number exists at all, leave this parameter absent and flag as a
      deviation.

      '
  - key: notification_trigger
    label: Event that starts the notification clock
    value_type: enum
    direction: exact
    allowed_values:
    - confirmed
    - reasonably_believed
    - suspected
    preferred_value: confirmed
    green_limit:
    - confirmed
    yellow_limit:
    - reasonably_believed
    extraction_hint: '"Confirmed", "verified" or "determined" maps to confirmed. "Reasonably
      believes" or "has reason to believe" maps to reasonably_believed. "Suspects", "becomes
      aware of a possible" or "potential" maps to suspected.

      '
  red_lines:
  - key: data-breach-notice-under-24h-or-on-suspicion
    description: Notice is required in under 24 hours, or is triggered by mere suspicion rather
      than confirmation or a reasonable belief.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to notify Customer of a security incident in fewer
        than twenty-four hours, or triggers the notification obligation on mere suspicion
        of an incident rather than on confirmation or a reasonable belief that one has occurred.

        '
    action: block
    rationale: 'A window under 24 hours, or a trigger on unconfirmed suspicion, does not allow
      even an initial forensic assessment and would generate repeated false-positive notices
      across Halcyon''s customer base, eroding trust in notices that matter.

      '
  objections:
  - objection: Seventy-two hours is too slow; we need to know the moment you suspect something
      is wrong.
    their_rationale: Hospital systems have their own regulatory notice clocks that they want
      to start as early as possible.
    response: 'We can commit to forty-eight hours instead of seventy-two, measured from the
      same confirmation trigger, which gives you more time inside your own notice clock without
      forcing us to report on unconfirmed suspicions that often turn out to be nothing.

      '
    talking_points:
    - A suspicion-based trigger produces false alarms that are costly to chase down and to
      walk back.
    - Offer 48 hours before offering 24 hours.
    recommended_position:
      rule_key: breach_notification.notification_timeline
      rung: 1
    frequency: common
    counterparty_profile: Hospital systems and tier 1 health systems
  - objection: Our cyber insurer requires notice to us within 24 hours of any suspected incident
      involving our data.
    their_rationale: Some customers' own insurance policies impose notice obligations on them
      that they then pass through to vendors.
    response: 'For accounts handling the most sensitive data we can move to a twenty-four
      hour outer limit, still triggered by our confirmation of an incident rather than by
      suspicion, with our security lead''s sign-off given the compressed internal timeline
      that requires.

      '
    talking_points:
    - Ask for the specific insurer requirement in writing to confirm the trigger it actually
      requires.
    - The trigger (confirmation vs. suspicion) matters as much as the hours.
    recommended_position:
      rule_key: breach_notification.notification_timeline
      rung: 2
    frequency: occasional
    counterparty_profile: Tier 1 health systems with cyber insurance pass-through requirements
  dependencies:
  - related_rule_key: limitation_of_liability.data_breach_super_cap
    relation: read_with
    note: The notification trigger and the data breach super-cap both turn on the same defined
      Security Incident; keep the definitions aligned.
  test_cases:
  - name: 72 hours after confirmation
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will tell Customer about a security incident without undue delay
      and no later than 72 hours after Halcyon has confirmed it, measured from the point of
      confirmation rather than any earlier suspicion.

      '
  - name: Customer-drafted "promptly" wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor will promptly notify Customer of a confirmed security incident affecting
      Customer Data, in no event later than seventy-two hours after Vendor''s confirmation.

      '
  - name: 24 hours after confirmation, PHI and tier 1
    context:
      data_sensitivity: phi
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Halcyon shall notify Customer within twenty-four hours after Halcyon confirms
      a security incident affecting Customer Data.

      '
  - name: Notice within 36 hours
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon shall notify Customer of a confirmed security incident within thirty-six
      hours after confirmation.

      '
  - name: Notice triggered by suspicion
    expected_outcome: red_line
    expected_red_line_key: data-breach-notice-under-24h-or-on-suspicion
    expected_zone: red
    sample_text: 'Halcyon shall notify Customer within twenty-four hours after it first suspects
      that a security incident may have occurred.

      '
- rule_key: subprocessors.subprocessor_changes
  title: Notice and objection rights for new subprocessors
  required: true
  risk_weight: 6
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon gives Customer 30 days'' advance notice before a new subprocessor
    begins handling Customer Data, with a right to object on reasonable grounds and a termination
    remedy if the objection cannot be resolved in good faith.

    '
  risk_rationale: 'Halcyon''s Services depend on a small set of cloud, messaging and analytics
    subprocessors that support all 310 customers. A general authorisation with advance notice
    and an objection right lets Halcyon update that shared list on one schedule instead of
    seeking per-customer consent for every change, while still giving each customer a real
    say before a new vendor touches its data.

    '
  detection_guidance: 'Look for "notify Customer at least thirty days before", "updating the
    list of subprocessors", "object on reasonable grounds", "work in good faith to resolve"
    and "terminate the affected Services". Record the number of days'' notice and whether
    objection requires prior consent for each subprocessor or only notice-and-object. Absence,
    in an agreement under which a subprocessor may handle Customer Data, is a missing clause.

    '
  source_ref: Halcyon Data Governance Policy DG-01
  authored_by: Privacy Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-05
  positions:
  - kind: preferred
    rung: 0
    label: General authorisation, 30 days' notice, right to object
    zone: green
    summary: Halcyon maintains a current subprocessor list and gives 30 days' notice before
      a new one begins processing, with an objection and good-faith resolution right.
    language: 'Halcyon may engage subprocessors to assist in providing the Services (each,
      a "Subprocessor"). Halcyon shall maintain a current list of its Subprocessors and shall
      notify Customer at least thirty (30) days before a new Subprocessor begins processing
      Customer Data. Customer may object to a new Subprocessor on reasonable grounds relating
      to data protection within fifteen (15) days of notice, in which case the parties shall
      work in good faith to resolve the objection, failing which Customer may terminate the
      affected Services for a pro-rata refund of prepaid Fees.

      '
  - kind: fallback
    rung: 1
    label: 45 days' notice
    zone: yellow
    approver_role: privacy_counsel
    give_get: Ask for a faster resolution commitment on any objection in return for the longer
      lead time.
    summary: Longer notice period, same mechanics.
    language: 'Halcyon may engage Subprocessors to assist in providing the Services. Halcyon
      shall maintain a current list of its Subprocessors and shall notify Customer at least
      forty-five (45) days before a new Subprocessor begins processing Customer Data. Customer
      may object on reasonable grounds relating to data protection within fifteen (15) days
      of notice, in which case the parties shall work in good faith to resolve the objection,
      failing which Customer may terminate the affected Services for a pro-rata refund of
      prepaid Fees.

      '
  - kind: fallback
    rung: 2
    label: 60 days' notice
    zone: yellow
    approver_role: privacy_counsel
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a longer initial term or renewal commitment in return for the extended
      notice period.
    summary: Extend notice to 60 days for strategic accounts with longer internal review cycles.
    language: 'Halcyon may engage Subprocessors to assist in providing the Services. Halcyon
      shall maintain a current list of its Subprocessors and shall notify Customer at least
      sixty (60) days before a new Subprocessor begins processing Customer Data. Customer
      may object on reasonable grounds relating to data protection within fifteen (15) days
      of notice, in which case the parties shall work in good faith to resolve the objection,
      failing which Customer may terminate the affected Services for a pro-rata refund of
      prepaid Fees.

      '
  - kind: acceptable_variant
    label: Customer-drafted "updated list" wording
    zone: green
    summary: Counterparty wording for the same outcome and notice period.
    language: 'Vendor shall keep an up-to-date list of its subprocessors available to Customer
      and shall give Customer at least thirty (30) days'' notice before a new subprocessor
      is authorized to process Customer Data. Customer may object on reasonable data-protection
      grounds within fifteen (15) days of that notice, and the parties will then work in good
      faith to resolve the objection.

      '
  parameters:
  - key: subprocessor_notice_days
    label: Days' advance notice before a new subprocessor begins processing
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 30
    green_limit: 30
    yellow_limit: 60
    extraction_hint: 'Calendar days between notice of a new subprocessor and when it may begin
      processing Customer Data. If notice is "concurrent with" the change (0 days) or the
      clause states no notice at all, record 0.

      '
  - key: subprocessor_objection_window_days
    label: Days Customer has to object after notice of a new subprocessor
    value_type: duration_days
    unit: days
    direction: lower_is_better
    preferred_value: 15
    green_limit: 15
    yellow_limit: 30
    extraction_hint: 'Calendar days from notice of a new subprocessor to the deadline for
      Customer to raise an objection. If the clause sets no deadline at all for objecting,
      leave this parameter absent rather than assuming a value; an unlimited window is a deviation,
      not a value for this parameter.

      '
  red_lines:
  - key: subprocessor-prior-consent-required
    description: A new subprocessor requires Customer's prior written consent, rather than
      notice and an objection right.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to obtain Customer''s prior written consent before
        engaging each new Subprocessor, rather than giving advance notice with a right to
        object.

        '
    action: block
    rationale: 'A consent-for-each-subprocessor model cannot run across a platform serving
      310 customers on a shared set of vendors; a single customer''s delay or refusal would
      block an infrastructure change for everyone else on the same tenancy.

      '
  objections:
  - objection: We must approve every subprocessor before it touches our data, not just be
      notified.
    their_rationale: Health systems want the final say over who handles patient data, not
      a right to object after the fact.
    response: 'We can give you more notice before a change takes effect so your review has
      real time to run, and if your objection raises a genuine data-protection concern we
      will work with you on it or let you terminate the affected Services for a refund. A
      consent requirement for each subprocessor is not something we can run across a shared
      platform.

      '
    talking_points:
    - Offer 45 days' notice before 60 days.
    - The termination-with-refund remedy gives a real exit, not just a complaint process.
    recommended_position:
      rule_key: subprocessors.subprocessor_changes
      rung: 1
    frequency: common
    counterparty_profile: Hospital systems and tier 1 health systems
  - objection: Thirty days is not enough time for our privacy office to review a new subprocessor.
    their_rationale: A privacy office with a backlog of vendor reviews cannot complete a review
      in a month.
    response: 'For larger accounts we can extend notice to sixty days with our privacy counsel''s
      sign-off, in exchange for a longer committed term so the extra lead time is worth building
      into our change process.

      '
    talking_points:
    - Longer notice is a real concession because it slows how quickly Halcyon can swap a vendor.
    - Ask whether the privacy office's review could run in parallel with the good-faith resolution
      period instead of before it.
    recommended_position:
      rule_key: subprocessors.subprocessor_changes
      rung: 2
    frequency: occasional
    counterparty_profile: Tier 1 health systems with a formal privacy review process
  dependencies:
  - related_rule_key: audit.customer_audit_rights
    relation: read_with
    note: Subprocessor changes and audit scope both touch Halcyon's vendor list; keep the
      two clauses from imposing conflicting review cycles.
  test_cases:
  - name: General authorisation, 30 days' notice
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon keeps a current list of the subprocessors it uses to provide the
      Services and will give Customer at least thirty days'' notice before a new one starts
      handling Customer Data. Customer may object on reasonable data-protection grounds, and
      the parties will work in good faith to resolve it.

      '
  - name: Customer-drafted "updated list" wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor will maintain an up-to-date subprocessor list available to Customer
      and will give at least 30 days'' notice before a new subprocessor is authorized to process
      Customer Data, with an opportunity for Customer to object on data-protection grounds.

      '
  - name: 60 days' notice, strategic deal
    context:
      deal_value_band: strategic
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Halcyon shall give Customer at least sixty days'' notice before any new
      subprocessor begins processing Customer Data, and will work in good faith to resolve
      any reasonable objection Customer raises.

      '
  - name: Notice described only as "reasonable advance notice"
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Halcyon will give Customer reasonable advance notice before a new subprocessor
      begins handling Customer Data.

      '
  - name: Prior written consent required for each subprocessor
    expected_outcome: red_line
    expected_red_line_key: subprocessor-prior-consent-required
    expected_zone: red
    sample_text: 'Halcyon shall obtain Customer''s prior written consent before engaging any
      new subprocessor to process Customer Data.

      '
  - name: Trap - negated "no notice" wording
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will not add a new subprocessor without notice; it will give Customer
      at least thirty days'' notice before a new subprocessor begins processing Customer Data,
      with a right to object on reasonable data-protection grounds.

      '
- rule_key: audit.customer_audit_rights
  title: Customer's right to audit Halcyon's compliance
  required: true
  risk_weight: 6
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Customer may verify Halcyon''s compliance once every 12 months, on 30
    days'' written notice, with Halcyon''s current SOC 2 Type II report satisfying the right
    in the first instance; an on-site audit at Customer''s cost is available on escalation
    if the report shows a material deficiency.

    '
  risk_rationale: 'Giving on-site access to production systems shared by around 310 customers
    risks exposing other customers'' data and operations to each auditor who visits, which
    is precisely what Halcyon''s SOC 2 Type II and ISO 27001 programmes are designed to avoid
    having to do repeatedly. Letting the independent report satisfy the right in the first
    instance, with on-site access reserved for a shown deficiency, protects every tenant on
    the platform while still giving Customer a real, enforceable audit right.

    '
  detection_guidance: 'Look for "audit", "inspect", "upon reasonable prior written notice",
    "no more than once in any twelve-month period", "SOC 2 Type II report" and "during normal
    business hours", as against "at any time" or "without notice". Record the notice period
    in days and whether the report satisfies the right or only supplements an on-site audit.
    Absence of any audit right at all, in a commercial agreement, means no audit right exists
    rather than a missing mandatory term.

    '
  source_ref: Halcyon Vendor and Audit Policy VA-01
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-05
  positions:
  - kind: preferred
    rung: 0
    label: Annual, 30 days' notice, SOC 2 report first
    zone: green
    summary: Report-based audit right once a year on 30 days' notice; on-site access only
      on a shown deficiency.
    language: 'No more than once in any twelve-month period, Customer may verify Halcyon''s
      compliance with its security obligations under this Agreement. Halcyon''s then-current
      SOC 2 Type II report shall satisfy this right in the first instance. If that report
      identifies a material deficiency directly relevant to the Services provided to Customer,
      Customer may, on at least thirty (30) days'' written notice and during Halcyon''s normal
      business hours, conduct or engage a reputable third party to conduct an on-site audit
      limited to that deficiency, at Customer''s cost, subject to a written confidentiality
      agreement.

      '
  - kind: fallback
    rung: 1
    label: Report plus written security questionnaire
    zone: green
    summary: Add a written questionnaire option alongside the report, same notice and frequency.
    language: 'No more than once in any twelve-month period, Customer may verify Halcyon''s
      compliance with its security obligations under this Agreement by reviewing Halcyon''s
      then-current SOC 2 Type II report and by submitting a written security questionnaire,
      which Halcyon shall answer within thirty (30) days. If the report and questionnaire
      together identify a material deficiency directly relevant to the Services provided to
      Customer, Customer may, on at least thirty (30) days'' written notice, conduct an on-site
      audit limited to that deficiency, at Customer''s cost.

      '
  - kind: fallback
    rung: 2
    label: On-site audit permitted, Customer's cost, 15 days' notice
    zone: yellow
    approver_role: security_lead
    conditions:
      counterparty_tier:
      - tier_1
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for a multi-year initial term or a higher deal_value_band commitment in
      return.
    summary: Permit a standalone on-site audit once a year, without requiring a shown deficiency
      first, at Customer's cost on shorter notice.
    language: 'No more than once in any twelve-month period, and on at least fifteen (15)
      days'' written notice, Customer may, at its own cost and during Halcyon''s normal business
      hours, conduct or engage a reputable third party to conduct an on-site audit of Halcyon''s
      compliance with its security obligations under this Agreement, limited to the systems
      and facilities used to provide the Services to Customer and subject to a written confidentiality
      agreement. This audit right is in addition to, and not conditioned on, review of Halcyon''s
      SOC 2 Type II report.

      '
    internal_note: 'Confirm with security_lead that the audit can be scheduled without disrupting
      other tenants before this rung is offered.

      '
  - kind: acceptable_variant
    label: Customer-drafted "no more than once every 12 months" wording
    zone: green
    summary: Counterparty wording for the same outcome and notice period.
    language: 'Customer may audit Vendor''s compliance with its security obligations no more
      than once every twelve (12) months, upon at least thirty (30) days'' prior written notice;
      Vendor''s then-current SOC 2 Type II report shall satisfy this right unless that report
      identifies a material deficiency.

      '
  - kind: fallback
    rung: 3
    label: Two on-site audits per year, tier-1 only
    zone: yellow
    approver_role: security_lead
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Ask Customer to fund, without reimbursement from Halcyon, any audit beyond the
      second in the same twelve-month period.
    summary: For a tier-1 relationship, Customer may conduct up to two on-site audits a year,
      each on the notice and cost terms already stated, rather than one.
    language: 'For a Customer in counterparty tier 1, Customer may conduct up to two (2) on-site
      audits under this Section in any twelve (12) month period, each on the fifteen (15)
      days'' written notice and cost terms stated above, rather than the one audit a year
      otherwise permitted.

      '
  parameters:
  - key: audit_notice_days
    label: Days' advance written notice required before an audit
    value_type: duration_days
    unit: days
    direction: higher_is_better
    preferred_value: 30
    green_limit: 30
    yellow_limit: 10
    extraction_hint: 'Calendar days between Customer''s written audit notice and the earliest
      date the audit may begin. "Reasonable notice" with no number is a deviation. Zero days
      or "at any time" maps to 0 and is a red-line indicator in combination with the semantic
      red lines on this rule.

      '
  - key: audit_frequency_per_year
    label: Number of audits Customer may conduct per 12-month period
    value_type: number
    unit: audits per year
    direction: lower_is_better
    preferred_value: 1
    green_limit: 1
    yellow_limit: 2
    extraction_hint: 'Count of audits (report review, questionnaire or on-site) Customer may
      initiate in any rolling 12-month period. "No more than once" maps to 1. A clause that
      states no limit on frequency at all is left absent here; that scenario is caught by
      the global-unannounced-audit red line instead of this parameter.

      '
  red_lines:
  - key: audit-scope-other-customers-or-unrelated
    description: Customer's audit right extends to other customers' data or systems, or to
      Halcyon commercial information unrelated to the Services provided to Customer.
    condition_type: semantic
    condition:
      test: 'The clause gives Customer audit or inspection rights reaching the data, systems
        or facilities of Halcyon''s other customers, or reaching Halcyon''s pricing, costs,
        personnel records or subcontractor agreements that are not directly relevant to the
        Services provided to Customer.

        '
    action: block
    rationale: 'An audit right that reaches other tenants'' data or Halcyon''s unrelated commercial
      information would breach the confidentiality Halcyon owes every other customer and exposes
      competitively sensitive information that has nothing to do with verifying the Services
      Customer actually receives.

      '
  objections:
  - objection: Your SOC 2 report is not enough; we need our own people inside your facility.
    their_rationale: Some procurement and compliance teams require a first-party or regulator-style
      audit regardless of third-party attestations.
    response: 'We can add a written questionnaire alongside the report as a first step, and
      if either one shows a genuine deficiency relevant to your Services, we will support
      a focused on-site audit at that point. We cannot open a shared production environment
      to a general audit with no finding behind it.

      '
    talking_points:
    - A report-first model is what lets Halcyon run one audit programme for 310 customers
      instead of one per customer.
    - Offer the questionnaire fallback before the standalone on-site fallback.
    recommended_position:
      rule_key: audit.customer_audit_rights
      rung: 1
    frequency: common
    counterparty_profile: Hospital systems and tier 1 health systems
  - objection: We need the right to walk in and audit at any time, without waiting for a deficiency.
    their_rationale: Large counterparties sometimes want a standing audit right as leverage,
      independent of whether a problem has surfaced.
    response: 'For an account of this size we can agree to a standalone on-site audit once
      every twelve months, at your cost and on fifteen days'' notice, without needing to show
      a deficiency first. We cannot agree to audits with no notice or with no limit on frequency.

      '
    talking_points:
    - Tie the standalone on-site option to deal size given the cost and disruption it carries.
    - Keep the scope limited to the systems and facilities used for this Customer's Services.
    recommended_position:
      rule_key: audit.customer_audit_rights
      rung: 2
    frequency: occasional
    counterparty_profile: Tier 1 health systems and strategic accounts
  dependencies:
  - related_rule_key: security.certifications
    relation: trade_against
    note: Offer the SOC 2 Type II report under the certifications rule as satisfying this
      right before conceding a standalone on-site audit.
  test_cases:
  - name: Annual, 30 days' notice, SOC 2 report first
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'No more than once a year, and on thirty days'' written notice, Customer
      may verify Halcyon''s security compliance; Halcyon''s current SOC 2 Type II report satisfies
      this right unless it shows a deficiency relevant to Customer''s Services.

      '
  - name: Customer-drafted "no more than once every 12 months" wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Customer may audit Vendor''s security compliance no more than once every
      12 months on 30 days'' prior written notice, and Vendor''s then-current SOC 2 Type II
      report will satisfy the right absent a shown deficiency.

      '
  - name: Standalone on-site audit, tier 1 and strategic deal
    context:
      counterparty_tier: tier_1
      deal_value_band: strategic
    expected_outcome: fallback
    expected_position_rung: 2
    expected_zone: yellow
    sample_text: 'Once every twelve months, on fifteen days'' written notice and at its own
      cost, Customer may conduct an on-site audit of Halcyon''s security compliance for the
      systems used to provide Customer''s Services, independent of Halcyon''s SOC 2 Type II
      report.

      '
  - name: Audit right described only as "upon reasonable notice"
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Customer may audit Halcyon''s compliance with its security obligations upon
      reasonable notice.

      '
  - name: Audit reaching other customers' environments
    expected_outcome: red_line
    expected_red_line_key: audit-scope-other-customers-or-unrelated
    expected_zone: red
    sample_text: 'Customer''s audit may extend to any system or facility operated by Halcyon,
      including those used to provide services to Halcyon''s other customers, and to Halcyon''s
      supplier contracts generally.

      '
  - name: Unannounced audit at any time
    expected_outcome: red_line
    expected_red_line_key: global-unannounced-audit
    expected_zone: red
    sample_text: 'Customer or its representatives may enter Halcyon''s facilities and access
      its systems to conduct an audit at any time, without prior notice and without limit
      on frequency.

      '
  - name: Tier-1 customer, second on-site audit in the same year
    context:
      counterparty_tier: tier_1
    expected_outcome: fallback
    expected_position_rung: 3
    expected_zone: yellow
    sample_text: 'As a tier-1 account, Customer may conduct a second on-site audit of Halcyon''s
      security compliance within the same twelve-month period, each on fifteen (15) days''
      written notice and at Customer''s cost.

      '
- rule_key: compliance.compliance_with_laws
  title: Compliance with applicable laws
  required: true
  risk_weight: 4
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Halcyon complies with the laws applicable to it as a provider of the
    Services; Halcyon is not responsible for Customer''s compliance with laws applicable to
    Customer''s own business or Customer''s use of the Services.

    '
  risk_rationale: 'Halcyon can represent and warrant to compliance with the laws that govern
    how it builds and operates Halcyon Engage, because that scope is within its own control
    and is already covered by its SOC 2 Type II and HITRUST r2 programmes. Halcyon cannot
    warrant compliance with the laws governing each of its roughly 310 customers'' own businesses,
    which vary by state, specialty and line of business and are outside anything Halcyon can
    audit or control.

    '
  detection_guidance: 'Look for "shall comply with all applicable laws and regulations", "applicable
    to its performance", "applicable to Customer''s business" and "export control". Wording
    that makes Halcyon responsible for Customer''s regulatory compliance, or for Customer''s
    own use of the Services in violation of law, is a deviation. Absence of a general compliance
    clause is a low-severity missing issue.

    '
  source_ref: Halcyon Compliance Policy CP-01
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-08
  positions:
  - kind: preferred
    rung: 0
    label: Compliance scoped to Halcyon's own performance
    zone: green
    summary: Halcyon complies with laws applicable to its performance; Customer is responsible
      for laws applicable to its own business and use.
    language: 'Halcyon shall comply with all laws and regulations applicable to Halcyon in
      its performance of this Agreement and its provision of the Services. Customer is solely
      responsible for compliance with all laws and regulations applicable to Customer''s business
      and to Customer''s use of the Services, including any laws specific to Customer''s industry.

      '
  - kind: fallback
    rung: 1
    label: Mutual compliance clause
    zone: green
    summary: State the same obligation for both parties rather than naming Halcyon alone.
    give_get: Ask Customer to confirm its own export-control and sanctions status in return.
    language: 'Each party shall comply with all laws and regulations applicable to it in connection
      with its performance of this Agreement. Each party is solely responsible for compliance
      with laws applicable to its own business that are not specific to its performance under
      this Agreement.

      '
  - kind: fallback
    rung: 2
    label: Broader undertaking including export control and anti-corruption, scope unchanged
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      deal_value_band:
      - enterprise
      - strategic
    give_get: Ask for mutual language confirming Customer remains responsible for its own
      regulatory compliance.
    summary: Name export control and anti-corruption laws expressly as part of the laws Halcyon
      complies with, without extending scope to Customer's business.
    language: 'Halcyon shall comply with all laws and regulations applicable to Halcyon in
      its performance of this Agreement, including applicable export control, trade sanctions
      and anti-corruption laws. Customer is solely responsible for compliance with all laws
      and regulations applicable to Customer''s business and to Customer''s use of the Services.

      '
  - kind: acceptable_variant
    label: Customer-drafted, Vendor-scoped wording
    zone: green
    summary: Counterparty wording naming Halcyon specifically, for the same one-sided outcome
      as the preferred position.
    language: 'Vendor shall comply with all laws and regulations applicable to it in providing
      the Services under this Agreement. Vendor is not responsible for Customer''s compliance
      with laws applicable to Customer''s own business or to Customer''s use of the Services.

      '
  red_lines:
  - key: compliance-scope-extends-to-customer-use
    description: Halcyon warrants or is made responsible for Customer's own compliance with
      laws applicable to Customer's business or Customer's use of the Services.
    condition_type: semantic
    condition:
      test: 'The clause makes Halcyon responsible for, or requires Halcyon to warrant, Customer''s
        compliance with laws applicable to Customer''s business, Customer''s industry, or
        Customer''s use of the Services, rather than limiting Halcyon''s compliance obligation
        to laws applicable to Halcyon''s own performance.

        '
    action: block
    rationale: 'Halcyon cannot audit or control how each of its roughly 310 customers uses
      the Services within their own regulatory environment, and a warranty extending that
      far is both unverifiable and uninsurable under Halcyon''s general liability coverage.

      '
  objections:
  - objection: You must comply with all laws applicable to our business, not just your own
      performance.
    their_rationale: Some customers draft compliance clauses broadly as a matter of standard
      form, without considering scope.
    response: 'We are glad to commit to the laws that govern how we build and run the Services,
      and we can make the clause mutual so each party answers for the laws that apply to it.
      We cannot warrant compliance with laws specific to your business or industry, since
      we have no visibility into or control over how you use the Services.

      '
    talking_points:
    - Offer the mutual wording as the first move; it resolves most versions of this objection.
    - Point to the separate warranties rule for what Halcyon does warrant about the Services
      themselves.
    recommended_position:
      rule_key: compliance.compliance_with_laws
      rung: 1
    frequency: occasional
  - objection: Add export control and anti-corruption compliance by name; our procurement
      policy requires it to be explicit.
    their_rationale: Procurement checklists sometimes require named categories of law rather
      than a general reference to "applicable laws".
    response: 'We can name export control, trade sanctions and anti-corruption laws expressly
      within the scope of laws applicable to our own performance, which satisfies the explicit
      reference your policy requires without broadening what we are responsible for.

      '
    talking_points:
    - Naming categories does not change scope; it only makes the existing scope explicit.
    - Pair this with the separate anti-corruption rule, which already covers bribery-specific
      representations.
    recommended_position:
      rule_key: compliance.compliance_with_laws
      rung: 2
    frequency: rare
  dependencies:
  - related_rule_key: compliance.anti_corruption
    relation: read_with
    note: The general compliance clause and the anti-corruption clause should not be drafted
      to overlap or conflict on scope.
  test_cases:
  - name: Compliance scoped to Halcyon's own performance
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Halcyon will comply with the laws that apply to it in providing the Services.
      Customer is responsible for complying with the laws that apply to Customer''s own business
      and its use of the Services.

      '
  - name: Customer-drafted, Vendor-scoped wording
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Vendor will comply with the laws applicable to it in providing the Services,
      and Vendor is not responsible for Customer''s compliance with laws applicable to Customer''s
      own business or its use of the Services.

      '
  - name: Mutual compliance clause
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Each party shall comply with all laws applicable to it in connection with
      this Agreement, and each party remains solely responsible for laws applicable to its
      own business that fall outside its performance here.

      '
  - name: Compliance obligation stated with no scope at all
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'The parties shall comply with applicable law.

      '
  - name: Halcyon responsible for Customer's industry-specific compliance
    expected_outcome: red_line
    expected_red_line_key: compliance-scope-extends-to-customer-use
    expected_zone: red
    sample_text: 'Halcyon shall ensure that the Services, and Customer''s use of them, comply
      with all laws and regulations applicable to Customer''s industry and business, regardless
      of what is described in the Documentation.

      '
- rule_key: compliance.anti_corruption
  title: Anti-corruption and program-exclusion representations
  required: true
  risk_weight: 4
  negotiable: true
  default_zone: yellow
  needs_human_judgment: false
  position_summary: 'Each party represents it will comply with applicable anti-corruption
    and anti-bribery laws and that neither it nor its personnel performing this Agreement
    is excluded from participation in any federal health care program, with prompt notice
    if that changes.

    '
  risk_rationale: 'Many of Halcyon''s customers are hospital systems and physician groups
    that bill federal health care programs, so a counterparty''s exclusion exposure can become
    Halcyon''s exposure if it is not addressed directly. A mutual, named representation covering
    the FCPA, the UK Bribery Act and program exclusion is a one-time commitment that costs
    Halcyon nothing operationally and matches what Halcyon already requires of its own personnel
    and subcontractors.

    '
  detection_guidance: 'Look for "anti-bribery", "Foreign Corrupt Practices Act", "Bribery
    Act", "anything of value", "excluded from participation in any federal health care program"
    and "Supplier Code of Conduct". Record whether the representation is mutual or one-sided
    and whether it includes the program-exclusion representation. Absence is a low-severity
    missing issue.

    '
  source_ref: Halcyon Compliance Policy CP-01
  authored_by: Senior Commercial Counsel
  approved_by: General Counsel
  last_reviewed_at: 2025-12-08
  positions:
  - kind: preferred
    rung: 0
    label: Mutual anti-corruption and exclusion representation
    zone: green
    summary: Each party represents compliance with named anti-corruption laws and that it
      is not an excluded party, with notice if that changes.
    language: 'Each party represents and warrants that it shall comply with applicable anti-corruption
      and anti-bribery laws, including the U.S. Foreign Corrupt Practices Act and the UK Bribery
      Act 2010, and shall not offer, give, request or accept any bribe or improper payment
      in connection with this Agreement. Each party further represents that neither it nor,
      to its knowledge, any of its personnel performing this Agreement is excluded, debarred
      or otherwise ineligible to participate in any federal health care program, and shall
      promptly notify the other party in writing if this representation ceases to be true.

      '
  - kind: fallback
    rung: 1
    label: Exclusion representation extended to subcontractors
    zone: green
    summary: Same representation, expressly extended to Halcyon's subcontractors performing
      the Services.
    language: 'Each party represents and warrants that it shall comply with applicable anti-corruption
      and anti-bribery laws, including the U.S. Foreign Corrupt Practices Act and the UK Bribery
      Act 2010. Halcyon further represents that neither it, nor to its knowledge any of its
      personnel or subcontractors performing the Services, is excluded, debarred or otherwise
      ineligible to participate in any federal health care program, and shall promptly notify
      Customer in writing if this representation ceases to be true.

      '
  - kind: fallback
    rung: 2
    label: Supplier code of conduct referenced as an additional, fixed commitment
    zone: yellow
    approver_role: commercial_counsel
    conditions:
      counterparty_tier:
      - tier_1
    give_get: Ask for a longer initial term in return for accepting the additional reference.
    summary: Reference Customer's supplier code of conduct as an additional representation,
      fixed at signature, without displacing Halcyon's own anti-corruption compliance obligation.
    language: 'In addition to its compliance with applicable anti-corruption and anti-bribery
      laws, Halcyon represents that it has reviewed Customer''s Supplier Code of Conduct as
      in effect on the Effective Date and will perform this Agreement consistently with its
      anti-corruption provisions. Any change to that code after the Effective Date applies
      to Halcyon only on the parties'' written agreement. Each party represents that neither
      it nor, to its knowledge, its personnel performing this Agreement is excluded from any
      federal health care program.

      '
    internal_note: 'Only agree to a version of the code fixed as of signature; never to the
      code as it may change unilaterally.

      '
  - kind: acceptable_variant
    label: Customer-drafted mutual representation
    zone: green
    summary: Counterparty wording for the same mutual outcome.
    language: 'Each party represents that it will comply with all applicable anti-corruption
      and anti-bribery laws, including the FCPA and the UK Bribery Act, and will promptly
      notify the other party if it or its personnel performing this Agreement becomes excluded
      from participation in any government health care program.

      '
  red_lines:
  - key: anti-corruption-absolute-warranty-strict-liability
    description: Halcyon warrants, as an absolute and strict-liability condition regardless
      of knowledge or fault, that no past, present or future personnel, agent or subcontractor
      has ever been or will ever be excluded or investigated, with automatic termination and
      full refund for any violation however minor.
    condition_type: semantic
    condition:
      test: 'The clause requires Halcyon to warrant, as an absolute condition without any
        knowledge or materiality qualifier, that no personnel, agent or subcontractor of Halcyon
        has ever been or will ever be excluded, debarred or investigated under any anti-corruption
        or program-exclusion law anywhere, and ties any violation, however minor or inadvertent,
        to automatic termination and a full refund of all fees ever paid.

        '
    action: block
    rationale: 'A strict-liability warranty with no knowledge qualifier makes Halcyon an insurer
      of facts it cannot verify about every current and former person who ever touched the
      account, and an automatic full-history refund on any violation functions as an uninsurable
      penalty untethered to actual harm.

      '
  objections:
  - objection: We need your representation to cover anyone who has ever worked on our account,
      including past employees and former subcontractors.
    their_rationale: Health systems want assurance that extends beyond the people currently
      assigned to the account.
    response: 'We can extend the representation to cover subcontractors performing the Services
      alongside our own personnel, which is where most of the real exposure sits. We cannot
      warrant facts about every person who has ever touched the account without any knowledge
      qualifier, since that is not something we can verify.

      '
    talking_points:
    - Offer the subcontractor-extension fallback first.
    - A knowledge qualifier is standard in representations of this kind and does not weaken
      the practical protection.
    recommended_position:
      rule_key: compliance.anti_corruption
      rung: 1
    frequency: occasional
  - objection: You must also follow our supplier code of conduct in full.
    their_rationale: Large health systems attach their own code of conduct to every vendor
      contract as a standard requirement.
    response: 'We can reference your code of conduct as an additional commitment, fixed to
      the version in effect when we sign, alongside our own anti-corruption compliance. We
      cannot agree to follow a version of the code that changes on your side without our review.

      '
    talking_points:
    - Fixing the code at signature avoids a silent change of obligations mid-term.
    - This fallback is reserved for larger counterparties given the added review it requires.
    recommended_position:
      rule_key: compliance.anti_corruption
      rung: 2
    frequency: rare
    counterparty_profile: Large hospital systems with a standard supplier code of conduct
  dependencies:
  - related_rule_key: compliance.compliance_with_laws
    relation: read_with
    note: The general compliance clause and the anti-corruption clause should not be drafted
      to overlap or conflict on scope.
  test_cases:
  - name: Mutual anti-corruption and exclusion representation
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Each party represents that it complies with applicable anti-bribery laws,
      including the FCPA and the UK Bribery Act, and that neither it nor its personnel working
      on this Agreement is excluded from any federal health care program, with prompt notice
      if that changes.

      '
  - name: Customer-drafted mutual representation
    expected_outcome: acceptable_variant
    expected_zone: green
    sample_text: 'Each party represents it will comply with all applicable anti-corruption
      and anti-bribery laws and will promptly tell the other party if it or its personnel
      performing this Agreement becomes excluded from a government health care program.

      '
  - name: Exclusion representation extended to subcontractors
    expected_outcome: fallback
    expected_position_rung: 1
    expected_zone: green
    sample_text: 'Halcyon represents that it complies with the FCPA and the UK Bribery Act,
      and that neither it nor, to its knowledge, its personnel or subcontractors performing
      the Services is excluded from any federal health care program.

      '
  - name: Representation stated with no named laws or exclusion coverage
    expected_outcome: deviation
    expected_zone: yellow
    sample_text: 'Each party shall comply with anti-corruption laws.

      '
  - name: Absolute strict-liability exclusion warranty with full refund
    expected_outcome: red_line
    expected_red_line_key: anti-corruption-absolute-warranty-strict-liability
    expected_zone: red
    sample_text: 'Halcyon absolutely warrants, regardless of knowledge or fault, that no person
      who has ever performed any part of this Agreement has ever been excluded from any government
      program, and any violation of this warranty, however minor, entitles Customer to immediate
      termination and a full refund of all fees ever paid.

      '
  - name: Trap - negated "no compliance" wording
    is_trap: true
    expected_outcome: compliant
    expected_zone: green
    sample_text: 'Neither party shall disregard anti-corruption law; each party represents
      it complies with the FCPA and the UK Bribery Act and will promptly notify the other
      if it or its personnel performing this Agreement becomes excluded from a federal health
      care program.

      '
