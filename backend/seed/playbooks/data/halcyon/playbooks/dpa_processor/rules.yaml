rules:
  - rule_key: definitions.roles_of_parties
    title: Roles of the parties
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Customer is the Controller and Halcyon is the Processor for Personal
      Data submitted to the Services, with a separate, narrow carve-out that
      Halcyon acts as an independent controller only for its own account
      administration, billing and relationship-management data.
    risk_rationale: >
      Halcyon serves about 310 customers on one multi-tenant platform, so a
      role designation that varies deal by deal would force a different
      compliance programme for every contract. Treating Halcyon as a
      Controller or joint controller for Personal Data would expose it to
      direct regulatory duties, such as independent lawful-basis assessments
      and direct liability to Data Subjects, that its one privacy counsel and
      two contracts managers cannot carry across 310 relationships. The
      account-administration carve-out reflects the one place Halcyon
      genuinely decides the purpose and means of processing: running its own
      billing and support systems.
    detection_guidance: >
      Look for "Customer is the Controller and Processor is the Processor",
      "acts as a Processor on behalf of the Controller", "independent
      Controller", "joint Controllers" and "Business Associate" or "Covered
      Entity" labels used instead. Note any clause that makes Halcyon a
      Controller, or a joint Controller, for Personal Data in the Services,
      as opposed to Halcyon's own account and billing data. Absence of any
      role statement in a data processing addendum is a missing clause,
      because every other obligation in this Addendum depends on it.
    source_ref: Halcyon Privacy Policy RP-01; processor role statement
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-01
    positions:
      - kind: preferred
        rung: 0
        label: Processor only, with account-data carve-out
        zone: green
        summary: >
          Customer is Controller and Halcyon is Processor for Personal Data in
          the Services; Halcyon is an independent controller only for its own
          account, billing and relationship data.
        language: >
          For the purposes of Applicable Data Protection Law, Customer is the
          Controller and Halcyon is the Processor with respect to Personal
          Data that Customer or its users submit to, or generate through use
          of, the Services ("Service Personal Data"). The parties agree that
          Halcyon acts as an independent controller, and not as a Processor
          or joint Controller, with respect to Personal Data that Halcyon
          collects to administer the Agreement, including account contact
          details, billing records and support correspondence, which Halcyon
          processes for its own business purposes and in accordance with its
          privacy policy. Nothing in this Addendum makes either party a
          joint Controller with the other for Service Personal Data.
      - kind: fallback
        rung: 1
        label: Processor only, carve-out stated separately
        zone: green
        summary: >
          Same allocation of roles, with the account-data carve-out addressed
          in a separate privacy notice rather than this Addendum.
        language: >
          For the purposes of Applicable Data Protection Law, Customer is the
          Controller and Halcyon is the Processor with respect to Service
          Personal Data. Halcyon's processing of account, billing and support
          contact information in order to administer the commercial
          relationship with Customer is governed by Halcyon's privacy policy
          and is outside the scope of this Addendum.
      - kind: fallback
        rung: 2
        label: Joint controller for one named ancillary activity
        zone: yellow
        approver_role: privacy_counsel
        conditions: {data_sensitivity: [personal_data, phi, special_category]}
        give_get: >
          Limit the joint-controller acknowledgement to one named activity,
          such as aggregated product-usage analytics that does not use
          identifiable Service Personal Data, and require a written
          Article 26-style arrangement describing each party's duties.
        summary: >
          Halcyon is acknowledged as a joint Controller only for one narrowly
          defined ancillary activity, remaining Processor for everything
          else.
        language: >
          Customer is the Controller and Halcyon is the Processor with
          respect to Service Personal Data, except that the parties are joint
          Controllers, within the meaning of Applicable Data Protection Law,
          solely with respect to Halcyon's generation of aggregated,
          de-identified usage analytics described in Schedule [X]. The
          parties shall record their respective duties for that joint
          processing in a written arrangement, and Customer's agreement to
          this paragraph does not extend Halcyon's controller status to any
          other processing under this Addendum.
      - kind: acceptable_variant
        label: Counterparty wording naming the same roles
        zone: green
        summary: >
          Different drafting that still states Customer as Controller and
          Halcyon as Processor only.
        language: >
          Supplier processes Personal Data solely as a data processor acting
          for and on the instructions of Customer, who remains the data
          controller for all Personal Data processed under the Agreement,
          save that Supplier is itself the controller of Personal Data it
          collects directly from Customer's personnel for account
          administration and billing.
    parameters:
      - key: role_designation
        label: Halcyon's role for Service Personal Data
        value_type: enum
        direction: set_membership
        preferred_value: processor_only
        green_limit: [processor_only]
        yellow_limit: [joint_controller_narrow_ancillary]
        allowed_values:
          - processor_only
          - joint_controller_narrow_ancillary
          - joint_controller_broad
          - controller
        extraction_hint: >
          processor_only when Halcyon is named Processor/data processor for
          Service Personal Data, regardless of how its own account and
          billing data is labelled. joint_controller_narrow_ancillary when
          joint control is limited to one named activity. joint_controller_
          broad or controller when the label applies generally to Service
          Personal Data.
    red_lines:
      - key: roles-processor-deemed-controller
        description: >
          Halcyon is designated Controller, or joint Controller generally,
          for Service Personal Data rather than Processor.
        condition_type: parameter
        condition: {parameter_key: role_designation, op: eq, value: controller}
        action: block
        rationale: >
          Direct controller duties for Service Personal Data across 310
          customers are not something Halcyon's single privacy counsel can
          discharge, and would make Halcyon directly liable to Data Subjects
          for decisions Customer actually makes.
      - key: roles-joint-controller-broad
        description: >
          The agreement makes the parties joint Controllers for Service
          Personal Data generally, not limited to one named ancillary
          activity.
        condition_type: parameter
        condition: {parameter_key: role_designation, op: eq, value: joint_controller_broad}
        action: escalate
        approver_role: general_counsel
        rationale: >
          A broad joint-controller label multiplies Halcyon's regulatory
          exposure across every customer on the shared platform and needs the
          General Counsel's sign-off, not a deal-level concession.
    objections:
      - objection: Your platform decides how our patients' data is stored and secured, so you are really a joint controller.
        their_rationale: >
          The counterparty equates technical control over infrastructure with
          legal control over the purposes of processing.
        response: >
          Deciding the security measures that protect your data is exactly
          what a Processor is required to do; it does not make Halcyon a
          Controller. We are glad to document those measures in the security
          annex so your assessment reflects a Processor's duties, not a
          Controller's.
        talking_points:
          - Technical and organisational security measures are a Processor
            obligation under Applicable Data Protection Law, not evidence of
            control over purposes.
          - Point to the technical and organisational measures annex.
        recommended_position: {rule_key: security.technical_organisational_measures, rung: 0}
        frequency: common
        counterparty_profile: Hospital systems new to cloud SaaS contracting
      - objection: We need Halcyon to be a joint controller for the analytics it runs on our data.
        their_rationale: >
          The counterparty believes shared decision-making over analytics
          output should carry shared controller status.
        response: >
          We can agree that the parties are joint Controllers for the single,
          aggregated analytics activity described in the schedule, with a
          written arrangement describing each party's duties, while Halcyon
          remains Processor for everything else under this Addendum.
        talking_points:
          - Offer the narrow joint-controller fallback with a written
            Article 26-style arrangement.
          - Keep the scope to one named, de-identified activity.
        recommended_position: {rule_key: definitions.roles_of_parties, rung: 2}
        frequency: occasional
        counterparty_profile: Larger health systems with in-house data science teams
    dependencies:
      - related_rule_key: data_protection.processing_instructions
        relation: read_with
        note: >
          The role statement only works if the instructions clause confirms
          Halcyon processes solely on Customer's documented instructions.
    test_cases:
      - name: Standard processor-only roles with account carve-out
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Customer is the Controller and Halcyon is the Processor in respect
          of Service Personal Data. Halcyon acts as an independent controller
          only for account, billing and support contact data that it collects
          to administer the commercial relationship.
      - name: Counterparty-style processor wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Supplier acts solely as data processor on Customer's instructions;
          Customer remains data controller throughout, except that Supplier
          is controller of the account and invoicing data it collects
          directly from Customer's staff.
      - name: Joint controller for one analytics activity, PHI deal
        context: {data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          The parties are Processor and Controller for Service Personal Data,
          save that they are joint controllers solely for the de-identified,
          aggregated usage analytics described in Schedule 4, governed by a
          written arrangement between them.
      - name: Role statement missing entirely
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          This Addendum governs Halcyon's processing of Customer's data under
          the Agreement.
      - name: Halcyon designated controller for all customer data
        expected_outcome: red_line
        expected_red_line_key: roles-processor-deemed-controller
        expected_zone: red
        sample_text: >
          Halcyon is the data controller for all Personal Data processed
          under the Agreement, including Service Personal Data submitted by
          Customer's users.
      - name: Trap - Halcyon is not a joint controller
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Customer is the sole Controller of Service Personal Data; Halcyon
          is not a joint controller and acts only as Processor, instructed in
          writing by Customer.

  - rule_key: data_protection.processing_instructions
    title: Processing only on documented instructions
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon processes Service Personal Data only on Customer's documented
      instructions, which the Agreement, this Addendum and Customer's use of
      the Services together make up in full, and tells Customer if an
      instruction appears to infringe Applicable Data Protection Law.
    risk_rationale: >
      An open-ended duty to follow any instruction given by any means would
      expose Halcyon's support staff, who are not trained in privacy law, to
      having to judge the lawfulness of ad hoc requests across 310 customer
      relationships. Fixing the instructions to the Agreement, this Addendum
      and the configuration choices available in the Services keeps the
      obligation auditable under SOC 2 Type II and ISO 27001 and lets Halcyon
      decline an instruction that falls outside what the Services were sold
      to do.
    detection_guidance: >
      Look for "only on documented instructions from the Controller",
      "including with regard to transfers of Personal Data", "the Agreement
      and this Addendum constitute the Controller's complete instructions"
      and "shall inform the Controller if, in its opinion, an instruction
      infringes". A duty to follow instructions "of whatever nature" or
      given informally by any individual is a deviation, not compliant.
      Absence in a data processing addendum is a missing mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; processing-instructions clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-01
    positions:
      - kind: preferred
        rung: 0
        label: Instructions fixed to the Agreement, Addendum and Services configuration
        zone: green
        summary: >
          Instructions are the Agreement, this Addendum and Customer's
          configuration of the Services; Halcyon flags apparent unlawfulness.
        language: >
          Halcyon shall process Service Personal Data only on Customer's
          documented instructions, including with regard to transfers of
          Service Personal Data to a third country, unless required to do
          otherwise by a law to which Halcyon is subject, in which case
          Halcyon shall inform Customer of that legal requirement before
          processing, unless that law prohibits such disclosure. The
          Agreement, this Addendum and Customer's configuration of the
          Services constitute Customer's complete and documented
          instructions as of the Effective Date. Any additional or different
          instruction must be agreed in writing, including by email, and
          Halcyon may treat an instruction that would require new features,
          material additional effort, or processing outside the purposes
          described in this Addendum as a change request under the
          Agreement. Halcyon shall promptly inform Customer if, in its
          opinion, an instruction infringes Applicable Data Protection Law.
      - kind: fallback
        rung: 1
        label: Instructions include a named operational contact's written requests
        zone: green
        summary: >
          Same core duty, extended to written instructions from a Customer
          contact named for this purpose, not only the signed documents.
        language: >
          Halcyon shall process Service Personal Data only on Customer's
          documented instructions, including with regard to transfers of
          Service Personal Data to a third country. Those instructions
          consist of the Agreement, this Addendum, Customer's configuration
          of the Services, and any further written instruction, including by
          email, given by a contact Customer names in writing for this
          purpose. Halcyon shall inform Customer before complying with any
          legal requirement to process Service Personal Data otherwise,
          unless prohibited from doing so, and shall promptly notify Customer
          if, in its opinion, an instruction infringes Applicable Data
          Protection Law.
      - kind: fallback
        rung: 2
        label: Broader channel for instructions, with notice of cost impact
        zone: yellow
        approver_role: privacy_counsel
        conditions: {counterparty_tier: [tier_1]}
        give_get: >
          Ask Customer to accept that instructions requiring material
          additional work are chargeable at Halcyon's then-current
          professional services rates.
        summary: >
          Instructions may be given by any of Customer's project team through
          email or the support portal, with Halcyon notifying Customer of
          cost impact rather than refusing.
        language: >
          Halcyon shall process Service Personal Data only on instructions
          given by Customer, including with regard to transfers of Service
          Personal Data to a third country. Those instructions include the
          Agreement, this Addendum, Customer's configuration of the Services,
          and further instructions given in writing by any member of
          Customer's project team identified to Halcyon, whether by email or
          through Halcyon's support portal. Where an instruction would
          require material additional work, Halcyon shall notify Customer of
          the anticipated cost and timeline before proceeding. Halcyon shall
          inform Customer if, in its opinion, an instruction infringes
          Applicable Data Protection Law.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing that still limits processing to documented
          instructions fixed by the Agreement and this Addendum.
        language: >
          Processor shall Process Personal Data only in accordance with
          Controller's documented instructions, which are fully set out in
          the Agreement and this Addendum, unless Processor is required to do
          otherwise by law, in which event Processor shall notify Controller
          of that legal requirement before Processing, unless such law
          prohibits such notice on important grounds of public interest.
    parameters: []
    red_lines:
      - key: instr-unbounded
        description: >
          Halcyon must comply with instructions of whatever nature, from any
          person, at its own cost, without the instructions being fixed to
          the Agreement and this Addendum.
        condition_type: semantic
        condition:
          test: >
            The clause requires the Processor to follow any instruction of
            whatever kind, given by any person and through any channel,
            without limiting the instructions to those documented in the
            Agreement, the Addendum or the Controller's use of the Services.
        action: block
        rationale: >
          An unbounded instruction duty cannot be reconciled with a
          multi-tenant platform serving 310 customers and removes any basis
          for Halcyon to decline out-of-scope work.
      - key: instr-legality-warranty
        description: >
          Halcyon warrants that every instruction it receives is lawful and
          accepts liability if an instruction later proves unlawful.
        condition_type: phrase
        condition:
          any:
            - Processor warrants that each instruction is lawful
            - Processor shall be liable for any Processing carried out on an instruction that is later found to be unlawful
          negation_guard: true
        action: escalate
        approver_role: general_counsel
        rationale: >
          Only the Controller can assess the lawfulness of its own purposes;
          shifting that warranty to the Processor reverses the allocation of
          duties under Applicable Data Protection Law.
    objections:
      - objection: Your support staff should follow whatever our team tells them, not just what is written in a contract.
        their_rationale: >
          The counterparty's day-to-day users expect operational flexibility
          without a paper trail.
        response: >
          We can route instructions through a named contact on your side so
          your team keeps that flexibility while we keep an auditable record,
          which protects both parties if a regulator later asks how an
          instruction was given.
        talking_points:
          - Offer the named-contact fallback.
          - A documented instruction trail is also what Customer's own
            auditors will expect to see.
        recommended_position: {rule_key: data_protection.processing_instructions, rung: 1}
        frequency: common
        counterparty_profile: Operationally decentralised hospital systems
      - objection: You should never process our data for any reason other than our instructions, full stop, including under compulsion of law.
        their_rationale: >
          The counterparty wants no exception for legally compelled
          processing.
        response: >
          We agree processing is limited to your instructions as a baseline,
          but if a law validly compels disclosure we are required to tell you
          first unless the law itself forbids that notice; we cannot promise
          to break the law to avoid telling you, but we will always try.
        talking_points:
          - The legal-compulsion carve-out with advance notice is standard
            and protects Customer, since it learns about the request.
        recommended_position: {rule_key: data_protection.processing_instructions, rung: 0}
        frequency: rare
    dependencies:
      - related_rule_key: data_protection.purpose_limitation
        relation: read_with
        note: >
          The instructions clause and the purpose-limitation clause together
          fix the scope of what Halcyon may do with Service Personal Data.
      - related_rule_key: data_transfers.transfer_mechanism
        relation: read_with
        note: >
          Instructions must expressly cover transfers; check the transfer
          clause gives Halcyon a documented instruction to make the transfers
          the Services actually require.
    test_cases:
      - name: Instructions fixed to Agreement and Addendum, with unlawfulness flag
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon will Process Service Personal Data only on Customer's
          documented instructions, set out fully in the Agreement and this
          Addendum, and will tell Customer if it believes an instruction is
          unlawful under Applicable Data Protection Law.
      - name: Counterparty complete-instructions wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor shall act only on instructions documented in the
          Agreement and Addendum, and shall notify Controller before
          following any legally compelled instruction unless notice is
          prohibited.
      - name: Tier 1 counterparty, project-team email instructions with cost notice
        context: {counterparty_tier: tier_1}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon will act on instructions given in writing by any identified
          member of Customer's project team, whether by email or the support
          portal, and will notify Customer of cost impact before doing
          material additional work.
      - name: Instructions given verbally by any Customer employee
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon shall carry out such instructions regarding Personal Data
          as it receives from Customer's personnel from time to time, whether
          in writing or otherwise.
      - name: Comply with any instruction of whatever nature
        expected_outcome: red_line
        expected_red_line_key: instr-unbounded
        expected_zone: red
        sample_text: >
          Halcyon shall comply with all instructions of whatever nature
          regarding the Personal Data that Customer or any of its affiliates
          may issue from time to time, at Halcyon's own expense.
      - name: Trap - Halcyon need not follow undocumented instructions
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon processes Service Personal Data only on Customer's
          documented instructions as set out in the Agreement and this
          Addendum; Halcyon is not required to act on an instruction that is
          not documented in this way.

  - rule_key: data_protection.purpose_limitation
    title: Purpose and scope of processing
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Processing is limited to the subject matter, duration, nature and
      purpose, and the categories of Personal Data and Data Subjects, set out
      in the processing description attached to this Addendum, and Halcyon
      does not process Service Personal Data for its own purposes.
    risk_rationale: >
      Halcyon Engage integrates with hospital record systems over HL7 FHIR
      and could technically be configured to use Service Personal Data for
      product analytics or model training well beyond what a care
      coordination subscription contemplates. Fixing the purpose to a
      schedule that names the categories of data and data subjects gives
      Customer, and Halcyon's own SOC 2 Type II and ISO 27001 auditors, a
      concrete scope to test processing against, and keeps Halcyon's own
      commercial interest in the data from expanding the deal it priced at a
      median $165k a year.
    detection_guidance: >
      Look for "for the purposes described in Schedule" or "Annex", "subject
      matter and duration of the processing", "nature and purpose of the
      processing", "categories of Data Subjects and Personal Data", and
      "Processor shall not Process Service Personal Data for its own
      purposes". A data processing addendum with no description of the
      processing, or one that lets Halcyon process for product development
      generally, is missing this issue or deviates from it.
    source_ref: Halcyon Privacy Policy RP-01; processing description schedule
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-01
    positions:
      - kind: preferred
        rung: 0
        label: Purpose fixed to the processing schedule, no own-purpose use
        zone: green
        summary: >
          The subject matter, duration, nature, purpose, and categories of
          data and data subjects are set out in a schedule, and Halcyon does
          not use Service Personal Data for its own purposes.
        language: >
          The subject matter, duration, nature and purpose of the processing,
          and the categories of Personal Data and Data Subjects, are set out
          in the Processing Description attached as Schedule [X] to this
          Addendum. Halcyon shall Process Service Personal Data only for the
          purposes of providing, securing and supporting the Services as
          described in the Agreement, this Addendum and the Documentation,
          and shall not Process Service Personal Data for Halcyon's own
          purposes, including product development generally or training
          models for use outside Customer's instance of the Services, except
          as the Agreement separately permits for aggregated or
          de-identified data.
      - kind: fallback
        rung: 1
        label: Purpose fixed to the schedule, with a defined service-improvement carve-out
        zone: green
        summary: >
          Same fixed purpose, with an explicit carve-out for using
          de-identified usage data to improve the Services generally.
        language: >
          The subject matter, duration, nature and purpose of the processing,
          and the categories of Personal Data and Data Subjects, are set out
          in the Processing Description attached as Schedule [X]. Halcyon
          shall Process Service Personal Data only to provide, secure and
          support the Services, and may additionally use de-identified,
          aggregated data derived from Service Personal Data to monitor,
          maintain and improve the Services generally, provided such data
          cannot reasonably be used to re-identify a Data Subject.
      - kind: fallback
        rung: 2
        label: Schedule updated by notice rather than amendment
        zone: yellow
        approver_role: privacy_counsel
        conditions: {deal_value_band: [enterprise, strategic]}
        give_get: >
          Ask Customer to accept that Halcyon may update the processing
          description by written notice to reflect new Service features,
          rather than requiring a signed amendment each time.
        summary: >
          The purpose and schedule may be refreshed by notice as the Services
          evolve, instead of a full contract amendment.
        language: >
          The subject matter, duration, nature and purpose of the processing,
          and the categories of Personal Data and Data Subjects, are set out
          in the Processing Description in Schedule [X], which Halcyon may
          update from time to time by written notice to Customer to reflect
          new features of the Services, provided the update does not
          materially expand the purposes for which Service Personal Data is
          Processed. Halcyon shall not Process Service Personal Data for its
          own purposes outside that Processing Description.
      - kind: acceptable_variant
        label: Purpose limitation stated without a separate schedule
        zone: green
        summary: >
          The same restriction stated in the body of the Addendum rather than
          a schedule, for a counterparty that prefers inline drafting.
        language: >
          Processor shall Process Personal Data solely as necessary to
          perform its obligations under the Agreement, for the duration of
          the Agreement, and shall not Process Personal Data for any purpose
          of its own.
    parameters: []
    red_lines:
      - key: purpose-own-use
        description: >
          Halcyon may use Service Personal Data for its own business
          purposes, including training third-party models, beyond providing
          and supporting the Services.
        condition_type: semantic
        condition:
          test: >
            The clause permits the Processor to use the Controller's
            Personal Data for its own independent purposes, such as general
            product development, marketing, or training models for use
            outside the Controller's own instance of the Services, without a
            de-identification or aggregation limit.
        action: block
        rationale: >
          Unrestricted own-purpose use of customer data is also global red
          line 10 on data used to train third-party models or for sale, and
          would put every one of Halcyon's 310 customer relationships at risk
          if it came out in one contract.
    objections:
      - objection: We cannot wait for a contract amendment every time your product adds a feature that touches our data.
        their_rationale: >
          Frequent SaaS release cycles make a full amendment process for
          every schedule update impractical.
        response: >
          We agree, and for larger relationships we offer a notice-based
          update to the processing schedule so new features can be reflected
          quickly, while keeping the restriction that we never expand the
          purposes we process your data for without telling you.
        talking_points:
          - Offer the notice-based schedule update fallback for larger deals.
          - The restriction on expanding purposes stays in place either way.
        recommended_position: {rule_key: data_protection.purpose_limitation, rung: 2}
        frequency: occasional
        counterparty_profile: Larger health systems with frequent feature requests
      - objection: We want assurance our data is never used to improve your product for other customers.
        their_rationale: >
          The counterparty worries that shared infrastructure means shared
          benefit from its data.
        response: >
          We can commit to the strict version of this clause, with no
          service-improvement carve-out at all, so Service Personal Data is
          used only to provide, secure and support your own Services.
        talking_points:
          - Offer the preferred position without the service-improvement
            carve-out.
          - Explain that de-identification is the only carve-out available
            at all, and only on request.
        recommended_position: {rule_key: data_protection.purpose_limitation, rung: 0}
        frequency: common
        counterparty_profile: Privacy-sensitive hospital systems
    dependencies:
      - related_rule_key: data_protection.processing_instructions
        relation: read_with
        note: >
          The instructions clause and this purpose-limitation clause together
          bound what Halcyon may do with Service Personal Data; check they do
          not conflict.
    test_cases:
      - name: Purpose fixed to schedule, no own-purpose use
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          The subject matter, duration, nature, purpose, and categories of
          Personal Data and Data Subjects are set out in Schedule 2. Halcyon
          Processes Service Personal Data only to provide, secure and support
          the Services and not for its own purposes.
      - name: Counterparty inline purpose restriction
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will Process Personal Data only as needed to perform its
          obligations under the Agreement for its term, and not for any
          purpose of its own.
      - name: Enterprise deal, notice-based schedule updates
        context: {deal_value_band: enterprise}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          The processing description in Schedule 2 may be updated by Halcyon
          on written notice to reflect new features, so long as the purposes
          of processing are not materially expanded.
      - name: No processing description at all
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon shall Process Personal Data as needed to provide the
          Services under the Agreement.
      - name: Processor may use data for general product improvement
        expected_outcome: red_line
        expected_red_line_key: purpose-own-use
        expected_zone: red
        sample_text: >
          Processor may use Personal Data, including Service Personal Data,
          to develop, improve and market its products and services generally,
          including products offered to other customers.
      - name: Trap - no use outside the Services
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon will not use Service Personal Data for any purpose other
          than providing, securing and supporting the Services described in
          Schedule 2; nothing in this Addendum permits use for Halcyon's own
          product development.

  - rule_key: data_protection.personnel_confidentiality
    title: Confidentiality of personnel handling Personal Data
    required: true
    risk_weight: 5
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Everyone Halcyon authorises to process Service Personal Data is bound by
      a duty of confidentiality, has access only as needed for their role, and
      receives privacy and security training.
    risk_rationale: >
      Halcyon's 430 employees include engineering, support and delivery staff
      who may touch Service Personal Data across 310 customer accounts, so
      the controls that keep one engineer from seeing another customer's
      patient data by accident are a confidentiality, training and
      need-to-know programme rather than anything the contract itself can
      enforce. This clause is part of what Halcyon's SOC 2 Type II and ISO
      27001 auditors already test, so agreeing to it adds no new operational
      burden.
    detection_guidance: >
      Look for "persons authorised to Process", "committed themselves to
      confidentiality or are under an appropriate statutory obligation of
      confidentiality", "need to know", "background checks" and "privacy and
      security training". Absence in a data processing addendum is a missing
      mandatory term; a clause naming specific named individuals who must
      personally handle the data is a deviation from the standard,
      role-based approach.
    source_ref: Halcyon Privacy Policy RP-01; personnel confidentiality clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-01
    positions:
      - kind: preferred
        rung: 0
        label: Confidentiality, need-to-know access and annual training
        zone: green
        summary: >
          Authorised personnel are bound by confidentiality, limited to
          need-to-know access, and trained annually.
        language: >
          Halcyon shall ensure that each person it authorises to Process
          Service Personal Data has committed to confidentiality or is under
          an appropriate statutory obligation of confidentiality, is granted
          access only to the extent necessary for that person's role, and
          completes privacy and security training at least once every twelve
          (12) months. Halcyon shall promptly revoke access for any person
          whose role no longer requires it.
      - kind: fallback
        rung: 1
        label: Confidentiality and need-to-know, training on hire only
        zone: yellow
        approver_role: privacy_counsel
        give_get: >
          Ask Customer to accept Halcyon's standard annual cadence for any
          future renewal, treating onboarding-only training as a one-time
          concession rather than the ongoing standard.
        summary: >
          Same confidentiality and access-limitation duties, with training
          required only at onboarding rather than annually. This drops the
          recurring-training commitment, which is a real reduction in the
          control that keeps personnel current on privacy and security
          practice, not an equivalent alternative to annual refreshers.
        language: >
          Halcyon shall ensure that each person it authorises to Process
          Service Personal Data has committed to confidentiality or is under
          an appropriate statutory obligation of confidentiality, and is
          granted access only to the extent necessary for that person's role.
          Each such person completes privacy and security training as part of
          onboarding.
      - kind: fallback
        rung: 2
        label: Background-check confirmation for personnel with standing access
        zone: yellow
        approver_role: privacy_counsel
        conditions: {data_sensitivity: [phi, special_category]}
        give_get: >
          Ask Customer to accept Halcyon's existing background-check policy,
          applied consistently across customers, rather than a
          customer-specific vetting standard.
        summary: >
          Halcyon confirms that personnel with standing access to Service
          Personal Data have passed a background check under its standard
          policy.
        language: >
          Halcyon shall ensure that each person it authorises to Process
          Service Personal Data has committed to confidentiality or is under
          an appropriate statutory obligation of confidentiality, is granted
          access only to the extent necessary for that person's role, and
          completes privacy and security training at least annually. Halcyon
          shall further confirm, on Customer's written request no more than
          once in any twelve (12) month period, that personnel with standing
          access to Service Personal Data have passed a background check
          consistent with Halcyon's personnel security policy.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same confidentiality, access-limitation
          and training commitments.
        language: >
          Processor shall ensure that persons authorised to Process Personal
          Data are subject to a duty of confidentiality, whether contractual
          or statutory, have access on a need-to-know basis only, and receive
          training appropriate to their role on a regular basis.
    parameters:
      - key: personnel_training_frequency_months
        label: Interval for privacy and security training
        value_type: duration_days
        unit: months
        direction: lower_is_better
        preferred_value: 12
        green_limit: 12
        yellow_limit: 999
        extraction_hint: >
          Record the stated training interval in months. "Onboarding only"
          with no recurring training converts to 999. Monthly, quarterly and
          annual cadences convert directly.
    red_lines:
      - key: pers-no-confidentiality-duty
        description: >
          The clause does not require personnel to be under any duty of
          confidentiality before handling Service Personal Data.
        condition_type: parameter
        condition: {parameter_key: personnel_training_frequency_months, op: is_absent}
        action: escalate
        approver_role: privacy_counsel
        rationale: >
          Personnel confidentiality is a mandatory term under Applicable Data
          Protection Law and a baseline expectation of Halcyon's own security
          certifications; its complete absence needs the Privacy Counsel's
          attention before signature.
    objections:
      - objection: We need the names of every employee who can access our data, not just a role-based description.
        their_rationale: >
          The counterparty wants individual accountability rather than a
          programme-level commitment.
        response: >
          On a shared platform serving 310 customers, naming individuals
          would not scale and would go stale the day someone changes teams;
          role-based, need-to-know access with audit logging gives you the
          same accountability without that operational burden.
        talking_points:
          - Role-based access with logging is what SOC 2 Type II actually
            tests, and is more durable than a named-individual list.
          - Offer to share the relevant SOC 2 control descriptions on
            request.
        recommended_position: {rule_key: data_protection.personnel_confidentiality, rung: 0}
        frequency: occasional
        counterparty_profile: Smaller practices unfamiliar with SaaS staffing models
      - objection: Annual training is not enough given the sensitivity of health data; we want quarterly refreshers.
        their_rationale: >
          The counterparty treats PHI exposure as warranting more frequent
          reinforcement than Halcyon's standard programme.
        response: >
          Our privacy and security training already runs annually for all
          personnel with data access, and we can commit to that cadence in
          the Addendum; a customer-specific quarterly cycle would require a
          parallel training track we do not currently operate.
        talking_points:
          - Hold the line at 12 months, which matches the preferred position.
          - Offer the background-check confirmation fallback for PHI deals as
            an alternative assurance.
        recommended_position: {rule_key: data_protection.personnel_confidentiality, rung: 2}
        frequency: rare
        counterparty_profile: Large hospital systems with strict internal policies
    dependencies:
      - related_rule_key: security.technical_organisational_measures
        relation: read_with
        note: >
          Personnel confidentiality and training are part of the technical
          and organisational measures described in the security annex; keep
          the two consistent.
    test_cases:
      - name: Confidentiality, need-to-know and annual training
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Each Halcyon employee authorised to access Service Personal Data is
          bound by confidentiality, has access only as needed for their role,
          and completes privacy and security training every twelve months.
      - name: Counterparty confidentiality and need-to-know wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Personnel handling Personal Data are under a duty of
          confidentiality and are given access strictly on a need-to-know
          basis, with regular role-appropriate training.
      - name: PHI deal, background check confirmation added
        context: {data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Personnel with standing access to Service Personal Data undergo a
          background check consistent with Halcyon's personnel security
          policy, are bound by confidentiality, and complete annual training.
      - name: Training mentioned but no confidentiality duty stated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon's support staff receive periodic product training that
          touches on customer data handling.
      - name: No confidentiality or training commitment at all
        expected_outcome: missing
        expected_zone: yellow
        sample_text: ""
      - name: Trap - training interval expressed as a range, still annual
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Personnel are bound by confidentiality obligations and complete
          privacy training no less often than once every twelve (12) months,
          and more often where their role requires it.
  - rule_key: data_protection.data_subject_requests
    title: Assistance with Data Subject requests
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Customer answers Data Subjects directly, using self-service tools in
      the Services first. Halcyon forwards any request it receives within
      ten business days, does not respond on the substance, and provides
      further reasonable assistance on request, chargeable beyond the tools.
    risk_rationale: >
      Only Customer can verify a patient's identity and decide whether an
      exemption applies, and Halcyon's one privacy counsel and two contracts
      managers cannot take on that judgment call across 310 customer
      relationships. A ten-business-day forwarding window, kept
      regime-neutral so it also works for a US state privacy law request and
      not just a GDPR one, gives Customer time within whatever statutory
      response period applies while leaving Halcyon room to route the
      request through support without a standing legal queue.
    detection_guidance: >
      Look for "Data Subject", "requests to exercise rights", "promptly
      notify the Controller", "shall not respond except on instructions",
      self-service tools in the Services, and a stated number of days to
      forward a request. Record the forwarding period and whether Halcyon
      may respond to the Data Subject itself. Absence in a data processing
      addendum is a missing mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; Data Subject request procedure
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-02
    positions:
      - kind: preferred
        rung: 0
        label: Self-service tools first, forward within ten business days
        zone: green
        summary: >
          Self-service tools first; direct requests forwarded within ten
          business days; no substantive reply by Halcyon; chargeable further
          assistance.
        language: >
          Customer is responsible for responding to requests from Data
          Subjects to exercise their rights under Applicable Data Protection
          Law. The Services include features that allow Customer to
          retrieve, correct, export, restrict and delete Service Personal
          Data, and Customer shall use those features where they are
          sufficient to respond to the request. If Halcyon receives a
          request from a Data Subject that identifies Customer, Halcyon
          shall forward it to Customer within ten (10) business days of
          receipt and shall not respond to the Data Subject other than to
          confirm that the request has been passed to Customer. Where
          Customer cannot fulfil a request using the features of the
          Services, Halcyon shall provide reasonable further assistance on
          Customer's written request, and may charge for that assistance at
          its then-current professional services rates. Customer is solely
          responsible for verifying the identity of the Data Subject and for
          the content and timing of the response.
      - kind: fallback
        rung: 1
        label: Forward within five business days, first hour of assistance free
        zone: green
        summary: >
          Shorter forwarding window and a small amount of free assistance
          before charges apply.
        language: >
          Customer is responsible for responding to Data Subject requests
          under Applicable Data Protection Law, using the self-service
          features of the Services first. If Halcyon receives a request that
          identifies Customer, Halcyon shall forward it to Customer within
          five (5) business days of receipt and shall not respond to the
          Data Subject other than to confirm that the request has been
          passed to Customer. Halcyon shall provide up to one (1) hour of
          further assistance per request at no charge, and may charge for
          additional assistance at its then-current professional services
          rates.
      - kind: fallback
        rung: 2
        label: Forward within two business days, assistance free up to a cap
        zone: yellow
        approver_role: privacy_counsel
        conditions: {counterparty_tier: [tier_1]}
        give_get: >
          Ask Customer to name a single contact address for forwarded
          requests and to accept that Halcyon's assistance is limited to
          Service Personal Data held in the production Services.
        summary: >
          Fast forwarding and a larger block of free assistance for a major
          counterparty.
        language: >
          If Halcyon receives a Data Subject request that identifies
          Customer, Halcyon shall forward it to Customer within two (2)
          business days of receipt and shall not respond to the Data Subject
          other than to confirm that the request has been passed to
          Customer. Halcyon shall provide up to four (4) hours of further
          assistance per calendar quarter at no charge, limited to Service
          Personal Data held in the production Services, and may charge for
          assistance beyond that at its then-current professional services
          rates.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same forward-and-assist structure.
        language: >
          Processor shall promptly notify Controller if it receives a
          request from a Data Subject relating to Personal Data processed
          under the Agreement and shall not respond to that Data Subject
          except on Controller's documented instructions, while making
          available the self-service functionality of the Services to
          assist Controller in responding.
    parameters:
      - key: dsr_forwarding_business_days
        label: Business days to forward a Data Subject request
        value_type: number
        unit: business days
        direction: higher_is_better
        preferred_value: 10
        green_limit: 10
        yellow_limit: 2
        extraction_hint: >
          Record the number of business days stated for Halcyon to forward a
          request it receives. Convert calendar days to business days at a
          ratio of 7:5 when the clause states calendar days.
    red_lines:
      - key: dsr-must-answer-directly
        description: >
          Halcyon must respond to the Data Subject on the substance of the
          request, rather than forwarding it to Customer.
        condition_type: phrase
        condition:
          any:
            - Processor shall respond directly to the Data Subject
            - Halcyon shall fulfil the request on Customer's behalf without further instruction
          negation_guard: true
        action: block
        rationale: >
          Only Customer can verify identity and apply any exemption; a direct
          duty to answer would make Halcyon responsible for clinical-record
          decisions it has no basis to make.
    objections:
      - objection: Ten business days to forward a request is too slow given our statutory deadline to respond.
        their_rationale: >
          The counterparty's own response clock is already running when the
          request reaches Halcyon.
        response: >
          We can commit to a five-business-day forwarding window as standard,
          and to two business days for larger relationships with a named
          contact for forwarded requests, which leaves more of your statutory
          period intact.
        talking_points:
          - Offer the five-business-day fallback, then the two-business-day
            fallback for tier 1 counterparties.
          - A named contact address speeds up delivery on both sides.
        recommended_position: {rule_key: data_protection.data_subject_requests, rung: 1}
        frequency: common
        counterparty_profile: Hospital systems with active patient portals
      - objection: Assistance beyond the self-service tools should be free, not billed at your professional services rates.
        their_rationale: >
          The counterparty sees request handling as part of the subscription
          it already pays for.
        response: >
          The self-service tools handle the large majority of requests at no
          additional cost; charging only for work beyond what those tools can
          do keeps pricing fair across customers who rarely need bespoke
          assistance and those who need it often.
        talking_points:
          - Point to the free-assistance allowance in the fallback positions.
          - Explain that unlimited free bespoke work is not priced into a
            median $165k contract.
        recommended_position: {rule_key: data_protection.data_subject_requests, rung: 1}
        frequency: occasional
    dependencies:
      - related_rule_key: data_protection.processing_instructions
        relation: requires
        note: >
          Halcyon only responding on instructions, rather than directly to
          the Data Subject, depends on the instructions clause fixing what
          counts as a documented instruction.
    test_cases:
      - name: Standard ten-business-day forwarding
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Customer will respond to Data Subject requests using the
          self-service tools in the Services. If Halcyon receives such a
          request, it will forward it to Customer within ten business days
          and will not respond on the substance.
      - name: Counterparty prompt-notification wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will promptly notify Controller of any Data Subject
          request it receives and will not respond except on Controller's
          instructions, while making the Services' self-service tools
          available to assist.
      - name: Tier 1 counterparty, two-day forwarding with quarterly free hours
        context: {counterparty_tier: tier_1}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon will forward any Data Subject request it receives to the
          named Customer contact within two business days and will provide
          up to four hours of further assistance per quarter at no charge.
      - name: Forwarding window left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will notify Customer if it receives a request from a Data
          Subject.
      - name: Halcyon must answer the Data Subject itself
        expected_outcome: red_line
        expected_red_line_key: dsr-must-answer-directly
        expected_zone: red
        sample_text: >
          If Halcyon receives a request from a Data Subject, Halcyon shall
          respond directly to that Data Subject and fulfil the request
          without needing further instruction from Customer.
      - name: Trap - Halcyon does not respond on the substance
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon does not respond to a Data Subject on the substance of a
          request; it only forwards the request to Customer within ten
          business days and otherwise stays silent pending Customer's
          instruction.

  - rule_key: data_protection.data_return_and_deletion
    title: Return and deletion of Service Personal Data
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      On termination or expiry, Halcyon makes Service Personal Data available
      for export for thirty days and then deletes it, including from backups
      within a stated backup-cycle period, confirming deletion in writing on
      request.
    risk_rationale: >
      Halcyon operates a multi-tenant platform across AWS us-east-1,
      us-west-2 and eu-west-1, so data from a terminated customer sits
      alongside active customers' data until backups cycle out; a thirty-day
      export window and a defined backup-deletion period let Halcyon give a
      real, auditable deletion commitment rather than an immediate promise
      it cannot keep operationally. This clause is tested in Halcyon's SOC 2
      Type II and ISO 27001 audits, so holding to those periods keeps the
      commitment consistent across all 310 customers.
    detection_guidance: >
      Look for "return or delete", "make available for export", "within
      thirty (30) days of termination", "securely delete or destroy",
      "backup copies" and "written confirmation of deletion". Record the
      export window and the deletion period, including any separate period
      for backups. Absence is a missing mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; data return and deletion clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-02
    positions:
      - kind: preferred
        rung: 0
        label: 30-day export window, deletion within 60 days including backups
        zone: green
        summary: >
          Thirty days to export, deletion complete within sixty days
          including from backups, written confirmation on request.
        language: >
          On termination or expiry of the Agreement, or earlier on Customer's
          written request, Halcyon shall make Service Personal Data available
          for Customer to export in a standard format for thirty (30) days,
          after which Halcyon shall delete or anonymise all remaining Service
          Personal Data, including copies held in backups, within sixty (60)
          days, except to the extent a longer retention period is required by
          law. On Customer's written request made before the end of the
          deletion period, Halcyon shall provide written confirmation that
          deletion has occurred.
      - kind: fallback
        rung: 1
        label: 30-day export, deletion within 90 days with backup cycling
        zone: green
        summary: >
          Same export window; longer deletion period reflecting Halcyon's
          backup retention cycle.
        language: >
          On termination or expiry of the Agreement, Halcyon shall make
          Service Personal Data available for export for thirty (30) days,
          after which Halcyon shall delete all remaining active copies of
          Service Personal Data and shall ensure that copies retained in
          backups are deleted or overwritten in the ordinary course of
          Halcyon's backup cycle, and in any event within ninety (90) days,
          except to the extent a longer retention period is required by law.
          Halcyon shall confirm deletion in writing on Customer's written
          request.
      - kind: fallback
        rung: 2
        label: Extended retrieval window for an enterprise transition
        zone: yellow
        approver_role: privacy_counsel
        conditions: {deal_value_band: [enterprise, strategic]}
        give_get: >
          Ask Customer to pay Halcyon's then-current professional services
          rates for export assistance beyond a standard data dump.
        summary: >
          A longer export window to support a large customer's migration,
          with the same deletion commitment once it ends.
        language: >
          On termination or expiry of the Agreement, Halcyon shall make
          Service Personal Data available for export for sixty (60) days to
          support Customer's transition, after which Halcyon shall delete all
          remaining Service Personal Data, including backups, within ninety
          (90) days, except to the extent a longer retention period is
          required by law, and shall confirm deletion in writing on request.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same export-then-delete structure.
        language: >
          Upon termination of the Agreement, Processor shall, at Controller's
          election, return or securely delete all Personal Data, including
          copies in backup systems, within a commercially reasonable period
          not exceeding ninety (90) days, and shall certify deletion in
          writing upon request.
    parameters:
      - key: dsr_export_window_days
        label: Days to export Service Personal Data after termination
        value_type: number
        unit: days
        direction: lower_is_better
        preferred_value: 30
        green_limit: 30
        yellow_limit: 60
        extraction_hint: >
          Record the number of days Halcyon must keep data available for
          export after termination before deletion begins.
      - key: deletion_completion_days
        label: Days to complete deletion, including backups
        value_type: number
        unit: days
        direction: higher_is_better
        preferred_value: 60
        green_limit: 45
        yellow_limit: 30
        extraction_hint: >
          Record the total number of days from termination (or from the end
          of the export window, if later) to deletion being complete across
          both active systems and backups. A shorter commitment is a greater
          operational risk for Halcyon, whose backups cycle across three AWS
          regions on a fixed schedule, not a more protective outcome; a
          commitment below 45 days needs escalation and below 30 days is
          unrealistic for the backup cycle described in the risk rationale.
    red_lines:
      - key: return-indefinite-retention
        description: >
          Halcyon may retain Service Personal Data indefinitely after
          termination, with no deletion commitment at all.
        condition_type: semantic
        condition:
          test: >
            The clause permits the Processor to keep Service Personal Data
            after termination with no stated deletion period and no
            requirement ever to delete it.
        action: block
        rationale: >
          An open-ended retention right defeats the purpose of the Addendum
          and would leave Customer's data outside the control it bargained
          for at termination.
    objections:
      - objection: Ninety days is too long to keep our patients' data around after we have left.
        their_rationale: >
          The counterparty wants the shortest possible tail of exposure
          after the relationship ends.
        response: >
          Our standard commitment deletes active copies quickly and clears
          backups within sixty days of the export window closing, which
          reflects how our backup systems actually cycle; we can hold to the
          tighter sixty-day total for a straightforward deployment.
        talking_points:
          - Offer the preferred 30-plus-60-day position over the 90-day
            fallback.
          - Explain the backup cycle reason for any period beyond immediate
            deletion.
        recommended_position: {rule_key: data_protection.data_return_and_deletion, rung: 0}
        frequency: common
        counterparty_profile: Privacy-sensitive hospital systems
      - objection: We need more than thirty days to complete our own migration before you delete anything.
        their_rationale: >
          Large health systems often need extended time to validate an
          export before cutting over.
        response: >
          For larger engagements we can extend the export window to sixty
          days to support a proper transition, with deletion following once
          that window closes and export assistance billed at standard rates
          if it goes beyond a routine data dump.
        talking_points:
          - Offer the enterprise transition fallback.
          - Keep the deletion commitment firm once the extended window ends.
        recommended_position: {rule_key: data_protection.data_return_and_deletion, rung: 2}
        frequency: occasional
        counterparty_profile: Enterprise and strategic hospital systems
    dependencies:
      - related_rule_key: security.technical_organisational_measures
        relation: read_with
        note: >
          Secure deletion, including from backups, should use the same
          deletion and sanitisation methods described in the security annex.
    test_cases:
      - name: Standard 30-day export, 60-day deletion
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          After termination, Halcyon will keep Service Personal Data
          available for export for thirty days, then delete all remaining
          copies, including backups, within sixty days, and will confirm
          deletion in writing on request.
      - name: Counterparty return-or-delete wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          On termination, Processor will, at Controller's election, return
          or delete all Personal Data including backup copies within ninety
          days and will certify the deletion in writing if asked.
      - name: Enterprise deal, 60-day export window
        context: {deal_value_band: enterprise}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon will keep Service Personal Data available for export for
          sixty days following termination to support Customer's migration,
          then delete all remaining data, including backups, within ninety
          days.
      - name: Deletion period left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          On termination, Halcyon will make Service Personal Data available
          for Customer to export.
      - name: No deletion commitment, retention indefinite
        expected_outcome: red_line
        expected_red_line_key: return-indefinite-retention
        expected_zone: red
        sample_text: >
          Halcyon may retain Service Personal Data after termination for
          its internal records for so long as it considers appropriate.
      - name: Trap - backups included in the deletion commitment
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Deletion is not limited to active systems; Halcyon will also
          delete Service Personal Data retained in backups within sixty days
          of the close of the export window.

  - rule_key: data_protection.dpia_assistance
    title: Assistance with data protection impact assessments
    required: true
    risk_weight: 5
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon gives Customer information about the Services and reasonable
      assistance, taking into account the nature of the processing and the
      information available to Halcyon, to carry out a data protection
      impact assessment and any prior consultation with a regulator.
    risk_rationale: >
      Customer, not Halcyon, decides whether a data protection impact
      assessment is required and carries it out, since only Customer knows
      the full context of its own processing; Halcyon's role is limited to
      the information it already holds about the Services, such as the
      technical and organisational measures annex and its SOC 2 Type II and
      ISO 27001 reports, rather than open-ended analysis work. Scoping
      assistance to existing documentation keeps the commitment something
      Halcyon's single privacy counsel can actually deliver across 310
      customers.
    detection_guidance: >
      Look for "data protection impact assessment", "prior consultation",
      "taking into account the nature of the processing and the information
      available to the Processor" and "reasonable assistance". A commitment
      to provide bespoke, unlimited assessment work with no reference to
      existing documentation is a deviation. Absence in an addendum covering
      Personal Data subject to an impact-assessment requirement is a missing
      mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; impact assessment assistance clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-02
    positions:
      - kind: preferred
        rung: 0
        label: Assistance from existing documentation, reasonable in scope
        zone: green
        summary: >
          Halcyon provides information and reasonable assistance drawn from
          its existing documentation, scoped to what it already knows about
          the Services.
        language: >
          Taking into account the nature of the processing and the
          information available to Halcyon, Halcyon shall provide Customer
          with reasonable assistance, including the technical and
          organisational measures described in the security annex and
          Halcyon's then-current SOC 2 Type II report, to enable Customer to
          carry out a data protection impact assessment and, where required
          by Applicable Data Protection Law, a prior consultation with a
          supervisory authority, in each case relating to Customer's use of
          the Services.
      - kind: fallback
        rung: 1
        label: Assistance includes a written response to specific questions
        zone: green
        summary: >
          Same scope of assistance, plus a commitment to answer specific
          written questions about the processing.
        language: >
          Taking into account the nature of the processing and the
          information available to Halcyon, Halcyon shall provide Customer
          with reasonable assistance to carry out a data protection impact
          assessment and any required prior consultation with a supervisory
          authority, including the information in the security annex and
          Halcyon's compliance reports, and shall respond in writing to
          Customer's specific written questions about the processing within
          a reasonable time.
      - kind: fallback
        rung: 2
        label: Dedicated review call with the privacy and security teams
        zone: yellow
        approver_role: privacy_counsel
        conditions: {counterparty_tier: [tier_1]}
        give_get: >
          Ask Customer to accept that further bespoke assessment work beyond
          one review call per assessment is chargeable.
        summary: >
          Halcyon additionally makes its privacy and security contacts
          available for one review call per assessment cycle.
        language: >
          Taking into account the nature of the processing and the
          information available to Halcyon, Halcyon shall provide Customer
          with reasonable assistance to carry out a data protection impact
          assessment and any required prior consultation, including the
          security annex, Halcyon's compliance reports, written answers to
          Customer's specific questions, and one review call with Halcyon's
          privacy and security contacts per assessment cycle. Further
          bespoke assistance may be charged at Halcyon's then-current
          professional services rates.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same information-and-assistance
          commitment.
        language: >
          Processor shall, upon request and having regard to the nature of
          the Processing and the information available to it, provide
          Controller with such assistance as is reasonably necessary for
          Controller to conduct a data protection impact assessment and any
          related consultation with a supervisory authority.
    parameters: []
    red_lines:
      - key: dpia-no-assistance
        description: >
          Halcyon disclaims any duty to assist with a data protection impact
          assessment or related regulatory consultation.
        condition_type: phrase
        condition:
          any:
            - Processor has no obligation to assist with any data protection impact assessment
            - Processor shall bear no responsibility for Controller's regulatory consultations
          negation_guard: true
        action: escalate
        approver_role: privacy_counsel
        rationale: >
          A flat disclaimer removes a mandatory supporting duty under
          Applicable Data Protection Law and leaves Customer unable to meet
          its own assessment obligations, which needs Privacy Counsel's
          review before it is ever accepted.
    objections:
      - objection: We need you to run the impact assessment for us, not just hand over documents.
        their_rationale: >
          Smaller counterparties without in-house privacy expertise want
          Halcyon to do the analytical work.
        response: >
          The assessment is Customer's legal responsibility because only
          Customer knows the full context of its own processing; we can
          provide everything we know about the Services, including a review
          call for larger relationships, but we cannot stand in for
          Customer's own judgment about its risk.
        talking_points:
          - Point to the existing-documentation scope and the review-call
            fallback.
          - Offer to connect Customer with outside counsel experienced in
            impact assessments if needed.
        recommended_position: {rule_key: data_protection.dpia_assistance, rung: 2}
        frequency: occasional
        counterparty_profile: Smaller practices without a privacy function
      - objection: Relying on a SOC 2 report is not specific enough for our assessment; we need direct answers about our own deployment.
        their_rationale: >
          A generic compliance report may not address configuration choices
          specific to one customer.
        response: >
          We agree a generic report alone is not always enough, which is why
          our standard position already commits to answering your specific
          written questions about the processing, not just pointing to the
          report.
        talking_points:
          - Offer the written-questions fallback as the default, not an
            escalation.
        recommended_position: {rule_key: data_protection.dpia_assistance, rung: 1}
        frequency: rare
    dependencies:
      - related_rule_key: security.technical_organisational_measures
        relation: read_with
        note: >
          The technical and organisational measures annex is the main
          document Halcyon points to when giving impact-assessment
          assistance; keep the two consistent.
    test_cases:
      - name: Assistance from existing documentation
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Taking into account the processing and the information available
          to it, Halcyon will give Customer reasonable assistance, including
          the security annex and its SOC 2 report, for any data protection
          impact assessment or prior consultation.
      - name: Counterparty assistance wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will, having regard to the nature of the processing and
          information available to it, provide reasonable assistance for
          Controller's data protection impact assessments and any related
          supervisory authority consultation.
      - name: Tier 1 counterparty, review call added
        context: {counterparty_tier: tier_1}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          In addition to the security annex and written answers to specific
          questions, Halcyon will hold one review call with its privacy and
          security contacts per assessment cycle, with further work
          chargeable at standard rates.
      - name: Assistance mentioned with no reference to existing documentation
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will cooperate reasonably with Customer's data protection
          impact assessments.
      - name: No impact assessment assistance clause at all
        expected_outcome: missing
        expected_zone: yellow
        sample_text: ""
      - name: Trap - assistance is scoped, not unlimited
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon's assistance with data protection impact assessments is
          not unlimited; it is reasonable assistance having regard to the
          nature of the processing and the information Halcyon has
          available, including its compliance reports.

  - rule_key: security.technical_organisational_measures
    title: Technical and organisational security measures
    required: true
    risk_weight: 8
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon maintains the technical and organisational measures described
      in the security annex, consistent with its SOC 2 Type II, ISO 27001
      and HITRUST r2 certifications, and may update those measures provided
      the overall level of protection is not reduced.
    risk_rationale: >
      Halcyon's security programme is the basis for its SOC 2 Type II, ISO
      27001 and HITRUST r2 certifications and underpins the $10M cyber and
      technology errors and omissions cover that stands behind every
      customer contract; freezing the measures to a fixed list taken at
      signing would stop Halcyon from adopting better controls as threats
      change. Letting Halcyon update the annex, so long as protection is not
      reduced, keeps the commitment enforceable while matching how a
      430-person security and engineering organisation actually operates.
    detection_guidance: >
      Look for "appropriate technical and organisational measures",
      "Annex" or "Schedule" describing security controls, "encryption",
      "access control", "resilience", "incident response" and "may update
      the measures provided that the level of protection is not reduced".
      A data processing addendum with no description of measures, or one
      that freezes them without any update right, is a deviation. Absence
      of any security commitment at all is a missing mandatory term.
    source_ref: Halcyon Security Policy SP-01; technical and organisational measures annex
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-03
    positions:
      - kind: preferred
        rung: 0
        label: Measures annex with a no-reduction update right
        zone: green
        summary: >
          Measures are set out in an annex consistent with Halcyon's
          certifications, updatable without consent provided protection is
          not reduced.
        language: >
          Halcyon shall implement and maintain the technical and
          organisational measures described in the Security Annex attached
          as Schedule [X], which are designed to protect Service Personal
          Data against accidental or unlawful destruction, loss, alteration,
          unauthorised disclosure or access, and are consistent with
          Halcyon's SOC 2 Type II, ISO 27001 and HITRUST r2 certifications.
          Halcyon may update the measures described in the Security Annex
          from time to time, provided that any such update does not
          materially reduce the overall level of protection for Service
          Personal Data.
      - kind: fallback
        rung: 1
        label: Measures annex, update right with notice
        zone: green
        summary: >
          Same annex and no-reduction standard, with advance notice of
          material updates rather than silent change.
        language: >
          Halcyon shall implement and maintain the technical and
          organisational measures described in the Security Annex, which are
          consistent with Halcyon's SOC 2 Type II, ISO 27001 and HITRUST r2
          certifications. Halcyon may update those measures from time to
          time, provided the overall level of protection for Service
          Personal Data is not materially reduced, and shall give Customer
          at least thirty (30) days' advance written notice of any material
          change to the Security Annex.
      - kind: fallback
        rung: 2
        label: Named additional control for a PHI or special-category deal
        zone: yellow
        approver_role: security_lead
        conditions: {data_sensitivity: [phi, special_category]}
        give_get: >
          Ask Customer to accept that the named additional control is
          evaluated against Halcyon's standard roadmap rather than committed
          to a fixed delivery date.
        summary: >
          Halcyon commits to one named additional control beyond the
          standard annex for data of heightened sensitivity.
        language: >
          Halcyon shall implement and maintain the technical and
          organisational measures described in the Security Annex, updatable
          on the no-reduction standard above, and shall additionally
          implement [named control, e.g. field-level encryption for the
          specified data elements] for Service Personal Data falling within
          the categories described in Schedule [X], subject to Halcyon's
          standard security roadmap and release process.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same annex-and-update structure.
        language: >
          Processor shall implement appropriate technical and organisational
          measures as set out in Annex II, taking into account the state of
          the art, costs of implementation, and the nature, scope, context
          and purposes of Processing, and may revise those measures provided
          the level of security is not thereby diminished.
    parameters:
      - key: toms_material_update_notice_days
        label: Advance notice of a material update to the measures annex
        value_type: number
        unit: days
        direction: lower_is_better
        preferred_value: 0
        green_limit: 0
        yellow_limit: 30
        extraction_hint: >
          Record the number of days' advance notice required before Halcyon
          may make a material update to the security annex. 0 where no
          advance notice is required, which is the preferred, least
          restrictive position for Halcyon.
    red_lines:
      - key: toms-no-description
        description: >
          The agreement requires "appropriate" security measures with no
          description of what they are, and no reference to an annex or
          Halcyon's certifications.
        condition_type: parameter
        condition: {parameter_key: toms_material_update_notice_days, op: is_absent}
        action: escalate
        approver_role: security_lead
        rationale: >
          A security commitment with no stated content cannot be tested
          against Halcyon's actual programme and gives Customer no way to
          hold Halcyon to anything specific.
    objections:
      - objection: You should not be able to change our security measures without our consent.
        their_rationale: >
          The counterparty worries that an update right lets Halcyon weaken
          protection unilaterally.
        response: >
          The update right only ever allows a change that does not reduce
          the overall level of protection, so it is a one-way ratchet toward
          better security, not a way to weaken it; for larger relationships
          we can also commit to thirty days' advance notice of material
          changes.
        talking_points:
          - Emphasise the no-reduction standard applies to every update.
          - Offer the thirty-day notice fallback.
        recommended_position: {rule_key: security.technical_organisational_measures, rung: 1}
        frequency: common
        counterparty_profile: Security-conscious hospital systems
      - objection: We need a specific control, such as field-level encryption, named in the contract, not just a general annex.
        their_rationale: >
          Counterparties handling especially sensitive data want a concrete,
          enforceable commitment beyond the general programme.
        response: >
          For data falling in your most sensitive categories we can name one
          additional control in the Addendum itself, on top of the standard
          annex, subject to our usual security release process.
        talking_points:
          - Offer the named-additional-control fallback for PHI or
            special-category data.
          - Keep any named control subject to Halcyon's standard roadmap,
            not a fixed delivery date.
        recommended_position: {rule_key: security.technical_organisational_measures, rung: 2}
        frequency: occasional
        counterparty_profile: Large hospital systems with dedicated security teams
    dependencies:
      - related_rule_key: data_protection.personnel_confidentiality
        relation: read_with
        note: >
          Personnel confidentiality and training are part of the measures
          described in the security annex; keep the two clauses consistent.
      - related_rule_key: breach_notification.notification_timeline
        relation: read_with
        note: >
          The incident-handling measures in the annex are what makes the
          breach notification timeline achievable; check they are not
          promising a response time the measures cannot support.
    test_cases:
      - name: Annex with no-reduction update right
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon maintains the technical and organisational measures in the
          Security Annex, consistent with its SOC 2 Type II, ISO 27001 and
          HITRUST r2 certifications, and may update them provided protection
          is not reduced.
      - name: Counterparty state-of-the-art wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will apply appropriate technical and organisational
          measures under Annex II, taking into account the state of the art
          and the nature of the processing, and may revise them without
          reducing the level of security.
      - name: PHI deal, named additional control
        context: {data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          In addition to the Security Annex, Halcyon will implement
          field-level encryption for the PHI data elements described in
          Schedule 3, subject to its standard security release process.
      - name: Measures referenced but not described anywhere
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will maintain reasonable security measures appropriate to
          the Services.
      - name: No description of measures and no certification reference
        expected_outcome: red_line
        expected_red_line_key: toms-no-description
        expected_zone: red
        sample_text: >
          Halcyon shall take appropriate measures to protect Personal Data.
      - name: Trap - update right is not unconditional
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon may update the measures in the Security Annex from time to
          time; it may not do so in a way that reduces the overall level of
          protection for Service Personal Data.
  - rule_key: breach_notification.notification_timeline
    title: Security incident notification timeline
    required: true
    risk_weight: 9
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon notifies Customer without undue delay and within seventy-two
      (72) hours of confirming a security incident affecting Service
      Personal Data, with the clock starting on confirmation rather than mere
      suspicion.
    risk_rationale: >
      A trigger on mere suspicion would start the clock before Halcyon's
      security team, which supports about 310 customers, has had any chance
      to separate a real incident from noise, producing false alarms that
      erode trust in every notice that follows. Seventy-two hours from
      confirmation lines up with Halcyon's SOC 2 Type II incident-response
      control and with the regulatory deadlines most of its customers
      themselves face, so a single internal process can serve every
      contract rather than a patchwork of customer-specific clocks.
    detection_guidance: >
      Look for "without undue delay", "within seventy-two (72) hours",
      "within twenty-four (24) hours", "after becoming aware", "upon
      discovery", "suspected or actual" and "confirmed". Record both the
      stated period in hours and the event that starts the clock
      (suspicion, discovery or confirmation). Absence in an agreement
      covering Personal Data is a missing mandatory term.
    source_ref: Halcyon Security Policy SP-01; incident notification clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-03
    positions:
      - kind: preferred
        rung: 0
        label: 72 hours from confirmation
        zone: green
        summary: >
          Notice without undue delay and in any event within 72 hours of
          Halcyon confirming a Security Incident.
        language: >
          If Halcyon confirms that a Security Incident has affected Service
          Personal Data, Halcyon shall notify Customer without undue delay
          and in any event within seventy-two (72) hours after confirming
          the Security Incident. "Security Incident" means a breach of
          security leading to the accidental or unlawful destruction, loss,
          alteration, unauthorised disclosure of, or access to, Service
          Personal Data. A Security Incident does not include an unsuccessful
          attempt or activity that does not compromise the security of
          Service Personal Data, including unsuccessful log-in attempts,
          pings, port scans, denial of service attacks and other network
          attacks on firewalls or networked systems.
      - kind: fallback
        rung: 1
        label: 48 hours from confirmation
        zone: green
        give_get: >
          Ask Customer to accept that the first notice may be preliminary and
          supplemented as the investigation continues, rather than complete
          on first notice.
        summary: >
          Notice within 48 hours of confirmation, with staged supplementation
          as more facts emerge.
        language: >
          If Halcyon confirms that a Security Incident has affected Service
          Personal Data, Halcyon shall notify Customer without undue delay
          and in any event within forty-eight (48) hours after confirming
          the Security Incident. The initial notice may be based on
          information then available and may be supplemented with additional
          information as Halcyon's investigation progresses.
      - kind: fallback
        rung: 2
        label: 24 hours from confirmation
        zone: yellow
        approver_role: security_lead
        internal_note: Consult privacy_counsel before approving this rung.
        conditions: {counterparty_tier: [tier_1], data_sensitivity: [phi, special_category]}
        give_get: >
          Ask Customer to accept a monetary or service-credit cap on any
          remedy tied specifically to late notice, separate from the general
          liability cap.
        summary: >
          Notice within 24 hours of confirmation for the most sensitive,
          highest-tier relationships.
        language: >
          If Halcyon confirms that a Security Incident has affected Service
          Personal Data, Halcyon shall notify Customer without undue delay
          and in any event within twenty-four (24) hours after confirming
          the Security Incident, with the initial notice supplemented as
          Halcyon's investigation progresses.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same 72-hour, confirmation-triggered
          commitment.
        language: >
          Processor shall, without undue delay and in no event later than
          seventy-two (72) hours after becoming aware that a Personal Data
          Breach affecting Personal Data has occurred, notify Controller of
          such Personal Data Breach.
    parameters:
      - key: breach_notice_hours
        label: Hours to notify after confirmation
        value_type: number
        unit: hours
        direction: higher_is_better
        preferred_value: 72
        green_limit: 48
        yellow_limit: 24
        extraction_hint: >
          Record the stated number of hours from the trigger event to
          notice. Convert "without undue delay" alone, with no outer limit,
          to null and flag for review rather than guessing a number.
      - key: breach_notice_trigger
        label: Event that starts the notification clock
        value_type: enum
        direction: set_membership
        preferred_value: confirmation
        green_limit: [confirmation]
        yellow_limit: [discovery]
        allowed_values: [confirmation, discovery, suspicion]
        extraction_hint: >
          confirmation when the clock starts once Halcyon has confirmed an
          incident occurred; discovery when it starts on becoming aware
          without confirmation; suspicion when any suspected event starts
          the clock.
    red_lines:
      - key: breach-suspicion-trigger
        description: >
          The notification clock starts on mere suspicion of a Security
          Incident rather than confirmation or discovery.
        condition_type: parameter
        condition: {parameter_key: breach_notice_trigger, op: eq, value: suspicion}
        action: block
        rationale: >
          A suspicion trigger would start a regulatory-style clock before
          Halcyon's security team can distinguish a real incident from
          routine network noise, across a platform generating that noise for
          310 customers at once.
      - key: breach-under-24-hours
        description: >
          The notification period is under twenty-four hours, regardless of
          trigger.
        condition_type: parameter
        condition: {parameter_key: breach_notice_hours, op: lt, value: 24}
        action: block
        rationale: >
          A commitment under 24 hours is not achievable for Halcyon's
          incident-response process and would set a notification deadline
          that is routinely breached, creating liability from the clause
          itself rather than from any underlying incident.
    objections:
      - objection: Seventy-two hours is too slow; we need to know within 24 hours so we can notify our own regulators and patients.
        their_rationale: >
          The counterparty's own regulatory deadline is shorter than
          Halcyon's standard commitment.
        response: >
          We can commit to 48 hours as standard for deals involving personal
          data, and to 24 hours for your most sensitive data on our largest
          relationships, so your own downstream clock has real time left on
          it; our investigation still needs to confirm what happened before
          the notice is accurate.
        talking_points:
          - Offer the 48-hour fallback, then the 24-hour fallback for tier 1,
            PHI or special-category deals.
          - Point out that a premature, inaccurate notice can be worse than
            a short delay for an accurate one.
        recommended_position: {rule_key: breach_notification.notification_timeline, rung: 1}
        frequency: common
        counterparty_profile: Hospital systems with their own regulatory reporting duties
      - objection: The clock should start the moment you suspect something is wrong, not once you have confirmed it.
        their_rationale: >
          The counterparty wants the earliest possible warning, even before
          facts are established.
        response: >
          Starting the clock on confirmation keeps the notice meaningful; a
          suspicion-based trigger would flood you with false alarms from
          routine security noise, which would make it harder, not easier, to
          spot the incidents that actually matter.
        talking_points:
          - Explain the difference between suspicion, discovery and
            confirmation, and why confirmation is standard across Halcyon's
            certifications.
        recommended_position: {rule_key: breach_notification.notification_timeline, rung: 0}
        frequency: occasional
    dependencies:
      - related_rule_key: breach_notification.notification_content
        relation: read_with
        note: >
          The timeline and the content requirement are usually negotiated
          together; a shorter timeline often comes with a lighter first-notice
          content standard.
      - related_rule_key: subprocessors.subprocessor_liability
        relation: read_with
        note: >
          An incident caused by a Sub-processor still runs on Halcyon's
          notification clock to Customer, regardless of which entity
          actually detected it.
    test_cases:
      - name: Standard 72-hour notice from confirmation
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          If Halcyon confirms a Security Incident affecting Service Personal
          Data, it will notify Customer without undue delay and within
          seventy-two hours of confirming the incident.
      - name: Counterparty Personal Data Breach wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will notify Controller without undue delay and no later
          than seventy-two hours after becoming aware that a Personal Data
          Breach has occurred.
      - name: PHI deal, 48-hour notice
        context: {data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 1
        expected_zone: green
        sample_text: >
          Halcyon will notify Customer of a confirmed Security Incident
          affecting Service Personal Data within forty-eight hours, with the
          initial notice supplemented as the investigation progresses.
      - name: Notice period left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will notify Customer of any Security Incident affecting
          Service Personal Data without undue delay.
      - name: Notice triggered by mere suspicion
        expected_outcome: red_line
        expected_red_line_key: breach-suspicion-trigger
        expected_zone: red
        sample_text: >
          Halcyon shall notify Customer within twenty-four hours of any
          suspected unauthorised access to Service Personal Data, whether or
          not later confirmed.
      - name: Trap - confirmation trigger is not suspicion
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          The seventy-two-hour notice period under this clause is not
          triggered by mere suspicion; it begins only once Halcyon has
          confirmed that a Security Incident affecting Service Personal Data
          has occurred.

  - rule_key: breach_notification.notification_content
    title: Content of the security incident notice
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      The notice describes the nature of the Security Incident, the
      categories and approximate number of Data Subjects and records
      affected, Halcyon's assessment of likely consequences, and the
      measures taken or proposed, and may be given in phases as information
      becomes available.
    risk_rationale: >
      Requiring full, final detail in the first notice would force Halcyon
      to delay sending it until the investigation is complete, which works
      against the short notification timeline customers also demand.
      Allowing phased notices lets Halcyon meet the 72-hour deadline with
      accurate preliminary information and follow up as its security team,
      which supports all 310 customers from one incident-response function,
      learns more.
    detection_guidance: >
      Look for "the notification shall include", "nature of the Security
      Incident", "categories and approximate number of Data Subjects",
      "measures taken or proposed to address the Security Incident" and "may
      be provided in phases as further information becomes available".
      Absence leaves the content of a notice undefined and is a missing
      issue; a clause demanding a fully conclusive first notice with no
      phasing is a deviation.
    source_ref: Halcyon Security Policy SP-01; incident notice content clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-03
    positions:
      - kind: preferred
        rung: 0
        label: Standard content, phased notice permitted
        zone: green
        summary: >
          Notice describes nature, affected categories and approximate
          numbers, likely consequences and measures taken, and may be
          phased.
        language: >
          To the extent then known, Halcyon's notice of a Security Incident
          shall describe: (a) the nature of the Security Incident, including
          where possible the categories and approximate number of Data
          Subjects and Service Personal Data records concerned; (b)
          Halcyon's assessment of the likely consequences of the Security
          Incident; and (c) the measures taken or proposed by Halcyon to
          address the Security Incident, including, where appropriate,
          measures to mitigate its possible adverse effects. Halcyon may
          provide this information in phases, without undue further delay,
          as it becomes available.
      - kind: fallback
        rung: 1
        label: Standard content plus a named incident contact
        zone: green
        summary: >
          Same content standard, with a named contact point for follow-up
          questions during the incident.
        language: >
          To the extent then known, Halcyon's notice shall describe the
          nature of the Security Incident, the categories and approximate
          number of Data Subjects and Service Personal Data records
          concerned, the likely consequences, and the measures taken or
          proposed to address it, and may be provided in phases as
          information becomes available. The notice shall identify a named
          Halcyon contact for Customer's follow-up questions during the
          incident.
      - kind: fallback
        rung: 2
        label: Content standard plus a written follow-up report
        zone: yellow
        approver_role: security_lead
        conditions: {counterparty_tier: [tier_1]}
        give_get: >
          Ask Customer to accept that the written follow-up report is
          provided once, after containment, rather than on a recurring
          schedule.
        summary: >
          Halcyon additionally provides a written follow-up report once the
          incident is contained.
        language: >
          In addition to the standard phased notice described above, Halcyon
          shall provide Customer with a written follow-up report once the
          Security Incident has been contained, summarising the root cause,
          remediation steps taken, and any further measures planned.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same content requirements, allowing
          staged disclosure.
        language: >
          The notification shall at least describe the nature of the
          Personal Data Breach, the categories and approximate number of
          Data Subjects and records concerned, the likely consequences, and
          the measures taken or proposed to address the breach, and may be
          provided in phases without undue further delay.
    parameters: []
    red_lines:
      - key: content-no-phasing-full-liability
        description: >
          The notice must be complete and final on first delivery, with no
          allowance for phased disclosure as facts develop, and Halcyon bears
          liability for any detail later found incomplete in that first
          notice.
        condition_type: semantic
        condition:
          test: >
            The clause requires the first incident notice to be complete and
            final, with no right to supplement it later, and makes the
            Processor liable for incompleteness in that first notice.
        action: escalate
        approver_role: general_counsel
        rationale: >
          An inflexible, fully-conclusive first-notice standard is
          incompatible with a short notification deadline and would punish
          Halcyon for giving an accurate preliminary notice on time.
    objections:
      - objection: We need a written root-cause report, not just a notice, once the incident is over.
        their_rationale: >
          The counterparty's own board or regulator will expect a formal
          post-incident report.
        response: >
          For our largest relationships we provide a written follow-up
          report once the incident is contained, covering root cause,
          remediation and further planned measures, on top of the phased
          notice you receive during the incident itself.
        talking_points:
          - Offer the written follow-up report fallback for tier 1
            counterparties.
          - Clarify the report is a one-time deliverable after containment,
            not a recurring obligation.
        recommended_position: {rule_key: breach_notification.notification_content, rung: 2}
        frequency: occasional
        counterparty_profile: Large hospital systems with board reporting duties
      - objection: Your first notice should already have everything we need; phasing sounds like an excuse to delay.
        their_rationale: >
          The counterparty worries phased notices are used to soften bad
          news.
        response: >
          Phasing is what lets us meet the 72-hour deadline with accurate
          information rather than waiting for a complete investigation; the
          content standard itself is fixed regardless of phasing, so you get
          the same categories of information, just as they become known.
        talking_points:
          - Point to the fixed content list in the preferred position.
          - Explain that an inflexible, fully-final first notice would
            conflict with the notification timeline.
        recommended_position: {rule_key: breach_notification.notification_content, rung: 0}
        frequency: rare
    dependencies:
      - related_rule_key: breach_notification.notification_timeline
        relation: read_with
        note: >
          The content standard applies to the notice required under the
          notification timeline rule; a shorter timeline implies more
          reliance on phasing.
    test_cases:
      - name: Standard content with phasing
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          To the extent then known, Halcyon's notice will describe the
          nature of the Security Incident, the categories and approximate
          number of affected Data Subjects and records, the likely
          consequences, and the measures taken, and may be given in phases.
      - name: Counterparty content wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          The notice will describe the nature of the breach, the categories
          and approximate number of Data Subjects and records concerned, the
          likely consequences and the measures taken or proposed, and may be
          provided in phases without undue further delay.
      - name: Tier 1 counterparty, follow-up report added
        context: {counterparty_tier: tier_1}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          In addition to the phased notice, Halcyon will provide a written
          follow-up report once the incident is contained, covering root
          cause and remediation.
      - name: Content requirement left vague
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon's notice will describe the Security Incident in reasonable
          detail.
      - name: First notice must be complete and final, no phasing
        expected_outcome: red_line
        expected_red_line_key: content-no-phasing-full-liability
        expected_zone: red
        sample_text: >
          Halcyon's notification shall be complete and final when given, and
          Halcyon may not supplement it later; Halcyon shall be liable for
          any detail omitted from that notice.
      - name: Trap - phasing does not excuse missing the content list
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Phased delivery does not relieve Halcyon of describing, as each
          phase is sent, the nature of the incident, the categories and
          approximate numbers affected, the likely consequences, and the
          measures taken or proposed.

  - rule_key: subprocessors.authorisation_model
    title: Authorisation to engage sub-processors
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Customer gives Halcyon general written authorisation to engage
      Sub-processors from a published list, rather than specific prior
      consent for each one.
    risk_rationale: >
      Halcyon runs one multi-tenant platform for about 310 customers on a
      shared set of infrastructure and monitoring Sub-processors; a
      specific-consent requirement would give any single customer an
      effective veto over infrastructure that every other customer also
      depends on, and would make a routine vendor change a multi-week
      approval exercise instead of a documented update to a public list.
      General authorisation with a published list and notice keeps that
      control meaningful without creating 310 separate approval queues.
    detection_guidance: >
      Look for "general written authorisation", "specific prior written
      authorisation", "the Sub-processors listed at [URL]", "Customer
      consents to the engagement of" and "shall not engage any Sub-processor
      without Customer's prior written consent". A data processing addendum
      with no authorisation wording at all is missing a mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; sub-processor authorisation clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-04
    positions:
      - kind: preferred
        rung: 0
        label: General authorisation from a published list
        zone: green
        summary: >
          Customer authorises the Sub-processors on Halcyon's published list
          generally, subject to the notice-and-objection process for
          changes.
        language: >
          Customer provides Halcyon with general written authorisation to
          engage Sub-processors to Process Service Personal Data, including
          those listed on Halcyon's published Sub-processor list as of the
          Effective Date, subject to Halcyon complying with the notice and
          objection process described in this Addendum for any new
          Sub-processor. Halcyon remains responsible for each Sub-processor's
          compliance with the obligations of this Addendum.
      - kind: fallback
        rung: 1
        label: General authorisation with a named-category acknowledgement
        zone: green
        summary: >
          Same general authorisation, naming the categories of
          sub-processing Customer is pre-approving (such as hosting,
          messaging and monitoring).
        language: >
          Customer provides Halcyon with general written authorisation to
          engage Sub-processors falling within the categories of hosting,
          messaging, monitoring and customer support, as listed on Halcyon's
          published Sub-processor list, subject to the notice and objection
          process for any new Sub-processor. Halcyon remains responsible for
          each Sub-processor's compliance with this Addendum.
      - kind: fallback
        rung: 2
        label: General authorisation with an advance briefing for major changes
        zone: yellow
        approver_role: privacy_counsel
        conditions: {counterparty_tier: [tier_1], data_sensitivity: [phi, special_category]}
        give_get: >
          Ask Customer to accept that the briefing is informational and does
          not itself require Customer's approval before the change proceeds.
        summary: >
          General authorisation stands, but Halcyon additionally briefs the
          largest, most sensitive relationships before a major new category
          of Sub-processor is added.
        language: >
          Customer provides Halcyon with general written authorisation to
          engage Sub-processors from the published Sub-processor list,
          subject to the notice and objection process for any new
          Sub-processor. For a new Sub-processor that will Process Service
          Personal Data in a category not already on the list, Halcyon shall
          additionally offer Customer a briefing on the change before it
          takes effect, which does not itself require Customer's prior
          approval.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same general-authorisation, published-
          list structure.
        language: >
          Controller authorises Processor generally to engage Sub-processors,
          provided that Processor maintains and makes available to
          Controller a current list of its Sub-processors and complies with
          the notification requirements set out below for any change to
          that list.
    parameters:
      - key: subprocessor_authorisation_type
        label: Authorisation model for Sub-processors
        value_type: enum
        direction: set_membership
        preferred_value: general
        green_limit: [general]
        yellow_limit: [general_with_briefing]
        allowed_values: [general, general_with_briefing, specific_prior_consent]
        extraction_hint: >
          general when Customer pre-authorises Sub-processors from a
          published list; general_with_briefing when that authorisation
          comes with an informational briefing for major changes;
          specific_prior_consent when Customer must approve each
          Sub-processor individually before engagement.
    red_lines:
      - key: subproc-specific-consent-required
        description: >
          Customer's prior written consent is required for each individual
          Sub-processor before engagement.
        condition_type: parameter
        condition: {parameter_key: subprocessor_authorisation_type, op: eq, value: specific_prior_consent}
        action: block
        rationale: >
          A specific-consent requirement from one customer would let that
          customer block an infrastructure change relied on by all 310
          customers on the shared platform, which is not something Halcyon
          can operationally grant.
    objections:
      - objection: We need to approve each new sub-processor before you use it, not just be told after the fact.
        their_rationale: >
          The counterparty equates data protection diligence with a direct
          veto.
        response: >
          A veto from any single customer over infrastructure shared across
          310 customers is not something we can operate; general
          authorisation from a published list, paired with real advance
          notice and a right to object to a specific change, gives you
          meaningful control without stopping platform-wide changes.
        talking_points:
          - Point to the notice-and-objection process in the companion
            subprocessor_changes rule.
          - Explain the operational impossibility of per-customer vetoes on
            shared infrastructure.
        recommended_position: {rule_key: subprocessors.authorisation_model, rung: 0}
        frequency: common
        counterparty_profile: Large hospital systems new to multi-tenant SaaS
      - objection: At minimum, tell us before you add a sub-processor in a category we have not already approved.
        their_rationale: >
          The counterparty accepts general authorisation but wants advance
          warning of materially new kinds of processing.
        response: >
          For your relationship we can commit to an advance briefing before
          Halcyon adds a Sub-processor in a new category, on top of the
          standard notice and objection process, while keeping the
          authorisation itself general.
        talking_points:
          - Offer the advance-briefing fallback for tier 1, PHI or
            special-category relationships.
        recommended_position: {rule_key: subprocessors.authorisation_model, rung: 2}
        frequency: occasional
        counterparty_profile: Tier 1 counterparties handling PHI or special category data
    dependencies:
      - related_rule_key: subprocessors.subprocessor_changes
        relation: read_with
        note: >
          The authorisation model and the notice-and-objection process for
          changes work together; general authorisation is only acceptable
          with a real objection right on changes.
    test_cases:
      - name: General authorisation from a published list
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Customer gives Halcyon general written authorisation to engage
          Sub-processors listed on Halcyon's published Sub-processor list,
          subject to the notice and objection process for new additions.
      - name: Counterparty general-authorisation wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Controller authorises Processor generally to use Sub-processors,
          provided Processor keeps a current list available and follows the
          notice process described below for any change.
      - name: Tier 1 PHI deal, advance briefing added
        context: {counterparty_tier: tier_1, data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Customer's general authorisation stands, but Halcyon will offer a
          briefing before adding a Sub-processor in a category not already
          on the published list.
      - name: Authorisation model left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon may engage Sub-processors as needed to provide the
          Services.
      - name: Specific prior consent required for each sub-processor
        expected_outcome: red_line
        expected_red_line_key: subproc-specific-consent-required
        expected_zone: red
        sample_text: >
          Halcyon shall not engage any Sub-processor to Process Service
          Personal Data without Customer's specific prior written consent
          for that Sub-processor.
      - name: Trap - general authorisation is not unconditional
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Customer's general authorisation of Halcyon's published
          Sub-processor list is not a waiver of the notice and objection
          process; it still applies to any new Sub-processor Halcyon adds.

  - rule_key: subprocessors.subprocessor_changes
    title: Notice and objection on sub-processor changes
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon gives Customer at least thirty days' advance notice of a new
      Sub-processor, Customer may object on reasonable data-protection
      grounds, and if the objection cannot be resolved Customer's remedy is
      to terminate the affected Services with a pro-rata refund.
    risk_rationale: >
      Thirty days gives a hospital system's own privacy or security team
      enough time to raise a genuine concern without letting a single
      objection freeze a platform-wide infrastructure change that Halcyon's
      other 309 customers are relying on. Terminating only the affected
      Services, rather than the whole Agreement, keeps the remedy
      proportionate to a median $165k contract rather than threatening the
      full relationship over one vendor swap.
    detection_guidance: >
      Look for "notify Customer at least thirty (30) days before", "updating
      the Sub-processor list", "object on reasonable grounds relating to
      data protection", "work in good faith to resolve the objection" and
      "terminate the affected Services". Record the notice period in days
      and the stated remedy if the objection is not resolved. Absence means
      Customer has no notice of, or say in, changes to who handles its data.
    source_ref: Halcyon Privacy Policy RP-01; sub-processor change notice clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-04
    positions:
      - kind: preferred
        rung: 0
        label: 30 days' notice, objection on reasonable grounds, partial termination remedy
        zone: green
        summary: >
          Thirty days' notice of a new Sub-processor, a right to object on
          reasonable data-protection grounds, and termination of the
          affected Services as the remedy if the objection is not resolved.
        language: >
          Before engaging a new Sub-processor to Process Service Personal
          Data, Halcyon shall update its published Sub-processor list and
          give Customer at least thirty (30) days' advance notice of the
          change, by posting to the list or by direct notice. Customer may
          object to the new Sub-processor on reasonable grounds relating to
          data protection by notifying Halcyon in writing within that
          thirty-day period. If Customer objects, the parties shall work in
          good faith to resolve the objection; if they cannot resolve it
          within thirty (30) days, Customer's sole remedy is to terminate the
          Services that cannot reasonably be provided without the new
          Sub-processor, on written notice to Halcyon, with a pro-rata
          refund of prepaid Fees for the terminated Services.
      - kind: fallback
        rung: 1
        label: 30 days' notice, direct-notice channel required
        zone: green
        summary: >
          Same thirty-day notice and objection structure, with direct notice
          to Customer required rather than posting to the list alone.
        language: >
          Before engaging a new Sub-processor to Process Service Personal
          Data, Halcyon shall give Customer direct written notice at least
          thirty (30) days in advance, in addition to updating its published
          list. Customer may object on reasonable grounds relating to data
          protection within that period; if the parties cannot resolve the
          objection within thirty (30) days, Customer's sole remedy is to
          terminate the affected Services on written notice, with a pro-rata
          refund of prepaid Fees for those Services.
      - kind: fallback
        rung: 2
        label: 60 days' notice for a named-category change
        zone: yellow
        approver_role: privacy_counsel
        conditions: {counterparty_tier: [tier_1]}
        give_get: >
          Ask Customer to accept that the extended notice applies only to a
          Sub-processor in a category not already on the published list,
          not to every routine addition.
        summary: >
          Sixty days' direct notice for a Sub-processor in a materially new
          category, keeping the standard thirty-day process for routine
          additions.
        language: >
          Before engaging a new Sub-processor to Process Service Personal
          Data in a category not already on the published Sub-processor
          list, Halcyon shall give Customer at least sixty (60) days' direct
          written notice; for any other new Sub-processor, thirty (30) days'
          notice applies. Customer may object on reasonable grounds relating
          to data protection within the applicable period; if unresolved
          within thirty (30) days after the objection, Customer's sole
          remedy is to terminate the affected Services on written notice,
          with a pro-rata refund of prepaid Fees for those Services.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same notice-and-objection structure.
        language: >
          Processor shall give Controller no less than thirty (30) days'
          notice before appointing a new Sub-processor. Controller may
          object on reasonable data protection grounds within that period;
          if the parties cannot resolve the objection, Controller's remedy
          is limited to termination of the Services affected by that
          Sub-processor, with a refund of Fees paid for the unused portion.
    parameters:
      - key: subprocessor_change_notice_days
        label: Days' advance notice of a new Sub-processor
        value_type: number
        unit: days
        direction: lower_is_better
        preferred_value: 30
        green_limit: 30
        yellow_limit: 60
        extraction_hint: >
          Record the number of days' advance notice required before a new
          Sub-processor may begin Processing Service Personal Data.
    red_lines:
      - key: changes-no-notice-or-objection
        description: >
          Halcyon may add Sub-processors with no notice to Customer at all,
          and no right to object.
        condition_type: parameter
        condition: {parameter_key: subprocessor_change_notice_days, op: is_absent}
        action: escalate
        approver_role: privacy_counsel
        rationale: >
          A total absence of notice or objection rights removes any say
          Customer has over who handles its data and needs Privacy Counsel's
          review before Halcyon accepts a DPA drafted this way.
    objections:
      - objection: Thirty days is not enough warning for our compliance team to evaluate a new vendor.
        their_rationale: >
          Larger health systems run their own vendor-risk process on top of
          Halcyon's.
        response: >
          For our largest relationships we can extend the notice to sixty
          days when the new Sub-processor is in a category you have not
          already approved, while keeping the standard thirty-day process
          for routine additions within categories you already know about.
        talking_points:
          - Offer the 60-day, named-category fallback for tier 1
            counterparties.
          - Distinguish routine additions within an existing category from a
            materially new category.
        recommended_position: {rule_key: subprocessors.subprocessor_changes, rung: 2}
        frequency: common
        counterparty_profile: Tier 1 hospital systems with formal vendor-risk programmes
      - objection: If we object and you cannot resolve it, we should be able to terminate the whole Agreement, not just the affected Services.
        their_rationale: >
          The counterparty wants maximum leverage over any sub-processor
          dispute.
        response: >
          Limiting termination to the Services that actually depend on the
          new Sub-processor keeps the remedy proportionate to the problem;
          terminating the whole Agreement over one vendor change would be a
          disproportionate outcome for both sides given our median contract
          size.
        talking_points:
          - Explain the proportionality of a Services-specific termination
            remedy.
          - Note the pro-rata refund already compensates Customer fairly.
        recommended_position: {rule_key: subprocessors.subprocessor_changes, rung: 0}
        frequency: occasional
    dependencies:
      - related_rule_key: subprocessors.authorisation_model
        relation: requires
        note: >
          The notice-and-objection process is what makes general
          authorisation acceptable; the two rules should always be read and
          offered together.
      - related_rule_key: subprocessors.subprocessor_liability
        relation: read_with
        note: >
          Once a new Sub-processor clears the notice and objection process,
          Halcyon's continuing liability for that Sub-processor is governed
          by the sub-processor liability rule.
    test_cases:
      - name: 30 days' notice, objection and partial termination remedy
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon will give Customer at least thirty days' notice before
          engaging a new Sub-processor. Customer may object on reasonable
          data protection grounds; if unresolved, Customer may terminate the
          affected Services with a pro-rata refund.
      - name: Counterparty 30-day notice wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will give Controller no less than thirty days' notice
          before appointing a new Sub-processor, and Controller's remedy for
          an unresolved objection is limited to terminating the affected
          Services with a refund of unused Fees.
      - name: Tier 1 counterparty, 60-day notice for a new category
        context: {counterparty_tier: tier_1}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          For a Sub-processor in a category not already on the published
          list, Halcyon will give Customer sixty days' direct notice; other
          additions follow the standard thirty-day process.
      - name: Notice period left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will update its Sub-processor list from time to time as
          needed.
      - name: No notice or objection right at all
        expected_outcome: red_line
        expected_red_line_key: changes-no-notice-or-objection
        expected_zone: red
        sample_text: >
          Halcyon may engage, replace or remove Sub-processors at its sole
          discretion without notice to Customer.
      - name: Trap - notice right is not merely a list posting
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Posting a change to the published Sub-processor list is not, on
          its own, the only notice Customer gets; Customer also has thirty
          days to object on reasonable data protection grounds before the
          new Sub-processor may Process Service Personal Data.
  - rule_key: subprocessors.subprocessor_liability
    title: Flow-down and liability for sub-processors
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Halcyon binds each Sub-processor in writing to data protection
      obligations no less protective than this Addendum and remains fully
      liable to Customer for a Sub-processor's acts and omissions as if they
      were Halcyon's own, within the limits of liability in the Agreement.
    risk_rationale: >
      Halcyon's Sub-processors are mainly cloud, messaging and analytics
      vendors that support the whole platform, not a vendor chosen per
      customer, so Customer's real protection is Halcyon standing behind
      each one rather than trying to enforce a separate contract against a
      vendor it has no direct relationship with. Keeping Sub-processor
      liability inside the Agreement's limitation of liability, rather than
      stacking it on top, keeps this clause consistent with the $10M cyber
      and technology errors and omissions cover that actually responds to a
      Sub-processor-caused incident.
    detection_guidance: >
      Look for "the same data protection obligations", "no less protective
      than those set out in this Addendum", "written agreement with each
      Sub-processor" and "remain fully liable for the performance of its
      Sub-processors' obligations" or "as if they were its own acts or
      omissions". Check whether Sub-processor liability is kept inside or
      stacked outside the general limitation of liability. Absence in a data
      processing addendum is a missing mandatory term.
    source_ref: Halcyon Privacy Policy RP-01; sub-processor flow-down clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-04
    positions:
      - kind: preferred
        rung: 0
        label: Equivalent flow-down, liability inside the general cap
        zone: green
        summary: >
          Written equivalent-obligations agreement with each Sub-processor;
          Halcyon liable for their acts as its own, subject to the
          Agreement's limitation of liability.
        language: >
          Halcyon shall enter into a written agreement with each
          Sub-processor imposing data protection obligations no less
          protective of Service Personal Data than those set out in this
          Addendum, to the extent applicable to the nature of the services
          the Sub-processor provides. Halcyon shall remain fully liable to
          Customer for the performance of each Sub-processor's obligations
          under that written agreement, as if the acts and omissions of the
          Sub-processor were Halcyon's own, subject in all cases to the
          limitation of liability set out in the Agreement.
      - kind: fallback
        rung: 1
        label: Equivalent flow-down with a summary available on request
        zone: green
        summary: >
          Same flow-down and liability standard, with Halcyon providing a
          summary of the relevant Sub-processor terms on request.
        language: >
          Halcyon shall enter into a written agreement with each
          Sub-processor imposing data protection obligations no less
          protective than those set out in this Addendum, and shall remain
          fully liable to Customer for each Sub-processor's performance of
          those obligations, as if they were Halcyon's own acts or
          omissions, subject to the limitation of liability in the
          Agreement. On Customer's written request, Halcyon shall provide a
          summary of the relevant data protection terms in its agreement
          with a named Sub-processor.
      - kind: fallback
        rung: 2
        label: Sub-processor liability carved out of the general cap for data breach only
        zone: yellow
        approver_role: general_counsel
        conditions: {deal_value_band: [strategic]}
        give_get: >
          Ask for the carve-out to be no broader than the data breach
          super-cap already offered under the Agreement's limitation of
          liability.
        summary: >
          For a strategic relationship, Sub-processor-caused data breach
          liability sits under the data breach super-cap rather than the
          general liability cap.
        language: >
          Halcyon shall enter into a written agreement with each
          Sub-processor imposing data protection obligations no less
          protective than those set out in this Addendum, and shall remain
          fully liable to Customer for each Sub-processor's performance of
          those obligations as if they were Halcyon's own acts or omissions.
          Liability arising from a Sub-processor's acts or omissions causing
          a Security Incident shall be subject to the data breach super-cap,
          rather than the general limitation of liability, set out in the
          Agreement.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same flow-down and liability standard.
        language: >
          Processor shall impose on each Sub-processor, by way of a written
          contract, data protection obligations consistent with those in
          this Addendum, and shall remain liable to Controller for the acts
          and omissions of its Sub-processors to the same extent Processor
          would be liable if performing the Sub-processor's services
          directly, subject to the limitation of liability agreed between
          the parties.
    parameters:
      - key: subprocessor_liability_scope
        label: How sub-processor liability sits against the general cap
        value_type: enum
        direction: set_membership
        preferred_value: inside_general_cap
        green_limit: [inside_general_cap]
        yellow_limit: [breach_super_cap_only]
        allowed_values: [inside_general_cap, breach_super_cap_only, outside_cap_uncapped]
        extraction_hint: >
          inside_general_cap when Sub-processor liability sits inside the
          Agreement's ordinary limitation of liability; breach_super_cap_only
          when it is carved into the data breach super-cap but no further;
          outside_cap_uncapped when Sub-processor liability is excluded from
          every cap in the Agreement.
    red_lines:
      - key: liab-subprocessor-uncapped
        description: >
          Halcyon's liability for a Sub-processor's acts or omissions is
          excluded from every limitation of liability in the Agreement.
        condition_type: parameter
        condition: {parameter_key: subprocessor_liability_scope, op: eq, value: outside_cap_uncapped}
        action: block
        rationale: >
          Uncapped liability for a third party's conduct is uninsurable
          against Halcyon's $10M cyber and technology errors and omissions
          cover and is the kind of unlimited exposure the general red line
          on uncapped liability exists to prevent.
      - key: liab-no-flow-down
        description: >
          Halcyon has no written agreement in place binding Sub-processors to
          equivalent data protection obligations.
        condition_type: semantic
        condition:
          test: >
            The clause does not require the Processor to bind its
            Sub-processors in writing to data protection obligations
            equivalent to those in this Addendum.
        action: escalate
        approver_role: privacy_counsel
        rationale: >
          Without an equivalent-obligations flow-down, Customer has no
          assurance that a Sub-processor is held to the same standard as
          Halcyon itself, which needs Privacy Counsel's review before the
          gap is accepted.
    objections:
      - objection: Your liability for a sub-processor's data breach should not be limited by the general cap at all.
        their_rationale: >
          The counterparty treats a Sub-processor incident as equivalent in
          severity to Halcyon's own breach and wants it treated the same way
          as the uncapped categories.
        response: >
          We already carry a dedicated, higher cap for data breach generally,
          including one caused by a Sub-processor, and for our largest
          relationships we can confirm that Sub-processor-caused breaches sit
          under that higher cap rather than the ordinary general cap.
        talking_points:
          - Point to the data breach super-cap fallback for strategic deals.
          - Explain that uncapped third-party liability is not insurable.
        recommended_position: {rule_key: subprocessors.subprocessor_liability, rung: 2}
        frequency: occasional
        counterparty_profile: Strategic hospital systems with large data volumes
      - objection: We want to see the actual contract terms you have with your sub-processors, not just your word that they are equivalent.
        their_rationale: >
          The counterparty does not want to rely solely on Halcyon's
          characterisation of its own vendor contracts.
        response: >
          We can provide a summary of the relevant data protection terms in
          our agreement with a named Sub-processor on request, which gives
          you visibility without requiring us to disclose commercially
          sensitive contract terms in full.
        talking_points:
          - Offer the summary-on-request fallback.
          - Note that the full vendor contracts are themselves confidential
            commercial agreements.
        recommended_position: {rule_key: subprocessors.subprocessor_liability, rung: 1}
        frequency: rare
    dependencies:
      - related_rule_key: limitation_of_liability.dpa_liability_alignment
        relation: trade_against
        note: >
          A broader carve-out for Sub-processor-caused data breach liability
          should be traded against, not stacked on top of, any separate
          widening of the general DPA liability alignment position.
    test_cases:
      - name: Equivalent flow-down, liability inside the general cap
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon enters into a written agreement with each Sub-processor
          imposing data protection obligations no less protective than this
          Addendum, and remains fully liable for their acts as if they were
          its own, subject to the Agreement's limitation of liability.
      - name: Counterparty equivalent-obligations wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor will impose equivalent data protection obligations on
          each Sub-processor by written contract and remains liable for
          their acts and omissions to the same extent as if performing the
          services itself, subject to the agreed limitation of liability.
      - name: Strategic deal, breach super-cap carve-out for sub-processors
        context: {deal_value_band: strategic}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon remains fully liable for each Sub-processor's acts as its
          own; liability from a Sub-processor-caused Security Incident sits
          under the data breach super-cap rather than the general cap.
      - name: Flow-down obligation stated vaguely, no written-agreement requirement
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will ensure its Sub-processors handle Service Personal
          Data appropriately.
      - name: Sub-processor liability excluded from every cap
        expected_outcome: red_line
        expected_red_line_key: liab-subprocessor-uncapped
        expected_zone: red
        sample_text: >
          Halcyon's liability for the acts or omissions of any Sub-processor
          shall not be subject to any limitation or exclusion of liability
          in the Agreement.
      - name: Trap - liability for sub-processors is not unlimited
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon's liability for its Sub-processors' acts and omissions is
          not unlimited; it is treated as Halcyon's own liability and sits
          within the Agreement's limitation of liability.

  - rule_key: data_transfers.transfer_mechanism
    title: Lawful basis for cross-border transfers
    required: true
    risk_weight: 7
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Where Applicable Data Protection Law restricts sending Service Personal
      Data outside the territory where it was collected, Halcyon uses the
      Standard Contractual Clauses or an equivalent recognised transfer
      mechanism, incorporated by reference, and keeps it current if the
      mechanism it relies on is invalidated or replaced.
    risk_rationale: >
      Halcyon hosts US customers in AWS us-east-1 and us-west-2 and EU
      customers in AWS eu-west-1, so most deals never trigger a restricted
      transfer at all, but the clause still needs to work the day a customer
      asks support staff elsewhere to access EU data. Incorporating the
      Standard Contractual Clauses by reference, rather than attaching a
      bespoke negotiated text, lets one mechanism serve all 310 customers
      and be swapped for a successor instrument without renegotiating each
      contract individually.
    detection_guidance: >
      Look for "Standard Contractual Clauses", "Module Two", "UK Addendum",
      "International Data Transfer Agreement", "Data Privacy Framework",
      "adequacy decision" and "Restricted Transfer". Record which mechanism
      is named and whether it is incorporated by reference or must be
      separately executed. Absence in a deal where Personal Data can be
      accessed from outside the territory where Applicable Data Protection
      Law requires a safeguard is a missing mandatory term; this rule does
      not apply where no such restriction exists.
    source_ref: Halcyon Privacy Policy RP-01; cross-border transfer clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-05
    positions:
      - kind: preferred
        rung: 0
        label: Standard Contractual Clauses incorporated by reference
        zone: green
        summary: >
          Where a restricted transfer occurs, the Standard Contractual
          Clauses (or the UK or Swiss equivalent) apply by reference, with no
          separate execution required.
        language: >
          Where Applicable Data Protection Law restricts the transfer of
          Service Personal Data to a country that does not benefit from an
          adequacy decision or equivalent recognised basis, the transfer
          shall take place under the Standard Contractual Clauses, Module
          Two (Controller to Processor), and, where the United Kingdom
          General Data Protection Regulation applies, the UK Addendum to
          those Clauses, in each case incorporated into this Addendum by
          reference and deemed executed by the parties without further
          action. If the Standard Contractual Clauses are amended, replaced
          or invalidated, the parties shall cooperate in good faith to adopt
          a replacement mechanism recognised under Applicable Data
          Protection Law.
      - kind: fallback
        rung: 1
        label: Standard Contractual Clauses, executed as a signed annex
        zone: green
        summary: >
          Same transfer mechanism, executed as a separately signed annex
          rather than incorporated purely by reference.
        language: >
          Where Applicable Data Protection Law restricts the transfer of
          Service Personal Data outside the territory in which it was
          collected, the parties shall execute the Standard Contractual
          Clauses, Module Two, as a signed annex to this Addendum, together
          with the UK Addendum where the transfer involves the United
          Kingdom. If that mechanism is invalidated or replaced, the parties
          shall promptly execute a replacement mechanism recognised under
          Applicable Data Protection Law.
      - kind: fallback
        rung: 2
        label: Additional transfer impact documentation on request
        zone: yellow
        approver_role: privacy_counsel
        conditions: {region: [eu, uk]}
        give_get: >
          Ask Customer to accept that the documentation reflects Halcyon's
          existing security certifications rather than a bespoke,
          customer-specific transfer impact assessment.
        summary: >
          Standard Contractual Clauses apply as above, and Halcyon provides
          supporting transfer documentation on request for Customer's own
          assessment.
        language: >
          Where Applicable Data Protection Law restricts the transfer of
          Service Personal Data, the Standard Contractual Clauses, Module
          Two, and the UK Addendum where applicable, apply as described
          above. On Customer's written request, Halcyon shall provide
          supporting documentation, drawn from its existing security
          certifications and policies, to assist Customer's own assessment
          of the transfer.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same Standard Contractual Clauses
          mechanism.
        language: >
          To the extent the Services involve a Restricted Transfer of
          Personal Data, the parties agree that the Standard Contractual
          Clauses approved by the European Commission, as supplemented by
          the UK Addendum where relevant, are incorporated into and form
          part of this Addendum.
    parameters:
      - key: transfer_mechanism_type
        label: Transfer mechanism relied on for a restricted transfer
        value_type: enum
        direction: set_membership
        preferred_value: standard_contractual_clauses
        green_limit: [standard_contractual_clauses, data_privacy_framework, adequacy_decision]
        yellow_limit: [bespoke_negotiated_clauses]
        allowed_values:
          - standard_contractual_clauses
          - data_privacy_framework
          - adequacy_decision
          - bespoke_negotiated_clauses
          - none_stated
        extraction_hint: >
          Record the named mechanism. none_stated when a restricted transfer
          could occur but no mechanism is named at all.
    red_lines:
      - key: transfer-no-mechanism
        description: >
          A restricted transfer may occur with no transfer mechanism named
          at all.
        condition_type: parameter
        condition: {parameter_key: transfer_mechanism_type, op: eq, value: none_stated}
        action: escalate
        approver_role: general_counsel
        rationale: >
          Making a restricted transfer with no recognised legal basis
          exposes Customer to regulatory action and Halcyon to a breach of
          this Addendum, and needs General Counsel's sign-off before it is
          ever allowed to happen.
    objections:
      - objection: We want the Standard Contractual Clauses separately signed, not just incorporated by reference.
        their_rationale: >
          The counterparty's own internal sign-off process requires a
          discrete, signed document for its files.
        response: >
          We can execute the Clauses as a signed annex to this Addendum
          rather than incorporating them purely by reference, which gives
          your team the standalone document it needs while keeping the
          substance identical.
        talking_points:
          - Offer the signed-annex fallback.
          - Confirm the substantive obligations are the same either way.
        recommended_position: {rule_key: data_transfers.transfer_mechanism, rung: 1}
        frequency: common
        counterparty_profile: EU and UK clinic groups with formal internal audit
      - objection: We need a transfer impact assessment, not just a reference to the Clauses.
        their_rationale: >
          Counterparties following current EU regulatory guidance expect
          their own assessment of the destination country's laws.
        response: >
          The transfer impact assessment is Customer's responsibility as
          data exporter, but we can provide supporting documentation drawn
          from our existing certifications so your assessment has what it
          needs without a bespoke exercise for every contract.
        talking_points:
          - Offer the supporting-documentation fallback for EU and UK deals.
          - Clarify that the assessment itself remains Customer's to
            complete.
        recommended_position: {rule_key: data_transfers.transfer_mechanism, rung: 2}
        frequency: occasional
        counterparty_profile: EU private clinic groups
    dependencies:
      - related_rule_key: data_transfers.data_residency
        relation: read_with
        note: >
          The transfer mechanism and the data residency commitment work
          together; a named single hosting region can remove the need for a
          transfer mechanism altogether for that customer's data.
    test_cases:
      - name: Standard Contractual Clauses by reference
        context: {region: eu}
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Where a restricted transfer occurs, the Standard Contractual
          Clauses, Module Two, and the UK Addendum where relevant, are
          incorporated into this Addendum by reference without further
          execution.
      - name: Counterparty Restricted Transfer wording
        context: {region: eu}
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          To the extent the Services involve a Restricted Transfer, the
          Standard Contractual Clauses, as supplemented by the UK Addendum
          where relevant, form part of this Addendum.
      - name: EU deal, supporting documentation on request
        context: {region: eu}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          The Standard Contractual Clauses apply to any restricted transfer,
          and Halcyon will provide supporting transfer documentation from its
          existing certifications on Customer's written request.
      - name: Transfer mechanism referenced vaguely without naming one
        context: {region: eu}
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will take appropriate steps to ensure transfers of Service
          Personal Data comply with applicable law.
      - name: No transfer mechanism named at all for an EU deal
        context: {region: eu}
        expected_outcome: red_line
        expected_red_line_key: transfer-no-mechanism
        expected_zone: red
        sample_text: >
          Service Personal Data may be transferred to and processed in any
          country where Halcyon or its Sub-processors operate.
      - name: Trap - incorporation by reference still requires compliance
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Incorporating the Standard Contractual Clauses by reference does
          not excuse Halcyon from complying with them; they are deemed
          executed and binding on the parties for any restricted transfer.

  - rule_key: data_transfers.data_residency
    title: Hosting region and data residency
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      US customer data is hosted in Halcyon's AWS us-east-1 or us-west-2
      regions and EU customer data in Halcyon's AWS eu-west-1 region, with
      remote access by support and engineering staff permitted from wherever
      Halcyon operates, consistent with the security annex.
    risk_rationale: >
      Halcyon's hosting footprint is already split by customer geography,
      AWS us-east-1 and us-west-2 for US customers and eu-west-1 for EU
      customers, so committing to that split costs nothing operationally and
      gives Customer a concrete, verifiable residency promise. A named
      single region beyond that split, or a demand for single-tenant or
      on-premises deployment, would require infrastructure Halcyon's
      430-person engineering organisation does not run and cannot
      extend to one customer without rebuilding the multi-tenant platform.
    detection_guidance: >
      Look for "hosted in", "stored exclusively within", "data centres
      located in", "shall not transfer or access from outside", "region" and
      "single-tenant" or "on-premises". Record the named region or regions
      and whether remote access is restricted. Absence means Halcyon may
      choose and change hosting locations freely, which a regulated customer
      will treat as a missing issue.
    source_ref: Halcyon Security Policy SP-01; hosting and residency clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-05
    positions:
      - kind: preferred
        rung: 0
        label: US and EU regional split, unrestricted remote access
        zone: green
        summary: >
          US data in us-east-1 or us-west-2; EU data in eu-west-1; no
          restriction on remote access by Halcyon personnel.
        language: >
          Halcyon shall host Service Personal Data originating from a US
          customer in Halcyon's AWS infrastructure located in the
          us-east-1 or us-west-2 regions, and Service Personal Data
          originating from an EU customer in Halcyon's AWS infrastructure
          located in the eu-west-1 region. Halcyon personnel may access
          Service Personal Data remotely from any location where Halcyon
          operates, subject to the technical and organisational measures
          described in the Security Annex.
      - kind: fallback
        rung: 1
        label: Regional split with disaster-recovery carve-out disclosed
        zone: green
        summary: >
          Same regional hosting split, with disaster-recovery replication
          between regions in the same jurisdiction disclosed rather than
          silently permitted.
        language: >
          Halcyon shall host Service Personal Data as described above, and
          may additionally replicate Service Personal Data to a secondary
          AWS region within the same jurisdiction, EU or US, solely for
          disaster recovery and business continuity purposes, in accordance
          with the Security Annex. Halcyon personnel may access Service
          Personal Data remotely from any location where Halcyon operates,
          subject to the Security Annex.
      - kind: fallback
        rung: 2
        label: Named single region for a security-sensitive deal
        zone: yellow
        approver_role: security_lead
        conditions: {counterparty_tier: [tier_1], data_sensitivity: [phi, special_category]}
        give_get: >
          Ask Customer to accept that Halcyon's standard disaster-recovery
          replication within the same jurisdiction still applies, so the
          commitment is to the primary region, not a single data centre.
        summary: >
          Halcyon commits to a single named region for this customer's data,
          consistent with its existing AWS footprint.
        language: >
          Halcyon shall host Service Personal Data for Customer exclusively
          in Halcyon's AWS [us-east-1 / eu-west-1] region, subject to
          disaster-recovery replication within the same jurisdiction as
          described in the Security Annex. Halcyon personnel may access
          Service Personal Data remotely from any location where Halcyon
          operates, subject to the Security Annex.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same regional hosting split.
        language: >
          Processor's hosting of Personal Data shall be limited to data
          centres located within the United States for Customers located in
          the United States, and within the European Union for Customers
          located in the European Union, consistent with Processor's
          published infrastructure regions.
    parameters:
      - key: data_residency_scope
        label: Scope of the data residency commitment
        value_type: enum
        direction: set_membership
        preferred_value: regional_split
        green_limit: [regional_split]
        yellow_limit: [named_single_region]
        allowed_values: [regional_split, named_single_region, single_tenant_or_on_premises]
        extraction_hint: >
          regional_split when hosting follows the standard US-region or
          EU-region split; named_single_region when the clause commits to
          one specific region for this customer; single_tenant_or_on_premises
          when the clause requires dedicated infrastructure or an
          on-premises deployment.
    red_lines:
      - key: resid-single-tenant-on-premises
        description: >
          Customer requires single-tenant or on-premises deployment of the
          Services.
        condition_type: parameter
        condition: {parameter_key: data_residency_scope, op: eq, value: single_tenant_or_on_premises}
        action: block
        rationale: >
          Halcyon Engage is built and operated as a multi-tenant SaaS
          platform across its 430-person organisation; single-tenant or
          on-premises deployment is not a configuration the Services support
          at any price.
    objections:
      - objection: We need our data kept in one named data centre, not just "the EU region".
        their_rationale: >
          The counterparty equates a named region with a single physical
          facility it can point to for its own compliance records.
        response: >
          For your relationship we can name the specific AWS region your
          data is hosted in, while keeping Halcyon's standard disaster
          recovery replication within the same jurisdiction so your data
          stays protected if that region has an outage.
        talking_points:
          - Offer the named-single-region fallback for tier 1 counterparties
            handling PHI or special category data.
          - Explain that disaster recovery replication stays inside the same
            jurisdiction.
        recommended_position: {rule_key: data_transfers.data_residency, rung: 2}
        frequency: common
        counterparty_profile: Tier 1 hospital systems with strict data-locality policies
      - objection: We want this deployed on our own infrastructure, not shared cloud hosting.
        their_rationale: >
          Some counterparties equate on-premises deployment with greater
          control over their data.
        response: >
          Halcyon Engage is built as a multi-tenant SaaS platform and does
          not offer an on-premises deployment option; we can offer the named
          single-region commitment instead, which gives you a concrete,
          auditable hosting location without requiring us to operate a
          separate on-premises build.
        talking_points:
          - Explain that on-premises deployment is outside what the Services
            support.
          - Redirect to the named-single-region fallback.
        recommended_position: {rule_key: data_transfers.data_residency, rung: 2}
        frequency: rare
        counterparty_profile: Large health systems with existing data-centre infrastructure
    dependencies:
      - related_rule_key: data_transfers.transfer_mechanism
        relation: read_with
        note: >
          A named single region can remove the need for a separate transfer
          mechanism for that customer's data; check the two clauses are
          drafted consistently.
    test_cases:
      - name: Standard US and EU regional split
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon hosts US customer data in its us-east-1 or us-west-2
          regions and EU customer data in its eu-west-1 region, with remote
          access by Halcyon personnel from any of its operating locations.
      - name: Counterparty regional split wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Processor's data centres are limited to the United States for US
          Customers and the European Union for EU Customers, consistent
          with its published infrastructure regions.
      - name: Tier 1 PHI deal, named single region
        context: {counterparty_tier: tier_1, data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon will host Customer's Service Personal Data exclusively in
          its eu-west-1 region, subject to disaster-recovery replication
          within the European Union.
      - name: Hosting region left unstated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Halcyon will host Service Personal Data on infrastructure it
          considers appropriate.
      - name: Single-tenant on-premises deployment required
        expected_outcome: red_line
        expected_red_line_key: resid-single-tenant-on-premises
        expected_zone: red
        sample_text: >
          Halcyon shall deploy a single-tenant instance of the Services on
          infrastructure dedicated exclusively to Customer, hosted on
          Customer's premises.
      - name: Trap - regional split is not a single data centre promise
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          The regional hosting commitment is not a promise to use a single
          named data centre; it is satisfied by hosting within the us-east-1
          or us-west-2 AWS region for US customer data.
  - rule_key: audit.customer_audit_rights
    title: Customer's audit and inspection rights
    required: true
    risk_weight: 6
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Customer may audit Halcyon's compliance once a year on 30 days'
      written notice, starting with Halcyon's SOC 2 Type II report and
      completed questionnaires, with any further on-site inspection limited
      to Halcyon's security team escorting auditors through a scoped review.
    risk_rationale: >
      Halcyon's SOC 2 Type II, ISO 27001 and HITRUST r2 reports are produced
      once a year by independent auditors and already cover the controls
      most customers want to verify, so starting every audit there avoids
      310 separate bespoke reviews of the same shared infrastructure. An
      annual cadence with 30 days' notice lets Halcyon's security team,
      which supports every customer relationship, schedule a real
      inspection instead of treating audit response as a standing function.
    detection_guidance: >
      Look for "audit", "inspect", "upon reasonable prior written notice",
      "no more than once in any twelve-month period", "SOC 2 Type II
      report", "during normal business hours" and "at any time" or "without
      notice". Record the frequency, the notice period and whether a
      compliance report may satisfy the right before an on-site audit is
      required. Absence in a data processing addendum is a missing
      mandatory term.
    source_ref: Halcyon Security Policy SP-01; customer audit rights clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-05
    positions:
      - kind: preferred
        rung: 0
        label: Annual audit, 30 days' notice, SOC 2 report first
        zone: green
        summary: >
          Once a year, 30 days' notice, SOC 2 Type II report and
          questionnaire satisfy the right before any on-site inspection.
        language: >
          No more than once in any twelve (12) month period, and on at least
          thirty (30) days' prior written notice, Customer may audit
          Halcyon's compliance with this Addendum. Halcyon shall first make
          available its then-current SOC 2 Type II report and a completed
          security questionnaire in a form Halcyon makes generally
          available, which shall satisfy the audit right unless the report
          and questionnaire do not reasonably address the specific matter
          raised. Any further audit shall be conducted during Halcyon's
          normal business hours, shall not unreasonably interfere with
          Halcyon's business or other customers' data, and shall be subject
          to Halcyon's standard confidentiality and security escort
          requirements.
      - kind: fallback
        rung: 1
        label: Annual audit, written questionnaire response within 15 business days
        zone: green
        summary: >
          Same annual, 30-day-notice structure, with a committed turnaround
          for Halcyon's written questionnaire response.
        language: >
          No more than once in any twelve (12) month period, on at least
          thirty (30) days' prior written notice, Customer may audit
          Halcyon's compliance with this Addendum, starting with Halcyon's
          SOC 2 Type II report and a written questionnaire, to which Halcyon
          shall respond within fifteen (15) business days. Any further audit
          shall be conducted during normal business hours, subject to
          Halcyon's standard confidentiality and security escort
          requirements.
      - kind: fallback
        rung: 2
        label: On-site audit permitted at Customer's cost
        zone: yellow
        approver_role: security_lead
        conditions: {counterparty_tier: [tier_1], data_sensitivity: [phi, special_category]}
        give_get: >
          See the companion audit_cost rule for the cost allocation that
          makes this fallback acceptable.
        summary: >
          An on-site audit is permitted once a year, after the SOC 2 report
          and questionnaire stage, at Customer's cost.
        language: >
          No more than once in any twelve (12) month period, and on at least
          thirty (30) days' prior written notice, Customer may audit
          Halcyon's compliance with this Addendum, starting with Halcyon's
          SOC 2 Type II report and written questionnaire. If that review does
          not reasonably address the matter raised, Customer may conduct an
          on-site audit, escorted by Halcyon's security personnel, during
          normal business hours, scoped to the systems and records relevant
          to Service Personal Data, and subject to the audit cost allocation
          described elsewhere in this Addendum.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same report-first, annual audit
          structure.
        language: >
          Controller may, no more than once per year and upon thirty (30)
          days' written notice, review Processor's compliance with this
          Addendum, and Processor's then-current third-party audit report
          shall be made available to satisfy that review in the first
          instance.
    parameters:
      - key: audit_frequency_per_year
        label: Audits Customer may conduct per year
        value_type: number
        unit: audits per year
        direction: lower_is_better
        preferred_value: 1
        green_limit: 1
        yellow_limit: 2
        extraction_hint: >
          Record the maximum number of audits Customer may conduct in a
          twelve-month period. "At any time" or "unlimited" converts to a
          high number such as 99 for extraction purposes.
      - key: audit_notice_days
        label: Days' advance notice required before an audit
        value_type: number
        unit: days
        direction: higher_is_better
        preferred_value: 30
        green_limit: 30
        yellow_limit: 10
        extraction_hint: >
          Record the number of days' advance written notice Customer must
          give before conducting an audit. "No notice required" or
          "immediately" converts to 0.
    red_lines:
      - key: audit-unannounced-or-unlimited
        description: >
          Customer may audit without notice, or as often as it wishes, or
          have direct access to Halcyon's production systems or facilities
          generally.
        condition_type: parameter
        condition: {parameter_key: audit_notice_days, op: lt, value: 10}
        action: block
        rationale: >
          Unannounced or unlimited audit access is global red line 9 and
          would expose other customers' data on Halcyon's shared platform to
          an inspection they never agreed to.
    objections:
      - objection: A SOC 2 report is not specific enough; we need the right to inspect your facilities directly.
        their_rationale: >
          Some counterparties, particularly those handling PHI, want direct
          verification beyond a third-party attestation.
        response: >
          For your relationship we can permit an on-site audit once the
          report and questionnaire stage does not resolve your question,
          scoped and escorted, and billed on the cost basis set out
          elsewhere in this Addendum.
        talking_points:
          - Offer the on-site audit fallback for tier 1, PHI or
            special-category deals.
          - Point to the companion audit_cost rule for who pays.
        recommended_position: {rule_key: audit.customer_audit_rights, rung: 2}
        frequency: common
        counterparty_profile: Large hospital systems with regulatory audit obligations
      - objection: Once a year is not often enough if we have an active concern about your compliance.
        their_rationale: >
          The counterparty wants the ability to respond to a specific
          incident or concern outside the annual cycle.
        response: >
          The annual cadence is for routine verification; if a specific
          incident gives you a genuine, documented concern, that is better
          addressed through the breach notification and cooperation
          provisions of this Addendum rather than a second full audit cycle.
        talking_points:
          - Distinguish routine audit cadence from incident-driven
            cooperation, which is handled elsewhere in the Addendum.
        recommended_position: {rule_key: audit.customer_audit_rights, rung: 0}
        frequency: rare
    dependencies:
      - related_rule_key: audit.audit_cost
        relation: read_with
        note: >
          The audit frequency and notice rule and the audit cost rule are
          negotiated together; an on-site audit fallback here should be
          offered together with the cost allocation it depends on.
    test_cases:
      - name: Annual audit, SOC 2 report first
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          No more than once a year, on thirty days' written notice, Customer
          may audit Halcyon's compliance, starting with Halcyon's SOC 2 Type
          II report and a completed questionnaire.
      - name: Counterparty annual review wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Controller may review Processor's compliance once per year on
          thirty days' notice, and Processor's current audit report
          satisfies that review in the first instance.
      - name: Tier 1 PHI deal, on-site audit permitted
        context: {counterparty_tier: tier_1, data_sensitivity: phi}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          If the SOC 2 report and questionnaire do not resolve Customer's
          question, Customer may conduct an escorted on-site audit once a
          year, scoped to systems relevant to Service Personal Data.
      - name: Audit right stated with no frequency or notice period
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Customer may audit Halcyon's compliance with this Addendum from
          time to time.
      - name: Audit permitted at any time without notice
        expected_outcome: red_line
        expected_red_line_key: audit-unannounced-or-unlimited
        expected_zone: red
        sample_text: >
          Customer or its representatives may audit and inspect Halcyon's
          systems and facilities at any time, without prior notice.
      - name: Trap - report-first review is still a real audit right
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Starting with Halcyon's SOC 2 Type II report does not waive
          Customer's audit right; it is simply the first step before any
          further review once a year on thirty days' notice.

  - rule_key: audit.audit_cost
    title: Cost of Customer's audit
    required: true
    risk_weight: 4
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Customer bears its own costs of an audit; if an on-site audit goes
      beyond the SOC 2 report and questionnaire stage, Customer also
      reimburses Halcyon's reasonable staff time at its then-current
      professional services rates, unless the audit reveals a material
      breach of this Addendum, in which case Halcyon bears its own costs.
    risk_rationale: >
      Supporting an on-site audit pulls Halcyon's security staff away from
      the work that protects all 310 customers, so an uncompensated,
      open-ended audit-support obligation effectively asks every other
      customer to subsidise one customer's inspection. Shifting cost to
      Halcyon only when the audit actually finds a material breach keeps
      the incentive aligned: Customer pays for routine verification, and
      Halcyon pays when verification was warranted.
    detection_guidance: >
      Look near the audit right for "at Customer's sole expense", "reimburse
      Halcyon for time expended at its then-current rates", "bear its own
      costs" and "unless the audit reveals a material breach". Record who
      bears the cost of the audit itself and of Halcyon's staff time, and
      whether that allocation shifts if the audit finds non-compliance. An
      audit right with no cost wording at all leaves the question open and
      is a missing issue.
    source_ref: Halcyon Security Policy SP-01; audit cost allocation clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-05
    positions:
      - kind: preferred
        rung: 0
        label: Customer's own costs, Halcyon's time reimbursed, shifts on material breach
        zone: green
        summary: >
          Customer pays its own costs and reimburses Halcyon's staff time
          for an on-site audit, unless a material breach is found, in which
          case Halcyon bears its own costs.
        language: >
          Each party shall bear its own costs of an audit conducted under
          this Addendum. If an audit extends beyond review of Halcyon's SOC 2
          Type II report and written questionnaire to an on-site inspection,
          Customer shall reimburse Halcyon for the reasonable time its
          personnel spend supporting that inspection, at Halcyon's
          then-current professional services rates, unless the audit reveals
          a material breach by Halcyon of its obligations under this
          Addendum, in which case Halcyon shall bear its own costs and the
          reasonable costs Customer incurred in conducting that audit.
      - kind: fallback
        rung: 1
        label: Customer's own costs and Halcyon's time, capped reimbursement
        zone: green
        summary: >
          Same allocation, with Halcyon's reimbursable time capped at a
          stated number of hours per audit.
        language: >
          Each party shall bear its own costs of an audit under this
          Addendum. For an on-site inspection beyond the SOC 2 report and
          questionnaire stage, Customer shall reimburse Halcyon's reasonable
          staff time at its then-current professional services rates, up to
          a maximum of sixteen (16) hours per audit, unless the audit
          reveals a material breach by Halcyon, in which case Halcyon shall
          bear its own costs without that cap.
      - kind: fallback
        rung: 2
        label: Halcyon absorbs its own time for the first on-site audit each year
        zone: yellow
        approver_role: security_lead
        conditions: {deal_value_band: [enterprise, strategic]}
        give_get: >
          Ask Customer to accept that a second on-site audit in the same
          twelve-month period reverts to the standard reimbursement
          allocation.
        summary: >
          For a larger relationship, Halcyon absorbs its own staff time for
          the first on-site audit in a year, reverting to reimbursement for
          any additional audit in that period.
        language: >
          Each party shall bear its own costs of an audit under this
          Addendum. Halcyon shall absorb the reasonable cost of its own
          personnel's time in supporting the first on-site audit conducted
          in any twelve-month period; any further on-site audit in that
          period shall be subject to reimbursement of Halcyon's staff time
          at its then-current professional services rates, unless the audit
          reveals a material breach by Halcyon, in which case Halcyon bears
          its own costs for that audit.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing of the same cost allocation, including the
          material-breach shift.
        language: >
          Controller shall bear the costs of any audit under this Addendum,
          including reimbursing Processor's reasonable time at its standard
          rates, save that if the audit identifies a material failure by
          Processor to comply with this Addendum, Processor shall bear its
          own costs and reimburse Controller's reasonable audit costs.
    parameters:
      - key: audit_cost_bearer
        label: Who bears the cost of an on-site audit
        value_type: enum
        direction: set_membership
        preferred_value: customer_reimburses_halcyon_time
        green_limit: [customer_reimburses_halcyon_time]
        yellow_limit: [halcyon_absorbs_first_annual_audit]
        allowed_values:
          - customer_reimburses_halcyon_time
          - halcyon_absorbs_first_annual_audit
          - halcyon_bears_all_costs
        extraction_hint: >
          customer_reimburses_halcyon_time when Customer pays its own costs
          and reimburses Halcyon's staff time for an on-site audit;
          halcyon_absorbs_first_annual_audit when Halcyon pays its own costs
          for at least the first on-site audit each year regardless of
          findings; halcyon_bears_all_costs when Halcyon pays its own costs
          for every audit regardless of findings or frequency.
    red_lines:
      - key: cost-halcyon-bears-all-unconditionally
        description: >
          Halcyon must bear all costs of every audit, including Customer's
          own costs, regardless of frequency or findings.
        condition_type: parameter
        condition: {parameter_key: audit_cost_bearer, op: eq, value: halcyon_bears_all_costs}
        action: escalate
        approver_role: general_counsel
        rationale: >
          An unconditional, uncapped duty to fund Customer's own audit
          activity has no limiting principle and would let audit frequency
          become a way to extract services outside the priced Agreement.
    objections:
      - objection: We should not have to pay for an audit that is really just you proving your own compliance.
        their_rationale: >
          The counterparty sees the audit as primarily benefiting Halcyon's
          own assurance story.
        response: >
          The audit is for your benefit and your records, which is why we
          already absorb our own costs for the report-and-questionnaire
          stage that most audits never go beyond; reimbursement only applies
          to the additional staff time an on-site inspection requires.
        talking_points:
          - Point out the SOC 2 report and questionnaire stage is free in
            every position.
          - Reimbursement is limited to the incremental cost of going
            on-site.
        recommended_position: {rule_key: audit.audit_cost, rung: 0}
        frequency: occasional
        counterparty_profile: Smaller practices unfamiliar with audit cost norms
      - objection: For a relationship our size, you should absorb the cost of at least one audit a year.
        their_rationale: >
          Larger counterparties expect audit support to be priced into a
          bigger contract.
        response: >
          For enterprise and strategic relationships we can absorb our own
          staff time for the first on-site audit each year, reverting to
          standard reimbursement only if a second on-site audit is needed in
          the same period.
        talking_points:
          - Offer the first-audit-absorbed fallback for enterprise and
            strategic deals.
        recommended_position: {rule_key: audit.audit_cost, rung: 2}
        frequency: common
        counterparty_profile: Enterprise and strategic hospital systems
    dependencies:
      - related_rule_key: audit.customer_audit_rights
        relation: requires
        note: >
          The cost allocation only matters once an on-site audit is
          permitted under the audit rights rule; offer the two together.
    test_cases:
      - name: Customer's own costs, Halcyon's time reimbursed, shifts on breach
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Each party bears its own audit costs. Customer reimburses
          Halcyon's reasonable staff time for an on-site audit at standard
          rates, unless the audit finds a material breach by Halcyon, in
          which case Halcyon bears its own costs.
      - name: Counterparty cost-shift wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Controller bears the costs of any audit, including reimbursing
          Processor's reasonable time at standard rates, unless the audit
          finds a material failure by Processor to comply, in which case
          Processor bears its own costs and Controller's reasonable costs.
      - name: Enterprise deal, first annual on-site audit absorbed
        context: {deal_value_band: enterprise}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          Halcyon absorbs its own staff time for the first on-site audit
          each year; any further on-site audit in that period is
          reimbursed at standard rates unless a material breach is found.
      - name: Audit right exists with no cost allocation stated
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          Customer may audit Halcyon's compliance with this Addendum once a
          year on thirty days' notice.
      - name: Halcyon must bear all audit costs unconditionally
        expected_outcome: red_line
        expected_red_line_key: cost-halcyon-bears-all-unconditionally
        expected_zone: red
        sample_text: >
          Halcyon shall bear all costs of any audit conducted by Customer
          under this Addendum, including Customer's own internal and
          external costs, regardless of the audit's findings or frequency.
      - name: Trap - cost shift on material breach is not unconditional funding
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Halcyon only bears audit costs where the audit reveals a material
          breach of this Addendum; absent such a finding, Customer
          reimburses Halcyon's reasonable time for an on-site audit at
          standard rates.

  - rule_key: limitation_of_liability.dpa_liability_alignment
    title: Alignment of DPA liability with the Agreement
    required: true
    risk_weight: 8
    negotiable: true
    default_zone: yellow
    needs_human_judgment: false
    position_summary: >
      Liability arising under this Addendum is subject to the limitation of
      liability in the Agreement, including the data breach super-cap at two
      times annual Fees, taken together with liability arising under the
      Agreement rather than stacked on top of it.
    risk_rationale: >
      This Addendum exists to implement the data protection terms of a
      commercial relationship priced at a median $165k and a largest $2.4M a
      year, backed by $10M of cyber and technology errors and omissions
      cover; a DPA that is silent on liability, or that states its own
      uncapped liability, could be read to bypass the cap the parties
      actually negotiated in the Agreement. Keeping the two caps together,
      with the dedicated data breach super-cap as the ceiling for data
      incidents, matches the insurance Halcyon actually carries rather than
      creating a second, uninsured exposure.
    detection_guidance: >
      Look in the Addendum for "subject to the limitation of liability set
      out in the Agreement", "taken together in the aggregate" or,
      conversely, "nothing in the Agreement shall limit liability under this
      Addendum". Also check the order-of-precedence wording between the
      Addendum and the Agreement. Absence means the position is ambiguous
      and should be raised, because an Addendum that prevails on conflict
      may be read as uncapped.
    source_ref: Halcyon Risk Policy RP-04; DPA liability alignment clause
    authored_by: Privacy Counsel
    approved_by: General Counsel
    last_reviewed_at: 2025-12-05
    positions:
      - kind: preferred
        rung: 0
        label: DPA liability inside the Agreement's caps, taken together
        zone: green
        summary: >
          Liability under the Addendum sits inside the Agreement's general
          cap and data breach super-cap, aggregated together rather than
          stacked.
        language: >
          Liability arising out of or in connection with this Addendum is
          subject to the limitation of liability, including any data breach
          super-cap, set out in the Agreement. Liability arising under this
          Addendum and liability arising under the Agreement shall be
          aggregated and treated as a single liability for the purpose of
          applying those limitations, and nothing in this Addendum shall be
          read to create a separate or additional cap, or to remove any cap
          that applies under the Agreement.
      - kind: fallback
        rung: 1
        label: DPA liability inside the caps, with an express carve-out list preserved
        zone: green
        summary: >
          Same aggregation, with an express statement that the Agreement's
          carve-outs from the cap, such as fraud and wilful misconduct,
          continue to apply to conduct under this Addendum.
        language: >
          Liability arising under this Addendum is subject to the limitation
          of liability, including any data breach super-cap, set out in the
          Agreement, and is aggregated with liability arising under the
          Agreement for that purpose. The carve-outs from the limitation of
          liability set out in the Agreement, including for fraud, wilful
          misconduct and payment obligations, apply equally to conduct under
          this Addendum.
      - kind: fallback
        rung: 2
        label: Super-cap raised toward 3x for this Addendum, still capped at $5M
        zone: yellow
        approver_role: general_counsel
        conditions: {deal_value_band: [strategic]}
        give_get: >
          Ask for the general liability cap outside data incidents to stay
          at the standard position, so only the data breach super-cap moves.
        summary: >
          For a strategic relationship, the data breach super-cap
          applicable to this Addendum moves toward three times annual Fees,
          never above $5M, with everything else aggregated as above.
        language: >
          Liability arising under this Addendum is subject to the limitation
          of liability set out in the Agreement and is aggregated with
          liability arising under the Agreement. For liability arising from
          a Security Incident under this Addendum, the data breach super-cap
          in the Agreement shall be up to three (3) times the annual Fees
          paid by Customer, but in no event more than five million US
          dollars (US$5,000,000) in the aggregate.
      - kind: acceptable_variant
        label: Counterparty wording to the same effect
        zone: green
        summary: >
          Different phrasing that still subjects Addendum liability to the
          Agreement's caps on an aggregated basis.
        language: >
          Each party's liability arising under this Addendum shall be
          subject to, and aggregated for the purpose of, the limitations and
          exclusions of liability set out in the Agreement, and this
          Addendum does not create any separate or additional limit.
    parameters:
      - key: dpa_breach_super_cap_multiple
        label: Data breach super-cap as a multiple of annual Fees
        value_type: number
        unit: multiple of annual Fees
        direction: lower_is_better
        preferred_value: 2
        green_limit: 2
        yellow_limit: 3
        extraction_hint: >
          Record the multiple of annual Fees used for the data breach
          super-cap as it applies to liability under this Addendum. An
          uncapped or undefined super-cap for Addendum liability converts to
          null and should be flagged rather than guessed.
    red_lines:
      - key: dpalia-addendum-prevails-uncapped
        description: >
          The Addendum states that nothing in the Agreement limits liability
          under the Addendum, or that the Addendum prevails over the
          Agreement's limitation of liability on conflict.
        condition_type: phrase
        condition:
          any:
            - nothing in the Agreement shall limit liability under this Addendum
            - this Addendum shall prevail over the Agreement to the extent of any conflict regarding liability
          negation_guard: true
        action: block
        rationale: >
          A clause that lets the Addendum override the Agreement's
          limitation of liability creates exactly the uncapped, uninsured
          exposure that global red line 1 exists to prevent, through the
          back door of a companion document.
    objections:
      - objection: Your liability under this DPA should not be limited at all given the sensitivity of the data.
        their_rationale: >
          The counterparty treats data processing obligations as warranting
          different, unlimited treatment from the rest of the Agreement.
        response: >
          We already carry a dedicated, higher cap specifically for data
          breach, and for our largest relationships we can raise that
          super-cap further, up to a stated dollar ceiling; removing the cap
          entirely is not something our insurance can stand behind.
        talking_points:
          - Point to the data breach super-cap and the strategic-deal
            fallback that raises it further.
          - Explain the $10M cyber and technology errors and omissions
            ceiling behind the commitment.
        recommended_position: {rule_key: limitation_of_liability.dpa_liability_alignment, rung: 2}
        frequency: common
        counterparty_profile: Large hospital systems and privacy-forward EU clinic groups
      - objection: We want the carve-outs from your general liability cap, like fraud and wilful misconduct, to apply here too.
        their_rationale: >
          The counterparty wants consistent treatment of the most serious
          categories of misconduct across both documents.
        response: >
          That is already how we intend the clause to work, and we are glad
          to make the carve-outs from the Agreement's cap explicit in this
          Addendum so there is no ambiguity that they carry over.
        talking_points:
          - Offer the fallback that expressly preserves the Agreement's
            carve-outs for conduct under this Addendum.
        recommended_position: {rule_key: limitation_of_liability.dpa_liability_alignment, rung: 1}
        frequency: occasional
    dependencies:
      - related_rule_key: subprocessors.subprocessor_liability
        relation: trade_against
        note: >
          A carve-out widening Sub-processor liability treatment should be
          traded against, not added on top of, any widening of the general
          DPA liability alignment position.
      - related_rule_key: data_protection.data_return_and_deletion
        relation: read_with
        note: >
          A failure to delete or return data on time is itself a potential
          source of liability under this Addendum; keep the two clauses
          read together when assessing exposure.
    test_cases:
      - name: DPA liability aggregated inside the Agreement's caps
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Liability under this Addendum is subject to the limitation of
          liability in the Agreement, including the data breach super-cap,
          aggregated together as a single liability rather than stacked.
      - name: Counterparty aggregation wording
        expected_outcome: acceptable_variant
        expected_zone: green
        sample_text: >
          Liability arising under this Addendum is subject to, and
          aggregated with, the limitations of liability in the Agreement,
          and this Addendum creates no separate or additional cap.
      - name: Strategic deal, super-cap raised to 3x capped at $5M
        context: {deal_value_band: strategic}
        expected_outcome: fallback
        expected_position_rung: 2
        expected_zone: yellow
        sample_text: >
          For liability from a Security Incident under this Addendum, the
          data breach super-cap is raised to three times annual Fees, never
          exceeding five million US dollars in the aggregate.
      - name: Addendum silent on how its liability relates to the Agreement
        expected_outcome: deviation
        expected_zone: yellow
        sample_text: >
          This Addendum forms part of the Agreement between the parties.
      - name: Addendum liability expressly excluded from the Agreement's cap
        expected_outcome: red_line
        expected_red_line_key: dpalia-addendum-prevails-uncapped
        expected_zone: red
        sample_text: >
          Nothing in the Agreement shall limit liability under this
          Addendum, and this Addendum shall prevail over the Agreement to
          the extent of any conflict regarding liability.
      - name: Trap - aggregation is not the same as doubling the cap
        is_trap: true
        expected_outcome: compliant
        expected_zone: green
        sample_text: >
          Aggregating liability under this Addendum with liability under the
          Agreement does not create a second, additional cap; the two are
          treated as one liability subject to one set of limits.
