      - Any deadline proposed for data subject requests, return or deletion, in days
    priority: 50
  - key: data-protection-red
    description: Data protection terms in the red zone, such as Halcyon acting as controller of Customer Data or processing outside documented instructions.
    clause_type: data_protection
    zone: red
    approver_role: general_counsel
    consult_roles: [privacy_counsel, security_lead]
    sla_hours: 48
    required_info:
      - The data protection term as drafted
      - Privacy Counsel's written assessment of whether Halcyon can lawfully accept it as a processor or business associate
      - Categories of data and estimated number of data subjects
      - Whether the term conflicts with Halcyon's commitments to its other customers
      - The compliant alternative already offered and refused
    priority: 50
  - key: data-protection-red-phi
    description: Data protection red-zone terms on deals involving PHI.
    clause_type: data_protection
    zone: red
    conditions: {data_sensitivity: [phi]}
    approver_role: general_counsel
    consult_roles: [privacy_counsel, security_lead, commercial_counsel]
    sla_hours: 48
    required_info:
      - The term as drafted and the business associate agreement provision it affects
      - Privacy Counsel's written assessment against 45 C.F.R. Parts 160 and 164
      - Estimated number of patient records Halcyon will hold for this customer
      - Whether accepting the term would put HITRUST r2 certification at risk
      - The compliant alternative already offered and refused
    priority: 80
  - key: subprocessors-yellow
    description: Sub-processor deviations that match no approved position, such as a 60-day notice period for changes.
    clause_type: subprocessors
    zone: yellow
    approver_role: privacy_counsel
    consult_roles: [security_lead]
    sla_hours: 24
    required_info:
      - The notice period proposed for new Sub-processors, in days
      - The counterparty's remedy if it objects to a new Sub-processor
      - Whether authorisation remains general or becomes specific to each Sub-processor
      - Sub-processor changes planned in the next 12 months that the term would delay
    priority: 50
  - key: subprocessors-red
    description: Sub-processor terms in the red zone, such as prior written consent for each Sub-processor.
    clause_type: subprocessors
    zone: red
    approver_role: general_counsel
    consult_roles: [privacy_counsel, security_lead]
    sla_hours: 48
    required_info:
      - The sub-processor clause as drafted
