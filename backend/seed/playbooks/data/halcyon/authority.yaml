      - Where support and engineering staff who may access the data are located
      - The transfer mechanism relied on for any access from outside the customer's region
    priority: 50
  - key: data-transfers-red
    description: Data transfer terms in the red zone, such as a ban on all access from outside one country or hosting outside Halcyon's AWS regions.
    clause_type: data_transfers
    zone: red
    approver_role: general_counsel
    consult_roles: [privacy_counsel, security_lead]
    sla_hours: 48
    required_info:
      - The transfer or residency term as drafted
      - The Security Lead's assessment of whether hosting in us-east-1, us-west-2 or eu-west-1 can satisfy it
      - Effect on follow-the-sun support and on disaster recovery between regions
      - Cost to comply, in dollars, compared with annual Fees
      - The regional hosting commitment already offered and refused
    priority: 50

