  - key: subprocessors-yellow-phi
    description: Sub-processor deviations on deals involving PHI, where each Subcontractor needs a business associate agreement.
    clause_type: subprocessors
    zone: yellow
    conditions: {data_sensitivity: [phi]}
    approver_role: privacy_counsel
    consult_roles: [security_lead, commercial_counsel]
    sla_hours: 24
    required_info:
      - The notice period proposed for new Subcontractors, in days
      - The flow-down terms the counterparty requires in each Subcontractor agreement
      - Which current Subcontractors handle PHI and whether their agreements already meet those terms
      - The counterparty's remedy if it objects to a new Subcontractor
    priority: 80
  - key: data-transfers-yellow
    description: Data transfer or residency deviations that match no approved position, such as a named single hosting region.
    clause_type: data_transfers
    zone: yellow
    approver_role: privacy_counsel
    consult_roles: [security_lead]
    sla_hours: 24
    required_info:
      - The transfer or residency term as drafted
