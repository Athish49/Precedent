      - Halcyon Engage's measured uptime for the last 12 months in the customer's hosting region
      - Whether credits remain the sole remedy for missed service levels
    priority: 50
  - key: service-levels-red
    description: Service level terms in the red zone, such as uptime of 99.99% or higher, credits above 25% or credits that are not the sole remedy.
    clause_type: service_levels
    zone: red
    approver_role: general_counsel
    consult_roles: [vp_customer_success, security_lead, cfo]
    sla_hours: 48
    required_info:
      - The service level and remedy as drafted
      - Halcyon Engage's measured uptime for the last 12 months and the number of months that would have missed the proposed target
      - Expected annual cost of credits at the proposed level, in dollars
      - Any termination right or damages claim tied to missed service levels
      - Engineering's view on whether the target can be met on the shared platform
    priority: 50
  - key: service-levels-yellow-tier-1
    description: Service level deviations from tier 1 counterparties, who often require their own service level schedule and reporting.
    clause_type: service_levels
    zone: yellow
    conditions: {counterparty_tier: [tier_1]}
    approver_role: vp_customer_success
    consult_roles: [security_lead, vp_sales]
    sla_hours: 24
    required_info:
      - The counterparty's service level schedule, compared line by line with Halcyon's standard
      - The uptime percentage, credit cap and reporting frequency proposed
      - Support response time targets and whether the current support plan covers them
      - Halcyon Engage's measured uptime for the last 12 months in the customer's hosting region
      - Number of sites and users the customer will bring onto the platform
    priority: 60

  # ---------------------------------------------------------------------
  # Group 5: security and breach notification
  # Families: security, breach_notification
  # ---------------------------------------------------------------------
  - key: security-yellow
    description: Security requirement deviations that match no approved position.
    clause_type: security
    zone: yellow
    approver_role: security_lead
    consult_roles: [privacy_counsel]
    sla_hours: 24
    required_info:
      - Each security requirement that differs from Halcyon's security programme, with the counterparty's wording
      - Whether the requirement is already met under SOC 2 Type II, ISO 27001 or HITRUST r2 controls
      - The counterparty's security questionnaire or policy, if one is incorporated by reference
      - Cost and time to meet any requirement not met today
    priority: 50
  - key: security-red
    description: Security terms in the red zone, such as single-tenant or on-premises deployment or compliance with a customer policy that can change without consent.
    clause_type: security
    zone: red
    approver_role: general_counsel
    consult_roles: [security_lead, privacy_counsel]
    sla_hours: 48
    required_info:
      - The security term as drafted
      - The Security Lead's written assessment of whether the multi-tenant platform can comply
      - Effect on other customers and on SOC 2 Type II, ISO 27001 and HITRUST r2 scope
      - Cost to comply, in dollars, compared with annual Fees
      - The alternative controls already offered and refused
    priority: 50
  - key: security-yellow-phi
    description: Security deviations on deals involving PHI.
    clause_type: security
    zone: yellow
    conditions: {data_sensitivity: [phi]}
    approver_role: security_lead
    consult_roles: [privacy_counsel, commercial_counsel]
    sla_hours: 24
    required_info:
      - Each security requirement that differs from Halcyon's security programme, with the counterparty's wording
      - How the requirement maps to the HIPAA Security Rule safeguards and to HITRUST r2 controls
      - Whether the requirement changes encryption, access or logging for PHI on the shared platform
      - Whether the same requirement must flow down to Subcontractors that handle PHI
    priority: 80
  - key: breach-notification-yellow
    description: Breach notification deviations that match no approved position, such as notice within 24 hours.
    clause_type: breach_notification
    zone: yellow
    approver_role: security_lead
    consult_roles: [privacy_counsel]
    sla_hours: 24
    required_info:
      - The notification deadline proposed, in hours, and the event that starts the clock
      - Whether the trigger is a confirmed incident or a suspected one
      - The content Halcyon must include in the first notice
      - Whether the incident response team can meet the deadline outside business hours
    priority: 50
  - key: breach-notification-red
    description: Breach notification terms in the red zone, such as notice in under 24 hours or notice running from suspicion.
    clause_type: breach_notification
    zone: red
    approver_role: general_counsel
    consult_roles: [security_lead, privacy_counsel]
    sla_hours: 48
    required_info:
      - The notification clause as drafted, with the deadline and trigger marked
      - The Security Lead's assessment of whether the deadline can be met and what it would cost
      - Any penalty, indemnity or termination right tied to late notice
      - The 24-hour and 48-hour alternatives already offered and the counterparty's response
    priority: 50
  - key: breach-notification-yellow-phi
    description: Breach notification deviations on deals involving PHI, where the business associate agreement and HIPAA timelines also apply.
    clause_type: breach_notification
    zone: yellow
    conditions: {data_sensitivity: [phi]}
    approver_role: security_lead
    consult_roles: [privacy_counsel, commercial_counsel]
    sla_hours: 24
    required_info:
      - The notification deadline proposed, in hours, and the event that starts the clock
      - Whether the trigger is a Breach of unsecured PHI, a security incident or a suspected event
      - The deadline in the business associate agreement, and whether the two documents agree
      - Who notifies affected individuals and regulators, and who bears the cost
      - Whether Subcontractors that handle PHI are bound to a deadline short enough to meet this one
    priority: 80

  # ---------------------------------------------------------------------
  # Group 6: privacy and sub-processors
  # Families: data_protection, subprocessors, data_transfers
  # ---------------------------------------------------------------------
  - key: data-protection-yellow
    description: Data protection deviations that match no approved position.
    clause_type: data_protection
    zone: yellow
    approver_role: privacy_counsel
    consult_roles: [security_lead]
    sla_hours: 24
    required_info:
      - The data protection term as drafted and the playbook position it departs from
