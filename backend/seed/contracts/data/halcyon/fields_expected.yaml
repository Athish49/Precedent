# Field answers for the 12 Halcyon seed contracts (task 6.1).
#
# Source: backend/seed/contracts/data/halcyon/source/*.md (do not edit those files).
# contract_type and counterparty are copied from expected.yaml (do not edit that file either).
# "Us" = Halcyon Care, Inc. (and its subsidiary Halcyon Care Ireland Ltd in files 04/06), per
# playbook_implementation.md section 2. Every value below carries an inline comment with the
# section number/heading in the source file it was traced to. `null` means the contract does not
# state that field. clause_family values are restricted to the 31 real keys: the 29 inserted by
# migrations/versions/010_playbook_lookups.py (baseline, nda, saas_msa, dpa, vendor_msa, hipaa,
# gdpr, indemnification, limitation_of_liability, termination, confidentiality,
# intellectual_property, governing_law, dispute_resolution, payment, warranties, force_majeure,
# assignment, entire_agreement, amendment, notices, definitions, term, compliance,
# data_protection, audit, insurance, other, service_levels, security, subprocessors,
# breach_notification, data_transfers, publicity, non_solicitation, suspension) plus preamble and
# signature_block, added by migrations/versions/016_doc_proc_schema_a.py.
#
# Note on signatories: none of the 12 source files contain actual signatory names, titles or
# signed/unsigned status - each ends with a generic reference to "the signature page" (e.g. file
# 01 has no execution block at all; file 03 line 269 "IN WITNESS WHEREOF ... each on the
# signature page attached to this Agreement"; files 08-12 Section "Signatories" / "Execution and
# Approval" clauses refer to an unpopulated signature page). So `signatories: null` for all 12,
# each with that trace.
#
# Note on mixed-topic top-level sections (e.g. "TERM AND TERMINATION", "GENERAL PROVISIONS"):
# clause_family records the single best-fit family for the section as a whole; a short note is
# added only where the choice is non-obvious. The section number and title are themselves the
# trace back to the source heading.

