name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]" --extra-index-url https://pypi.org/simple 2>/dev/null || pip install -e "." && pip install pytest pytest-asyncio httpx ruff mypy

      - name: Ruff lint
        run: ruff check app tests

      - name: Guard — import anthropic only in app/core/llm/
        run: |
          bad=$(grep -r "import anthropic" app/ --include="*.py" \
                | grep -v "^app/core/llm/" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: 'import anthropic' found outside app/core/llm/:"
            echo "$bad"
            exit 1
          fi

      - name: Guard — app/services/document_processing never imports core/llm
        run: |
          bad=$(grep -r "core[./]llm\|core\.llm\|from app\.core\.llm" \
                app/services/document_processing/ --include="*.py" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: app/services/document_processing imports core/llm:"
            echo "$bad"
            exit 1
          fi

      - name: Guard — app/services/analytics never imports core/llm
        run: |
          bad=$(grep -r "core[./]llm\|core\.llm\|from app\.core\.llm" \
                app/services/analytics/ --include="*.py" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: app/services/analytics imports core/llm:"
            echo "$bad"
            exit 1
          fi

      # backend/seed/ is optional and must be deletable. Mirrors
      # tests/unit/test_seed_isolation.py; passes whether or not seed/ exists.
      - name: Guard — nothing outside seed/ uses seed/
        run: |
          bad=$(grep -rnE --include="*.py" \
                -e '^[[:space:]]*(import|from)[[:space:]]+seed([.[:space:],;]|$)' \
                -e '(^|[^A-Za-z0-9_.-])seed/' \
                -e "[\"']seed[\"']" \
                -e "([\"']|-m[[:space:]]+)seed\.[A-Za-z_]" \
                app migrations scripts tests \
                | grep -v "^tests/unit/test_seed_isolation\.py:" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: app, migrations, scripts or tests import from or point into seed/:"
            echo "$bad"
            exit 1
          fi

      - name: Seed tests (only when backend/seed exists)
        if: ${{ hashFiles('backend/seed/tests/**') != '' }}
        run: |
          pip install "pyyaml>=6.0"
          pytest seed/tests -q --tb=short

      - name: Pytest
        env:
          DATABASE_URL: "postgresql+psycopg://user:pass@localhost/testdb"
          ANTHROPIC_API_KEY: "sk-ant-test"
          # Placeholders: cloud storage settings are required, tests never reach a bucket.
          OBJECT_STORAGE_ENDPOINT: "https://storage.invalid"
          OBJECT_STORAGE_BUCKET: "test-bucket"
          OBJECT_STORAGE_ACCESS_KEY: "test-access-key"
          OBJECT_STORAGE_SECRET_KEY: "test-secret-key"
        run: pytest tests/ -q --tb=short
